<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- color-scheme 给两个值：主题由 lib/theme.ts 在首帧前写到 <html> 上，
         若这里写死 light，暗色主题下滚动条/表单控件会在 CSS 生效前先按亮色画一帧。 -->
    <meta name="color-scheme" content="light dark" />

    <title>Lucky-Y · Personal OS</title>
  </head>
  <body>
    <!-- 页底衬层。**纯色**（2026-09-25 由玻璃拟态换成纯色）。
         它为什么还留下：这一层担着**窗口圆角** —— `border-radius` + 底衬基色
         必须待在同一个图层里。桌面壳里窗口是透明的，基色若留在 body 上，
         圆角外露出来的那部分就是**不透明的方角**（比"没有圆角"更难看）。

         ⚠️ 里面原本还有两层（`.ambient__aurora` 八层色团 + `.ambient__noise` 霜感颗粒），
         **已删**。它们当时必须与这一层分开，是因为"带圆角"与"会漂移的 transform"
         不能落在同一个元素上（transform 会把圆角整体挪出视口，极光顺着四角漏出去）。
         现在没有漂移、也没有色团，那一层的理由消失了，所以不必再拆。
         仍留在 prism.css §7 里一条 `display:none` 兜底，防旧产物里的标记复活。 -->
    <div class="ambient" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
