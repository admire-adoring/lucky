<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部署 · 项目详情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* [hidden] 必须始终生效 —— 否则会被 author 的 display 覆盖 */
        [hidden] { display: none !important; }

        :root {
            --bg-page: #F7F8FA;
            --bg-card: rgba(255,255,255,0.72);
            --bg-card-solid: #FFFFFF;
            --bg-sidebar: rgba(255,255,255,0.72);
            --bg-topbar: rgba(255,255,255,0.72);
            --border-card: rgba(255,255,255,0.8);
            --border-subtle: rgba(15,23,42,0.07);
            --border-strong: rgba(15,23,42,0.12);
            --text-primary: #0F172A;
            /* 浅色主题下二级/三级文字必须 ≥4.5:1 */
            --text-secondary: #4A5A72;
            --text-muted: #5B6A82;
            --shadow-card: 0 4px 24px rgba(15,23,42,0.05);
            --shadow-card-hover: 0 8px 32px rgba(15,23,42,0.10);
            --blur-card: blur(28px) saturate(200%);
            --blob-opacity: 0.42;
            --blob-blur: 120px;

            --r-sm: 8px; --r-md: 12px; --r-lg: 18px;

            --a-work-1: #FDA4AF; --a-work-2: #FECDD3; --a-work-3: #FBCFE8;
            --s-work: #E11D48;
            --m1: var(--a-work-1); --m2: var(--a-work-2); --m3: var(--a-work-3);
            --m-main: var(--s-work);

            /* 部署模块功能色 —— 与运维绿、工作域粉都拉开距离 */
            --dp: #6366F1;        /* 只用于图形：图标底、选中左条、焦点环 */
            --dp-fg: #4338CA;     /* 需要作为文字时用这一档（≥4.5:1） */
            /* 实底按钮背景单独深一档：#6366F1 上的白字只有 4.47:1，差一点不达标 */
            --dp-btn: #4F46E5;    /* 白字 6.28:1 */

            /* 语义状态令牌（浅色）—— 全部 ≥4.5:1 */
            --ok-fg: #036B4E;      --ok-bg: rgba(16,185,129,0.14);
            --warn-fg: #9A4708;    --warn-bg: rgba(245,158,11,0.16);
            --danger-fg: #B91C1C;  --danger-bg: rgba(239,68,68,0.13);
            --idle-fg: #475569;    --idle-bg: rgba(100,116,139,0.16);

            --bar-ok: #10B981;
            --bar-warn: #F59E0B;
            --bar-danger: #EF4444;
            --bar-track: rgba(15,23,42,0.09);

            /* 终端输出区：深浅两套都保持"深底浅字"，它是代码块不是普通文本 */
            --term-bg: #0F172A;
            --term-fg: #CBD5E1;
            --term-dim: #94A3B8;
            --term-ok: #6EE7B7;
            --term-warn: #FCD34D;
            --term-err: #FCA5A5;
            --term-bar: #1B2438;   /* 终端标题栏：比正文区略亮一档 */

            /* 各分区的垂直/水平内边距统一走这两个值，别一处 11 一处 13 */
            --pad-y: 12px;
            --pad-x: 16px;

            --focus-ring: var(--text-primary);
        }

        .dark {
            --bg-page: #0A0F1C;
            --bg-card: rgba(30,41,59,0.5);
            --bg-card-solid: #1E293B;
            --bg-sidebar: rgba(15,23,42,0.78);
            --bg-topbar: rgba(15,23,42,0.78);
            --border-card: rgba(255,255,255,0.08);
            --border-subtle: rgba(255,255,255,0.06);
            --border-strong: rgba(255,255,255,0.14);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #8695AB;
            --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-card-hover: 0 8px 32px rgba(0,0,0,0.42);
            --blur-card: blur(32px) saturate(180%);
            --blob-opacity: 0.26;
            --blob-blur: 140px;

            --a-work-1: #BE123C; --a-work-2: #9F1239; --a-work-3: #881337;
            --s-work: #FB7185;
            --dp: #818CF8;
            --dp-fg: #A5B4FC;

            --ok-fg: #6EE7B7;      --ok-bg: rgba(16,185,129,0.20);
            --warn-fg: #FCD34D;    --warn-bg: rgba(245,158,11,0.22);
            --danger-fg: #FCA5A5;  --danger-bg: rgba(239,68,68,0.22);
            --idle-fg: #CBD5E1;    --idle-bg: rgba(148,163,184,0.22);

            --bar-ok: #34D399;
            --bar-warn: #FBBF24;
            --bar-danger: #F87171;
            --bar-track: rgba(255,255,255,0.13);

            --term-bg: #060B16;
            --term-fg: #CBD5E1;
            --term-dim: #94A3B8;
            --term-bar: #101828;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-primary);
            background: var(--bg-page);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 6px; }

        /* 极光 */
        .aurora-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(var(--blob-blur)); opacity: var(--blob-opacity); animation: drift 22s ease-in-out infinite alternate; }
        .blob-1 { width: 600px; height: 600px; top: -12%; left: -10%; background: var(--m1); }
        .blob-2 { width: 540px; height: 540px; top: 20%; right: -14%; background: var(--m2); animation-delay: -7s; }
        .blob-3 { width: 620px; height: 620px; bottom: -20%; left: 26%; background: var(--m3); animation-delay: -14s; }
        @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(50px,-40px) scale(1.12); } }

        /* ============================================================
           工作台外壳：没有侧栏 / 顶栏 / 面包屑，整页就是部署工具本身
           ============================================================ */
        .viewer {
            position: relative; z-index: 1;
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .viewer-bar {
            flex-shrink: 0;
            display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap;
            padding: 9px 14px;
            background: var(--bg-topbar);
            backdrop-filter: var(--blur-card);
            border-bottom: 1px solid var(--border-subtle);
        }
        .viewer-id { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .viewer-ico {
            width: 26px; height: 26px; border-radius: var(--r-sm); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            background: color-mix(in srgb, var(--dp) 15%, transparent);
            color: var(--dp);
        }
        .viewer-name { font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
        .viewer-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        /* 顶栏里的按钮统一 30px 高，否则主题按钮会比刷新/关闭高一截 */
        .viewer-actions .log-tool { height: 30px; padding: 0 11px; }
        .viewer-bar .theme-toggle { width: 30px; height: 30px; font-size: 14px; border-radius: 9px; }

        .btn {
            border: none; border-radius: 10px;
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }
        .btn-primary { background: var(--m-main); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--m-main) 30%, transparent); }
        .btn-primary:hover { box-shadow: 0 6px 20px color-mix(in srgb, var(--m-main) 50%, transparent); transform: translateY(-1px); }
        .btn-ghost { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-subtle); backdrop-filter: blur(12px); }
        .btn-ghost:hover { border-color: var(--m-main); color: var(--m-main); }
        .btn-danger { background: var(--danger-fg); color: #fff; }
        .btn-danger:hover { filter: brightness(1.08); transform: translateY(-1px); }
        /* 深色主题下这两个按钮都是「亮底 + 白字」，实测只有 2.69:1 / 1.90:1。
           翻成深字即可 —— 亮底深字本来就是暗色主题处理高饱和色的通行做法。 */
        .dark .btn-primary, .dark .btn-danger { color: #0F172A; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .theme-toggle {
            width: 38px; height: 38px; border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card); backdrop-filter: blur(12px);
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.18s ease, border-color 0.18s ease;
        }
        .theme-toggle:hover { transform: scale(1.05); border-color: var(--m-main); }

        /* 工作区：占满剩余高度 */
        .viewer-main {
            flex: 1 1 auto; min-height: 0;
            padding: 12px 14px 14px;
            display: flex; flex-direction: column;
        }
        .last-sync { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }

        /* 顶栏小按钮 */
        .log-tool {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 10px; border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid); color: var(--text-secondary);
            font-family: inherit; font-size: 11.5px; font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .log-tool:hover { border-color: var(--dp); color: var(--dp-fg); }

        .server-meta-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 9px; border-radius: 6px;
            background: var(--border-subtle);
            font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em;
            color: var(--text-secondary); font-variant-numeric: tabular-nums;
        }
        .chip b { font-weight: 800; color: var(--text-primary); }
        .chip b.ok { color: var(--ok-fg); }
        .chip b.warn { color: var(--warn-fg); }
        .chip b.danger { color: var(--danger-fg); }
        /* 带状态值的 chip 用对应浅色底，扫一眼就能分出正常/告警 */
        .chip:has(b.ok)     { background: var(--ok-bg); }
        .chip:has(b.warn)   { background: var(--warn-bg); }
        .chip:has(b.danger) { background: var(--danger-bg); }

        /* ============================================================
           部署工作区：左栏「部署配置」+ 右栏「配置 → 上传 → 执行 → 输出」
           ============================================================ */
        .dp-scope {
            flex: 1 1 auto; min-height: 0;
            display: grid;
            grid-template-columns: 272px minmax(0, 1fr);
            /* 行高必须钉死成 1fr：默认 auto 会按内容取高，而右栏里的步骤区是
               flex-shrink:0，于是整栏会被内容顶出视口（底部终端被裁掉）。 */
            grid-template-rows: minmax(0, 1fr);
            gap: 14px; align-items: stretch;
        }

        /* ---------- 左栏 · 部署配置列表 ---------- */
        .dp-side {
            display: flex; flex-direction: column; min-height: 0;
            background: var(--bg-card);
            backdrop-filter: var(--blur-card);
            border: 1px solid var(--border-card);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        /* 深色下加一道上沿内发光，卡片才不至于平贴在背景上 */
        .dark .dp-side, .dark .dp-main {
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .dp-side-head {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 11px 10px 11px 14px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .dp-side-add {
            width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid); color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-family: inherit; font-size: 13px; line-height: 1;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .dp-side-add:hover { border-color: var(--dp); color: var(--dp-fg); background: color-mix(in srgb, var(--dp) 8%, transparent); }

        .dp-cfg-list { display: flex; flex-direction: column; gap: 1px; padding: 6px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .dp-cfg {
            position: relative; width: 100%;
            display: flex; flex-direction: column; gap: 3px;
            padding: 9px 11px; border-radius: 9px;
            border: none; background: transparent; font-family: inherit;
            text-align: left; cursor: pointer;
            overflow: hidden;   /* 让选中色条被裁进圆角里，不外露直角 */
            transition: background 0.15s ease;
        }
        .dp-cfg:hover { background: var(--border-subtle); }
        .dp-cfg.active { background: color-mix(in srgb, var(--dp) 10%, transparent); }
        .dp-cfg.active::before {
            content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
            width: 3px; border-radius: 0 3px 3px 0; background: var(--dp);
        }
        .dp-cfg-name {
            font-size: 12.5px; font-weight: 700; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dp-cfg-cmd {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dp-cfg.active .dp-cfg-cmd { color: var(--text-secondary); }

        /* 降级成一行文字动作：虚线框和列表项抢注意力，而它只是个次要入口 */
        .dp-side-foot {
            flex-shrink: 0; margin: 0 6px; padding: 11px 12px;
            border: none; border-top: 1px solid var(--border-subtle);
            border-radius: 0; background: transparent;
            color: var(--text-muted);
            font-family: inherit; font-size: 11.5px; font-weight: 600;
            cursor: pointer; text-align: center;
            transition: color 0.15s ease;
        }
        .dp-side-foot:hover { color: var(--dp-fg); }

        /* 空态（配置被删空时） */
        .dp-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; padding: 34px 18px; text-align: center;
        }
        .dp-empty .ico { font-size: 22px; opacity: 0.6; }
        .dp-empty .t { font-size: 13px; font-weight: 700; }
        .dp-empty .d { font-size: 11.5px; color: var(--text-muted); }

        /* ---------- 右栏 ---------- */
        .dp-main {
            display: flex; flex-direction: column; min-height: 0; min-width: 0;
            background: var(--bg-card);
            backdrop-filter: var(--blur-card);
            border: 1px solid var(--border-card);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        /* 配置摘要 */
        .dp-head { flex-shrink: 0; padding: var(--pad-y) var(--pad-x); border-bottom: 1px solid var(--border-subtle); }
        .dp-head-top { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
        .dp-title {
            position: relative; padding-left: 11px;
            font-size: 15px; font-weight: 800; letter-spacing: -0.01em; min-width: 0;
        }
        .dp-title::before {
            content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 15px; border-radius: 2px; background: var(--dp);
        }
        .dp-head-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .dp-spec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 0; margin-top: 12px; }
        .dp-spec-item {
            display: flex; flex-direction: column; gap: 3px; min-width: 0;
            padding-left: 16px; border-left: 1px solid var(--border-subtle);
        }
        .dp-spec-item:first-child { padding-left: 0; border-left: none; }
        .dp-spec-k { font-size: 10px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
        .dp-spec-v {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; color: var(--text-primary); word-break: break-all;
        }
        /* 命令列塞得下「第一条 + 共 N 条」徽标，超长命令省略号收尾、悬停看全 */
        .dp-spec-line { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
        .dp-spec-line .dp-spec-v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dp-spec-more {
            flex-shrink: 0; padding: 1px 5px; border-radius: 4px;
            background: var(--border-subtle); color: var(--text-secondary);
            font-size: 9.5px; font-weight: 700; white-space: nowrap;
        }

        /* 上传区 */
        .dp-upload { flex-shrink: 0; padding: var(--pad-y) var(--pad-x); border-bottom: 1px solid var(--border-subtle); }
        .dp-label {
            display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 9px;
        }
        .dp-label .aside { font-size: 10.5px; font-weight: 600; letter-spacing: 0; text-transform: none; }
        .dropzone {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            padding: 18px 16px; border-radius: 12px;
            border: 1.5px dashed color-mix(in srgb, var(--dp) 42%, var(--border-strong));
            background: color-mix(in srgb, var(--dp) 3%, transparent);
            cursor: pointer; text-align: center; font-family: inherit;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }
        .dropzone:hover {
            border-color: var(--dp);
            background: color-mix(in srgb, var(--dp) 7%, transparent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--dp) 10%, transparent);
        }
        .dropzone.over {
            border-color: var(--dp);
            background: color-mix(in srgb, var(--dp) 13%, transparent);
            box-shadow: 0 0 0 5px color-mix(in srgb, var(--dp) 18%, transparent),
                        0 6px 20px color-mix(in srgb, var(--dp) 18%, transparent);
        }
        .dz-ico { font-size: 19px; line-height: 1; }
        .dz-t { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
        .dz-d { font-size: 11px; color: var(--text-muted); }
        input[type="file"] { display: none; }

        /* 文件多时限高滚动，别把下面的执行区挤出屏幕 */
        .file-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 158px; overflow-y: auto; }
        .file-item {
            display: grid; grid-template-columns: auto minmax(0, 1fr) auto 22px;
            gap: 10px; align-items: center;
            padding: 8px 11px; border-radius: 9px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid);
            animation: fileIn 0.22s ease both;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        @keyframes fileIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
        .file-item:hover {
            border-color: color-mix(in srgb, var(--dp) 34%, transparent);
            background: color-mix(in srgb, var(--dp) 5%, var(--bg-card-solid));
        }
        /* 宽度跟着扩展名长短走：JAR / YAML / GZ 不该都被塞进同一个方块 */
        .file-ico {
            height: 24px; min-width: 32px; padding: 0 7px; border-radius: 6px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em;
            background: color-mix(in srgb, var(--dp) 14%, transparent);
            color: var(--dp-fg);
        }
        .file-name {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .file-size {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums;
        }
        .file-del {
            width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
            border: none; background: transparent; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-family: inherit; font-size: 11px; line-height: 1;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .file-del:hover { background: var(--danger-bg); color: var(--danger-fg); }

        /* 执行动作行 */
        /* 固定最小高度：提示文案换行时按钮不该跟着上下跳 */
        .dp-run {
            flex-shrink: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            min-height: 62px; padding: var(--pad-y) var(--pad-x);
            border-bottom: 1px solid var(--border-subtle);
        }
        .btn-run {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 22px; border-radius: 11px; border: none;
            background: var(--dp-btn); color: #fff;
            font-family: inherit; font-size: 13.5px; font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px color-mix(in srgb, var(--dp-btn) 32%, transparent);
            transition: box-shadow 0.18s ease, transform 0.18s ease, opacity 0.18s ease;
        }
        .btn-run:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 7px 22px color-mix(in srgb, var(--dp-btn) 46%, transparent); }
        /* 执行中：不加透明度（那会把白字压到 2.5:1），改用一道扫光表达「正在跑」 */
        .btn-run:disabled { cursor: not-allowed; position: relative; overflow: hidden; box-shadow: none; }
        .btn-run:disabled::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(100deg, transparent 32%, rgba(255,255,255,0.30) 50%, transparent 68%);
            transform: translateX(-110%);
            animation: btnSweep 1.5s ease-in-out infinite;
        }
        @keyframes btnSweep { to { transform: translateX(110%); } }
        .run-hint { font-size: 11.5px; color: var(--text-muted); min-width: 0; }
        .run-hint.warn { color: var(--warn-fg); font-weight: 600; }

        /* ============================================================
           执行区：左侧任务列 + 右侧执行输出
           ============================================================ */
        .dp-output {
            flex: 1 1 auto; min-height: 0;
            display: grid;
            grid-template-columns: 268px minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr);
            overflow: hidden;
        }

        /* ---------- 左：任务列 ---------- */
        .dp-tasks {
            position: relative;
            display: flex; flex-direction: column; min-height: 0; min-width: 0;
            border-right: 1px solid var(--border-subtle);
            background: linear-gradient(180deg,
                color-mix(in srgb, var(--dp) 4%, transparent) 0%,
                color-mix(in srgb, var(--dp) 1.5%, transparent) 60%,
                transparent 100%);
        }
        .dp-tasks-head {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 10px 14px 8px;
        }
        .dp-tasks-title {
            display: flex; align-items: center; gap: 7px;
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .dp-tasks-title::before {
            content: ""; width: 3px; height: 12px; border-radius: 2px;
            background: var(--dp); flex-shrink: 0;
        }
        .dp-tasks-stats { display: inline-flex; align-items: center; gap: 4px; }
        .task-count {
            display: inline-flex; align-items: center;
            padding: 2px 8px; border-radius: 999px;
            background: var(--border-subtle);
            font-size: 10px; font-weight: 700; letter-spacing: 0.02em;
            color: var(--text-secondary); font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }
        /* 实底：这枚 chip 落在任务列的淡紫渐变上，叠绿底会掉到 4.42:1 */
        .task-count.done { background: var(--bg-card-solid); color: var(--ok-fg); }
        .task-fold-btn {
            width: 20px; height: 20px; border-radius: 5px;
            border: none; background: transparent; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; cursor: pointer; font-family: inherit;
            transition: background 0.15s ease, color 0.15s ease, transform 0.2s ease;
        }
        .task-fold-btn:hover { background: color-mix(in srgb, var(--dp) 10%, transparent); color: var(--dp-fg); }
        .task-fold-btn.active { color: var(--dp-fg); transform: rotate(180deg); }

        .dp-tasks-progress {
            flex-shrink: 0; height: 2px; margin: 0 14px 6px;
            background: var(--border-subtle); border-radius: 2px; overflow: hidden;
        }
        .dp-tasks-progress > span {
            display: block; height: 100%; width: 0; border-radius: 2px;
            background: linear-gradient(90deg, var(--dp), var(--ok-fg));
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .steps {
            flex: 1 1 auto; min-height: 0; overflow-y: auto;
            display: flex; flex-direction: column; gap: 2px;
            padding: 4px 10px 12px;
            position: relative;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: color-mix(in srgb, var(--dp-fg) 45%, var(--border-strong)) transparent;
        }
        .steps::-webkit-scrollbar { width: 6px; }
        .steps::-webkit-scrollbar-thumb {
            background: color-mix(in srgb, var(--dp-fg) 45%, var(--border-strong));
            border-radius: 3px;
        }
        .steps::-webkit-scrollbar-thumb:hover {
            background: color-mix(in srgb, var(--dp-fg) 65%, var(--border-strong));
        }

        /* ---------- 步骤 ---------- */
        .step {
            position: relative;
            display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 18px;
            gap: 8px; align-items: center;
            padding: 7px 9px; border-radius: 9px;
            cursor: pointer; outline: none;
            max-height: 96px;
            transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease,
                        background 0.18s ease, box-shadow 0.18s ease;
        }
        /* 竖向连接线：把 6 个圆点串成一条流程 */
        .step::before {
            content: ""; position: absolute;
            left: 18px; top: 50%; bottom: -2px; width: 2px;
            background: var(--border-subtle);
            transform: translateX(-1px);
            transition: background 0.25s ease;
            z-index: 0;
        }
        .step:last-child::before { display: none; }
        .step-ok::before { background: color-mix(in srgb, var(--ok-fg) 35%, var(--border-subtle)); }
        .step-run::before { background: color-mix(in srgb, var(--dp) 40%, var(--border-subtle)); }
        .step-skip::before {
            background-color: transparent;
            background-image: linear-gradient(180deg, var(--border-subtle) 50%, transparent 50%);
            background-size: 2px 6px;
        }
        .dp-tasks.folded .step-ok:not(.focused)::before { display: none; }

        .step:hover { background: color-mix(in srgb, var(--dp) 6%, transparent); }
        .step:focus-visible { box-shadow: 0 0 0 2px var(--dp); }
        .step.focused { background: color-mix(in srgb, var(--dp) 11%, transparent); }

        .step-dot {
            position: relative; z-index: 1;
            width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-card-solid);
            border: 2px solid var(--border-strong);
            color: var(--text-muted);
            font-size: 9.5px; font-weight: 800;
            transition: background 0.25s ease, border-color 0.25s ease,
                        color 0.25s ease, transform 0.25s ease;
        }
        /* 数字单独一层：圆点带 2px 边框，合在一起量会把边框采成文字底衬 */
        .step-dot-n { line-height: 1; }
        .step-run .step-dot {
            /* 用实底那一档：--dp 上的白字只有 4.47:1，差一点不达标 */
            background: var(--dp-btn); border-color: var(--dp-btn); color: #fff;
            animation: pulse 1.4s ease-in-out infinite;
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--dp) 18%, transparent);
        }
        .step-ok .step-dot {
            background: var(--ok-fg); border-color: var(--ok-fg); color: #fff;
            animation: dotSettle 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        .step-err .step-dot { background: var(--danger-fg); border-color: var(--danger-fg); color: #fff; }
        .step-skip .step-dot {
            background: transparent;
            border: 2px dashed var(--border-strong);
            color: var(--text-muted); font-size: 11px;
        }
        /* 深色下 ok / err 的圆点是亮底 → 翻成深字 */
        .dark .step-ok .step-dot,
        .dark .step-err .step-dot { color: #0F172A; }
        /* 深色下运行中回到亮紫底 + 深字：实底那档在深色里太闷，白字也不行 */
        .dark .step-run .step-dot {
            background: var(--dp); border-color: var(--dp); color: #0F172A;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--dp) 18%, transparent); }
            50%      { box-shadow: 0 0 0 6px color-mix(in srgb, var(--dp) 6%, transparent); }
        }
        @keyframes dotSettle { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }

        /* 重试过的步骤：右上角挂一个黄点 */
        .step-retry .step-dot::after {
            content: ""; position: absolute; top: -2px; right: -2px;
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--warn-fg);
            border: 1.5px solid var(--bg-card-solid);
        }

        .step-name {
            font-size: 12.5px; color: var(--text-muted); min-width: 0;
            line-height: 1.35; position: relative;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            transition: color 0.25s ease;
        }
        .step-run .step-name { color: var(--text-primary); font-weight: 700; }
        .step-ok  .step-name { color: var(--text-primary); }
        .step-err .step-name { color: var(--danger-fg); font-weight: 700; }
        .step-skip .step-name {
            color: var(--text-muted); opacity: .55;
            text-decoration: line-through;
            text-decoration-color: var(--border-strong);
        }
        /* 名称被截断时，悬停给出全文 */
        .step-name.truncated::after {
            content: attr(data-full);
            position: absolute; left: 0; top: calc(100% + 6px);
            z-index: 30;
            padding: 6px 10px; border-radius: 8px;
            background: var(--bg-card-solid);
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-card-hover);
            font-size: 11.5px; font-weight: 500; color: var(--text-primary);
            white-space: normal; width: max-content; max-width: 260px;
            opacity: 0; pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .step:hover .step-name.truncated::after { opacity: 1; transform: none; }

        /* 说明行：只在进行中 / 被点开 / 失败时展开 */
        .step-line {
            grid-column: 2 / -1;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            max-height: 0; opacity: 0;
            transition: max-height 0.2s ease, opacity 0.2s ease, margin 0.2s ease;
        }
        .step-run .step-line,
        .step.focused .step-line,
        .step-err .step-line {
            max-height: 20px; opacity: 1; margin-top: 2px;
        }

        .step-time {
            font-size: 10px; color: var(--text-muted);
            font-variant-numeric: tabular-nums; white-space: nowrap;
            padding: 1px 6px; border-radius: 4px;
            min-width: 44px; text-align: right;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .step-ok .step-time {
            /* 实底：绿色徽标压在 .step-ok 那层 4% 绿底上会掉到 4.23:1 */
            background: var(--bg-card-solid); color: var(--ok-fg); font-weight: 700;
        }
        .step-run .step-time {
            background: color-mix(in srgb, var(--dp) 15%, transparent);
            color: var(--dp-fg); font-weight: 700;
        }
        .step-err .step-time { background: var(--danger-bg); color: var(--danger-fg); font-weight: 700; }
        .step-skip .step-time { background: transparent; color: var(--text-muted); opacity: .55; }
        .step-time.slow { background: var(--warn-bg); color: var(--warn-fg); }

        .step-retry-btn {
            width: 18px; height: 18px; border-radius: 5px;
            border: 1px solid var(--danger-fg);
            background: var(--danger-bg); color: var(--danger-fg);
            display: none; align-items: center; justify-content: center;
            font-size: 10px; cursor: pointer; font-family: inherit; padding: 0;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .step-retry-btn:hover { background: color-mix(in srgb, var(--danger-fg) 20%, transparent); }
        .step-err .step-retry-btn { display: flex; }

        .step-run {
            background: color-mix(in srgb, var(--dp) 9%, transparent);
            box-shadow: inset 3px 0 0 var(--dp);
        }
        .step-ok { background: color-mix(in srgb, var(--ok-fg) 4%, transparent); }

        /* 等待输入：这一步不会自己往下走。用琥珀色与「进行中」的靛蓝区分开 ——
           它是「需要你介入」，既不是跑得好也不是出错 */
        .step-wait {
            background: color-mix(in srgb, var(--bar-warn) 10%, transparent);
            box-shadow: inset 3px 0 0 var(--bar-warn);
        }
        .step-wait::before { background: color-mix(in srgb, var(--warn-fg) 40%, var(--border-subtle)); }
        .step-wait .step-dot {
            background: var(--warn-fg); border-color: var(--warn-fg); color: #fff;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: -1px;
            animation: pulseWarn 1.3s ease-in-out infinite;
        }
        /* 深色下琥珀是亮底 → 翻成深字（亮底白字只有 1.9:1） */
        .dark .step-wait .step-dot { color: #0F172A; }
        .step-wait .step-name { color: var(--text-primary); font-weight: 700; }
        .step-wait .step-time { background: var(--warn-bg); color: var(--warn-fg); font-weight: 700; }
        .step-wait .step-line { max-height: 20px; opacity: 1; margin-top: 2px; }
        /* 等待态那层琥珀底衬会把三级文字压到 4.25:1 —— 说明行这时承载「为什么停下来」，
           提到二级文字色（浅 6.6:1 / 深 7.6:1 左右） */
        .step-wait .step-line { color: var(--text-secondary); }
        @keyframes pulseWarn {
            0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn-fg) 22%, transparent); }
            50%      { box-shadow: 0 0 0 7px color-mix(in srgb, var(--warn-fg) 7%, transparent); }
        }

        /* 步骤内进度条（只有上传步有） */
        .step-bar {
            grid-column: 2 / -1; display: block;
            height: 6px; border-radius: 999px;
            background: var(--bar-track);
            overflow: hidden; margin-top: 2px;
        }
        .step-bar > span {
            display: block; height: 100%; border-radius: 999px; width: 0;
            background: linear-gradient(90deg, var(--dp), color-mix(in srgb, var(--dp) 70%, #fff));
            transition: width 0.12s linear, background 0.3s ease;
        }
        .step-run .step-bar > span {
            background-image: linear-gradient(45deg,
                rgba(255,255,255,0.25) 25%, transparent 25%,
                transparent 50%, rgba(255,255,255,0.25) 50%,
                rgba(255,255,255,0.25) 75%, transparent 75%, transparent);
            background-size: 18px 18px;
            animation: barFlow 0.7s linear infinite;
        }
        @keyframes barFlow { to { background-position: 18px 0; } }
        .step-ok .step-bar > span { background: var(--bar-ok); background-image: none; animation: none; }

        /* 折叠已完成的步骤 */
        .dp-tasks.folded .step-ok:not(.focused) {
            max-height: 0; padding-top: 0; padding-bottom: 0;
            margin: 0; opacity: 0; overflow: hidden;
        }

        .jump-btn {
            position: absolute; right: 14px; bottom: 12px; z-index: 5;
            padding: 4px 10px; border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--dp) 40%, transparent);
            background: var(--bg-card-solid); color: var(--dp-fg);
            font-family: inherit; font-size: 10.5px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 12px rgba(15,23,42,0.12);
            animation: jumpIn 0.2s ease;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .jump-btn:hover { background: color-mix(in srgb, var(--dp) 10%, var(--bg-card-solid)); transform: translateY(-1px); }
        @keyframes jumpIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        /* ---------- 右：执行面板 ---------- */
        .dp-exec { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
        .dp-exec-head {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; flex-wrap: wrap;
            padding: 8px var(--pad-x);
            border-bottom: 1px solid var(--border-subtle);
        }
        .dp-exec-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .dp-exec-title {
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .exec-meta {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }
        .exec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--idle-fg); flex-shrink: 0; }
        .exec-meta.run .exec-dot { background: var(--dp); animation: pulse 1.1s ease-in-out infinite; }
        .exec-meta.ok  .exec-dot { background: var(--ok-fg); }
        .exec-meta.err .exec-dot { background: var(--danger-fg); }
        .exec-meta.run { color: var(--dp-fg); font-weight: 700; }
        .exec-meta.ok  { color: var(--ok-fg); font-weight: 700; }
        .exec-meta.err { color: var(--danger-fg); font-weight: 700; }
        /* 等待输入：慢闪的琥珀点 —— 和「执行中」的靛蓝脉冲区分开 */
        .exec-meta.wait .exec-dot { background: var(--warn-fg); animation: pulseWarn 1.3s ease-in-out infinite; }
        .exec-meta.wait { color: var(--warn-fg); font-weight: 700; }
        .exec-meta.jump { animation: metaJump 0.4s ease; }
        @keyframes metaJump {
            0%   { transform: translateX(-4px); opacity: 0.4; }
            100% { transform: none; opacity: 1; }
        }
        .dp-exec-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .exec-host {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted); white-space: nowrap;
        }
        .exec-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: transparent; color: var(--text-secondary);
            font-family: inherit; font-size: 10.5px; font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .exec-btn:hover { border-color: var(--dp); color: var(--dp-fg); }
        .exec-btn.on {
            border-color: var(--dp); color: var(--dp-fg);
            background: color-mix(in srgb, var(--dp) 8%, transparent);
        }
        .exec-btn.alert {
            border-color: var(--warn-fg); color: var(--warn-fg);
            background: color-mix(in srgb, var(--warn-fg) 10%, transparent);
        }

        .console {
            flex: 1 1 auto; min-height: 0;
            overflow-y: auto;
            padding: var(--pad-y) var(--pad-x);
            background: var(--term-bg);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; line-height: 1.85;
        }
        .console-line { display: flex; gap: 10px; }
        .console-t { color: var(--term-dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .console-x { color: var(--term-fg); word-break: break-all; min-width: 0; }
        .console-line.ok   .console-x { color: var(--term-ok); }
        .console-line.warn .console-x { color: var(--term-warn); }
        .console-line.err  .console-x { color: var(--term-err); }
        .console-line.step-header .console-x {
            color: var(--term-dim); font-weight: 700; letter-spacing: 0.04em;
        }
        .console-line.step-header { margin-top: 6px; }
        /* 子命令的操作名：弱化一行，让长命令序列在终端里也能一眼分段 */
        .console-line.sub .console-x { color: var(--term-dim); }
        .console-line.flash { animation: lineFlash 1.2s ease; border-radius: 4px; }
        @keyframes lineFlash {
            0%   { background: color-mix(in srgb, var(--dp) 30%, transparent); }
            100% { background: transparent; }
        }
        .console-empty { color: var(--term-dim); }

        /* 终端里的内联输入：命令自己停下要密码时，就在它那一行里接着输。
           终端深浅两套都是深底浅字，所以这里用固定的浅色而不是主题令牌 */
        .console-line.ask { margin-top: 1px; }
        .console-x.ask-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ask-label { color: var(--term-fg); }
        .ask-input {
            flex: 0 1 190px; min-width: 104px;
            padding: 1px 8px; border-radius: 5px;
            /* 0.24 的描边在终端底上只有 2.54:1 —— 一个要人往里填东西的控件，
               边界必须是 3:1 起（WCAG 1.4.11），太淡等于没画 */
            border: 1px solid rgba(255,255,255,0.44);
            background: rgba(255,255,255,0.06);
            color: var(--term-fg);
            font-family: inherit; font-size: 11.5px; line-height: 1.6;
            letter-spacing: 0.2em;
        }
        .ask-input:focus {
            outline: none;
            border-color: #A5B4FC;
            box-shadow: 0 0 0 2px rgba(165,180,252,0.35);
        }
        .ask-input::placeholder { color: var(--term-dim); letter-spacing: 0; }
        .ask-input:disabled { opacity: 0.5; }
        .ask-go {
            padding: 1px 10px; border-radius: 5px; cursor: pointer;
            border: 1px solid rgba(165,180,252,0.55);
            background: rgba(165,180,252,0.16);
            color: #E0E7FF; font-family: inherit; font-size: 11px; font-weight: 700;
            transition: background 0.15s ease;
        }
        .ask-go:hover { background: rgba(165,180,252,0.30); }
        .ask-note { font-size: 10.5px; color: var(--term-dim); }
        .ask-err { font-size: 10.5px; color: var(--term-err); }
        .ask-dots { color: var(--term-ok); letter-spacing: 0.2em; }
        .console-line.ask.done .ask-label { color: var(--term-dim); }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1024px) {
            .dp-scope { grid-template-columns: 232px minmax(0, 1fr); }
            /* 两列时每行首项不该带分隔线 */
            .dp-spec-item:nth-child(odd) { padding-left: 0; border-left: none; }
        }
        @media (max-width: 860px) {
            :root { --pad-y: 10px; --pad-x: 12px; }
            /* 顶栏折成两行：第一行 标识 + 操作，第二行 概览 chips */
            .viewer-bar { padding: 8px 10px; gap: 8px 10px; }
            .viewer-name { font-size: 13px; }
            /* 折行后顶栏太挤，时间信息让位给操作按钮 */
            .last-sync { display: none; }
            .viewer-id { order: 1; }
            .viewer-actions { order: 2; }
            .server-meta-bar { order: 3; width: 100%; }
            .viewer-main { padding: 10px; }
            /* 左栏折叠成横向滚动条，右栏独占整宽 */
            .dp-scope { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
            /* 左栏折成横向条后自带滚动条会很抢眼，隐藏掉、靠内容自证可滑 */
            .dp-side {
                flex-direction: row; align-items: center; gap: 8px; padding: 8px;
                overflow-x: auto;
                scrollbar-width: none; -ms-overflow-style: none;
            }
            .dp-side::-webkit-scrollbar { display: none; }
            .dp-side-head { border: none; padding: 0 4px 0 6px; flex-shrink: 0; }
            .dp-side-head span:first-child { display: none; }
            .dp-cfg-list { flex-direction: row; padding: 0; gap: 6px; overflow: visible; }
            .dp-cfg {
                flex-shrink: 0; width: auto; min-width: 196px;
                border: 1px solid var(--border-subtle); border-radius: 10px;
            }
            .dp-side-foot { margin: 0; flex-shrink: 0; padding: 9px 12px; }
            .dp-spec { grid-template-columns: minmax(0, 1fr); gap: 10px 0; }
            .dp-spec-item { padding-left: 0; border-left: none; }
            /* 执行区折成上下：任务列变成横向步骤条 */
            .dp-output {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
                /* 窄屏上方内容多，给输出区保底高度，否则终端会被压到只剩三行 */
                min-height: 330px;
            }
            /* 右栏内容超出时整体滚动（圆角仍会裁切内容） */
            .dp-main { overflow-y: auto; }
            .dp-tasks { border-right: none; border-bottom: 1px solid var(--border-subtle); }
            .dp-tasks-progress { margin: 0 12px 4px; }
            .steps {
                flex-direction: row; overflow-x: auto; overflow-y: hidden;
                padding: 8px 10px; gap: 6px;
                scrollbar-width: none; scroll-snap-type: x proximity;
            }
            .steps::-webkit-scrollbar { display: none; }
            .step {
                flex-shrink: 0; min-width: 180px; max-height: none;
                border: 1px solid var(--border-subtle); border-radius: 10px;
                background: var(--bg-card-solid); box-shadow: none;
                scroll-snap-align: start;
            }
            .step::before { display: none; }
            .step-run {
                box-shadow: inset 0 -3px 0 var(--dp);
                background: color-mix(in srgb, var(--dp) 8%, var(--bg-card-solid));
            }
            /* 横向条里强调条要跟着转 90°：左侧竖条在卡片上看不见 */
            .step-wait {
                box-shadow: inset 0 -3px 0 var(--bar-warn);
                background: color-mix(in srgb, var(--bar-warn) 10%, var(--bg-card-solid));
            }
            .step-line { display: none; }
            .step-bar { display: none; }
            .dp-tasks.folded .step-ok:not(.focused) { max-height: 96px; padding: 8px 10px; opacity: 1; }
            .jump-btn { display: none; }
            .console { font-size: 11px; }
            .console-t { font-size: 10px; }
            /* 移动端改到顶部居中，避免和底部操作按钮打架 */
            .toast {
                bottom: auto; top: 12px; right: auto; left: 50%;
                transform: translateX(-50%) translateY(-24px);
            }
            .toast.show { transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 560px) {
            .modal-actions { flex-direction: column-reverse; }
            .modal-actions .btn { justify-content: center; }
            .dp-run .btn-run { width: 100%; justify-content: center; }
            .file-item { grid-template-columns: auto minmax(0, 1fr) 22px; }
            .cmd-row { grid-template-columns: 84px minmax(0, 1fr) 24px 22px; }
            .file-ico { height: 20px; min-width: 26px; padding: 0 5px; font-size: 8.5px; }
            .file-size { display: none; }
        }

        /* ============================================================
           弹窗 / Toast
           ============================================================ */
        .modal-mask {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(15,23,42,0.35); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-mask.open { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--bg-card-solid);
            border-radius: var(--r-lg);
            width: 100%; max-width: 480px; max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(15,23,42,0.28);
            animation: modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: none; } }
        .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--border-subtle); }
        .modal-title { font-size: 16px; font-weight: 700; }
        .modal-close {
            width: 32px; height: 32px; border-radius: var(--r-sm); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary); background: transparent;
            border: none; font-size: 14px; font-family: inherit;
            transition: background 0.18s ease, color 0.18s ease;
        }
        .modal-close:hover { background: var(--border-subtle); color: var(--text-primary); }
        .modal-body { padding: 22px; overflow-y: auto; }
        .modal-body > p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.75; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 22px; border-top: 1px solid var(--border-subtle); }

        .modal-field { margin-top: 16px; }
        .modal-field:first-child { margin-top: 0; }
        .modal-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        .modal-input {
            width: 100%; padding: 9px 12px; border-radius: 9px;
            border: 1px solid var(--border-strong);
            background: var(--bg-card-solid); color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .modal-input:focus { outline: none; border-color: var(--dp); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dp) 18%, transparent); }
        .modal-input.is-invalid { border-color: var(--bar-danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bar-danger) 20%, transparent); }
        /* 名称字段填的是中文描述，用等宽会显得别扭 */
        .modal-input.plain { font-family: inherit; font-size: 13px; }
        /* placeholder 不写颜色就吃浏览器默认灰，深色下只有 3.17:1 */
        .modal-input::placeholder { color: var(--text-muted); }
        .modal-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .modal-chip {
            padding: 4px 9px; border-radius: 6px;
            border: 1px solid var(--border-subtle); background: var(--bg-card-solid);
            color: var(--text-secondary); cursor: pointer;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; font-weight: 600;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .modal-chip:hover { border-color: var(--dp); color: var(--dp-fg); }
        .modal-warn {
            display: flex; gap: 10px; align-items: flex-start;
            margin-top: 16px; padding: 12px 14px; border-radius: var(--r-md);
            background: var(--danger-bg); color: var(--danger-fg);
            font-size: 12.5px; line-height: 1.65;
        }
        .modal-warn.info { background: var(--idle-bg); color: var(--idle-fg); }
        .modal-warn strong { font-weight: 800; margin-right: 2px; }

        /* ============================================================
           部署配置表单（新增 / 编辑弹窗）
           ============================================================ */
        /* 表单比普通确认框长得多：宽度给到 560，长路径才不至于被截断到看不全；
           高度上限放到 92vh：矮窗口下也尽量让整张表单留在首屏 */
        .modal.modal-form { max-width: 600px; max-height: 92vh; }
        .modal-form .modal-body { padding: 14px 20px; }
        .modal-form .modal-input { padding: 7px 12px; }

        /* 分组：把「这是什么配置」和「要对服务器做什么」分开 */
        .form-group { margin-top: 13px; }
        .form-group:first-of-type { margin-top: 0; }
        .form-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
        .form-group-no {
            width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: color-mix(in srgb, var(--dp) 14%, transparent);
            color: var(--dp-fg);
            font-size: 10px; font-weight: 800;
        }
        .form-group-title {
            font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
            color: var(--text-secondary); white-space: nowrap;
        }
        /* 标题右侧拉一条淡线，两组在视觉上才切得开 ——
           用 strong 而非 subtle：0.06 的透明度过淡，等于没画 */
        .form-group-head::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--border-strong); }

        .modal-form .modal-field { margin-top: 9px; }
        .modal-form .form-group > .modal-field:first-child { margin-top: 0; }
        .modal-form .field-label { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
        .modal-form .field-label label { display: inline; margin-bottom: 0; }
        /* 必填用徽标而非跟在文字后的红星：红星在深色底上几乎看不见 */
        .field-req {
            padding: 1px 6px; border-radius: 4px;
            background: var(--danger-bg); color: var(--danger-fg);
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap;
        }
        /* 字段说明改挂到标签行的「?」气泡里（见 .tip-layer），不再常驻占位；
           下方只留校验错误，报错时高度只多出错误那一行 */
        .field-help {
            width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; cursor: help;
            border: 1px solid var(--border-strong);
            background: transparent; color: var(--text-secondary);
            font-family: inherit; font-size: 9.5px; font-weight: 800; line-height: 1;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .field-help:hover, .field-help:focus-visible {
            border-color: var(--dp); color: var(--dp-fg);
            background: color-mix(in srgb, var(--dp) 10%, transparent);
        }
        /* 右对齐的计数：多行命令填了几条，填的时候就要能看见 */
        .field-count {
            margin-left: auto; white-space: nowrap;
            font-size: 10px; font-weight: 700; color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }
        .field-err {
            display: flex; align-items: center; gap: 5px;
            margin-top: 5px;
            font-size: 10px; font-weight: 700; line-height: 1.45; color: var(--danger-fg);
        }
        .field-err::before { content: "⚠"; font-size: 11px; flex-shrink: 0; }
        .modal-form .modal-field.has-error .modal-input {
            border-color: var(--bar-danger);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--bar-danger) 20%, transparent);
        }

        /* 常用值：给一组孤零零的路径加个前缀，才知道这是可选而非示例 */
        .chips-row { display: flex; align-items: baseline; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
        .chips-label { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-secondary); white-space: nowrap; }
        .modal-form .modal-chip { padding: 3px 8px; }

        /* 启动命令列表：左边写这一步做什么，右边写要执行的命令。
           列表限高后内部滚动，条数再多也不会把弹窗撑高 */
        .cmd-rows {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 174px; overflow-y: auto;   /* 约 5 行，再多就内部滚动 */
        }
        /* 第 3 列是「需人工输入」开关：有些命令天生要停下来等人填，标记后执行到它会暂停 */
        .cmd-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 26px 24px; gap: 6px; align-items: center; }
        /* 操作名是中文标签，用等宽会显得别扭 */
        .cmd-op { font-family: inherit; font-size: 12px; }
        .cmd-run { font-size: 12px; }
        .cmd-del {
            width: 24px; height: 30px; padding: 0; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid transparent; background: transparent;
            color: var(--text-muted); cursor: pointer; font-family: inherit; font-size: 11px;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .cmd-del:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger-fg); border-color: var(--danger-fg); }
        .cmd-del:disabled { opacity: 0.4; cursor: not-allowed; }
        /* 用 >_ 而不是 ⌨：U+2328 在本机没有文本字形，兜底落到彩色 emoji 字体，
           既不跟着 color 走（开关的选中态只能靠底色区分），深色下又是一坨深蓝 */
        .cmd-ask {
            width: 26px; height: 30px; padding: 0; border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border-subtle); background: transparent;
            color: var(--text-muted); cursor: pointer;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; font-weight: 700; letter-spacing: -0.5px;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .cmd-ask:hover { border-color: var(--dp); color: var(--dp-fg); }
        .cmd-ask.on {
            border-color: var(--dp); color: var(--dp-fg);
            background: color-mix(in srgb, var(--dp) 14%, transparent);
        }
        /* 交互提示行：只有识别到「会等输入」或已标记时才出现，普通命令行不会被撑高 */
        .cmd-note {
            grid-column: 1 / -1;
            display: flex; align-items: flex-start; gap: 5px;
            margin: 1px 2px 0;
            font-size: 10.5px; line-height: 1.5; color: var(--warn-fg);
        }
        .cmd-note.on { color: var(--dp-fg); }
        .cmd-note .ic { flex-shrink: 0; font-weight: 800; }
        .cmd-edit > .cmd-add { margin-top: 7px; }
        .cmd-add {
            padding: 5px 11px; border-radius: 8px;
            border: 1px dashed var(--border-strong); background: transparent;
            color: var(--text-secondary); cursor: pointer; font-family: inherit;
            font-size: 11px; font-weight: 600;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .cmd-add:hover { border-color: var(--dp); color: var(--dp-fg); background: color-mix(in srgb, var(--dp) 6%, transparent); }

        /* 「?」气泡必须挂在 .modal-body 之外 —— body 是 overflow-y:auto，
           挂在字段里的绝对定位气泡一贴到底部就会被裁掉一半 */
        .tip-layer {
            position: fixed; z-index: 400; pointer-events: none;
            max-width: 272px;
            padding: 8px 11px; border-radius: 9px;
            background: var(--bg-card-solid);
            border: 1px solid var(--border-strong);
            box-shadow: 0 8px 26px rgba(15,23,42,0.18);
            font-size: 11.5px; line-height: 1.65; color: var(--text-secondary);
        }
        .dark .tip-layer { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* 矮窗口（≤800 高）再收一档节奏，尽量让整张表单留在首屏。
           只在视口不足 800 高时生效，高窗口保持舒展的间距。 */
        @media (max-height: 800px) {
            .modal-form .modal-body { padding: 12px 18px; }
            .form-group { margin-top: 11px; }
            .modal-form .modal-field { margin-top: 7px; }
            .chips-row { margin-top: 4px; }
        }

        .toast {
            /* 右下角：不压住左栏配置列表与顶栏 */
            position: fixed; bottom: 24px; right: 24px;
            transform: translateY(80px);
            background: var(--bg-card-solid); color: var(--text-primary);
            padding: 12px 20px; border-radius: var(--r-md);
            box-shadow: 0 12px 32px rgba(15,23,42,0.2);
            font-size: 13px; font-weight: 600; z-index: 300;
            opacity: 0; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; gap: 8px;
            border: 1px solid var(--border-subtle);
            max-width: calc(100vw - 32px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast[data-type="ok"] { border-color: color-mix(in srgb, var(--bar-ok) 40%, transparent); }
        .toast[data-type="warn"] { border-color: color-mix(in srgb, var(--bar-warn) 45%, transparent); }
        .toast[data-type="danger"] { border-color: color-mix(in srgb, var(--bar-danger) 45%, transparent); }
        .toast[data-type="ok"] .toast-ico { color: var(--ok-fg); }
        .toast[data-type="warn"] .toast-ico { color: var(--warn-fg); }
        .toast[data-type="danger"] .toast-ico { color: var(--danger-fg); }
        .toast-ico { font-weight: 800; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
<div class="aurora-bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="viewer">

    <header class="viewer-bar">
        <div class="viewer-id">
            <span class="viewer-ico" aria-hidden="true">📦</span>
            <span class="viewer-name">支付系统重构 · 部署</span>
        </div>

        <div class="server-meta-bar" id="headMeta"></div>

        <div class="viewer-actions">
            <span class="last-sync" id="lastSync">最后更新 11:20</span>
            <button class="log-tool" onclick="refreshAll()" title="刷新部署配置">⟳ 刷新</button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换到深色主题" aria-pressed="false">🌙</button>
            <button class="log-tool" id="closeBtn" onclick="goOps()" title="关闭这个部署窗口">✕</button>
        </div>
    </header>

    <main class="viewer-main">
<div class="dp-scope">

    <!-- ========== 左栏：部署配置 ========== -->
    <aside class="dp-side">
        <div class="dp-side-head">
            <span>部署配置</span>
            <button class="dp-side-add" title="新增部署配置" aria-label="新增部署配置" onclick="askNewConfig()">＋</button>
        </div>
        <div class="dp-cfg-list" id="cfgList" role="tablist" aria-label="部署配置列表"></div>
        <button class="dp-side-foot" onclick="askNewConfig()">＋ 新增部署配置</button>
    </aside>

    <!-- ========== 右栏：当前配置 → 上传 → 执行 → 输出 ========== -->
    <section class="dp-main">

        <!-- 配置摘要 -->
        <div class="dp-head">
            <div class="dp-head-top">
                <div class="dp-title" id="cfgTitle">—</div>
                <div class="dp-head-actions">
                    <button class="log-tool" onclick="askEditConfig()" title="编辑当前配置">✎ 编辑</button>
                    <button class="log-tool" onclick="askDeleteConfig()" title="删除当前配置">🗑 删除</button>
                </div>
            </div>
            <div class="dp-spec">
                <div class="dp-spec-item">
                    <span class="dp-spec-k">上传到</span>
                    <span class="dp-spec-v" id="specPath">—</span>
                </div>
                <div class="dp-spec-item">
                    <span class="dp-spec-k">启动命令</span>
                    <span class="dp-spec-line">
                        <span class="dp-spec-v" id="specCmd">—</span>
                        <span class="dp-spec-more" id="specCmdMore" hidden></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- 上传文件 -->
        <div class="dp-upload">
            <div class="dp-label">
                <span>要上传的文件</span>
                <span class="aside" id="fileTotal"></span>
            </div>
            <!-- 拖拽区：真实可拖入，也支持点击选择 -->
            <div class="dropzone" id="dropzone" role="button" tabindex="0"
                 aria-label="选择或拖入要部署的文件" onclick="pickFiles()">
                <span class="dz-ico" aria-hidden="true">⬆</span>
                <span class="dz-t">把文件拖到这里，或点击选择</span>
                <span class="dz-d">支持多选 · jar / zip / tar.gz / sql / 静态资源</span>
            </div>
            <input type="file" id="fileInput" multiple onchange="onFilesPicked(this.files)">
            <div class="file-list" id="fileList" hidden></div>
        </div>

        <!-- 执行 -->
        <div class="dp-run">
            <button class="btn-run" id="runBtn" onclick="startDeploy()">🚀 开始部署</button>
            <button class="log-tool" id="abortBtn" onclick="abortDeploy()" hidden>■ 中止</button>
            <span class="run-hint" id="runHint">先选文件，再点「开始部署」—— 会上传到上方路径，然后执行启动命令</span>
        </div>

        <!-- 执行输出 -->
        <div class="dp-output">

            <!-- 左：任务列 -->
            <aside class="dp-tasks" id="taskCol">
                <div class="dp-tasks-head">
                    <span class="dp-tasks-title">执行任务</span>
                    <span class="dp-tasks-stats">
                        <span class="task-count" id="taskCount">6 步</span>
                        <span class="task-count done" id="taskTotal" hidden>0.0s</span>
                        <button class="task-fold-btn" id="foldBtn" onclick="toggleFold()"
                                title="折叠已完成的步骤" aria-pressed="false">⌄</button>
                    </span>
                </div>
                <div class="dp-tasks-progress" aria-hidden="true">
                    <span id="taskProgressFill"></span>
                </div>
                <div class="steps" id="stepList" role="listbox" aria-label="部署步骤"></div>
                <button class="jump-btn" id="jumpBtn" hidden onclick="jumpToCurrent()">↓ 当前步</button>
            </aside>

            <!-- 右：执行面板 -->
            <section class="dp-exec">
                <div class="dp-exec-head">
                    <div class="dp-exec-left">
                        <span class="dp-exec-title">执行输出</span>
                        <span class="exec-meta" id="execMeta">
                            <span class="exec-dot"></span>
                            <span class="exec-text">等待开始</span>
                        </span>
                    </div>
                    <div class="dp-exec-right">
                        <span class="exec-host" id="execHost">—</span>
                        <button class="exec-btn on" id="followBtn" onclick="toggleFollow()"
                                title="新日志自动滚到底部">↓ 跟随</button>
                        <button class="exec-btn" id="copyBtn" onclick="copyConsole()"
                                title="复制全部日志">⧉ 复制</button>
                    </div>
                </div>
                <div class="console" id="console">
                    <div class="console-line">
                        <span class="console-t">--:--:--</span>
                        <span class="console-x console-empty">等待开始部署…</span>
                    </div>
                </div>
            </section>

        </div>

    </section>

</div>
    </main>
</div>

<!-- 弹窗：新增 / 编辑部署配置 -->
<div class="modal-mask" id="modalMask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
            <div class="modal-title" id="modalTitle">标题</div>
            <button class="modal-close" onclick="closeModal()" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions">
            <button class="btn btn-ghost" id="modalCancel" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="modalConfirm">确定</button>
        </div>
    </div>
</div>

<div class="tip-layer" id="tipLayer" role="tooltip" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
    /* ============================================================
       主题（与运维页共用同一个 key，跨页保持一致）
       ============================================================ */
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(dark) {
        root.classList.toggle('dark', dark);
        themeToggle.textContent = dark ? '☀️' : '🌙';
        themeToggle.setAttribute('aria-pressed', String(dark));
        themeToggle.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
        localStorage.setItem('theme', dark ? 'dark' : 'light');
    }
    // 主题优先级：URL 参数 > localStorage。
    // ?theme= 是「渲染级验收」驱动深色态的入口 —— 页面不读它，深色场景会静默渲染成浅色，
    // 量出一模一样的数值，看着还像「全绿」。
    const urlTheme = new URLSearchParams(location.search).get('theme');
    applyTheme(urlTheme ? urlTheme === 'dark' : (localStorage.getItem('theme') || 'light') === 'dark');
    themeToggle.addEventListener('click', () => applyTheme(!root.classList.contains('dark')));

    /* ============================================================
       Toast
       ============================================================ */
    const TOAST_ICON = { ok: '✓', info: 'ℹ', warn: '⚠', danger: '✕' };
    let toastTimer;

    function toast(msg, type = 'ok') {
        const t = document.getElementById('toast');
        t.dataset.type = type;
        t.innerHTML = '';
        const ico = document.createElement('span');
        ico.className = 'toast-ico';
        ico.setAttribute('aria-hidden', 'true');
        ico.textContent = TOAST_ICON[type] || TOAST_ICON.ok;
        const txt = document.createElement('span');
        txt.textContent = msg;
        t.append(ico, txt);
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ============================================================
       独立窗口模式（从运维页用 window.open 打开时 URL 带 #win）
       ============================================================ */
    const IS_WINDOW = location.hash === '#win';
    const OPS_URL = '工作-项目-项目详情-运维-部署-index.html';
    /* 目标服务器由「从哪台机器进来」决定（运维页打开时带 ?host=），不再逐条配置 ——
       同一条部署流程在多台机器上是复用的，让每条配置各存一份机器名只会互相打架 */
    const TARGET_HOST = new URLSearchParams(location.search).get('host') || 'prod-web-01';

    function goOps() {
        if (IS_WINDOW) {
            window.close();
            // close() 只对脚本打开的窗口生效；直接访问 #win 时兜底回跳转运维页
            setTimeout(() => { location.href = OPS_URL; }, 150);
            return;
        }
        location.href = OPS_URL;
    }

    /* ============================================================
       弹窗
       ============================================================ */
    const mask = document.getElementById('modalMask');
    const mTitle = document.getElementById('modalTitle');
    const mBody = document.getElementById('modalBody');
    const mConfirm = document.getElementById('modalConfirm');
    const mBox = mask.querySelector('.modal');
    let lastFocused = null;

    function openConfirm({ title, desc, warn, warnKind = 'danger', confirmText = '确定', danger = false, variant, render, onConfirm }) {
        lastFocused = document.activeElement;
        mTitle.textContent = title;
        mBody.innerHTML = '';
        // 表单弹窗更宽：长路径与命令需要横向空间，挤在 480 里会被截断
        mBox.classList.toggle('modal-form', variant === 'form');

        if (desc) {
            const p = document.createElement('p');
            p.textContent = desc;
            mBody.appendChild(p);
        }
        if (warn) {
            const box = document.createElement('div');
            box.className = 'modal-warn' + (warnKind === 'info' ? ' info' : '');
            box.setAttribute('role', 'note');
            const strong = document.createElement('strong');
            strong.textContent = warnKind === 'info' ? '说明：' : '影响：';
            const span = document.createElement('span');
            span.textContent = warn;
            box.append(strong, span);
            mBody.appendChild(box);
        }

        // render 负责挂自定义表单，返回 { focus, validate, onInvalid }
        const api = render ? render(mBody) : null;

        mConfirm.textContent = confirmText;
        mConfirm.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
        mConfirm.onclick = () => {
            if (api && api.validate && api.validate() !== true) {
                if (api.onInvalid) api.onInvalid();
                return;
            }
            closeModal();
            if (onConfirm) onConfirm();
        };

        mask.classList.add('open');
        // focus 允许传函数：编辑态要先 focus 再全选，光给一个元素做不到
        const focusTarget = api && api.focus ? api.focus : mConfirm;
        if (typeof focusTarget === 'function') focusTarget();
        else focusTarget.focus();
    }

    function closeModal() {
        if (!mask.classList.contains('open')) return;
        mask.classList.remove('open');
        if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    /* ============================================================
       数据：部署配置
       path = 传到服务器上的哪个位置，cmd = 传完之后执行什么
       failAt 仅用于把「失败链」演示出来（健康检查不通过 → 自动回滚）
       ============================================================ */
    let CONFIGS = [
        { id: 'c1', name: '应用包 · 全量启动',
          path: '/opt/app/releases',
          cmd: [
              { op: '同步文件', run: 'rsync -a --delete /opt/app/releases/ /opt/app/current/' },
              { op: '重启服务', run: 'su - deploy -c "systemctl restart pay-api"' },
              { op: '健康检查', run: 'curl -sf http://127.0.0.1:8080/healthz' }
          ] },
        { id: 'c2', name: '前端静态资源',
          path: '/var/www/pay-web/dist',
          cmd: [
              { op: '校验配置', run: 'nginx -t' },
              { op: '重载 Nginx', run: 'nginx -s reload' }
          ] },
        { id: 'c3', name: '数据库迁移脚本',
          path: '/opt/db/migrations',
          cmd: [
              { op: '备份当前库', run: 'pg_dump -Fc -f /opt/db/pre-migration.dump paydb' },
              { op: '执行迁移', run: 'psql -f /opt/db/migrations/latest.sql paydb' }
          ],
          failAt: 'health' },
        // 演示「需要人工输入」：su - 会停下来等密码，第 2 步不会自己往下走
        { id: 'c4', name: '切用户重启 · 需输入',
          path: '/opt/app/releases',
          cmd: [
              { op: '同步文件', run: 'rsync -a --delete /opt/app/releases/ /opt/app/current/' },
              { op: '切到 deploy', run: 'su - deploy', ask: true },
              { op: '重启服务', run: 'systemctl restart pay-api' }
          ] }
    ];

    let currentId = 'c1';
    let files = [];          // { name, size }
    let steps = [];
    let running = false;
    let timers = [];
    let barTimers = [];
    let stepTicks = {};              // 各步「进行中耗时」的定时器
    let retryCount = {};             // 各步重试次数
    let followTail = true;           // 终端是否自动跟随到底部
    let savedMeta = { text: '等待开始', kind: '' };
    let credCache = {};              // 本次执行里已输入过的凭据（只缓存 sudo —— su 每次都会重新问）
    let pendingAsk = null;           // 正等着输入的那一行：中止 / 复位时要能收掉它

    const cfg = () => CONFIGS.find(c => c.id === currentId) || null;
    const pad2 = n => String(n).padStart(2, '0');
    const hhmmss = (d = new Date()) => pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());

    function fmtSize(b) {
        if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
        if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
        if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
        return b + ' B';
    }
    const totalSize = () => files.reduce((s, f) => s + f.size, 0);
    function extOf(name) {
        const m = String(name).match(/\.([A-Za-z0-9]+)$/);
        return m ? m[1].toUpperCase().slice(0, 4) : 'FILE';
    }
    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }

    /* ============================================================
       字段「?」说明气泡
       气泡挂在页面根下（#tipLayer）：弹窗主体是 overflow-y:auto，
       挂在字段里的绝对定位气泡贴到底部会被裁掉一半。
       ============================================================ */
    const tipLayer = document.getElementById('tipLayer');

    function showTip(anchor, text) {
        tipLayer.textContent = text;
        tipLayer.hidden = false;
        const r = anchor.getBoundingClientRect();
        const w = tipLayer.offsetWidth, h = tipLayer.offsetHeight;
        const box = document.querySelector('#modalMask .modal');
        const boxR = box ? box.getBoundingClientRect() : null;
        let left, top;
        if (boxR && boxR.right + 12 + w <= window.innerWidth - 12) {
            // 首选弹窗右侧外侧：气泡从字段右边弹出会压住正在填的输入框
            left = boxR.right + 12;
            top = Math.max(12, Math.min(r.top - 6, window.innerHeight - h - 12));
        } else {
            // 窄视口退回锚点下方，下方放不下再翻到上方
            left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
            top = r.bottom + 8;
            if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);
        }
        tipLayer.style.left = left + 'px';
        tipLayer.style.top = top + 'px';
    }
    function hideTip() { tipLayer.hidden = true; }

    function helpBtn(text) {
        const b = el('button', 'field-help', '?');
        b.type = 'button';
        b.setAttribute('aria-label', '字段说明：' + text);
        b.addEventListener('mouseenter', () => showTip(b, text));
        b.addEventListener('mouseleave', hideTip);
        b.addEventListener('focus', () => showTip(b, text));
        b.addEventListener('blur', hideTip);
        // 触屏没有 hover：点一下也能看
        b.addEventListener('click', e => { e.preventDefault(); showTip(b, text); });
        return b;
    }
    document.addEventListener('click', e => { if (!e.target.closest('.field-help')) hideTip(); });
    document.getElementById('modalBody').addEventListener('scroll', hideTip);

    /* ============================================================
       左栏：配置列表
       ============================================================ */

    function renderCfgList() {
        const list = document.getElementById('cfgList');
        list.innerHTML = '';

        if (!CONFIGS.length) {
            const box = el('div', 'dp-empty');
            box.append(el('div', 'ico', '📦'), el('div', 't', '还没有部署配置'),
                       el('div', 'd', '点下方「新增部署配置」填上传路径和启动命令'));
            list.appendChild(box);
            return;
        }
