        CONFIGS.forEach(c => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'dp-cfg' + (c.id === currentId ? ' active' : '');
            b.setAttribute('role', 'tab');
            b.setAttribute('aria-selected', String(c.id === currentId));
            b.dataset.id = c.id;
            b.onclick = () => selectConfig(c.id);
            b.append(el('span', 'dp-cfg-name', c.name),
                     el('span', 'dp-cfg-cmd', c.path));
            list.appendChild(b);
        });
    }

    function selectConfig(id) {
        if (running) { toast('部署执行中，暂不能切换配置', 'warn'); return; }
        if (id === currentId) return;
        currentId = id;
        renderCfgList();
        renderConfig();
        resetRun();
    }

    function renderConfig() {
        const c = cfg();
        document.getElementById('cfgTitle').textContent = c ? c.name : '—';
        document.getElementById('specPath').textContent = c ? c.path : '—';
        const cmdEl = document.getElementById('specCmd');
        const cmdMore = document.getElementById('specCmdMore');
        const cmdArr = c ? cmdList(c.cmd) : [];
        cmdEl.textContent = cmdArr.length ? cmdArr[0].run : '—';
        cmdEl.title = cmdArr.map(x => (x.op ? '[' + x.op + '] ' : '') + x.run + (x.ask ? '（需人工输入）' : '')).join('\n');
        // 摘要把「哪几条要你输入」提前说清 —— 别等跑到那一步才发现
        const askN = cmdArr.filter(x => x.ask).length;
        cmdMore.hidden = cmdArr.length < 2 && !askN;
        cmdMore.textContent = [
            cmdArr.length > 1 ? '共 ' + cmdArr.length + ' 条' : '',
            askN ? '需输入 ' + askN + ' 处' : ''
        ].filter(Boolean).join(' · ');
        const hostEl = document.getElementById('execHost');
        if (hostEl) hostEl.textContent = '本机 → ' + TARGET_HOST;
        updateHeadMeta();
    }

    function updateHeadMeta() {
        const box = document.getElementById('headMeta');
        box.innerHTML = '';
        const add = (label, val, cls) => {
            const c = el('span', 'chip');
            if (label) c.appendChild(el('span', null, label));
            const b = el('b', cls || null, val);
            c.appendChild(b);
            box.appendChild(c);
        };
        add(null, '生产环境');
        // 目标服务器是位置信息不是状态，不借用状态绿（那会把绿字压到绿底上，只剩 4.5:1 的边）
        add('目标', TARGET_HOST);
        add(null, CONFIGS.length + ' 个配置');
        add(null, 'v2.3.1 运行中', 'ok');
    }

    /* ============================================================
       上传：选文件 / 拖入 / 移除
       ============================================================ */
    function pickFiles() {
        if (running) { toast('部署执行中，请先中止或等待完成', 'warn'); return; }
        document.getElementById('fileInput').click();
    }

    function onFilesPicked(fileList) {
        if (!fileList || !fileList.length) return;
        let n = 0;
        Array.prototype.forEach.call(fileList, f => {
            const i = files.findIndex(x => x.name === f.name);
            if (i > -1) files[i] = { name: f.name, size: f.size };   // 同名覆盖，避免列出两个同名文件
            else files.push({ name: f.name, size: f.size });
            n++;
        });
        // 清空 input，否则再次选同一个文件不会触发 change
        document.getElementById('fileInput').value = '';
        renderFiles();
        refreshFirstStep();
        toast('已添加 ' + n + ' 个文件');
    }

    function removeFile(name) {
        if (running) { toast('部署执行中，暂不能改文件列表', 'warn'); return; }
        files = files.filter(f => f.name !== name);
        renderFiles();
        refreshFirstStep();
    }

    function renderFiles() {
        const list = document.getElementById('fileList');
        const total = document.getElementById('fileTotal');
        list.innerHTML = '';

        if (!files.length) {
            list.hidden = true;
            total.textContent = '';
            return;
        }
        list.hidden = false;
        total.textContent = files.length + ' 个文件 · 共 ' + fmtSize(totalSize());

        files.forEach(f => {
            const row = el('div', 'file-item');
            row.append(el('span', 'file-ico', extOf(f.name)),
                       el('span', 'file-name', f.name),
                       el('span', 'file-size', fmtSize(f.size)));
            const del = el('button', 'file-del', '✕');
            del.type = 'button';
            del.title = '移除 ' + f.name;
            del.setAttribute('aria-label', '移除 ' + f.name);
            del.onclick = () => removeFile(f.name);
            row.appendChild(del);
            list.appendChild(row);
        });
    }

    function bindDropzone() {
        const dz = document.getElementById('dropzone');
        ['dragenter', 'dragover'].forEach(ev =>
            dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(ev =>
            dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
        dz.addEventListener('drop', e => {
            const fl = e.dataTransfer && e.dataTransfer.files;
            if (fl && fl.length) onFilesPicked(fl);
        });
        dz.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickFiles(); }
        });
    }

    /* ============================================================
       部署执行：串行跑步骤，带进度与终端输出
       ============================================================ */
    const FAIL_MSG = {
        check: '本地文件不可读或校验值不匹配',
        upload: '目标目录写入失败（磁盘空间不足）',
        backup: '回滚点创建失败',
        start: '启动命令返回非 0 退出码',
        health: '健康检查连续 3 次未通过（/healthz 返回 502）'
    };

    function buildSteps(c) {
        return [
            { key: 'check',  name: '校验本地文件',   line: '检查可读性与校验值',   ms: 700 },
            { key: 'upload', name: '上传到 ' + c.path, line: '',                  ms: 1900, bar: true },
            { key: 'backup', name: '备份当前版本',   line: '生成回滚点',           ms: 900 },
            { key: 'start',  name: '执行启动命令',   line: cmdBrief(c.cmd),        ms: 1300 },
            { key: 'health', name: '健康检查',       line: 'GET /healthz',         ms: 950 },
            { key: 'done',   name: '部署完成',       line: '',                     ms: 0 }
        ];
    }

    function renderSteps() {
        const box = document.getElementById('stepList');
        box.innerHTML = '';
        steps.forEach((st, i) => {
            const row = el('div', 'step step-idle');
            row.dataset.i = i;
            row.dataset.key = st.key;
            row.tabIndex = 0;
            row.setAttribute('role', 'option');
            row.setAttribute('aria-selected', 'false');
            row.setAttribute('aria-label', '步骤 ' + (i + 1) + '：' + st.name);

            // 数字单独一层：圆点带 2px 边框，合在一起量会把边框采成文字底衬
            const dot = el('span', 'step-dot');
            dot.appendChild(el('span', 'step-dot-n', String(i + 1)));

            const name = el('span', 'step-name', st.name);
            const time = el('span', 'step-time', '待执行');
            const retry = el('button', 'step-retry-btn', '↻');
            retry.type = 'button';
            retry.title = '从这个步骤重试';
            retry.setAttribute('aria-label', '重试 ' + st.name);
            retry.onclick = e => { e.stopPropagation(); retryStep(i); };

            row.append(dot, name, time, retry);
            if (st.line) row.appendChild(el('div', 'step-line', st.line));
            if (st.bar) {
                const bar = el('span', 'step-bar');
                bar.appendChild(el('span'));
                row.appendChild(bar);
            }

            // 名称被截断时，悬停给出全文
            requestAnimationFrame(() => {
                if (name.scrollWidth > name.clientWidth + 1) {
                    name.classList.add('truncated');
                    name.dataset.full = st.name;
                }
            });

            row.addEventListener('click', () => focusStep(i));
            row.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focusStep(i); }
            });
            box.appendChild(row);
        });
        setTaskCount(steps.length + ' 步');
        updateTaskProgress();
    }

    // 第一步的名称跟着「选了几个文件」走
    function refreshFirstStep() {
        const row = stepNode(0);
        if (!row || running) return;
        const name = row.querySelector('.step-name');
        if (!name) return;
        const text = files.length ? '校验本地文件（' + files.length + ' 个）' : '校验本地文件';
        name.textContent = text;
        if (name.classList.contains('truncated')) name.dataset.full = text;
    }

    function stepNode(i) { return document.querySelector('.step[data-i="' + i + '"]'); }

    function markStep(i, cls, badge, time) {
        const row = stepNode(i);
        if (!row) return;
        const keepRetry = row.classList.contains('step-retry');
        row.className = 'step ' + cls + (keepRetry && cls !== 'step-idle' ? ' step-retry' : '');
        if (keepRetry && cls !== 'step-idle') row.dataset.retry = retryCount[i] || 1;

        const dotNum = row.querySelector('.step-dot-n');
        if (dotNum) dotNum.textContent = badge;

        const t = row.querySelector('.step-time');
        if (t) {
            t.textContent = time;
            // 比基线慢 50% 以上就把耗时标成琥珀色
            const base = steps[i] && steps[i].ms;
            const ms = parseFloat(time) * 1000;
            if (base && !isNaN(ms) && ms > base * 1.5) {
                t.classList.add('slow');
                t.title = '比基线慢 ' + ((ms / base - 1) * 100).toFixed(0) + '%';
            } else {
                t.classList.remove('slow');
                t.removeAttribute('title');
            }
        }
        updateTaskProgress();
        updateJumpBtn();
    }

    /* ============================================================
       任务列：计数 / 进度 / 焦点联动 / 键盘
       ============================================================ */
    function setTaskCount(text, done) {
        const c = document.getElementById('taskCount');
        if (!c) return;
        c.textContent = text;
        c.className = 'task-count' + (done ? ' done' : '');
    }

    function updateTaskProgress() {
        const fill = document.getElementById('taskProgressFill');
        if (!fill) return;
        const finished = document.querySelectorAll('.step-ok, .step-err, .step-skip').length;
        fill.style.width = (steps.length ? finished / steps.length * 100 : 0) + '%';
    }

    // 点某一步 → 在终端里定位到它那几行
    function focusStep(i) {
        document.querySelectorAll('.step').forEach(row => {
            row.classList.remove('focused');
            row.setAttribute('aria-selected', 'false');
        });
        const row = stepNode(i);
        if (row) {
            row.classList.add('focused');
            row.setAttribute('aria-selected', 'true');
        }
        const key = steps[i] && steps[i].key;
        const line = key && document.querySelector('.console-line[data-step="' + key + '"]');
        if (line) {
            line.scrollIntoView({ block: 'center', behavior: 'smooth' });
            line.classList.add('flash');
            setTimeout(() => line.classList.remove('flash'), 1200);
        }
        // 执行面板头部闪一下，说明「在找哪一步」
        if (steps[i]) {
            const meta = document.getElementById('execMeta');
            if (meta) {
                meta.classList.add('jump');
                meta.querySelector('.exec-text').textContent = '→ ' + steps[i].name;
                setTimeout(() => { meta.classList.remove('jump'); restoreExecMeta(); }, 1600);
            }
        }
    }

    function setExecMeta(text, kind) {
        savedMeta = { text: text, kind: kind || '' };
        const m = document.getElementById('execMeta');
        if (!m) return;
        m.className = 'exec-meta' + (kind ? ' ' + kind : '');
        m.querySelector('.exec-text').textContent = text;
    }
    function restoreExecMeta() {
        const m = document.getElementById('execMeta');
        if (!m) return;
        m.className = 'exec-meta' + (savedMeta.kind ? ' ' + savedMeta.kind : '');
        m.querySelector('.exec-text').textContent = savedMeta.text;
    }

    // 上下键在步骤间移动
    document.getElementById('stepList').addEventListener('keydown', e => {
        const cur = document.activeElement.closest('.step');
        if (!cur) return;
        const rows = Array.from(document.querySelectorAll('.step'));
        const idx = rows.indexOf(cur);
        if (e.key === 'ArrowDown' && idx < rows.length - 1) { e.preventDefault(); rows[idx + 1].focus(); }
        else if (e.key === 'ArrowUp' && idx > 0) { e.preventDefault(); rows[idx - 1].focus(); }
        else if (e.key === 'Home') { e.preventDefault(); rows[0].focus(); }
        else if (e.key === 'End') { e.preventDefault(); rows[rows.length - 1].focus(); }
    });

    /* ============================================================
       折叠 / 跳到当前步
       ============================================================ */
    function toggleFold() {
        const col = document.getElementById('taskCol');
        const btn = document.getElementById('foldBtn');
        if (!col || !btn) return;
        const folded = col.classList.toggle('folded');
        btn.classList.toggle('active', folded);
        btn.setAttribute('aria-pressed', String(folded));
        btn.title = folded ? '展开已完成的步骤' : '折叠已完成的步骤';
        const done = document.querySelectorAll('.step-ok').length;
        setTaskCount(folded && done ? done + ' 步已完成' : steps.length + ' 步');
        updateJumpBtn();
    }

    function updateJumpBtn() {
        const btn = document.getElementById('jumpBtn');
        const box = document.getElementById('stepList');
        if (!btn || !box) return;
        const run = document.querySelector('.step-run, .step-wait, .step-err');
        if (!run) { btn.hidden = true; return; }
        const boxRect = box.getBoundingClientRect();
        const runRect = run.getBoundingClientRect();
        btn.hidden = runRect.top >= boxRect.top && runRect.bottom <= boxRect.bottom;
    }
    document.getElementById('stepList').addEventListener('scroll', updateJumpBtn);

    function jumpToCurrent() {
        const run = document.querySelector('.step-run, .step-wait, .step-err');
        if (run) run.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    /* ============================================================
       跟随 / 复制
       ============================================================ */
    function updateFollowBtn() {
        const btn = document.getElementById('followBtn');
        if (!btn) return;
        btn.className = 'exec-btn' + (followTail ? ' on' : ' alert');
        btn.textContent = followTail ? '↓ 跟随' : '↓ 回到底部';
    }

    function toggleFollow() {
        followTail = !followTail;
        const box = document.getElementById('console');
        if (followTail && box) box.scrollTop = box.scrollHeight;
        updateFollowBtn();
    }

    document.getElementById('console').addEventListener('scroll', () => {
        const box = document.getElementById('console');
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 8;
        if (followTail && !atBottom) { followTail = false; updateFollowBtn(); }
        else if (!followTail && atBottom) { followTail = true; updateFollowBtn(); }
    });

    function copyConsole() {
        const lines = Array.from(document.querySelectorAll('#console .console-line'));
        if (!lines.length) return;
        const text = lines.map(l => {
            const t = l.querySelector('.console-t');
            const x = l.querySelector('.console-x');
            return ((t ? t.textContent : '') + '  ' + (x ? x.textContent : '')).trim();
        }).join('\n');
        const done = () => {
            const b = document.getElementById('copyBtn');
            const old = b.textContent;
            b.textContent = '✓ 已复制';
            setTimeout(() => { b.textContent = old; }, 1400);
        };
        const fallback = () => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            ta.remove();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(fallback);
        } else { fallback(); }
    }

    /* ============================================================
       跳过剩余 / 单步重试
       ============================================================ */
    function markRemainingSkipped(fromIdx) {
        document.querySelectorAll('.step').forEach(row => {
            const i = Number(row.dataset.i);
            if (i > fromIdx && row.classList.contains('step-idle')) {
                // 去掉 step-idle 再加 step-skip：留着两个状态类，
                // 后面任何按 classList.contains 判断状态的地方都会读到自相矛盾的行
                row.classList.remove('step-idle');
                row.classList.add('step-skip');
                const dn = row.querySelector('.step-dot-n');
                if (dn) dn.textContent = '—';
                const t = row.querySelector('.step-time');
                if (t) { t.textContent = '跳过'; t.classList.remove('slow'); }
            }
        });
        updateTaskProgress();
        updateJumpBtn();
    }

    function retryStep(i) {
        if (running) return;
        if (!cfg()) return;
        retryCount[i] = (retryCount[i] || 0) + 1;

        running = true;
        const runBtn = document.getElementById('runBtn');
        runBtn.disabled = true;
        runBtn.textContent = '⏳ 部署中…';
        document.getElementById('abortBtn').hidden = false;
        setHint('从「' + steps[i].name + '」重试中…', false);
        setExecMeta('重试中…', 'run');

        // 该步及其之后全部复位
        steps.forEach((st, k) => {
            if (k < i) return;
            const row = stepNode(k);
            if (!row) return;
            row.className = 'step step-idle';
            delete row.dataset.retry;
            const dn = row.querySelector('.step-dot-n');
            if (dn) dn.textContent = String(k + 1);
            const t = row.querySelector('.step-time');
            if (t) { t.textContent = '待执行'; t.classList.remove('slow'); t.removeAttribute('title'); }
            const bar = row.querySelector('.step-bar > span');
            if (bar) bar.style.width = '0%';
        });
        const row = stepNode(i);
        if (row) { row.classList.add('step-retry'); row.dataset.retry = retryCount[i]; }

        logAt('↻ 从「' + steps[i].name + '」重试（第 ' + retryCount[i] + ' 次）', 'warn');
        runStep(i);
    }

    // stepKey 让「点某一步」能在终端里定位到它那几行
    function logAt(text, kind, stepKey) {
        const box = document.getElementById('console');
        const empty = box.querySelector('.console-empty');
        if (empty) empty.closest('.console-line').remove();
        const line = el('div', 'console-line' + (kind ? ' ' + kind : ''));
        line.dataset.step = stepKey == null ? '' : stepKey;
        line.append(el('span', 'console-t', hhmmss()), el('span', 'console-x', text));
        box.appendChild(line);
        if (followTail) box.scrollTop = box.scrollHeight;
    }

    function logStepHeader(st) {
        const box = document.getElementById('console');
        const empty = box.querySelector('.console-empty');
        if (empty) empty.closest('.console-line').remove();
        const line = el('div', 'console-line step-header');
        line.dataset.step = st.key;
        line.append(el('span', 'console-t', ''), el('span', 'console-x', '── ' + st.name + ' ──'));
        box.appendChild(line);
        if (followTail) box.scrollTop = box.scrollHeight;
    }

    function clearConsole() {
        const box = document.getElementById('console');
        box.innerHTML = '';
        const line = el('div', 'console-line');
        line.append(el('span', 'console-t', '--:--:--'),
                    el('span', 'console-x console-empty', '等待开始部署…'));
        box.appendChild(line);
        followTail = true;
        updateFollowBtn();
    }

    function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
    function clearTimers() {
        timers.forEach(clearTimeout); timers = [];
        barTimers.forEach(clearInterval); barTimers = [];
        Object.values(stepTicks).forEach(clearInterval); stepTicks = {};
    }

    let deployStart = 0;

    function startDeploy() {
        if (running) return;
        const c = cfg();
        if (!c) { toast('请先在左栏选择一个部署配置', 'warn'); return; }
        if (!files.length) {
            toast('请先选择要上传的文件', 'warn');
            const dz = document.getElementById('dropzone');
            dz.classList.add('over');
            setTimeout(() => dz.classList.remove('over'), 700);
            return;
        }

        running = true;
        deployStart = Date.now();
        const runBtn = document.getElementById('runBtn');
        runBtn.disabled = true;
        runBtn.textContent = '⏳ 部署中…';
        document.getElementById('abortBtn').hidden = false;
        setHint('正在执行…', false);

        retryCount = {};
        credCache = {};
        pendingAsk = null;
        document.getElementById('taskTotal').hidden = true;
        document.getElementById('taskCol').classList.remove('folded');
        document.getElementById('foldBtn').classList.remove('active');
        document.getElementById('execHost').textContent = '本机 → ' + TARGET_HOST;
        setExecMeta('执行中…', 'run');

        steps = buildSteps(c);
        steps[0].name = '校验本地文件（' + files.length + ' 个）';
        renderSteps();
        clearConsole();

        logAt('开始部署「' + c.name + '」→ ' + TARGET_HOST, '');
        logAt('目标路径 ' + c.path + ' · 共 ' + files.length + ' 个文件 / ' + fmtSize(totalSize()), '');
        runStep(0);
    }

    function runStep(i) {
        if (!running) return;

        if (i >= steps.length) { finish(true); return; }
        const st = steps[i];

        // 终态步：只做标记
        if (st.ms === 0) {
            markStep(i, 'step-ok', '✓', '—');
            logAt('部署完成，服务已启动', 'ok', st.key);
            finish(true);
            return;
        }

        markStep(i, 'step-run', '●', '0.0s');
        logStepHeader(st);
        const t0 = Date.now();

        // 命令条数决定这一步的时长：一条条地走，而不是所有命令挤在同一瞬间
        const cmdArr = st.key === 'start' ? cmdList(cfg() && cfg().cmd) : [];
        const dur = cmdArr.length ? 320 + cmdArr.length * 300 : st.ms;

        // 进行中实时走秒
        startTick(i, st, t0);

        if (st.bar) {
            const bar = stepNode(i).querySelector('.step-bar > span');
            barStart(bar, st.ms);
            logAt('↑ 上传 ' + fmtSize(totalSize()) + ' → ' + cfg().path, '', st.key);
        } else if (st.key === 'start' && cmdArr.length) {
            // 命令序列自己走：中途可能停在「等你输入」上
            runCmdSequence(i, st, cmdArr, t0);
            return;
        } else {
            logAt(st.name + ' …', '', st.key);
        }

        later(() => completeStep(i, t0, cmdArr), dur);
    }

    /* 进行中实时走秒。t0 用「整步开始时刻」——
       中途等待输入的时长也算在耗时里，不藏起来 */
    /* 窄屏下步骤是一根横向条，要等输入的那一步很可能停在可视区之外 ——
       等待态必须让人看得见，所以只横向把它滚进来（不动整页滚动位置）。
       桌面是纵向列表 + 右下角「↓ 当前步」，不走这里。 */
    function revealStepCard(i) {
        const box = document.getElementById('stepList');
        const row = stepNode(i);
        if (!box || !row) return;
        if (box.scrollWidth <= box.clientWidth + 1) return;
        const b = box.getBoundingClientRect(), r = row.getBoundingClientRect();
        if (r.left >= b.left && r.right <= b.right) return;
        box.scrollLeft += (r.left - b.left) - (b.width - r.width) / 2;
    }

    function startTick(i, st, t0) {
        clearInterval(stepTicks[st.key]);
        stepTicks[st.key] = setInterval(() => {
            const el2 = stepNode(i) && stepNode(i).querySelector('.step-time');
            if (el2) el2.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
        }, 100);
    }

    /* 一条命令 = 打印命令 → （可能）等输入 → 下一条。
       不用 forEach + 定时器批量铺出去，否则遇到交互命令会「后面的先跑完」 */
    function runCmdSequence(i, st, items, t0) {
        let k = 0;
        function next() {
            if (!running) return;
            if (k >= items.length) {
                clearInterval(stepTicks[st.key]);
                delete stepTicks[st.key];
                completeStep(i, t0, items);
                return;
            }
            const it = items[k];
            // 逐条打印：先给操作名（弱化），再给命令 —— 长命令序列才分得清哪步是哪步
            if (it.op) logAt('· ' + it.op, 'sub', st.key);
            logAt('$ ' + it.run, '', st.key);
            const step = () => { k++; next(); };
            if (it.ask) askFor(it, i, t0, step);
            else later(step, 300);
        }
        next();
    }

    function completeStep(i, t0, cmdArr) {
        if (!running) return;                    // 中止之后不再往下推进
        const st = steps[i];
        if (!st) return;
        cmdArr = cmdArr || [];
        clearInterval(stepTicks[st.key]);
        delete stepTicks[st.key];
        const sec = ((Date.now() - t0) / 1000).toFixed(1) + 's';

        // 演示失败链：健康检查不通过 → 中止后续步骤并回滚
        if (cfg() && cfg().failAt === st.key) {
            if (st.bar) barStop(false);
            markStep(i, 'step-err', '✕', sec);
            logAt('✕ ' + st.name + ' 失败：' + FAIL_MSG[st.key], 'err', st.key);
            logAt('触发自动回滚 → 恢复上一个版本', 'warn');
            markRemainingSkipped(i);
            later(() => { finish(false); }, 900);
            return;
        }

        if (st.bar) barStop(true);

        if (st.key === 'upload') logAt('✓ 已上传到 ' + cfg().path, 'ok', st.key);
        else if (st.key === 'start') logAt('✓ ' + (cmdArr.length > 1 ? cmdArr.length + ' 条命令依次执行完成' : '命令执行完成') + '（退出码 0）', 'ok', st.key);
        else if (st.key === 'health') logAt('✓ 健康检查通过（/healthz 200 · 12ms）', 'ok', st.key);
        else if (st.key === 'backup') logAt('✓ 回滚点已生成', 'ok', st.key);
        else logAt('✓ ' + (st.line || st.name), 'ok', st.key);

        markStep(i, 'step-ok', '✓', sec);
        runStep(i + 1);
    }

    /* ============================================================
       等待输入：命令自己停了下来
       终端那一行里直接给输入框 —— 不弹窗、不跳页，输出流不断。
       步骤行切到 step-wait，进度与计时都停在这里，直到你按下回车。
       ============================================================ */
    function askFor(it, i, t0, onDone) {
        const st = steps[i];
        const det = detectAsk(it.run);
        const kind = det ? det.kind : 'input';
        const prompt = (det && det.prompt) || 'Input:';

        // sudo 的凭据默认缓存 15 分钟，同一次执行里不必反复问；
        // su 不缓存（每次都会重新要密码）—— 别把两者写成一样
        if (kind === 'sudo' && credCache[kind]) {
            logAt(prompt + ' •••••••• 已复用本次执行输入的 sudo 凭据', 'sub', st.key);
            later(onDone, 220);
            return;
        }

        clearInterval(stepTicks[st.key]);
        delete stepTicks[st.key];
        // 立刻写成「等待 0.0s」而不是先落在「等待输入」上 —— 秒数每 100ms 才刷一次，
        // 中间那 100ms 会露出一帧和下方定时器不一致的文案
        markStep(i, 'step-wait', '>_', '等待 0.0s');
        revealStepCard(i);
        setExecMeta('等你输入…', 'wait');
        setHint('命令停下来了，需要你手动输入 —— 输完按回车或点「继续」', true);

        const line = el('div', 'console-line ask');
        line.dataset.step = st.key;
        const x = el('span', 'console-x ask-row');
        const label = el('span', 'ask-label', prompt);
        const inp = el('input', 'ask-input');
        inp.type = 'password';
        inp.autocomplete = 'new-password';
        inp.spellcheck = false;
        inp.placeholder = '演示：任意 4 位以上算正确';
        inp.setAttribute('aria-label', it.op ? it.op + '，' + prompt : prompt);
        const go = el('button', 'ask-go', '继续');
        go.type = 'button';
        const msg = el('span', 'ask-err');
        x.append(label, inp, go, msg);
        line.append(el('span', 'console-t', hhmmss()), x);
        const cbox = document.getElementById('console');
        cbox.appendChild(line);
        cbox.scrollTop = cbox.scrollHeight;

        let tries = 0;
        const waitT0 = Date.now();
        // 等待时把步骤徽标换成「等待 X.Xs」，让「卡住了」和「正在等你」一眼分得清
        const wt = setInterval(() => {
            const el2 = stepNode(i) && stepNode(i).querySelector('.step-time');
            if (el2) el2.textContent = '等待 ' + ((Date.now() - waitT0) / 1000).toFixed(1) + 's';
        }, 100);
        // 无限等下去等于把这台机器挂在这儿 —— 真实系统里超时即失败
        const to = setTimeout(() => {
            fail('等待输入超时（' + (ASK_TIMEOUT_MS / 1000) + 's 未输入）', '终止本次部署 → 服务保持原状');
        }, ASK_TIMEOUT_MS);
        timers.push(to);

        pendingAsk = { i: i, close: close };

        function detach(text) {
            clearInterval(wt); clearTimeout(to);
            inp.disabled = true; go.hidden = true; msg.textContent = '';
            x.appendChild(el('span', 'ask-note', text));
            line.classList.add('done');
        }
        function close(how) {
            pendingAsk = null;
            detach(how === 'abort' ? '已中止' : '未提供');
        }
        function fail(txt, extra) {
            pendingAsk = null;
            detach('✕ 失败');
            markStep(i, 'step-err', '✕', ((Date.now() - t0) / 1000).toFixed(1) + 's');
            logAt('✕ ' + txt, 'err', st.key);
            if (extra) logAt(extra, 'warn', st.key);
            markRemainingSkipped(i);
            later(() => finish(false), 800);
        }

        function submit() {
            const v = inp.value;
            if (!v) { msg.textContent = '密码不能为空'; inp.focus(); return; }
            // su 会给 3 次机会；演示里不足 4 位就当密码错
            if (v.length < 4) {
                tries++;
                logAt('su: Authentication failure', 'err', st.key);
                if (tries >= 3) { fail('连续 3 次认证失败'); return; }
                msg.textContent = '密码错误，还剩 ' + (3 - tries) + ' 次机会';
                inp.value = '';
                inp.focus();
                return;
            }
            if (kind === 'sudo') credCache[kind] = true;
            pendingAsk = null;
            clearInterval(wt); clearTimeout(to);
            inp.remove(); go.remove(); msg.remove();
            x.append(el('span', 'ask-dots', '••••••••'), el('span', 'ask-note', '✓ 认证通过'));
            line.classList.add('done');
            logAt(prompt + ' •••••••• 认证通过 → 继续执行', 'ok', st.key);
            setExecMeta('执行中…', 'run');
            setHint('正在执行…', false);
            startTick(i, st, t0);          // 接着按整步耗时走秒
            later(onDone, 240);
        }

        go.onclick = submit;
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); submit(); }
        });
        inp.focus();
    }

    function barStart(bar, ms) {
        if (!bar) return;
        const t0 = Date.now();
        const tick = setInterval(() => {
            const pct = Math.min(97, (Date.now() - t0) / ms * 100);
            bar.style.width = pct.toFixed(1) + '%';
        }, 80);
        barTimers.push(tick);
    }
    // fillUp=true 走成功路径（补满）；失败时停在当前进度，别假装传完了
    function barStop(fillUp) {
        barTimers.forEach(clearInterval);
        barTimers = [];
        if (fillUp) document.querySelectorAll('.step-bar > span').forEach(s => { s.style.width = '100%'; });
    }

    function finish(ok) {
        clearTimers();
        running = false;
        const runBtn = document.getElementById('runBtn');
        runBtn.disabled = false;
        runBtn.textContent = ok ? '🚀 再次部署' : '🚀 重试部署';
        document.getElementById('abortBtn').hidden = true;

        // 总耗时挂到任务列头部
        const total = ((Date.now() - deployStart) / 1000).toFixed(1) + 's';
        const totalEl = document.getElementById('taskTotal');
        if (totalEl) { totalEl.textContent = total; totalEl.hidden = false; }
        setTaskCount(steps.length + ' 步');

        if (ok) {
            setHint('部署完成 · ' + hhmmss(), false);
            setExecMeta('部署完成 · ' + hhmmss(), 'ok');
            toast('部署完成');
        } else {
            setHint('部署失败，已自动回滚到上一个版本', true);
            setExecMeta('部署失败，已自动回滚', 'err');
            toast('部署失败，已自动回滚', 'danger');

        followTail = true;
        updateFollowBtn();

        if (box) box.scrollTop = box.scrollHeight;

    function abortDeploy() {

        const cur = document.querySelector('.step.step-run, .step.step-wait');

        running = false;

        if (cur) {
            const idx = Number(cur.dataset.i);
            // 进度条保持当前宽度 —— 中止时上传并没有传完，补满等于假报成功
            markStep(idx, 'step-idle', '■', '已中止');
            // 从 idx 之后开始跳过：传 idx-1 会把刚标好的「已中止」再盖成「跳过」
            markRemainingSkipped(idx);
        }
        logAt('用户中止了本次部署', 'warn');

        const runBtn = document.getElementById('runBtn');
        runBtn.disabled = false;
        runBtn.textContent = '🚀 重新部署';
        document.getElementById('abortBtn').hidden = true;
        setHint('已中止 · 服务保持中止前的状态', true);
        setExecMeta('已中止', 'err');

    /* ============================================================
       新增 / 编辑 / 删除配置
       ============================================================ */
    const PATH_PRESETS = ['/opt/app/releases', '/var/www/pay-web/dist', '/opt/db/migrations'];
    // 启动命令 = 「操作名称 + 命令」的列表，按顺序执行；ask = 执行到这里要停下来等输入
    const CMD_PRESETS = [
        [{ op: '重启服务', run: 'systemctl restart pay-api' }],
        [{ op: '校验配置', run: 'nginx -t' }, { op: '重载 Nginx', run: 'nginx -s reload' }],
        [{ op: '切换用户重启', run: 'su - deploy -c "systemctl restart pay-api"' }],
        [{ op: '切到 deploy', run: 'su - deploy', ask: true },
         { op: '重启服务', run: 'systemctl restart pay-api' }]
    ];

    /* 读到结构化的命令列表。表单里以 JSON 存在隐藏 input 上；也容忍纯文本（旧的「每行一条」） */
    function parseCmds(v) {
        if (typeof v === 'string') {
            const t = v.trim();
            if (!t) return [];
            if (t.charAt(0) === '[') {
                try { return JSON.parse(t); } catch (e) { return []; }
            }
            return t.split('\n').map(s => ({ op: '', run: s }));
        }
        return Array.isArray(v) ? v : [];
    }
    /* 只保留真正有命令的条目，并归一化字段。
       ask 必须原样带下去 —— 它决定执行时那一条要不要停下来等输入 */
    function cmdList(v) {
        return parseCmds(v)
            .filter(x => x && String(x.run || '').trim())
            .map(x => ({
                op: String(x.op || '').trim(),
                run: String(x.run).trim(),
                ask: !!(x && x.ask)
            }));
    }
    /* 步骤说明行很窄，只放第一条的操作名（没有就退回命令本身） */
    function cmdBrief(v) {
        const a = cmdList(v);
        if (!a.length) return '—';
        const first = a[0].op || a[0].run;
        const n = a.filter(x => x.ask).length;
        return (a.length === 1 ? first : first + ' 等 ' + a.length + ' 条')
            + (n ? ' · 含 ' + n + ' 处需输入' : '');
    }

    /* ============================================================
       交互命令识别
       有些命令跑起来会停在那儿等人敲键盘（su 要密码），自动执行会一直挂着。
       这里只做「识别 + 提示」，不替用户改写命令 —— 能不能免密只有他知道。
       ============================================================ */
    const ASK_TIMEOUT_MS = 180000;   // 等 3 分钟没人输入就判失败，而不是无限挂着

    function detectAsk(run) {
        const s = String(run || '').trim();
        if (!s) return null;
        if (/^su\b/.test(s)) {
            const hasC = /(^|\s)-c(\s|$)/.test(s);
            return { kind: 'su', prompt: 'Password:', sure: !hasC,
                     why: hasC ? 'su 在非 root 下仍可能要求密码' : 'su 会停在这里等密码' };
        }
        if (/^sudo\b/.test(s) && !/(^|\s)-n(\s|$)/.test(s)) {
            return { kind: 'sudo', prompt: '[sudo] password for deploy:', sure: false,
                     why: '没加 -n，未配置免密时会要求密码' };
        }
        if (/^(ssh|scp|sftp)\b/.test(s)) {
            return { kind: 'ssh', prompt: 'deploy@10.0.3.12\'s password:', sure: false,
                     why: '未配置公钥登录时会要求密码' };
        }
        if (/^(mysql|mariadb)\b/i.test(s)) {
            return { kind: 'mysql', prompt: 'Enter password:', sure: false,
                     why: '命令里没带凭据时会要求密码' };
        }
        if (/^psql\b/.test(s)) {
            return { kind: 'psql', prompt: 'Password for user pay:', sure: false,
                     why: '未配置 ~/.pgpass 时会要求密码' };
        }
        if (/(^|[|;&]\s*)(read|passwd)\b/.test(s)) {
            return { kind: 'read', prompt: '', sure: true, why: '这条命令本身就在读输入' };
        }
        return null;
    }

    function askNewConfig() {
        if (running) { toast('部署执行中，暂不能改配置', 'warn'); return; }
        openConfigForm(null);
    }
    function askEditConfig() {
        if (running) { toast('部署执行中，暂不能改配置', 'warn'); return; }
        const c = cfg();
        if (!c) { toast('请先选择一个部署配置', 'warn'); return; }
        openConfigForm(c);
    }

    function openConfigForm(base) {
        if (!base && CONFIGS.length >= 6) {
            toast('原型里最多演示 6 个配置', 'warn');
            return;
        }

        let fields = null;   // render 里回填，onConfirm 才有字段可读

        openConfirm({
            title: base ? '编辑部署配置' : '新增部署配置',
            variant: 'form',
            confirmText: base ? '保存' : '创建配置',
            render: (body) => {
                const inputs = {};

                /* 一个字段 = 标签行（必填徽标 + ? 说明 + 右侧计数）+ 控件 + 常用值 + 错误 */
                function field(o) {
                    const wrap = el('div', 'modal-field');

                    const head = el('div', 'field-label');
                    const lab = el('label', null, o.label);
                    lab.setAttribute('for', o.id);
                    head.appendChild(lab);
                    if (o.required) head.appendChild(el('span', 'field-req', '必填'));
                    if (o.help) head.appendChild(helpBtn(o.help));

                    let countEl = null;
                    if (o.count) {
                        countEl = el('span', 'field-count');
                        head.appendChild(countEl);
                    }

                    let inp;
                    if (o.list) {
                        // 值载体：列表结构的 JSON 也放进 input.value，
                        // 校验 / 计数 / 摘要就还能沿用同一条读取口径
                        inp = el('input');
                        inp.type = 'hidden';
                    } else {
                        inp = el('input', 'modal-input' + (o.plain ? ' plain' : ''));
                        inp.type = 'text';
                        inp.autocomplete = 'off';
                        inp.maxLength = o.max || 120;
                    }
                    inp.id = o.id;
                    if (o.placeholder) inp.placeholder = o.placeholder;
                    inp.value = o.value || '';
                    inp.setAttribute('aria-describedby', o.id + '-err');

                    const err = el('div', 'field-err');
                    err.id = o.id + '-err';
                    err.hidden = true;

                    const countText = () => (countEl ? o.count(inp.value) : '');

                    inp.addEventListener('input', () => {
                        wrap.classList.remove('has-error');
                        inp.classList.remove('is-invalid');
                        inp.removeAttribute('aria-invalid');
                        err.hidden = true;
                        if (countEl) countEl.textContent = countText();
                    });
                    // 字段全是单行（列表编辑器里每行也是单行），Enter 直接提交
                    inp.addEventListener('keydown', e => {
                        if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); mConfirm.click(); }
                    });

                    wrap.append(head, inp, err);

                    let setList = null;   // 列表编辑器的灌值入口（chips 要用）
                    if (o.list) {
                        const ed = cmdEditor(o.list, () => {
                            inp.value = JSON.stringify(ed.get());
                            inp.dispatchEvent(new Event('input'));
                        });
                        setList = ed.set;
                        wrap.insertBefore(ed.node, err);
                        inp.value = JSON.stringify(ed.get());
                    }
                    if (countEl) countEl.textContent = countText();

                    if (o.presets) {
                        const row = el('div', 'chips-row');
                        row.appendChild(el('span', 'chips-label', '常用'));
                        o.presets.forEach(p => {
                            // 路径是单行字符串；命令是 [{op, run}] 列表
                            const list = Array.isArray(p) ? p : [p];
                            const val = typeof list[0] === 'object' && list[0] !== null
                                ? JSON.stringify(list)
                                : list.join('\n');
                            const c = el('button', 'modal-chip',
                                typeof list[0] === 'object' && list[0] !== null
                                    ? list.map(x => x.op || x.run).join(' ; ')
                                    : list.join(' ; '));
                            c.type = 'button';
                            c.title = val;
                            c.onclick = () => {
                                if (setList) {
                                    setList(parseCmds(val));   // 内部已重建并同步值
                                } else {
                                    inp.value = val;
                                    inp.dispatchEvent(new Event('input'));
                                }
                                const focusTo = setList ? wrap.querySelector('.cmd-op') : inp;
                                if (focusTo) focusTo.focus();
                            };
                            row.appendChild(c);
                        });
                        wrap.appendChild(row);
                    }

                    inputs[o.key] = { wrap: wrap, inp: inp, err: err };
                    return wrap;
                }

                /* 启动命令列表编辑器：左「操作名称」+ 右「命令」+ >_「需人工输入」+ 删除。
                   值以 JSON 写回隐藏 input。 */
                function cmdEditor(init, onChange) {
                    const rows = el('div', 'cmd-rows');
                    const data = (Array.isArray(init) ? init : [])
                        .map(x => ({ op: x.op || '', run: x.run || '', ask: !!x.ask }));
                    if (!data.length) data.push({ op: '', run: '', ask: false });

                    function paint() {
                        rows.innerHTML = '';
                        data.forEach((it, i) => {
                            const row = el('div', 'cmd-row');
                            const op = el('input', 'modal-input cmd-op');
                            op.type = 'text';
                            op.value = it.op || '';
                            op.placeholder = '操作名称';
                            op.autocomplete = 'off';
                            op.maxLength = 16;

                            const run = el('input', 'modal-input cmd-run');
                            run.type = 'text';
                            run.value = it.run || '';
                            run.title = run.value;
                            run.placeholder = '命令';
                            run.autocomplete = 'off';
                            run.spellcheck = false;
                            run.maxLength = 200;

                            // >_ 开关常驻（不依赖识别）—— 识别不出来的自研脚本也得能标
                            const ask = el('button', 'cmd-ask', '>_');
                            ask.type = 'button';
                            ask.classList.toggle('on', !!it.ask);
                            ask.setAttribute('aria-pressed', String(!!it.ask));
                            ask.title = it.ask ? '已标记：执行到这里会暂停等你输入' : '标记为「需人工输入」';
                            ask.setAttribute('aria-label', '第 ' + (i + 1) + ' 条，' + ask.title);
                            ask.onclick = () => { it.ask = !it.ask; paint(); onChange(); };

                            const del = el('button', 'cmd-del', '✕');
                            del.type = 'button';
                            del.disabled = data.length < 2;
                            del.title = del.disabled ? '至少保留一条' : '删除这一条';
                            del.setAttribute('aria-label', '删除第 ' + (i + 1) + ' 条');
                            del.onclick = () => { data.splice(i, 1); paint(); onChange(); };

                            op.addEventListener('input', () => { it.op = op.value; onChange(); });
                            // 命令常常比输入框宽，悬停至少能看全
                            run.addEventListener('input', () => { it.run = run.value; run.title = run.value; onChange(); });
                            // 都是单行字段：Enter 直接提交整张表单
                            [op, run].forEach(x => x.addEventListener('keydown', e => {
                                if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); mConfirm.click(); }
                            }));

                            row.append(op, run, ask, del);

                            /* 提示行只在「识别到会等输入」或「已标记」时出现，
                               纯静态命令行不会被多说一句话 */
                            const det = detectAsk(it.run);
                            if (it.ask || det) {
                                const note = el('div', 'cmd-note' + (it.ask ? ' on' : ''));
                                note.appendChild(el('span', 'ic', it.ask ? '>_' : (det.sure ? '⚠' : 'ℹ')));
                                note.appendChild(el('span', null, it.ask
                                    ? '执行到这里会暂停，等你在终端里输入'
                                      + (det && det.prompt ? '（会提示 ' + det.prompt + '）' : '')
                                    : det.why + ' —— 换得掉就改成非交互写法，换不掉点右侧 >_ 标记'));
                                row.appendChild(note);
                            }

                            rows.appendChild(row);
                        });
                    }

                    const add = el('button', 'cmd-add', '＋ 添加一条');
                    add.type = 'button';
                    add.onclick = () => {
                        data.push({ op: '', run: '', ask: false });
                        paint();
                        onChange();
                        // 新行直接落在操作名上，少一次点击
                        rows.lastElementChild.querySelector('.cmd-op').focus();
                    };

                    const box = el('div', 'cmd-edit');
                    box.append(rows, add);
                    paint();

                    /* 灌值：常用值 chip 点一下就整段替换，UI 必须重建 ——
                       只改隐藏 input 的值，列表上还是旧内容 */
                    function set(v) {
                        const next = (Array.isArray(v) ? v : [])
                            .map(x => ({ op: (x && x.op) || '', run: (x && x.run) || '', ask: !!(x && x.ask) }));
                        data.length = 0;
                        next.forEach(x => data.push(x));
                        if (!data.length) data.push({ op: '', run: '', ask: false });
                        paint();
                        onChange();   // 重建后同步一次值，否则计数 / 摘要还按旧值算
                    }

                    return { node: box, get: () => data, set: set };
                }

                function group(no, title) {
                    const g = el('div', 'form-group');
                    const h = el('div', 'form-group-head');
                    h.append(el('span', 'form-group-no', no), el('span', 'form-group-title', title));
                    g.appendChild(h);
                    return g;
                }

                /* ---------------- ① 配置标识 ---------------- */
                const g1 = group('1', '配置标识');
                g1.appendChild(field({
                    key: 'name', id: 'cfgName', label: '配置名称', required: true, plain: true,
                    placeholder: '例如：应用包 · 全量启动', max: 20,
                    value: base ? base.name : '',
                    help: '显示在左侧配置列表里，建议写清用途。'
                }));


                /* ---------------- ② 部署动作 ---------------- */
                const g2 = group('2', '部署动作');
                g2.appendChild(field({
                    key: 'path', id: 'cfgPath', label: '上传到（服务器路径）', required: true,
                    placeholder: '/opt/app/releases', presets: PATH_PRESETS, max: 80,
                    value: base ? base.path : '',
                    help: '目录不存在会自动创建；同名文件将被覆盖。'
                }));
                g2.appendChild(field({
                    key: 'cmd', id: 'cfgCmd', label: '启动命令', required: true,
                    list: base ? base.cmd : [],
                    presets: CMD_PRESETS,
                    help: '按顺序执行。会切用户就写 su - user -c "命令"（免密，推荐）；'
                        + '确实要交互的命令（su - / sudo / ssh）点行尾的 >_ 标记，执行到那一步会暂停等你输入。',
                    count: v => { const n = cmdList(v).length; return n ? n + ' 条' : ''; }
                }));

                body.append(g1, g2);
                fields = inputs;

                return {
                    focus: () => {
                        inputs.name.inp.focus();
                        if (base) inputs.name.inp.select();   // 编辑态预填内容直接全选，省一次三击
                    },
                    validate: () => {
                        const bad = [];
                        const val = k => inputs[k].inp.value.trim();
                        const mark = (k, msg) => {
                            const f = inputs[k];
                            f.wrap.classList.add('has-error');
                            f.inp.classList.add('is-invalid');
                            f.inp.setAttribute('aria-invalid', 'true');
                            f.err.textContent = msg;
                            f.err.hidden = false;
                            bad.push(k);
                        };

                        ['name', 'path', 'cmd'].forEach(k => {
                            const f = inputs[k];
                            f.wrap.classList.remove('has-error');
                            f.inp.classList.remove('is-invalid');
                            f.inp.removeAttribute('aria-invalid');
                            f.err.hidden = true;
                        });

                        // 每个字段独立判断：一次把问题全指出来，而不是修好一个又冒一个
                        if (!val('name')) mark('name', '请填写配置名称');
                        if (!val('path')) mark('path', '请填写上传路径');
                        else if (val('path').charAt(0) !== '/') mark('path', '路径要以 / 开头，例如 /opt/app/releases');
                        const cmds = cmdList(val('cmd'));
                        if (!cmds.length) mark('cmd', '请至少填写一条启动命令');
                        else if (cmds.some(x => !x.op)) mark('cmd', '每条命令都要有操作名称');

                        if (bad.length) {
                            inputs[bad[0]].inp.focus();
                            inputs[bad[0]].inp.scrollIntoView({ block: 'center', behavior: 'smooth' });
                            toast(bad.length + ' 项还没填好', 'warn');
                            return false;
                        }
                        return true;
                    }
                };
            },
            onConfirm: () => {
                const payload = {
                    name: fields.name.inp.value.trim(),
                    path: fields.path.inp.value.trim(),
                    cmd: fields.cmd.inp.value.trim()
                };
                if (base) {
                    Object.assign(base, payload);
                    toast('已保存「' + payload.name + '」');
                } else {
                    const id = 'c' + Date.now();
                    CONFIGS.push(Object.assign({ id: id }, payload));
                    currentId = id;
                    toast('已创建「' + payload.name + '」');
                }
                renderCfgList();
                renderConfig();
                resetRun();
                document.getElementById('stepList').scrollTop = 0;
            }
        });
    }
    function askDeleteConfig() {
        if (running) { toast('部署执行中，暂不能删除配置', 'warn'); return; }
        const c = cfg();
        if (!c) { toast('请先选择一个部署配置', 'warn'); return; }

        openConfirm({
            title: '删除部署配置',
            desc: '将删除「' + c.name + '」（上传到 ' + c.path + '）。',
            warn: '只移除这条配置，不会影响服务器上已经部署的内容。',
            warnKind: 'info',
            confirmText: '删除',
            danger: true,
            onConfirm: () => {
                CONFIGS = CONFIGS.filter(x => x.id !== c.id);
                currentId = CONFIGS.length ? CONFIGS[0].id : null;
                renderCfgList();
                renderConfig();
                resetRun();
                toast('已删除「' + c.name + '」');
            }
        });
    }

    function refreshAll() {
        if (running) { toast('部署执行中，完成后再刷新', 'warn'); return; }
        document.getElementById('lastSync').textContent = '最后更新 ' + hhmmss().slice(0, 5);
        renderCfgList();
        renderConfig();
        resetRun();
        toast('已刷新部署配置');
    }

    /* ============================================================
       键盘
       ============================================================ */
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if (mask.classList.contains('open')) closeModal();
            return;
        }
        // ⌘/Ctrl + Enter 直接开始部署
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !running && !mask.classList.contains('open')) {
            e.preventDefault();
            startDeploy();
        }
    });

    /* ============================================================
       初始化
       ============================================================ */
    renderCfgList();
    renderConfig();
    renderFiles();
    bindDropzone();
    resetRun();
    updateFollowBtn();
    updateTaskProgress();
    updateJumpBtn();

    if (IS_WINDOW) {
        document.title = '部署 · 支付系统重构（独立窗口）';
        setTimeout(() => toast('已在新窗口打开部署面板'), 500);
    }
</script>
</body>
</html>
