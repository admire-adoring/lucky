<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目工作区 · 个人系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 导航壳与内容区共用：槽面板 / 图标列靠它兜底 */
        /* [hidden] 会被 author 的 display 覆盖，全局兜底 */
        [hidden] { display: none !important; }

        /* ============================================================
           0. 令牌层 · 纯色
           这一版把整套材质从"半透明 + 模糊 + 极光底衬"换成纯色。
           全轮的取舍都引下面四条口径，改任何一处前先回来看：

           ① 面一律不透明。层次只由三样东西给：底色明度差 + 1px 实描边
              + 两段小阴影。没有 α、没有 backdrop-filter。
           ② 薄染与描边允许写 `color-mix(..., transparent)` —— 它们压在
              不透明面上，结果是确定的实色，属于纯色范式内的合法叠层，
              不是第二套材质。全文件的 α 用法就只剩这一类，可以穷举。
           ③ 判据不是"有没有 gradient/blur 这个词"，而是"它里面有没有信息"。
              弥散光斑、极光底衬、贴顶高光、hover 扫光 —— 没信息，全删。
           ④ 对比度只增不减，但仍要逐项算过再宣布：实底比"合成后的半透明底衬"
              更极端，所以这一版顺手把几个本来就差一口气的地方补齐了
             （强调色分两档、四象限分"图形色 / 文字色"、字阶三档重定）。

           面阶：页 < 沉槽 < 深槽 < 卡面（"浮起" = 变亮）。
           亮暗两套是各自定出来的，只共用这个方向。
           ============================================================ */
        :root {
            color-scheme: light;

            /* —— 面阶 —— */
            --bg-page:  #ECF0F7;   /* 页 */
            --bg-shell: #FFFFFF;   /* 外壳：顶栏 / 侧栏 */
            --bg-card:  #FFFFFF;   /* 卡面 */
            --bg-slot:  #F2F5FB;   /* 沉槽：卡内低凹面、悬停底、淡底 */
            --bg-deep:  #E7ECF5;   /* 深槽：进度轨道 / 书脊底衬 / 头像底 */

            /* —— 导航壳的尺寸 ——
               侧栏下限 210px（再窄，槽面板里的四字按钮会折行），取 240 留 30px 余量。
               内容轴收口：≥1440 起给对称留白，改 --content-gutter 一个值就能调松紧。 */
            --gap-page: 16px;
            --sidebar-w: 240px;
            --sidebar-w-collapsed: 64px;
            --content-max: 1360px;
            --content-gutter: 16px;

            /* —— 线阶。结构线不是装饰，要能被看见，所以不沿用发丝线的刻度 —— */
            --line:        #E4E9F2;
            --line-strong: #D2DAE7;

            /* —— 字阶。三档都按"承载文字 4.5:1"定过，
                   而且是最差的那块面上也要过（muted 会落在沉槽上，不只落在白卡上）—— */
            --text-primary:   #0F172A;
            --text-secondary: #4F5B75;
            --text-muted:     #61708A;

            /* —— 阴影：两段小阴影。hover 与常态的**项数与顺序必须一致**，
                   否则过渡会在两套不相干的阴影之间插值，看起来像抖了一下 —— */
            --shadow-card:       0 1px 2px rgba(15,23,42,0.04), 0 6px 16px -8px rgba(15,23,42,0.12);
            --shadow-card-hover: 0 2px 4px rgba(15,23,42,0.06), 0 12px 24px -10px rgba(15,23,42,0.16);
            --shadow-pop:        0 2px 6px rgba(15,23,42,0.06), 0 14px 30px -10px rgba(15,23,42,0.18);

            /* —— 强调色两档 ——
               --m-main 只做"图形"：色条 / 圆点 / 描边 / 进度（判据 3:1）；
               --m-ink  做一切"承载文字"的位置：实底上的白字、白底上的彩字（4.5:1）。
               ⚠️ 一个橙干不了这两件事 —— 白字压在 #F97316 (orange-500) 上只有
               2.8:1，纯图形也不到 3:1，所以图形这一档退到 600；
               文字这一档再深半档（#B93E0B）：因为彩字多数坐在"薄染底"上，
               而薄染底比白底暗一点，会把比值往回拉 ~0.7 ——
               深半档正好把这些位置一起补齐，不必逐个改色。
               分档不是"每处各挑一个够深的"，是"按承载 / 不承载文字，只分两档"。 */
            --m-main: #EA580C;     /* 图形（orange-600） */
            --m-ink:  #B93E0B;     /* 文字 / 实底（orange-700 再深半档） */
            --m-on:   #FFFFFF;     /* 压在 --m-ink 实底上的字 */
            --m-tint: color-mix(in srgb, var(--m-main) 12%, var(--bg-card));

            /* 四象限：色相分开，避免"四个格子长得一样"。
               每格两支：--q* 只管图形，--q*-ink 管文字 —— 同一支颜色当文字用时
               几乎都差一口气，与其逐格调深，不如把两条通道显式分开。 */
            --q1: #EF4444;     --q1-ink: #CF2020;        /* 重要且紧急 */
            --q2: #EA580C;     --q2-ink: var(--m-ink);   /* 重要不紧急（= 本模块强调色） */
            --q3: #3B82F6;     --q3-ink: #2563EB;        /* 紧急不重要 */
            --q4: #75839D;     --q4-ink: #5D6B85;        /* 不重要不紧急 */

            /* 语义色：一律"淡底 + 深字"。淡底由深字色压进卡面**算出来**，
               不手写第二组常量 —— 暗色主题因此只需要换深字色。
               （表达式在 .dark 里还要再挂一次，原因见那个块的末尾） */
            --ok:     #036B4B;   --ok-bg:     color-mix(in srgb, var(--ok) 13%, var(--bg-card));
            --info:   #1D4ED8;   --info-bg:   color-mix(in srgb, var(--info) 13%, var(--bg-card));
            --warn:   #B03A0A;   --warn-bg:   color-mix(in srgb, var(--warn) 13%, var(--bg-card));
            --danger: #B91C1C;   --danger-bg: color-mix(in srgb, var(--danger) 13%, var(--bg-card));
        }

        /* 暗色：只覆写"值"，不改"关系"。
           面阶方向不变（页 < 沉槽 < 深槽 < 卡面 = 浮起变亮）；
           语义色只换深字色，淡底跟着算 —— 但见块尾那一段：
           派生令牌必须在这里再声明一次，否则 .dark 挂在 body 上会拿到亮色的底。 */
        .dark {
            color-scheme: dark;

            --bg-page:  #0A1018;
            --bg-shell: #111A29;
            --bg-card:  #18222F;
            --bg-slot:  #111A26;
            --bg-deep:  #0D1521;

            --line:        #25303F;
            --line-strong: #38465C;

            --text-primary:   #F1F5F9;
            --text-secondary: #A9B6C9;
            --text-muted:     #8FA0B8;

            --shadow-card:       0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -10px rgba(0,0,0,0.55);
            --shadow-card-hover: 0 2px 4px rgba(0,0,0,0.40), 0 14px 26px -12px rgba(0,0,0,0.60);
            --shadow-pop:        0 2px 6px rgba(0,0,0,0.40), 0 16px 32px -12px rgba(0,0,0,0.65);

            /* 深底上判据反向：强调色要提亮，实底上的字换成深字 */
            --m-main: #FB923C;
            --m-ink:  #FDBA74;
            --m-on:   #1A1206;

            /* 暗色下四个象限要整体提亮：深底上的 #3B82F6 / #EF4444 会沉下去 */
            --q1: #F87171; --q1-ink: #FCA5A5;
            --q2: #FB923C; --q2-ink: #FDBA74;
            --q3: #60A5FA; --q3-ink: #93C5FD;
            --q4: #94A3B8; --q4-ink: #A9B6C9;

            --ok: #6EE7B7;
            --info: #93C5FD;
            --warn: #FDBA74;
            --danger: #FCA5A5;

            /* ⚠️ 派生令牌必须在这里**再声明一次**，不能只靠 :root 那一份。
               var() 是在"声明这条自定义属性的那个元素"上解析的，
               继承下去的是解析结果、不是表达式 —— .dark 挂在 <body> 上时，
               :root 那份 --ok-bg 会带着亮色的 --ok 一起被继承下来。
               这一组看起来是重复，实际是让 .dark 挂在 html 或 body 上都成立。 */
            --m-tint: color-mix(in srgb, var(--m-main) 12%, var(--bg-card));
            --ok-bg:     color-mix(in srgb, var(--ok) 13%, var(--bg-card));
            --info-bg:   color-mix(in srgb, var(--info) 13%, var(--bg-card));
            --warn-bg:   color-mix(in srgb, var(--warn) 13%, var(--bg-card));
            --danger-bg: color-mix(in srgb, var(--danger) 13%, var(--bg-card));
        }

        html, body {
            height: 100%;
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-primary);
            background: var(--bg-page);
            /* 页面本身不滚：只有 .main / .slot-body 各自滚，否则会撑出两条滚动条 */
            transition: background 0.45s ease, color 0.35s ease;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 弥散背景（.aurora-bg / .blob-1~3 / @keyframes drift / 降级用的
           prefers-reduced-motion）整层已删：极光光斑属于"渐变里没有信息"那一类。
           页面底色现在只由 --bg-page 一个值给，没有第二层要合成。 */

        /* 布局 —— 顶栏是通栏药丸，下面是**两栏**：侧栏卡片 / 正文。
           ⚠️ 原来是三栏（侧栏 / 正文 / 260px 的上下文栏）。项目详情换成
              「Hero + 下划线分区栏 + 7 个面板」之后右栏取消了 ——
              留着一个没有元素的 260px 栅格列，等于正文白白窄掉 260px，
              而且**页面上看不出来**，只会觉得"这一页怎么这么挤"。
           用 minmax(0, 1fr) 而不是 1fr：本原型正文里有大量省略号与固定列宽，
           1fr 会被内容顶宽。 */
        .app {
            position: relative; z-index: 1;
            height: 100vh;
            display: grid;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            grid-template-rows: 68px minmax(0, 1fr);
            grid-template-areas:
      "topbar  topbar"
      "sidebar main";
            gap: var(--gap-page);
            padding: var(--gap-page);
            transition: grid-template-columns 0.32s cubic-bezier(0.4,0,0.2,1);
        }
        .app.sidebar-collapsed {
            grid-template-columns: var(--sidebar-w-collapsed) minmax(0, 1fr);
        }

        /* 旧侧栏（.sidebar / .sidebar-title / .menu-item / .menu-dot）整族已删 ——
           它被 v5 的导航壳取代：顶栏一级胶囊 + 侧栏卡片里的圆盘 / 图标列。
           ⚠️ 不留"只剩定位契约"的空壳：旧侧栏没有承担任何包含块，
              而且留着的旧 .sidebar 会和新壳的 .sidebar 直接打架。 */

        /* 旧顶栏（.topbar / .breadcrumb / .topbar-actions）已删：
           .topbar 这个名字现在归 v5 的顶栏药丸（见导入段）。
           "归档 / 新建任务"两个页级动作搬到了 .page-header 右端 ——
           从"全局顶栏"落到"当前页"，和它们的实际作用范围对齐。 */

        .btn {
            border: none; border-radius: 10px;
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.18s ease;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            /* 实底上压着白字 → 用 --m-ink；--m-main 只够做图形（2.8:1） */
            background: var(--m-ink);
            color: var(--m-on);
            box-shadow: 0 4px 14px color-mix(in srgb, var(--m-ink) 28%, transparent);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px color-mix(in srgb, var(--m-ink) 40%, transparent);
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: var(--bg-slot);
            color: var(--text-primary);
            border: 1px solid var(--line);
        }
        .btn-ghost:hover {
            border-color: var(--m-ink);
            color: var(--m-ink);
        }
        /* 主题按钮换成顶栏里的 .icon-btn#themeBtn（见导入段）。
           顺带修掉一处旧的空承诺：旧 .theme-toggle 根本没接线（点了没反应），
           而 v5 的 setTheme / readTheme / localStorage 是成套的。 */

        /* 主内容 —— 它**不是**卡片：本原型的正文本身就是一堆 .card，
           再套一层卡片会变成白卡压白卡，层次反而没了。
           所以正文列保持透明、浮在页面上。 */
        .main {
            grid-area: main;
            padding: 12px 14px 20px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
            min-width: 0;
        }
        .main::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
        .main:hover::-webkit-scrollbar-thumb { background: var(--line-strong); }

        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        /* 语义徽标：状态 / 优先级 / 分区计数共用这一套，避免同类信息两套配色。
           ⚠️ 状态徽标是**项目状态**唯一的一张表：列表卡的角标与详情 Hero 上那一枚
              读的是同一份（见脚本里的 STATUS_BADGE）——各写一份就会出现
              "列表说已完成、点进去说已归档"这种同一个枚举两种说法。 */
        .badge-neutral { background: var(--bg-slot); color: var(--text-secondary); }
        .badge-ok      { background: var(--ok-bg);     color: var(--ok); }
        .badge-doing   { background: var(--info-bg);   color: var(--info); }
        .badge-danger  { background: var(--danger-bg); color: var(--danger); }
        .text-danger   { color: var(--danger); font-weight: 600; }
        .badge:hover { transform: translateY(-1px); }

        .progress-bar {
            flex: 1; height: 8px;
            background: var(--bg-deep);
            border-radius: 999px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 999px;
            /* 原来的 opacity:.8 是"让半透明填充压上去别太抢"，实底上直接给满色 */
            background: var(--m-main);
            transition: width 0.4s ease;
        }
        /* ============================================================
           页头
           ⚠️ **只有列表态有页头**。详情态没有：位置已经由 Hero（项目名）与
           分区栏（当前分区）说了，再放一行"项目 / 名字"就是同一个词说两遍。
           ⚠️ 列表态的页头与详情态的 Hero **同构**：一行大字说"我在哪"（16px/700，
              与 hero-name 同字号）、一行小字说"这一层是干什么的"、右侧同一位置放
              这一态的动作（+ 新建项目，与 Hero 的"编辑"同位）。
              原来这里是 13px 的面包屑 —— 同一职责两种规格，两级切换时重心会跳。
           ============================================================ */
        .page-header {
            display: flex; align-items: flex-end; justify-content: space-between;
            gap: 16px; flex-wrap: wrap;
        }
        .page-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
        .page-head-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 5px; }

        /* Tab 面板 */
        .panel { display: none; flex-direction: column; gap: 20px; }
        .panel.active { display: flex; }

        /* 卡片：纯色下"浮起"这件事全靠这三样 —— 比页更亮的实底
           + 1px 实描边 + 两段小阴影。没有模糊、没有半透明 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            padding: 20px;
            transition: all 0.25s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 12px; font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.06em;
        }

        /* ============================================================
           列表态的筛选区：读数（可点即筛）+ 工具栏，**同处一张卡的两行**
           ------------------------------------------------------------
           读数这一层原来也是 4 张 .card。于是第一张项目卡之前压了
           4 张 KPI 卡 + 1 张工具栏卡 + 三个 20px 间距 —— 而 KPI 与工具栏
           是同一件事的两段（都在"读 / 筛"），权重却差一档（4 张带描边阴影的卡
           vs 一张卡里的控件），权重与作用成反比。
           现在读数退成卡内的四个"格"：左边一道色条，可点即筛。
           ============================================================ */
        .filter-bar { padding: 6px 16px 12px; }
        .ov-kpi {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0;
            border-bottom: 1px solid var(--line);
            margin-bottom: 10px;
        }
        /* ⚠️ gap:0 之后，四格**必须**同时有两样东西，少一样就"贴"：
             ① 一条 1px 竖线 —— 说"这是四格"；
             ② 色号离格子的左沿一段距离 —— 零间距下，把色条摆在 left:0
                等于把它摆在左边那格文字的右边（它自己那格的左沿就是别人的右沿），
                四格会读成一条连体的带子。
           所以颜色不从左沿那道竖条给，改成标签前的一枚圆点：它是图形（3:1 即可），
           且完全不占格边。 */
        .ov-kpi-card {
            position: relative;
            padding: 10px 16px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.18s ease, box-shadow 0.18s ease;
        }
        .ov-kpi-card + .ov-kpi-card { border-left: 1px solid var(--line); }
        .ov-kpi-card:hover { background: var(--bg-slot); }
        /* 选中态与 .seg-btn.active 同一档（都是"我在筛"）：淡染 + 内描边，
           不与任何卡片自己的描边抢 */
        .ov-kpi-card.is-on {
            background: var(--m-tint);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--m-ink) 34%, transparent);
        }
        .ov-kpi-card.is-on .ov-kpi-label { color: var(--m-ink); }
        .ov-kpi-label {
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }
        /* 颜色只落在这一枚 7px 点上（不引字体、不引图标库，颜色本身就是分类） */
        .ov-kpi-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--kc); flex-shrink: 0;
        }
        .ov-kpi-value {
            margin: 4px 0 2px;
            font-size: 24px; font-weight: 700; line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }
        .ov-kpi-sub { font-size: 11.5px; color: var(--text-secondary); }

        /* 任务 */
        .task-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
        }
        .task-item:last-child { border-bottom: none; }
        .task-check {
            width: 18px; height: 18px;
            border-radius: 6px;
            /* 未勾选态要能看见：结构线（--line）是装饰级对比度（约 1.1:1），
               而这是一个"必须被发现"的控件，得按 3:1 的另一套刻度走 ——
               55% 的混色实测只有 2.1:1，所以取到 85%（约 3.6:1）。
               ⚠️ 换底衬时这个数要重算，别照抄。 */
            border: 1.5px solid color-mix(in srgb, var(--text-muted) 85%, var(--bg-card));
            flex-shrink: 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: var(--m-on);
            transition: all 0.18s ease;
        }
        .task-check:hover {
            border-color: var(--m-ink);
            background: var(--m-tint);
        }
        .task-check.done {
            /* 实底上那个 ✓ 是白字 → 与 .btn-primary / .tab.active 同一档 */
            background: var(--m-ink);
            border-color: var(--m-ink);
        }
        /* 它是 tabindex=0 的 role=checkbox，键盘要看得见落点 */
        .task-check:focus-visible { outline: 2px solid var(--m-ink); outline-offset: 2px; }
        .task-text { flex: 1; cursor: pointer; }
        .task-text.done {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        /* 「接下来」里全是待办，状态标签没有信息量 → 换成真正在判的东西：还剩几天 */
        .task-due-inline {
            flex-shrink: 0;
            font-size: 12px; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .task-due-inline.is-late { color: var(--danger); font-weight: 600; }

        /* 看板 */
        .kanban {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .kanban-col {
            background: var(--bg-slot);
            border-radius: 14px;
            padding: 12px;
        }
        .kanban-title {
            font-size: 12px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-bottom: 10px;
            display: flex; justify-content: space-between;
        }
        .kanban-card {
            /* 柱子是沉槽、牌是卡面 —— 一张牌浮在自己的柱子上，
               这是纯色下唯一还需要的"浮起"表达 */
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.18s ease;
        }
        .kanban-card:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-card);
            border-color: var(--m-ink);
        }
        .kanban-card:last-child { margin-bottom: 0; }
        .kanban-card.is-done { opacity: 0.6; text-decoration: line-through; }

        /* 文档（书脊 / 索引行） */
        .doc-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .doc-item:hover {
            border-color: var(--m-ink);
            transform: translateY(-1px);
        }
        .doc-item:last-child { margin-bottom: 0; }
        .doc-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: var(--m-tint);
            color: var(--m-ink);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .doc-info { flex: 1; }
        .doc-name { font-size: 14px; font-weight: 500; }
        .doc-meta { font-size: 12px; color: var(--text-muted); }
        .doc-arrow {
            flex-shrink: 0; font-size: 18px; line-height: 1;
            color: var(--text-muted);
            transition: color 0.18s ease, transform 0.18s ease;
        }
        .doc-item:hover .doc-arrow { color: var(--m-ink); transform: translateX(2px); }
        /* ============================================================
           分段切换（面板内的视图组；比 .tab 低一级：淡染 + 描边）
           —— 这一级是"选项组"，不是"页面级导航"，所以它坐在沉槽里、
              选中态只用淡染 + 内描边，绝不与 .tab.active 的下划线抢。
           两处：列表态的卡片 / 表格 / 看板，任务分区的列表 / 看板 / 四象限。
           ============================================================ */
        .seg {
            display: inline-flex; gap: 4px; padding: 4px;
            border-radius: 12px;
            background: var(--bg-slot);
            border: 1px solid var(--line);
        }
        .seg-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 9px;
            font-size: 13px; font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer; user-select: none; white-space: nowrap;
            transition: all 0.18s ease;
        }
        .seg-btn:hover { color: var(--text-primary); }
        .seg-btn.active {
            background: var(--m-tint);
            color: var(--m-ink);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--m-ink) 34%, transparent);
            font-weight: 600;
        }

        /* 视图/视图容器：沿用 .panel 的 active 约定 */
        .view { display: none; flex-direction: column; gap: 20px; }
        .view.active { display: flex; }

        .toolbar {
            display: flex; align-items: center; gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar-summary {
            margin-left: auto;
            font-size: 12px; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* ============================================================
           任务 · 列表视图
           ============================================================ */
        .task-group {
            display: flex; align-items: center; gap: 8px;
            padding: 2px 12px 8px;
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .task-group:not(:first-child) {
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }
        .task-group-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .task-group.is-doing { color: var(--info); }
        .task-group.is-done { color: var(--ok); }
        .task-row {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 12px;
            border-bottom: 1px solid var(--line);
            border-radius: 10px;
            transition: background 0.18s ease;
        }
        .task-row:last-child { border-bottom: none; }
        .task-row:hover { background: var(--bg-slot); }
        .task-row.is-done .task-row-title { color: var(--text-muted); text-decoration: line-through; }

        .task-row-main { flex: 1; min-width: 0; }
        .task-row-title {
            font-size: 14px; font-weight: 500;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .task-row-sub {
            display: flex; align-items: center; gap: 10px;
            margin-top: 4px;
            font-size: 12px; color: var(--text-muted);
        }

        /* 右簇：列宽写死，三行才对齐 */
        .task-row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .task-due {
            width: 92px; text-align: right;
            font-size: 12px; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .task-due.is-late { color: var(--danger); font-weight: 600; }
        .task-quad-tag {
            width: 96px;
            font-size: 11px; color: var(--text-secondary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* 状态 / 优先级 / 标签：共用"淡底深字" */
        .pill {
            display: inline-flex; align-items: center;
            padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 500; white-space: nowrap;
        }
        .pill-todo  { background: var(--bg-slot);   color: var(--text-secondary); }
        .pill-doing { background: var(--info-bg);   color: var(--info);   font-weight: 600; }
        .pill-done  { background: var(--ok-bg);     color: var(--ok); }

        .prio { display: inline-flex; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .prio-P0 { background: var(--danger-bg); color: var(--danger); }
        .prio-P1 { background: var(--warn-bg);   color: var(--warn); }
        .prio-P2 { background: var(--info-bg);   color: var(--info); }
        .prio-P3 { background: var(--bg-slot);   color: var(--text-muted); }

        .tag {
            font-size: 11px; padding: 2px 8px; border-radius: 999px;
            background: var(--bg-slot); color: var(--text-secondary);
        }

        /* ============================================================
           任务 · 四象限（艾森豪威尔矩阵）
           ============================================================ */
        .matrix {
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr);
            grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
        }
        .matrix-axis {
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.08em; color: var(--text-muted);
        }
        .matrix-axis.is-y { writing-mode: vertical-rl; transform: rotate(180deg); }

        .quad {
            position: relative;
            display: flex; flex-direction: column; gap: 8px;
            padding: 14px 14px 14px 17px;
            border-radius: 16px;
            background: var(--bg-slot);
            border: 1px solid transparent;
            min-height: 168px;
            transition: all 0.2s ease;
        }
        /* 象限色条：色值来自 --qc，四格只写一次变量 */
        .quad::before {
            content: "";
            position: absolute; left: 0; top: 12px; bottom: 12px;
            width: 3px; border-radius: 0 3px 3px 0;
            background: var(--qc);
        }
        .quad:hover {
            border-color: color-mix(in srgb, var(--qc) 45%, transparent);
            background: color-mix(in srgb, var(--qc) 7%, var(--bg-slot));
        }
        /* 每格两支：--qc 走图形（色条 / 描边），--qc-ink 走文字 */
        .quad.q1 { --qc: var(--q1); --qc-ink: var(--q1-ink); }
        .quad.q2 { --qc: var(--q2); --qc-ink: var(--q2-ink); }
        .quad.q3 { --qc: var(--q3); --qc-ink: var(--q3-ink); }
        .quad.q4 { --qc: var(--q4); --qc-ink: var(--q4-ink); }

        .quad-head { display: flex; align-items: baseline; gap: 8px; }
        .quad-name { font-size: 13px; font-weight: 600; color: var(--qc-ink); }
        .quad-hint { font-size: 11px; color: var(--text-muted); }
        .quad-count {
            margin-left: auto;
            font-size: 11px; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .q-task {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 9px;
            border-radius: 9px;
            background: var(--bg-card);
            border: 1px solid transparent;
            font-size: 13px;
            transition: all 0.16s ease;
        }
        .q-task:hover { border-color: var(--qc); transform: translateX(2px); }
        .q-task.is-done .q-task-title { color: var(--text-muted); text-decoration: line-through; }
        .q-task-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .q-task-due { font-size: 11px; color: var(--text-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .q-empty { font-size: 12px; color: var(--text-muted); padding: 10px 2px; }

        /* ============================================================
           文档 · 主从（索引 ⇄ 详情）
           ============================================================ */
        .screen { display: none; flex-direction: column; gap: 20px; }
        .screen.active { display: flex; }

        .crumb-back {
            display: inline-flex; align-items: center; gap: 6px;
            align-self: flex-start;
            padding: 6px 12px 6px 8px; border-radius: 9px;
            font-size: 13px; color: var(--text-secondary);
            cursor: pointer; user-select: none;
            transition: all 0.18s ease;
        }
        .crumb-back:hover {
            background: var(--bg-slot);
            color: var(--m-ink);
        }

        .doc-head { display: flex; align-items: flex-start; gap: 14px; }
        .doc-head-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: var(--m-tint);
            color: var(--m-ink);
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; flex-shrink: 0;
        }
        .doc-head-main { flex: 1; min-width: 0; }
        .doc-head-title { font-size: 20px; font-weight: 700; line-height: 1.35; }
        .doc-head-meta {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            margin-top: 8px;
            font-size: 12px; color: var(--text-muted);
        }
        .doc-head-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .prose { font-size: 14px; line-height: 1.85; color: var(--text-secondary); }
        .prose h4 {
            font-size: 13px; font-weight: 600; color: var(--text-primary);
            margin: 20px 0 8px;
        }
        .prose h4:first-child { margin-top: 0; }
        .prose p { margin-bottom: 10px; }
        .prose ul { margin: 0 0 10px 18px; }
        .prose li { margin-bottom: 4px; }
        .prose code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
            padding: 2px 6px; border-radius: 6px;
            background: var(--bg-slot); color: var(--text-primary);
        }

        .callout {
            display: flex; gap: 10px; align-items: flex-start;
            padding: 12px 14px; border-radius: 12px;
            font-size: 13px; line-height: 1.7;
            color: var(--text-secondary);
            background: var(--ok-bg);
            border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
        }
        .callout-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--ok); margin-top: 7px; flex-shrink: 0;
        }

        /* ============================================================
           Toast（替代 alert：不打断、可叠加）
           ============================================================ */
        .toast-wrap {
            position: fixed; left: 50%; bottom: 28px;
            transform: translateX(-50%);
            z-index: 60;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            pointer-events: none;
        }
        .toast {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: 12px;
            /* 它浮在页面之上、又可能落在任何一块面上 ——
               纯色下"浮起"靠实底 + 实描边 + 一段更重的投影说清楚 */
            background: var(--bg-card);
            border: 1px solid var(--line-strong);
            box-shadow: var(--shadow-pop);
            font-size: 13px; color: var(--text-primary);
            opacity: 0; transform: translateY(8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .toast.on { opacity: 1; transform: translateY(0); }
        .toast-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--m-main); flex-shrink: 0; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            /* 滚动条是"要被发现"的控件，不能沿用发丝线的刻度 */
            background: var(--line-strong); border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 1100px) {
            .ov-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 980px) {
            .matrix { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); }
            .task-quad-tag { display: none; }
        }
        @media (max-width: 768px) {
            /* 壳的窄屏规则在 ≤900 那条（见导入段）—— 这条只管正文 */
            .kanban { grid-template-columns: 1fr; }
            /* 矩阵落到一列：轴标签失去意义（象限标题自带"重要/紧急"），一并收掉 */
            .matrix {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto;
            }
            .matrix-axis { display: none; }
            .seg { width: 100%; }
            .seg-btn { flex: 1; justify-content: center; }
            .toolbar-summary { margin-left: 0; }
            .task-row-right { flex-wrap: wrap; justify-content: flex-end; }
            .task-due { width: auto; }
            .doc-head { flex-wrap: wrap; }
            .doc-head-actions { width: 100%; }
            /* 读数四格在窄屏保持 2×2（≤1100 那条已给 2 列）——
               不再往下收到一列：四行读数会把工具栏和第一张项目卡一起挤下去 */
            .filter-bar { padding: 4px 12px 10px; }
        }

        /* ============================================================
           项目域 · 两级
           ------------------------------------------------------------
           根 `/projects`      = 全部项目。这一态**没有环** —— 域根没有可寻址的下级，
                                 与 `data/workspace/tabs.ts` 里 `projects: []` 同一条判据。
           详情 `/projects/:id` = 单项目工作区。环 = 该项目的分区，**由数据裁**
                                 （生活/学习项目没有「运维」「账户」，因为池子里
                                 servers / accounts 是空数组）。

           版式取自 React 落地的那份原型（`design/work/work_product-detail.html`）：
           可折叠 Hero 卡 + 下划线分区栏 + 7 个面板。
           材质换成这里的面阶 —— 原型那版是玻璃，backdrop-filter 与渐变一律不搬：
           书脊、机架、进度条、头像那几处渐变都改成实色或实色色条。
           ============================================================ */

        /* ---------- 列表态 · 筛选控件 ----------
           不复用文档详情那套表单（随"复盘 / 笔记"两段一起删了）：
           这三个只服务列表筛选，尺寸比表单小一档。 */
        .proj-input {
            font: inherit; font-size: 13px;
            height: 34px; padding: 0 10px;
            border-radius: 9px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--line-strong);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .proj-input:focus {
            outline: none;
            border-color: var(--m-ink);
            box-shadow: 0 0 0 3px var(--m-tint);
        }
        .proj-input::placeholder { color: var(--text-muted); }
        .proj-search { flex: 1 1 240px; min-width: 170px; }

        /* ---------- 列表态 · 卡片栅格 ---------- */
        .proj-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .proj-card { cursor: pointer; display: flex; flex-direction: column; }
        .proj-card:hover { border-color: var(--m-ink); }
        .proj-card-head { display: flex; align-items: center; gap: 8px; }
        .proj-card-name { font-size: 15px; font-weight: 600; line-height: 1.4; margin-top: 10px; }
        /* ⚠️ 描述固定两行。行数不一时，下面那三行（标签 / 进度条 / 剩几天）
           在同一行的不同卡片上会上下错开 —— 而栅格只保证"同一行的卡等高"，
           内容不会自己贴底。**同一行里可比的读数必须横着能比**。 */
        .proj-card-desc {
            font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin-top: 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            min-height: 3.2em;
        }
        .proj-card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        /* 底部这一组贴底：`margin-top: auto` 加在**这一组的第一个元素**上 */
        .proj-card .progress-bar { height: 6px; margin: auto 0 10px; }
        .proj-card-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

        /* ---------- 表格视图 ----------
           它是"横着比"的形态，所以末两列定宽：头与行共用同一组宽度，
           否则每一行的"优先级 / 状态"跟着文字长短飘，就没有比较的基准。 */
        .proj-table .task-row[role="button"] { cursor: pointer; }
        .proj-table .task-due { width: 88px; }
        .proj-table .task-quad-tag { width: 64px; }
        .proj-table .prio { width: 52px; justify-content: center; }
        .proj-table .pill { width: 70px; justify-content: center; }
        /* 表头：没有它 6 列全靠猜。复用 .task-row 的栅格，只换字号与分隔线 */
        .proj-table .task-row.is-head {
            padding: 0 12px 8px;
            border-bottom: 1px solid var(--line-strong);
            font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .proj-table .task-row.is-head:hover { background: none; }
        .proj-table .task-row.is-head .prio,
        .proj-table .task-row.is-head .pill {
            background: none; color: inherit; font-weight: 600;
        }

        /* ---------- 看板视图 ----------
           卡片视图 10 项读数、表格 6 项，看板原来只有 1 项（项目名）——
           同一栏里比不出任何东西。补一行读数，让它至少有"进度 + 剩几天"。 */
        .kanban-card-name { font-size: 13px; }
        .kanban-card-meta {
            display: flex; align-items: center; gap: 6px;
            margin-top: 8px;
            font-size: 11px; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .progress-mini {
            flex: 1; min-width: 40px; height: 4px; border-radius: 999px;
            background: var(--bg-deep); overflow: hidden;
        }
        .progress-mini i { display: block; height: 100%; border-radius: 999px; background: var(--m-main); }
        .kanban-card.is-done .progress-mini i { background: var(--ok); }
        /* ⚠️ .kanban-card 的 `cursor: grab` 是给**任务看板**的拖拽写的，
           项目看板借用同一个类 ⇒ 鼠标显示"可拖"却拖不动。这里是"点开"，
           换成 pointer。 */
        .kanban-card[role="button"] { cursor: pointer; }

        /* 看板在列表态是"按状态分四栏"，不是任务那三栏 */
        .kanban.is-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

        /* ============================================================
           详情态 · 可折叠 Hero
           收起就是一行 52px：徽标 · 名称 · 状态 · 进度 · 截止 · 编辑 / ⋯ / 折叠
           ============================================================ */
        .hero-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.3s ease;
        }
        /* ⚠️ 这里**没有** overflow: hidden，而原型那一版有 —— 那是原型的一处缺陷：
           ⋯ 菜单（.more-dropdown，绝对定位在卡片内）会被整条裁掉 ⇒
           菜单点开了、DOM 里也 open 了，屏幕上却什么都看不见。
           收紧放在真正需要它的 .hero-body 上。 */
        .hero-card:hover { box-shadow: var(--shadow-card-hover); }
        .hero-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; padding: 10px 16px; min-height: 52px;
            cursor: pointer; user-select: none;
        }
        .hero-bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .hero-tag {
            font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
            padding: 3px 8px; border-radius: 8px;
            background: var(--m-tint); color: var(--m-ink);
            text-transform: uppercase; flex-shrink: 0;
        }
        .hero-name {
            font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
        }
        .hero-bar-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
        .hero-progress {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; padding: 3px 5px; margin: -3px -5px;
            border-radius: 6px; transition: background 0.18s ease;
        }
        .hero-progress:hover { background: var(--bg-slot); }
        .hp-pct { font-size: 13px; font-weight: 700; color: var(--m-ink); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
        .hp-track { width: 72px; height: 5px; background: var(--bg-deep); border-radius: 999px; overflow: hidden; }
        .hp-fill { height: 100%; background: var(--m-main); border-radius: 999px; transition: width 0.6s ease; }
        .hero-deadline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
        .hd-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
        .hd-value { font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
        .hd-urgent { font-weight: 600; font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--warn-bg); color: var(--warn); }
        .hd-urgent.is-over { background: var(--danger-bg); color: var(--danger); }
        .fold-toggle {
            width: 28px; height: 28px; border-radius: 8px;
            border: 1px solid var(--line-strong); background: var(--bg-slot);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary); flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1), border-color 0.18s ease, color 0.18s ease;
        }
        .fold-toggle:hover { border-color: var(--m-ink); color: var(--m-ink); }
        .hero-card.open .fold-toggle { transform: rotate(180deg); }
        .hero-body { max-height: 0; overflow: hidden; transition: max-height 0.45s cubic-bezier(0.34, 1.1, 0.64, 1); }
        .hero-card.open .hero-body { max-height: 400px; }
        .hero-body-inner {
            padding: 16px 20px 20px;
            border-top: 1px solid var(--line);
            opacity: 0; transform: translateY(-6px);
            transition: opacity 0.35s ease 0.1s, transform 0.35s ease 0.1s;
        }
        .hero-card.open .hero-body-inner { opacity: 1; transform: none; }
        .body-label { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
        .body-text { font-size: 13.5px; line-height: 1.75; color: var(--text-secondary); text-indent: 2em; }
        .body-meta {
            margin-top: 14px; padding-top: 12px;
            border-top: 1px dashed var(--line);
            font-size: 12px; color: var(--text-muted);
            display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        }
        .body-meta .sep { opacity: 0.5; }

        .more-menu { position: relative; }
        .more-btn {
            width: 34px; height: 34px; border-radius: 10px;
            border: 1px solid var(--line-strong); background: var(--bg-slot);
            cursor: pointer; color: var(--text-secondary); font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s ease;
        }
        .more-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .more-dropdown {
            position: absolute; top: calc(100% + 6px); right: 0; min-width: 158px;
            background: var(--bg-card);
            border: 1px solid var(--line-strong);
            border-radius: 12px; box-shadow: var(--shadow-pop);
            padding: 6px; display: none; z-index: 20;
        }
        .more-dropdown.open { display: block; animation: dropIn 0.15s ease; }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
        .more-item {
            padding: 8px 12px; border-radius: 8px; font-size: 13px;
            cursor: pointer; transition: background 0.15s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .more-item:hover { background: var(--bg-slot); }
        .more-item.danger { color: var(--danger); }
        .more-sep { height: 1px; background: var(--line); margin: 6px 4px; }

        /* ============================================================
           详情态 · 下划线分区栏
           它是**页内**的分区入口：项目模块下，环就是这 7 格；
           工作模块下那一版（`/work/projects/:id`）环是工作模块的分区，
           这 7 格退成这条横条 —— 两处挂载的差别只有"环是谁的"，正文一字不差。
           ============================================================ */
        .tabs-wrap {
            position: sticky; top: 0; z-index: 10;
            background: var(--bg-page);
            border-bottom: 1px solid var(--line);
            margin: 0 -14px; padding: 0 14px;
            transition: background 0.45s ease;
        }
        .tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0; display: flex; align-items: center; gap: 6px;
            padding: 12px 16px 14px;
            font-size: 13.5px; font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer; white-space: nowrap; user-select: none;
            position: relative; transition: color 0.18s ease;
        }
        .tab:hover { color: var(--text-primary); }
        .tab.active { color: var(--m-ink); font-weight: 600; }
        .tab.active::after {
            content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px;
            height: 2px; background: var(--m-main); border-radius: 2px 2px 0 0;
        }
        .tab-count {
            font-size: 10.5px; font-weight: 600;
            padding: 1px 6px; border-radius: 999px;
            background: var(--bg-slot); color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            transition: all 0.18s ease;
        }
        .tab.active .tab-count { background: var(--m-tint); color: var(--m-ink); }
        /* 更新小红点只表示"这一格有未处理的"；当前格不显示 —— 它已经在看了 */
        .tab-dot {
            position: absolute; top: 8px; right: 8px;
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--danger); display: none;
        }
        .tab.has-update:not(.active) .tab-dot { display: block; }

        /* ============================================================
           详情态 · 面板零件
           ============================================================ */
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .card-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .card-icon {
            width: 26px; height: 26px; border-radius: 8px;
            background: var(--m-tint); color: var(--m-ink);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0;
        }
        /* 卡片头里的标题是正文级：把 .card-title 那套"大写小字"按下去 */
        .card-head .card-title {
            margin-bottom: 0;
            font-size: 13.5px; font-weight: 600;
            color: var(--text-primary);
            text-transform: none; letter-spacing: 0;
        }
        .card-count {
            font-size: 11px; font-weight: 500;
            padding: 2px 8px; border-radius: 999px;
            background: var(--bg-slot); color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .card-more { font-size: 12px; color: var(--m-ink); cursor: pointer; font-weight: 600; white-space: nowrap; }
        .card-more:hover { text-decoration: underline; }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px; align-items: start;
        }
        /* 概览的卡是**读数**，不是入口 —— 悬停不抬，抬了会让人以为能点开 */
        .overview-grid .card { padding: 14px; }
        .overview-grid .card:hover { transform: none; }

        .task-group-title {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 2px 6px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .task-group-title .tg-count {
            font-size: 11px; padding: 0 7px; border-radius: 999px;
            background: var(--bg-slot); color: var(--text-muted);
            font-variant-numeric: tabular-nums; letter-spacing: 0;
        }
        .task-group-title.is-doing { color: var(--info); }
        .task-group-title.is-done { color: var(--ok); }

        /* ---------- 文档书脊 ----------
           一本书一支实色：白字压在 --book 上，七支都按 4.5:1 挑过。
           原型那版是四段渐变 + 内阴影 + 投影的书脊，渐变一律不搬。 */
        .doc-books { display: flex; gap: 12px; flex-wrap: wrap; }
        .doc-book {
            width: 102px; height: 134px;
            border-radius: 4px 10px 10px 4px;
            cursor: pointer; position: relative; overflow: hidden;
            background: var(--book, var(--text-muted));
            color: #fff; padding: 9px 9px 9px 14px;
            display: flex; flex-direction: column;
            transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.25s ease;
        }
        /* 书脊那道脊线：压在实色封面**之上**的一层深色 —— 属于"不透明面上的合法叠层"，
           所以写成 color-mix 而不是 rgba()。 */
        .doc-book::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
            background: color-mix(in srgb, #000 24%, transparent);
        }
        .doc-book::after {
            content: ""; position: absolute; left: 3px; top: 9%; bottom: 9%; width: 1px;
            background: color-mix(in srgb, #fff 36%, transparent);
        }
        .doc-book:hover { transform: translateY(-4px); box-shadow: var(--shadow-card-hover); }
        .doc-book.script { --book: #374151; }
        .doc-book.k-plan     { --book: #B93E0B; }
        .doc-book.k-design   { --book: #6D28D9; }
        .doc-book.k-api      { --book: #1D4ED8; }
        .doc-book.k-test     { --book: #036B4B; }
        .doc-book.k-spec     { --book: #B45309; }
        .doc-book.k-research { --book: #7C3AED; }
        .doc-book.k-ref      { --book: #475569; }
        .db-tag {
            font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
            color: color-mix(in srgb, #fff 86%, transparent);
            padding: 2px 6px; border-radius: 4px;
            border: 1px solid color-mix(in srgb, #fff 32%, transparent);
            align-self: flex-start; text-transform: uppercase;
        }
        .db-title {
            font-size: 11.5px; font-weight: 600; line-height: 1.3;
            margin-top: auto; margin-bottom: 4px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .db-meta { font-size: 9.5px; color: color-mix(in srgb, #fff 72%, transparent); }
        .doc-books.compact .doc-book { width: 88px; height: 116px; padding: 8px 8px 8px 14px; }
        .doc-books.compact .db-title { font-size: 10.5px; }
        .doc-books.compact .db-tag { font-size: 8px; padding: 1px 5px; }
        .doc-books.compact .db-meta { font-size: 8.5px; }

        /* ---------- Bug ---------- */
        .bug-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
        .bug-card {
            position: relative; border-radius: 10px;
            padding: 10px 12px 10px 15px;
            background: var(--bg-slot);
            border: 1px solid var(--line);
            cursor: pointer; transition: all 0.2s ease;
        }
        /* 级别色条：色 = 级别（致命 / 严重 / 一般），与徽标同一个来源 */
        .bug-card::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--bc); border-radius: 10px 0 0 10px;
        }
        .bug-card:hover { border-color: var(--bc); transform: translateX(2px); }
        .bug-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .bug-level {
            font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
            padding: 2px 7px; border-radius: 4px;
            background: color-mix(in srgb, var(--bc) 14%, var(--bg-card));
            color: var(--bc); text-transform: uppercase;
        }
        .bug-status { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
        .bug-title { font-size: 12.5px; font-weight: 600; line-height: 1.4; margin-bottom: 5px; }
        .bug-meta { font-size: 10.5px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
        .bug-assignee {
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--bg-deep); color: var(--text-secondary);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 9.5px; font-weight: 700; margin-left: auto;
        }

        /* ---------- 运维 ---------- */
        .server-list { display: flex; flex-direction: column; gap: 8px; }
        .server-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 10px;
            background: var(--bg-slot); border: 1px solid var(--line);
            cursor: pointer; transition: all 0.2s ease;
        }
        .server-row:hover { border-color: var(--m-ink); transform: translateX(2px); }
        /* 机架：原型是两段渐变 + 内高光。改成实色 + 三条实线指示 */
        .server-rack {
            width: 24px; height: 32px; border-radius: 5px;
            background: var(--text-muted);
            position: relative; flex-shrink: 0;
        }
        .server-rack::before {
            content: ""; position: absolute; top: 7px; left: 4px; right: 4px; height: 2px;
            background: color-mix(in srgb, #fff 55%, transparent);
            box-shadow: 0 6px 0 color-mix(in srgb, #fff 32%, transparent),
                        0 12px 0 color-mix(in srgb, #fff 32%, transparent);
        }
        .server-rack.prod { background: var(--danger); }
        .server-rack.test { background: var(--info); }
        .server-info { flex: 1; min-width: 0; }
        .server-name {
            font-size: 12.5px; font-weight: 600; margin-bottom: 2px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .server-meta { font-size: 11px; color: var(--text-muted); }
        .server-status { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
        .server-status.on  { background: var(--ok-bg); color: var(--ok); }
        .server-status.off { background: var(--bg-slot); color: var(--text-muted); }

        .deploy-timeline { display: flex; flex-direction: column; position: relative; }
        .deploy-timeline::before {
            content: ""; position: absolute; left: 5.5px; top: 14px; bottom: 14px;
            width: 1px; background: var(--line);
        }
        .deploy-row {
            display: flex; gap: 12px; padding: 7px 6px; border-radius: 9px;
            cursor: pointer; transition: background 0.15s ease; position: relative;
        }
        .deploy-row:hover { background: var(--bg-slot); }
        .deploy-dot {
            width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
            background: var(--dc);
            border: 3px solid var(--bg-card);
            margin-top: 3px; position: relative; z-index: 1;
        }
        .deploy-info { flex: 1; min-width: 0; }
        .deploy-ver { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
        .deploy-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
        .deploy-badge.success  { background: var(--ok-bg);   color: var(--ok); }
        .deploy-badge.rollback { background: var(--warn-bg); color: var(--warn); }
        .deploy-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .deploy-meta .sep { opacity: 0.5; }
        .deploy-duration { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--bg-deep); color: var(--text-muted); }

        /* ---------- 会议 ---------- */
        .meeting-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
        .meeting-card {
            display: flex; gap: 10px; padding: 10px; border-radius: 10px;
            background: var(--bg-slot); border: 1px solid var(--line);
            cursor: pointer; transition: all 0.2s ease;
        }
        .meeting-card:hover { border-color: var(--m-ink); transform: translateY(-2px); }
        .meeting-date {
            width: 44px; flex-shrink: 0; text-align: center;
            background: var(--m-tint); border-radius: 8px; padding: 5px 3px;
        }
        .meeting-month { font-size: 9px; color: var(--m-ink); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
        .meeting-day { font-size: 17px; font-weight: 700; color: var(--m-ink); line-height: 1; margin: 3px 0; font-variant-numeric: tabular-nums; }
        .meeting-time { font-size: 9px; color: var(--text-muted); font-weight: 600; font-variant-numeric: tabular-nums; }
        .meeting-info { flex: 1; min-width: 0; }
        .meeting-title { font-size: 12.5px; font-weight: 600; margin-bottom: 3px; line-height: 1.35; }
        .meeting-meta { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
        .meeting-attendees { display: flex; align-items: center; margin-top: 6px; }
        .meeting-attendees .avatar {
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--bg-deep); color: var(--text-secondary);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 700;
            margin-left: -5px; border: 2px solid var(--bg-slot);
        }
        .meeting-attendees .avatar:first-child { margin-left: 0; }
        .meeting-attendees .more { font-size: 10px; color: var(--text-muted); margin-left: 6px; font-weight: 600; }

        /* ---------- 账户 ---------- */
        .account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
        .account-card {
            display: flex; gap: 10px; padding: 11px 12px; border-radius: 10px;
            background: var(--bg-slot); border: 1px solid var(--line);
            cursor: pointer; transition: all 0.2s ease; position: relative;
        }
        .account-card:hover { border-color: var(--m-ink); }
        .account-card:hover .account-copy { opacity: 1; }
        .account-key {
            width: 34px; height: 34px; border-radius: 9px;
            background: var(--m-tint); color: var(--m-ink);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; flex-shrink: 0;
        }
        .account-info { flex: 1; min-width: 0; }
        .account-platform { font-size: 12.5px; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
        .account-env { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
        .account-env.prod { background: var(--danger-bg); color: var(--danger); }
        .account-env.test { background: var(--info-bg);   color: var(--info); }
        .account-env.dev  { background: var(--warn-bg);   color: var(--warn); }
        .account-user {
            font-size: 11px; color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .account-pwd { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
        .account-copy {
            position: absolute; top: 8px; right: 8px;
            width: 22px; height: 22px; border-radius: 6px;
            border: 1px solid var(--line-strong); background: var(--bg-card);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-muted); font-size: 10px;
            opacity: 0; transition: all 0.18s ease;
        }
        .account-copy:hover { color: var(--m-ink); border-color: var(--m-ink); }
        .account-expire {
            position: absolute; bottom: 8px; right: 10px;
            font-size: 9.5px; color: var(--text-muted);
            background: var(--bg-deep); padding: 1px 6px; border-radius: 4px; font-weight: 600;
        }
        .account-expire.warn { background: var(--warn-bg); color: var(--warn); }

        /* ============================================================
           窄屏
           ============================================================ */
        @media (max-width: 1180px) {
            .kanban.is-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 1100px) {
            .ov-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .hero-bar { flex-wrap: wrap; padding: 10px 14px; }
            .hero-bar-right { width: 100%; justify-content: space-between; gap: 10px; }
            .hp-track { width: 54px; }
        }
        @media (max-width: 1000px) {
            .kanban, .kanban.is-4 { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 980px) {
            .matrix { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); }
            .task-quad-tag { display: none; }
        }
        @media (max-width: 860px) {
            .hero-name { font-size: 14px; }
        }
        @media (max-width: 768px) {
            .matrix { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
            .matrix-axis { display: none; }
            .seg { width: 100%; }
            .seg-btn { flex: 1; justify-content: center; }
            .toolbar-summary { margin-left: 0; }
            .task-row-right { flex-wrap: wrap; justify-content: flex-end; }
            .task-due { width: auto; }
            .doc-head { flex-wrap: wrap; }
            .doc-head-actions { width: 100%; }
            .ov-kpi { grid-template-columns: minmax(0, 1fr); }
            .overview-grid { grid-template-columns: minmax(0, 1fr); }
            .proj-grid { grid-template-columns: minmax(0, 1fr); }
            .tabs-wrap { margin: 0 -10px; padding: 0 10px; }
            .tab { padding: 10px 12px 12px; font-size: 13px; }
            .tab.active::after { left: 12px; right: 12px; }
            .hero-deadline .hd-label { display: none; }
        }
        @media (max-width: 520px) {
            .hero-bar-left .hero-tag { display: none; }
            .proj-card-name { font-size: 14px; }
        }

        /* 两级根各自成列：.main 的 gap 到它们为止，里面自己排 */
        #viewList, #viewDetail { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

        @media (min-width: 1440px) {
            /* 内容轴收口。比上面那条多了两级的后代 —— 正文现在包在 #viewList / #viewDetail 里，
               而它们自己也是 flex 项目：**三件套缺一不可**（width:100% + max-width + margin:auto）。
               只写 max-width 会让子项退化成 shrink-to-fit（实测正文列从 992 掉到 594）。 */
            #viewList > *, #viewDetail > * {
                width: 100%;
                max-width: min(var(--content-max), 100% - var(--content-gutter) * 2);
                margin-left: auto; margin-right: auto;
            }
        }
        /* ========== 顶栏 ========== */
        .topbar-wrap {
            grid-area: topbar;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            min-width: 0;
            /* 超级菜单要浮到侧栏（z-index: 30）与主内容卡之上。
               不给这一层定 z-index 的话，DOM 在后的 .sidebar-wrap 会盖住面板。 */
            position: relative; z-index: 40;
        }

        .topbar {
            pointer-events: auto;
            display: flex; align-items: center;
            gap: 10px;
            padding: 10px 12px 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 999px;
            box-shadow: var(--shadow-pop);
            width: 100%;
            /* 不设 max-width：顶栏两端必须与下方「侧栏左沿 / 正文右沿」严格对齐。
               曾写死 1400px —— 1440 视口错位 4px，1920 视口错位 244px（顶栏缩成居中长条，
               而下面两栏铺满 1888px，整页像两套坐标系）。 */
            transition: all 0.3s ease;
            position: relative;
            min-width: 0;
        }


        .logo-mark {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--m-ink);
            color: var(--m-on);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 800;
            flex-shrink: 0;
            letter-spacing: -0.5px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .logo-mark:hover { transform: rotate(-8deg) scale(1.08); }

        .divider-v {
            width: 1px; height: 22px;
            background: var(--line);
            flex-shrink: 0;
            margin: 0 2px;
        }

        .nav-primary {
            display: flex; align-items: center;
            gap: 1px; flex: 1;
            overflow-x: auto;
            scrollbar-width: none;
            height: 40px;
            min-width: 0;
        }
        .nav-primary::-webkit-scrollbar { display: none; }

        .nav-p-item {
            position: relative;
            display: flex; align-items: center; gap: 7px;
            padding: 0 12px; height: 36px;
            border-radius: 999px;
            font-size: 13px; font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap; user-select: none;
            flex-shrink: 0;
        }
        .nav-p-item:hover {
            color: var(--text-primary);
            background: var(--bg-deep);
        }
        .nav-p-item.active {
            color: var(--m-on);
            background: var(--m-ink);
            font-weight: 600;
        }
        .nav-p-icon {
            width: 15px; height: 15px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-p-icon svg { width: 15px; height: 15px; stroke-width: 2; }
        .nav-p-item:hover .nav-p-icon { transform: scale(1.15); }

        .nav-p-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.25);
            color: inherit;
            font-weight: 700;
            line-height: 1.5;
        }
        .nav-p-item:not(.active) .nav-p-badge {
            background: var(--m-tint);
            color: var(--m-ink);
        }
        .nav-p-badge.warn {
            background: var(--danger-bg);
            color: var(--danger);
        }
        /* 实底胶囊上的徽标改成「实白底 + 深字」：半透明白底压白字实测只有 3.82:1，
           而徽标字 10px 属小字，门槛是 4.5:1 */
        .nav-p-item.active .nav-p-badge {
            background: rgba(255,255,255,0.92);
            color: #0B1220;
        }
        .nav-p-item.active .nav-p-badge.warn {
            background: rgba(255,255,255,0.92);
            color: var(--danger);
        }

        /* ========== 超级菜单（顶栏二级下拉）==========
           ⚠️ 面板必须挂在 .topbar 上（它已是 position: relative），**不能**放进 .nav-primary：
              后者是 overflow-x: auto ⇒ 计算出的 overflow-y 也是 auto，面板会被裁、还会顶出竖滚动条。
              实测把 260×160 的面板挂进 .nav-primary：导航 scrollHeight 40 → 198、
              面板底 228 > 导航底 70、命中测试拿到的是 topbar 而不是面板。 */
        .mega {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;                      /* JS 按触发项定位并夹在顶栏内 */
            z-index: 50;
            width: max-content;
            max-width: calc(100vw - 40px);
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow-pop);
            opacity: 0; visibility: hidden;
            transform: translateY(-4px);
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
        }
        /* 4px 缝的"桥"：面板与顶栏之间不能有死区，否则指针横跨时会触发 mouseleave */
        .mega::before { content: ''; position: absolute; left: 0; right: 0; top: -6px; height: 6px; }
        .mega.is-open { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }

        .mega-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 18px; margin-bottom: 10px; padding: 0 2px;
        }
        .mh-title { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
        .mh-all {
            border: none; background: none; cursor: pointer; padding: 0;
            font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--m-ink);
        }
        .mh-all:hover { text-decoration: underline; }

        .mega-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 116px); gap: 2px; }
        .mega-item {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 8px; border-radius: 8px;
            border: none; background: none; cursor: pointer; text-align: left;
            font-family: inherit; font-size: 12.5px; font-weight: 500;
            color: var(--text-primary); white-space: nowrap;
        }
        .mega-item:hover { background: var(--bg-deep); }
        .mega-item.is-current { background: var(--m-tint); color: var(--m-ink); font-weight: 600; }
        .mi-icon {
            width: 15px; height: 15px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
        }
        .mega-item.is-current .mi-icon { color: var(--m-main); }
        .mi-icon svg { width: 15px; height: 15px; stroke-width: 2; }

        /* 面板打开时，它的触发项保持高亮 —— 否则鼠标移进面板后就看不出这面板是谁的 */
        .nav-p-item.mega-on { color: var(--text-primary); background: var(--bg-deep); }

        /* 窄屏没有 hover：面板改成整条全宽，点项开、点外部或 Esc 关 */
        @media (max-width: 900px) {
            .mega { left: 8px !important; right: 8px; width: auto; max-width: none; }
            .mega-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        .topbar-right {
            display: flex; align-items: center; gap: 4px;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            position: relative;
        }
        .icon-btn:hover {
            background: var(--bg-deep);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .icon-btn svg { width: 17px; height: 17px; stroke-width: 1.9; }
        .icon-btn .dot {
            position: absolute;
            top: 7px; right: 7px;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--danger);
            border: 1.5px solid var(--bg-card);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 40%, transparent); }
            50%      { box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 0%, transparent); }
        }
        /* AI 助手：实底撞色 + 双层闪光 glyph + 悬停辉光 */
        .icon-btn.ai {
            background: var(--m-ink);
            color: var(--m-on);
            box-shadow: 0 2px 8px color-mix(in srgb, var(--m-main) 30%, transparent);
            transition: transform .22s cubic-bezier(.34, 1.4, .64, 1), box-shadow .24s ease;
        }
        .icon-btn.ai:hover {
            transform: translateY(-1px) scale(1.06);
            box-shadow: 0 5px 16px color-mix(in srgb, var(--m-main) 48%, transparent),
                        0 0 0 5px color-mix(in srgb, var(--m-main) 16%, transparent);
        }
        .icon-btn.ai:active { transform: translateY(0) scale(.94); }
        .icon-btn.ai svg { width: 18px; height: 18px; overflow: visible; }
        /* 副星常驻呼吸：静止时也在“活”，悬停时加快 */
        .icon-btn.ai .ai-spark-mini {
            transform-box: fill-box;
            transform-origin: center;
            animation: aiTwinkle 3.6s ease-in-out infinite;
        }
        .icon-btn.ai:hover .ai-spark-mini { animation-duration: 1.1s; }
        @keyframes aiTwinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: .5; transform: scale(.78); }
        }
        @media (prefers-reduced-motion: reduce) {
            .icon-btn.ai .ai-spark-mini { animation: none; }
        }

        .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--m-ink);
            color: var(--m-on);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
            cursor: pointer;
            position: relative;
            margin-left: 4px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .avatar:hover { transform: scale(1.1); }
        .avatar::after {
            content: "";
            position: absolute;
            right: -1px; bottom: -1px;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--ok);
            border: 2px solid var(--bg-card);
        }

        /* 域根没有可寻址的下级 ⇒ **不渲染空环**（圆盘与收起态图标列一起收掉）。
           留一个 12 点的空圆盘加一扇写着空字符串的门，读起来像"坏了"，
           而不是"这里没有下一层"。类由 renderRing 的空守卫挂/摘。

           ⚠️ 收起态那条 `.sidebar.collapsed .rail { display: flex }` 在文件**更靠后**的位置，
              特异性与下面这条**相同**（都是 3 个类）⇒ 它会压过它，把**空的**图标列显示出来。
              所以这里带上 `.collapsed` 再写一条（4 个类，稳赢，不用 !important）。 */
        .sidebar.no-ring .radial-stage,
        .sidebar.no-ring .rail,
        .sidebar.no-ring.collapsed .rail { display: none; }

        /* 列表态**不给侧栏副标题**：页头的大标题已经说了"全部项目"，
           而这个副标题当初存在的理由（"分区搬到环上了，需要一处文字回执"）
           在没有环的列表态并不成立。读数归右侧的 KPI 四格。 */
        .sidebar.no-ring .sidebar-subtitle { display: none; }
        .sidebar.no-ring .sidebar-title { margin-bottom: 0; }

        /* ========== 侧栏 ========== */        .sidebar-wrap {
            grid-area: sidebar;
            display: flex;
            overflow: hidden;
            min-width: 0;
            position: relative;
            /* 收起态的悬停提示要浮到主内容卡之上：.sidebar 是 relative 定位，
               若不抬这一层，DOM 在后的主内容卡会盖住提示。 */
            z-index: 30;
        }
        /* 收起态整列都不能裁：.sidebar 自己已放开，这一层不放开会把提示按列宽剪掉 */
        .app.sidebar-collapsed .sidebar-wrap { overflow: visible; }

        .sidebar {
            background: var(--bg-shell);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow-pop);
            display: flex; flex-direction: column;
            overflow: hidden;
            width: 100%;
            transition: background 0.4s ease;
            position: relative;
        }
        /* 收起态内部没有滚动内容，放开裁剪，好让图标列的悬停提示浮到侧栏之外 */
        .sidebar.collapsed { overflow: visible; }

        .sidebar-head {
            padding: 14px 16px 0;
            flex-shrink: 0;
            position: relative;
        }
        .sidebar.collapsed .sidebar-head { padding: 12px 12px 0; }

        .sidebar-title {
            font-size: 14px; font-weight: 800;
            letter-spacing: -0.3px;
            margin-bottom: 3px;
            white-space: nowrap;
            transition: opacity 0.2s ease;
            display: flex; align-items: center; gap: 7px;
        }
        .sidebar-title .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--m-main);
            flex-shrink: 0;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        /* 这里原来是渐变裁切文字（background-clip:text）。它的对比度无法用「前景透明化」量出来
           —— 字形像素本身就取自背景渐变，透明化动不到它 —— 等于留了个永久不可验证的元素，
           而它是 14px 小字。改成实色，品牌色交给左边的 .dot。 */
        .sidebar-title .name {
            color: var(--text-primary);
            transition: color 0.4s ease;
        }
        .sidebar-subtitle {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            transition: opacity 0.2s ease;
            margin-left: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .sidebar.collapsed .sidebar-title,
        .sidebar.collapsed .sidebar-subtitle { opacity: 0; overflow: hidden; height: 0; margin: 0; }

        /* ========== 展开态：圆盘 ========== */
        .radial-stage {
            flex-shrink: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 2px;
            position: relative;
            /* 上提贴住侧栏头。这个值 = 期望的视觉间距 − 容器自带的顶部空白。
               容器顶部空白 = 容器半宽 −（环半径 + 咬合 5px + 半个图标）—— 图标一变大它就变小，
               所以这个值**必须跟着图标尺寸重算**：图标 30px 时 −2px 刚好，图标 36px 时就贴脸了。 */
            margin-top: 1px;
            padding: 0 0 2px;
            transition: opacity 0.2s ease, margin 0.3s ease, padding 0.3s ease, height 0.3s ease;
        }
        .sidebar.collapsed .radial-stage { opacity: 0; overflow: hidden; height: 0; margin: 0; padding: 0; }

        .radial {
            /* 三个值都由 JS 按项数写入（见 radiusFor / iconFor）：
               --r 环半径 · --icon 图标直径 · --dial 中心门。
               「项数少 ⇒ 盘小、刻度少」—— 尺寸本身携带信息，不再是一个固定大小的圈。
               容器边长由「环半径 + 图标半径 + 10px 呼吸」推出；10px 同时要留给选中项的向外咬合。

               ⚠️ 容器宽度是硬约束，不是可以随便长的：容器居中在 .sidebar 的内容盒里，
                  侧栏 240 → 内容 238；≤1100px 断点侧栏收到 220 → 内容 218。
                  即 **容器必须 ≤ 218**。当前最大值 201（n=11）／198（n=12），两侧各余 ~8.5px。
                  想再放大图标，要么抬 R（吃余量），要么压这里的 10px 呼吸位（会挤掉咬合）。 */
            --r: 74px;
            --icon: 36px;
            --dial: 53px;
            position: relative;
            width: calc(2 * (var(--r) + var(--icon) / 2 + 10px));
            height: calc(2 * (var(--r) + var(--icon) / 2 + 10px));
            flex-shrink: 0;
            transition: opacity 0.2s ease;
        }


        .hub-ripple {
            position: absolute; left: 50%; top: 50%;
            width: var(--dial); height: var(--dial);
            margin-left: calc(var(--dial) / -2);
            margin-top: calc(var(--dial) / -2);
            border-radius: 999px;
            border: 1.5px solid var(--m-main);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .hub-door {
            position: absolute; left: 50%; top: 50%;
            width: var(--dial); height: var(--dial);
            transform: translate(-50%, -50%);
            border-radius: 999px;
            appearance: none; border: 0; padding: 0; margin: 0;
            background: none; color: inherit; font: inherit;
            cursor: pointer;
            z-index: 5;
        }
        .hub-dial {
            position: absolute; inset: 0;
            border-radius: 999px;
            background: var(--m-tint);
            border: 1px solid color-mix(in srgb, var(--m-main) 32%, transparent);
            transition: background 0.24s ease, border-color 0.24s ease;
        }
        .hub-door:hover .hub-dial {
            background: color-mix(in srgb, var(--m-main) 20%, transparent);
            border-color: color-mix(in srgb, var(--m-main) 58%, transparent);
        }

        /* 分段刻度弧：停靠点由 JS 生成（段数 = 该模块的分区数，已过的段用强调色填满）。
           它是这个界面里「形状携带信息」的主要载体 —— 一眼能看出「共几格、走到第几格」。
           ⚠️ 未填充的那几格是**纯装饰**（总数由图标本身可见），故不适用 3:1 的图形门槛。 */
        .hub-arc {
            position: absolute; inset: 0;
            border-radius: 999px;
            background: conic-gradient(from 0deg, var(--arcs, var(--m-main) 0deg 0deg, transparent 0deg 360deg));
            -webkit-mask: radial-gradient(closest-side, transparent 90%, #000 96%);
            mask: radial-gradient(closest-side, transparent 90%, #000 96%);
        }

        .hub-compass {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }
        .hub-compass__petals path {
            fill: color-mix(in srgb, var(--m-main) 10%, transparent);
            stroke: color-mix(in srgb, var(--m-main) 55%, transparent);
            stroke-width: 0.9;
            stroke-dasharray: 1.5 1.2;
