        keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"></rect><line x1="6" y1="10" x2="6" y2="10"></line><line x1="10" y1="10" x2="10" y2="10"></line><line x1="14" y1="10" x2="14" y2="10"></line><line x1="18" y1="10" x2="18" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line>',
        database: '<ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>',
        link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>',
        info: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>',
        activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
        alert: '<path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4M12 17h.01"></path>',
        flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line>',
        send: '<line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>',
        trend: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
        chevronLeft: '<polyline points="15 18 9 12 15 6"></polyline>',
        /* 设置的齿轮：v5 的图标表里没有它（顶栏那个齿轮是内联写的）——
           分区要用就得进表，否则 iconSvg 会静默回落到 grid */
        gear: '<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>'
    };

    /* 图标查不到时**不要静默回落**：回落成 grid 的症状是"N 个分区全变成同一个图形"，
       而页面不报任何错，只有肉眼看得出来。 */
    function iconSvg(name) {
        if (!icons[name]) console.warn('[nav] 未定义的图标：' + name + '（已回落到 grid）');
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${icons[name] || icons.grid}</svg>`;
    }

    /* ============ 状态 ============ */
    let currentPrimary = CURRENT_MODULE;
    let ringLevel = 'level2';
    let currentItemIdx = 0;
    let currentChildIdx = 0;
    let parentItem = null;
    const START = -90;

    const ringEl = document.getElementById('moduleRing');
    const radialItemsWrap = ringEl.querySelector('[data-radial-items]');
    const arcEl = ringEl.querySelector('[data-hub-arc]');
    const ripple = ringEl.querySelector('.hub-ripple');
    const hubDoor = ringEl.querySelector('[data-hub-door]');
    const railEl = document.getElementById('moduleRail');
    const sidebarEl = document.getElementById('sidebar');
    const subtitleEl = document.getElementById('sidebarSubtitle');
    const captionEl = document.getElementById('ringCaption');
    /* ⚠️ matchMedia 要带守卫：没有它的话 jsdom / 老引擎里这一行会抛，
       而**从这一行起整段脚本都不再执行** —— 症状是"导航正常、它后面的功能全静默失效"。 */
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    /* 环半径随项数变：项少时收小。尺寸本身就是信息 ——
       「概览只有 9 格，盘就铺满」；换个只有 3 个分区的模块，盘会自己缩小。
       下界 52 不是拍的：要容下中心门半径 + 图标半径 + 7px 缝。
       ⚠️ 图标变大后这个下界要跟着抬 —— 它由「中心门 + 图标」反推，不是独立常数。 */
    const R_MIN = 52, R_MAX = 74;
    function radiusFor(n) {
        const chordT = 44;                      // 相邻两项的弦长目标
        return Math.max(R_MIN, Math.min(R_MAX, Math.round(chordT / (2 * Math.sin(Math.PI / n)))));
    }

    /* 图标直径也要按项数收：n 大时相邻弦长短，不收就会在「选中 1.15 倍 + 悬停 1.16 倍」
       的相邻一对上边缘相切、看成一块。
       ⚠️ ICON_MAX 与 CSS 的 --icon 初值、还有 R_MIN 是**联动的三件套**。 */
    const ICON_MAX = 36;
    function iconFor(n, R) {
        const chord = 2 * R * Math.sin(Math.PI / n);
        return Math.max(26, Math.min(ICON_MAX, Math.floor((chord - 3) / 1.155)));
    }

    /* 分段刻度：每段对应一个分区，已过的段填强调色。它是"形状携带信息"的主要载体 ——
       一眼能看出"共几格、走到第几格"，也是取代页签之后唯一的"第几个"读数。 */
    function arcStops(n, activeIdx) {
        const step = 360 / n;
        const gap = Math.min(6, step * 0.22);
        const out = [];
        for (let i = 0; i < n; i++) {
            const a = i * step, b = a + step - gap;
            const color = i <= activeIdx
                ? 'var(--m-main)'
                : 'color-mix(in srgb, var(--text-primary) 14%, transparent)';
            out.push(`${color} ${a.toFixed(2)}deg ${b.toFixed(2)}deg`);
            out.push(`transparent ${b.toFixed(2)}deg ${(a + step).toFixed(2)}deg`);
        }
        return out.join(', ');
    }

    /* 名称条只有显隐两种状态，不参与布局：显隐用 opacity + translateY，
       任何时候都不改变其他元素的 rect。 */
    function showCaption(text) {
        if (!captionEl || (captionEl.textContent === text && captionEl.classList.contains('is-on'))) return;
        captionEl.textContent = text;
        captionEl.classList.add('is-on');
    }
    function hideCaption() { if (captionEl) captionEl.classList.remove('is-on'); }

    /* ============ 内容 → 导航的唯一同步点 ============ */
    function syncRingTo(key) {
        /* ⚠️ 索引要按 **activeSections()** 算，不能按 SECTIONS ——
           分区是"由数据裁过"的：生活/学习项目没有「运维」「账户」，
           拿全集的下标去点筛选后的列表，高亮会从第一格起就错位。 */
        const idx = activeSections().findIndex((s) => s.key === key);
        if (idx < 0) return;                  // 未知 key 只当没看见，不动导航也不抛错
        if (ringLevel !== 'level2') { ringLevel = 'level2'; parentItem = null; }
        currentItemIdx = idx;
        renderRing(false);
    }

    /* ============ 一级切换 ============ */
    /* ⚠️ 只有 CURRENT_MODULE 走这里。其余模块由 navPrimary() 拦住 ——
       切过去会得到一个"顶栏指着项目、内容区还是项目"的分裂状态。 */
    function switchPrimary(key) {
        const cfg = primaryConfig[key];
        if (!cfg) return;
        if (megaMod) closeMega();      // 收掉面板，否则会留着上一个模块的二级与"当前项"高亮
        currentPrimary = key;
        ringLevel = 'level2';
        currentItemIdx = 0;
        currentChildIdx = 0;
        parentItem = null;

        document.querySelectorAll('.nav-p-item').forEach((el) => {
            el.classList.toggle('active', el.dataset.module === key);
        });
        document.getElementById('sidebarTitle').textContent = cfg.name;
        document.getElementById('sidebarSubtitle').textContent = cfg.subtitle;

        /* 分区与面板一起换 —— 走 activateTab，导航只同步这一次 */
        activateTab(cfg.items[0].key);
    }

    /* 顶栏一级项的点击：本原型只有「项目」有内容 */
    function navPrimary(key) {
        if (key !== CURRENT_MODULE) {
            alert('原型演示：切换到「' + primaryConfig[key].name + '」模块（需该模块的原型承载内容）');
            return;
        }
        if (currentPrimary === key) return;
        switchPrimary(key);
    }

    /* ============ 渲染环 ============ */
    function renderRing(animate) {
        const cfg = primaryConfig[currentPrimary];
        const list = ringList();
        const n = list.length;

        /* ⚠️ **列表态不渲染环**：域根没有可寻址的下级。
           留一个空圆盘 + 一扇写着空字符串的门，读起来像"坏了"，
           而不是"这里没有下一层"。收起态的图标列同理 —— 它俩是同一份数据。 */
        if (!n) {
            radialItemsWrap.innerHTML = '';
            railEl.innerHTML = '';
            hideCaption();
            ringEl.classList.remove('is-nested');
            if (sidebarEl) sidebarEl.classList.add('no-ring');
            /* 列表态**不给副标题**（见 CSS 那段）：页头的大标题已经说了"全部项目"。
               清空文字之外还要摘掉 title，否则 hover 会浮出一句对不上的提示。 */
            if (subtitleEl) {
                subtitleEl.textContent = '';
                subtitleEl.removeAttribute('title');
            }
            /* 默认给「KPI」槽：刚进列表态 VISITED 是空的，
               「最近」会渲染成一句"还没有打开过项目" —— **默认态不能是空态**。 */
            selectSlot('kpi');
            renderPage();
            renderSlots();
            return;
        }
        if (sidebarEl) sidebarEl.classList.remove('no-ring');
        /* 回到详情态：把槽交还给「最近」（那才是这一态的默认） */
        if (slotKey === 'kpi' && !slotTouched) selectSlot('recent');

        const step = 360 / n;
        const activeIdx = ringLevel === 'level2' ? currentItemIdx : currentChildIdx;

        const R = radiusFor(n);
        const iconPx = iconFor(n, R);
        ringEl.style.setProperty('--r', R + 'px');
        ringEl.style.setProperty('--icon', iconPx + 'px');
        if (arcEl) arcEl.style.setProperty('--arcs', arcStops(n, activeIdx));

        /* 名称条用 count（短，必须容得下 240px 侧栏）；
           图标列的悬停提示用 meta（它浮在侧栏之外，放得下全称）。 */
        const label = (it) => it.label + (it.meta ? ' · ' + it.meta() : '');
        const caption = (it) => it.label + (it.count ? ' · ' + it.count() : '');

        let html = '';
        list.forEach((item, i) => {
            const a = START + step * i;
            const isActive = i === activeIdx;
            const hasChildren = !!(item.children && item.children.length);
            const animClass = animate
                ? (ringLevel === 'level3' ? 'enter-from-center-strong' : 'enter-from-center') : '';
            html += `
        <button type="button"
          class="radial__item ${isActive ? 'active' : ''} ${animClass}"
          style="--a:${a}deg; --i:${i}"
          data-idx="${i}"
          data-key="${esc(item.key)}"
          data-has-children="${hasChildren}"
          aria-label="${esc(caption(item))}"
          aria-current="${isActive ? 'true' : 'false'}">
          ${iconSvg(item.icon)}
        </button>`;
        });
        radialItemsWrap.innerHTML = html;

        /* 圆盘上只剩图标，所以**悬停名称条必须带上"量"** ——
           它是"值不值得点"的唯一线索（这里的量就是分区条数 / 逾期数这类读数）。 */
        let stillHovered = false;
        radialItemsWrap.querySelectorAll('[data-idx]').forEach((btn) => {
            const i = parseInt(btn.dataset.idx, 10);
            const item = list[i];
            btn.addEventListener('click', () => handleRingClick(i));
            btn.addEventListener('mouseenter', () => showCaption(caption(item)));
            btn.addEventListener('focus', () => showCaption(caption(item)));
            btn.addEventListener('mouseleave', hideCaption);
            btn.addEventListener('blur', hideCaption);
            /* 重渲染后鼠标可能还停在原地（元素已换新），补一次，免得名称条闪没 */
            if (btn.matches(':hover')) { showCaption(caption(item)); stillHovered = true; }
        });
        if (!stillHovered) hideCaption();

        ringEl.classList.toggle('is-nested', ringLevel === 'level3');

        /* 侧栏副标题给"量"，不给分区名 —— 分区名已经由圆盘、面包屑、面板各自说了。 */
        if (subtitleEl) {
            const cur = list[activeIdx];
            subtitleEl.textContent = (cur && cur.meta) ? cur.meta() : cfg.subtitle;
            subtitleEl.title = cfg.desc;
        }

        renderRail(list, activeIdx);

        if (ringLevel === 'level2') {
            hubDoor.classList.remove('is-back');
            hubDoor.setAttribute('aria-label', '回到 ' + list[0].label);
        } else {
            hubDoor.classList.add('is-back');
            hubDoor.setAttribute('aria-label', '返回上一级');
        }

        pointTo(START + step * activeIdx);
        renderPage();
        renderSlots();
    }

    /* ============ 收起态：平铺图标列 ============ */
    /* 与圆盘共用同一份 list / activeIdx，收起只是换一种排列，
       所以"展开时看到的"和"收起时看到的"永远不会不一致。 */
    function renderRail(list, activeIdx) {
        let html = '';
        if (ringLevel === 'level3') {
            html += `
        <button type="button" class="rail__item rail__back" data-back="1" aria-label="返回上一级">
          <span class="rail__btn">${iconSvg('chevronLeft')}</span>
          <span class="rail__tip">返回 ${parentItem ? esc(parentItem.label) : ''}</span>
        </button>`;
        }
        list.forEach((item, i) => {
            const hasChildren = !!(item.children && item.children.length);
            const isActive = i === activeIdx;
            const tip = item.label + (item.meta ? ' · ' + item.meta() : '');
            html += `
        <button type="button" class="rail__item ${isActive ? 'active' : ''}"
          data-idx="${i}" data-has-children="${hasChildren}"
          aria-label="${esc(tip)}" aria-current="${isActive ? 'true' : 'false'}">
          <span class="rail__btn">${iconSvg(item.icon)}</span>
          <span class="rail__tip">${esc(tip)}</span>
        </button>`;
        });
        railEl.innerHTML = html;
        railEl.querySelectorAll('[data-idx]').forEach((btn) => {
            btn.addEventListener('click', () => {
                const i = parseInt(btn.dataset.idx, 10);
                const item = list[i];
                /* 收起态看不到中心门，所以「点当前项」也要能下钻；
                   展开态这个动作由中心门承担。 */
                if (ringLevel === 'level2' && i === activeIdx && item && item.children && item.children.length) {
                    enterLevel3(item); return;
                }
                handleRingClick(i);
            });
        });
        const backBtn = railEl.querySelector('[data-back]');
        if (backBtn) backBtn.addEventListener('click', backToLevel2);
    }

    /* ============ 点击环上的项 ============ */
    /* v5 里"点带 children 的项"会立刻下钻；本原型改成：
       点非当前项 → **只切内容**；点当前项 → 才下钻。
       理由：这里的圆盘承载的是**这个项目的 7 个分区**，自动下钻会把整圈
       瞬间换成 3~4 个子项 —— 那一下切的是区域，不是视图。 */
    function handleRingClick(i) {
        const list = ringList();
        const item = list[i];
        if (!item) return;
        if (ringLevel === 'level2') {
            if (i === currentItemIdx) {
                if (item.children && item.children.length) enterLevel3(item);
                return;
            }
            activateTab(item.key);
        } else {
            if (i === currentChildIdx) return;
            currentChildIdx = i;
            renderRing(false);
        }
    }

    /* ============ 三级（本原型用不到，但整段保留）============
       ⚠️ 这 7 个分区**都没有 children**，所以下面这几个函数当前一次也不会被调用。
          保留它们是 v5 的契约：将来给某个分区加 `children`（比如把「任务」的
          某个真正有终点的子对象挂上去），导航不用重写就能用。
          判据（写在这里免得下次又混）：**枚举值做 chip，对象才配一层三级** ——
          「列表 / 看板 / 四象限」是同一张列表上的视图切换，已经做成面板内的 .seg，
          它**不该**变成三级。 */
    function enterLevel3(item) {
        parentItem = item;
        ringLevel = 'level3';
        currentChildIdx = 0;
        if (ripple && !reduce) {
            ripple.animate(
                [{ transform: 'scale(0.4)', opacity: 0.7 },
                 { transform: 'scale(2.6)', opacity: 0 }],
                { duration: 700, easing: 'cubic-bezier(0.16, 0.9, 0.3, 1)' }
            );
        }
        renderRing(true);
        /* 下钻后立刻落到第一个子项，别让"高亮"和"内容"错开一格 */
        applyChildView(item, (item.children && item.children[0]) ? item.children[0].key : null);
    }
    function backToLevel2() {
        if (ringLevel !== 'level3') return;
        ringLevel = 'level2';
        parentItem = null;
        renderRing(true);
    }
    /* 子项 → 子视图。没有加 children 的分区不受影响。 */
    const CHILD_VIEW = {};
    function applyChildView(parent, childKey) {
        const f = CHILD_VIEW[parent.key];
        if (f && childKey) f(childKey);
        else renderPage();
    }

    /* ============ 中心门 ============ */
    /* v5 里它是「进入 / 返回下一级」。本原型的 7 个分区都没有三级，
       所以这里没有"下一级"可进 —— 与其留一个点了没反应的按钮，
       不如让它承担一件确定的事：把圆盘和内容一起送回第一格。 */
    hubDoor.addEventListener('click', () => {
        if (ringLevel === 'level3') { backToLevel2(); return; }
        const list = ringList();
        const item = list[currentItemIdx];
        if (item && item.children && item.children.length) { enterLevel3(item); return; }
        if (currentItemIdx !== 0 && list[0]) activateTab(list[0].key);
    });

    /* ============ 指针 ============ */
    /* 罗盘指针（.hub-compass__star）跟着当前项转。
       注意它与 .hub-arc 是两件事：arc 是"共几格 / 走到第几格"的**读数**，
       指针只是把同一个位置又说了一遍 —— 所以纯色化时 arc 留下、指针随罗盘纹一起算装饰层。 */
    let needleAngle = START + 90;
    function pointTo(deg) {
        const target = deg + 90;
        const delta = ((target - needleAngle + 540) % 360) - 180;
        needleAngle += delta;
        if (sidebarEl) sidebarEl.style.setProperty('--na', needleAngle + 'deg');
    }

    /* ============ 页头 ============ */
    /* ⚠️ **详情态没有页头**。位置已经由 Hero（项目名）与分区栏（当前分区）说了，
       再放一行"项目 / 名字"就是同一个词说两遍 —— React 落地时也是这么砍掉的。
       列表态那个页头由 `renderList()` 自己渲染，与这里无关。
       留着这个空函数是因为它是导航的调用点（renderRing 每次都会调一次）。 */
    function renderPage() {}

    /* ============ 侧栏三槽 + 顶栏徽标 ============ */
    /* 全部从本页数据派生。**不留一份手抄的示例数字** ——
       那正是本文件一开始就在防的"看板说有 4 条、列表只列出 2 条"。
       ⚠️ 三槽随**两态**换内容：列表态说项目，详情态说这一个项目的欠账。 */
    function renderSlots() {
        /* 顶栏徽标：项目域上它就是"未完成项目数"，与列表态的 KPI 同一份派生 */
        const badge = document.getElementById('navProjectBadge');
        if (badge) {
            const n = PROJECTS.filter((p) => p.status !== 'done').length;
            badge.textContent = n;
            badge.title = '未完成项目 ' + n + ' 个';
        }

        /* 最近：**真实走过的路** —— 详情态进过的项目。点它直接回那个项目。 */
        const recent = document.getElementById('slotRecent');
        if (recent) {
            recent.innerHTML = VISITED.length
                ? VISITED.map((p) => `
                <div class="recent-item" data-open-project="${p.id}" role="button" tabindex="0">
                    <span class="recent-icon">${iconSvg('project')}</span>
                    <span class="recent-text">${esc(p.name)}</span>
                    <span class="recent-time">${SCOPE_LABEL[p.scope]}</span>
                </div>`).join('')
                : '<div class="q-empty">还没有打开过项目</div>';
        }

        /* KPI：两态各一组，都是同一份派生 */
        const kpi = document.getElementById('slotKpi');
        if (kpi) {
            let rows;
            if (viewMode === 'detail') {
                const t = curTasks();
                rows = [
                    ['未完成', t.filter((x) => x.status !== 'done').length, true],
                    ['逾期', t.filter((x) => x.late).length, false],
                    ['Bug 待处理', curBugs().filter((b) => b.status !== 'fixed').length, true],
                    ['文档', curDocs().length, false],
                    ['服务器', curServers().length, false],
                ];
            } else {
                const st = projStats();
                rows = [
                    ['项目', st.total, true],
                    ['进行中', st.active, false],
                    ['风险', st.risk, true],
                    ['平均进度', st.avg + '%', false],
                ];
            }
            kpi.innerHTML = '<div class="kpi-list">' + rows.map((r) =>
                `<div class="kpi-item"><span class="kpi-label">${r[0]}</span>`
                + `<span class="kpi-value${r[2] ? ' accent' : ''}">${r[1]}</span></div>`).join('') + '</div>';
        }

        /* AI：句子也全部由数据算出来 —— 不写死"1 项风险"这种记在纸上的数 */
        const ai = document.getElementById('slotAi');
        if (ai) {
            const st = projStats();
            const risk = PROJECTS.filter((p) => p.status === 'risk');
            const soon = PROJECTS.filter((p) => p.status !== 'done').slice().sort((a, b) => a.daysLeft - b.daysLeft)[0];
            const lines = [
                ['bot', risk.length
                    ? `全部 ${st.total} 个项目里 ${risk.length} 个有风险：${risk.map((p) => '「' + p.name + '」').join('')}。要我先排一下吗？`
                    : `全部 ${st.total} 个项目都在正常推进，平均进度 ${st.avg}%。`],
                ['user', '最赶的是哪个'],
                ['bot', soon
                    ? `「${soon.name}」截止 ${soon.dueShort}，剩 ${soon.daysLeft} 天，进度 ${soon.progress}%（${soon.tasksDone}/${soon.tasksTotal} 任务）。`
                    : '没有在推进的项目。'],
            ];
            ai.innerHTML = '<div class="ai-chat">'
                + lines.map((l) => `<div class="ai-msg ${l[0]}">${esc(l[1])}</div>`).join('')
                + '</div><div class="ai-input"><input type="text" placeholder="问点什么…" id="aiAsk" />'
                + `<button class="ai-send" data-demo="AI 助手">${iconSvg('send')}</button></div>`;
        }
    }

    /* ============ 槽切换 ============ */
    /* 槽的选中态是**组件局部 state**：不进路由、不持久化 ——
       它是"我此刻想看一下旁边那块"的临时视图，刷新回到默认是符合预期的。
       两条默认：列表态给「KPI」（刚进来 VISITED 是空的，「最近」是句空话）；
       详情态给「最近」。
       `slotTouched` 记"用户自己点过" —— 点过之后，两态切换就不替他改默认了。 */
    let slotKey = 'recent';
    let slotTouched = false;

    function selectSlot(key) {
        const tabs = document.querySelectorAll('.slot-tab');
        if (!tabs.length) return;
        slotKey = key;
        tabs.forEach((t) => t.classList.toggle('active', t.dataset.slot === key));
        document.querySelectorAll('.slot-panel').forEach((p) => {
            p.classList.toggle('active', p.dataset.panel === key);
        });
    }

    document.querySelectorAll('.slot-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
            slotTouched = true;
            selectSlot(tab.dataset.slot);
        });
    });

    /* ============ 超级菜单（顶栏二级下拉）============
       存在的理由不是"更好看"：实测 ≤900 时侧栏、圆盘、图标列三者皆不可见，
       顶栏只剩 9 个一级项 ⇒ **二级完全够不到**。这个面板补的就是这个缺口。
       ≥900：悬停展开（面板是 .topbar 的后代，mouseleave 不触发）；
       ≤900：点击展开，面板整条全宽。 */
    const megaEl = document.getElementById('mega');
    const topbarEl = document.querySelector('.topbar');
    const navItemEls = [...document.querySelectorAll('.nav-p-item')];
    let megaMod = null;
    let megaTimer = null;

    const megaCols = (n) => (n <= 4 ? 2 : 3);

    function megaHtml(mod) {
        const cfg = primaryConfig[mod];
        /* ⚠️ 列表态下「项目」这一域**没有分区可列** —— 域根没有可寻址的下级
           （与侧栏不渲染空环、`data/workspace/tabs.ts` 里 projects: [] 同一条判据）。
           这时列它下面的**项目**；进了项目才列那 7 个分区。 */
        if (mod === CURRENT_MODULE && viewMode === 'list') {
            const body = PROJECTS.map((p) => `<button type="button" class="mega-item" data-p="${p.id}">
                <span class="mi-icon">${iconSvg('project')}</span>${esc(p.name)}</button>`).join('');
            return `<div class="mega-head">
                <span class="mh-title">项目 · 全部 ${PROJECTS.length} 个</span>
            </div>
            <div class="mega-grid" style="--cols:${megaCols(PROJECTS.length)}">${body}</div>`;
        }
        const items = cfg.items;
        /* ⚠️ 项目域的分区是**由数据裁过**的（生活/学习项目没有「运维」「账户」），
           所以"当前项"要按 activeSections() 的次序认，不能拿 items 的下标直接比 ——
           否则一进生活项目，「总览」那格就会错点成别处。 */
        const shown = items === SECTIONS ? activeSections() : items;
        const body = items.map((it, i) => {
            const cur = currentPrimary === mod && ringLevel === 'level2' && shown[i] === it;
            return `<button type="button" class="mega-item${cur ? ' is-current' : ''}" data-idx="${i}"`
                + `${cur ? ' aria-current="true"' : ''}>`
                + `<span class="mi-icon">${iconSvg(it.icon)}</span>${esc(it.label)}</button>`;
        }).join('');
        return `<div class="mega-head">
                <span class="mh-title">${esc(cfg.name)} · 二级 ${items.length} 项</span>
                <button type="button" class="mh-all" data-all="1">全部 ›</button>
            </div>
            <div class="mega-grid" style="--cols:${megaCols(items.length)}">${body}</div>`;
    }

    /* 与触发项居中对齐，再夹进顶栏范围内（末项"设置"的天然位置会越出右边界） */
    function positionMega(anchorEl) {
        const tb = topbarEl.getBoundingClientRect();
        const a = anchorEl.getBoundingClientRect();
        const w = megaEl.offsetWidth;
        const left = a.left - tb.left + a.width / 2 - w / 2;
        megaEl.style.left = Math.round(Math.max(8, Math.min(left, tb.width - w - 8))) + 'px';
    }

    function openMega(mod, anchorEl) {
        clearTimeout(megaTimer);
        megaMod = mod;
        megaEl.innerHTML = megaHtml(mod);
        positionMega(anchorEl);              /* 先量宽再定位 */
        megaEl.classList.add('is-open');
        navItemEls.forEach((el) => {
            const on = el.dataset.module === mod;
            el.classList.toggle('mega-on', on);
            el.setAttribute('aria-expanded', String(on));
        });
        megaEl.querySelectorAll('.mega-item').forEach((btn) => {
            btn.addEventListener('click', () => {
                /* 列表态列的是项目（见 megaHtml），点它 = 进那个项目 */
                if (btn.dataset.p) { showDetail(btn.dataset.p); closeMega(); return; }
                gotoLevel2(mod, parseInt(btn.dataset.idx, 10));
            });
        });
        const all = megaEl.querySelector('[data-all]');
        if (all) all.addEventListener('click', () => gotoLevel2(mod, 0));
    }

    function closeMega() {
        clearTimeout(megaTimer);
        megaMod = null;
        megaEl.classList.remove('is-open');
        navItemEls.forEach((el) => {
            el.classList.remove('mega-on');
            el.setAttribute('aria-expanded', 'false');
        });
    }
    const scheduleCloseMega = () => { clearTimeout(megaTimer); megaTimer = setTimeout(closeMega, 180); };

    /* 直达某个分区。⚠️ 不走 handleRingClick —— 它对"当前项"是 no-op，会把这次点击吞掉 */
    function gotoLevel2(mod, idx) {
        if (mod !== CURRENT_MODULE) {
            alert('原型演示：切换到「' + primaryConfig[mod].name + '」模块（需该模块的原型承载内容）');
            closeMega();
            return;
        }
        const cfg = primaryConfig[mod];
        if (currentPrimary !== mod) switchPrimary(mod);
        ringLevel = 'level2';
        currentItemIdx = idx;
        currentChildIdx = 0;
        parentItem = null;
        activateTab(cfg.items[idx].key);
        closeMega();
    }

    navItemEls.forEach((el) => {
        el.setAttribute('tabindex', '0');       /* 原来是一串不可聚焦的 div，键盘进不去 */
        el.setAttribute('aria-haspopup', 'true');
        el.setAttribute('aria-expanded', 'false');
        const key = el.dataset.module;
        el.addEventListener('mouseenter', () => { if (window.innerWidth > 900) openMega(key, el); });
        el.addEventListener('focus', () => openMega(key, el));
        el.addEventListener('click', () => {
            /* 先切模块再开面板：宽屏是"跟随新模块重建"，
               窄屏（没有 hover）是**唯一的展开入口**。
               不做 toggle —— 关闭交给点外部 / Esc / 鼠标移开，行为更可预测。 */
            navPrimary(key);
            openMega(key, el);
        });
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navPrimary(key); }
        });
    });
    /* 面板是 .topbar 的后代 ⇒ 指针移进面板不会触发 mouseleave，不需要"桥接"逻辑 */
    topbarEl.addEventListener('mouseleave', () => { if (megaMod) scheduleCloseMega(); });
    megaEl.addEventListener('mouseenter', () => clearTimeout(megaTimer));
    document.addEventListener('click', (e) => { if (megaMod && !topbarEl.contains(e.target)) closeMega(); });
    window.addEventListener('resize', () => { if (megaMod) closeMega(); });

    /* ============ 折叠 ============ */
    const appEl = document.getElementById('app');
    const collapseBtn = document.getElementById('collapseBtn');
    collapseBtn.addEventListener('click', () => {
        const collapsed = sidebarEl.classList.toggle('collapsed');
        appEl.classList.toggle('sidebar-collapsed', collapsed);
        collapseBtn.title = collapsed ? '展开侧栏' : '收起侧栏';
        collapseBtn.setAttribute('aria-expanded', String(!collapsed));
        /* 收起会把圆盘整块收掉，名称条要一起复位，否则展开后会留个过期名字 */
        if (collapsed) hideCaption();
    });

    /* ============ 主题 ============ */
    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const SUN = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
    const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

    function readTheme() {
        const q = new URLSearchParams(location.search).get('theme');
        if (q === 'dark' || q === 'light') return q;
        try {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') return saved;
        } catch (e) { /* file:// 下可能不可用 */ }
        return 'light';
    }
    function setTheme(mode) {
        document.documentElement.classList.toggle('dark', mode === 'dark');
        themeIcon.innerHTML = mode === 'dark' ? SUN : MOON;
    }
    themeBtn.addEventListener('click', () => {
        const isDark = !document.documentElement.classList.contains('dark');
        setTheme(isDark ? 'dark' : 'light');
        try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
    });

    /* ============ 键盘 ============ */
    /* 与内容区的键盘处理是**两个**监听：那个管勾选框 / 打开条目，这个管导航。
       两边都只认自己的目标，顺序上内容区先注册、先跑。 */
    document.addEventListener('keydown', (e) => {
        /* 命令面板的开关要在任何地方生效（含光标停在面板输入框里时） */
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            if (cmdMask.classList.contains('open')) closeCmd(); else openCmd();
            return;
        }
        if (e.key === 'Escape') {
            if (cmdMask.classList.contains('open')) { closeCmd(); return; }
            if (megaMod) { closeMega(); return; }
        }
        if (e.target.tagName === 'INPUT') return;

        const list = ringList();

        if (e.key === 'Escape' || e.key === 'Backspace') {
            if (ringLevel === 'level3') { e.preventDefault(); backToLevel2(); }
            return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            if (!list.length) return;
            e.preventDefault();
            const dir = e.key === 'ArrowRight' ? 1 : -1;
            if (ringLevel === 'level2') {
                currentItemIdx = (currentItemIdx + dir + list.length) % list.length;
                activateTab(list[currentItemIdx].key);
            } else {
                currentChildIdx = (currentChildIdx + dir + list.length) % list.length;
                renderRing(false);
            }
            return;
        }
        if (e.key === 'Enter') {
            e.preventDefault();
            if (ringLevel === 'level3') { backToLevel2(); return; }
            const item = list[currentItemIdx];
            if (item && item.children && item.children.length) enterLevel3(item);
            return;
        }
        /* v5 的主题彩蛋：不在输入框里按 d 就切主题 */
        if ((e.key === 'd' || e.key === 'D') && !e.metaKey && !e.ctrlKey && !cmdMask.classList.contains('open')) {
            themeBtn.click();
        }
    });

    /* ============ 命令面板 ============ */
    const cmdMask = document.getElementById('cmdMask');
    const cmdInput = document.getElementById('cmdInput');
    const cmdList = document.getElementById('cmdList');

    /* 列什么由**两态**定：
       · 列表态 —— 8 个项目（"跳到某个项目"就是这一态最常用的一条命令）；
       · 详情态 —— 这个项目当前的 N 个分区。
       能直达的才配叫命令：列一堆点进去没内容的模块等于给假承诺。 */
    function cmdItems() {
        if (viewMode !== 'detail') {
            return PROJECTS.map((p) => ({
                kind: 'project', key: p.id, icon: 'project', label: p.name,
                desc: SCOPE_LABEL[p.scope] + ' · ' + STATUS_LABEL[p.status] + ' · 进度 ' + p.progress + '%',
            }));
        }
        return activeSections().map((s) => ({
            kind: 'section', key: s.key, icon: s.icon, label: s.label, desc: s.desc || '',
        }));
    }

    function renderCmdList() {
        const items = cmdItems();
        cmdList.innerHTML = items.map((it) => `
            <div class="cmd-item" data-cmd-kind="${it.kind}" data-cmd-key="${esc(it.key)}" role="button" tabindex="0">
                <div class="cmd-item-icon">${iconSvg(it.icon)}</div>
                <div class="cmd-item-text">${esc(it.label)}</div>
            </div>`).join('');
        cmdList.querySelectorAll('[data-cmd-key]').forEach((el) => {
            el.addEventListener('click', () => {
                if (el.dataset.cmdKind === 'project') showDetail(el.dataset.cmdKey);
                else activateTab(el.dataset.cmdKey);
                closeCmd();
            });
        });
    }

    /* 输入即筛：让这个框对自己的 placeholder 负责，而不是一个摆设 */
    function filterCmd(q) {
        const kw = q.trim().toLowerCase();
        const items = cmdItems();
        let shown = 0;
        cmdList.querySelectorAll('[data-cmd-key]').forEach((el) => {
            const it = items.filter((x) => x.kind === el.dataset.cmdKind && x.key === el.dataset.cmdKey)[0];
            const hay = it ? (it.label + it.desc).toLowerCase() : '';
            const ok = !kw || hay.indexOf(kw) > -1;
            el.hidden = !ok;
            if (ok) shown++;
        });
        let empty = cmdList.querySelector('[data-empty]');
        if (!shown) {
            if (!empty) {
                empty = document.createElement('div');
                empty.className = 'q-empty';
                empty.dataset.empty = '1';
                empty.textContent = viewMode === 'detail' ? '没有匹配的分区' : '没有匹配的项目';
                cmdList.appendChild(empty);
            }
        } else if (empty) empty.remove();
    }

    function openCmd() {
        cmdMask.classList.add('open');
        cmdInput.value = '';
        renderCmdList();      /* 两态列的东西不同，每次打开重建一次 */
        filterCmd('');
        setTimeout(() => cmdInput.focus(), 50);
    }
    function closeCmd() { cmdMask.classList.remove('open'); cmdInput.value = ''; }
    cmdInput.addEventListener('input', () => filterCmd(cmdInput.value));

    /* ============ 导航初始化 ============ */
    setTheme(readTheme());

    /* 窄屏（≤900）顶栏只留图标，补 title 作为悬停提示 */
    navItemEls.forEach((el) => {
        el.title = primaryConfig[el.dataset.module].name;
    });
    collapseBtn.title = '收起侧栏';
    collapseBtn.setAttribute('aria-expanded', 'true');

    renderSlots();

    /* ============================================================
       9. 首屏
       项目域是**两级**：模块根 = 全部项目（列表态），点开一个项目才是工作区。
       所以首屏落在列表态 —— 点开「项目」看到的就是它。
       ============================================================ */
    document.querySelectorAll('.nav-p-item').forEach((el) => {
        el.classList.toggle('active', el.dataset.module === CURRENT_MODULE);
    });
    document.getElementById('sidebarTitle').textContent = primaryConfig.projects.name;
    currentPrimary = CURRENT_MODULE;
    ringLevel = 'level2';

    renderContent();            /* 列表态先立起来 */
    renderCmdList();
    /* 导航最后起：到这里两态的内容与数据都已就位。
       列表态下 renderRing 会**整块不渲染环**（见那个函数的空守卫）。 */
    renderRing(false);

</script>
</body>
</html>
