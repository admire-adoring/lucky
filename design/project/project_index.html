            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .hub-compass__star {
            transform-box: view-box;
            transform-origin: 50% 50%;
            transform: rotate(var(--na, 0deg));
            transition: opacity 0.3s ease;
        }
        .hub-compass__star path {
            fill: color-mix(in srgb, var(--m-main) 16%, transparent);
            stroke: color-mix(in srgb, var(--m-main) 70%, transparent);
            stroke-width: 0.9;
            stroke-dasharray: 1.4 1.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .hub-compass__star path.is-main {
            fill: color-mix(in srgb, var(--m-main) 28%, transparent);
            stroke: var(--m-main);
            stroke-width: 1.1;
        }

        .hub-back {
            position: absolute;
            inset: 0;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .hub-back svg { width: 19px; height: 19px; color: var(--m-main); stroke-width: 2.4; }
        .radial.is-nested .hub-compass { opacity: 0; }
        .radial.is-nested .hub-back { opacity: 1; }

        /* 中心门不再放文字：名称统一由下方的 .radial-caption 承担（悬停才出现）。
           "我在哪"由上方的 sidebar-subtitle 给，不在这里重复。 */

        /* 环上的图标 */
        .radial__item {
            position: absolute;
            left: 50%; top: 50%;
            width: var(--icon, 36px); height: var(--icon, 36px);
            border-radius: 999px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translate(-50%, -50%) rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a)));
            z-index: 2;
        }

        .radial__item.enter-from-center {
            animation: ring-in 0.5s cubic-bezier(0.16, 0.9, 0.3, 1) backwards;
            animation-delay: calc(var(--i) * 35ms);
        }
        @keyframes ring-in {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(var(--a)) translateX(0px) rotate(calc(-1 * var(--a))) scale(0.4);
            }
        }
        .radial__item.enter-from-center-strong {
            animation: ring-in-strong 0.6s cubic-bezier(0.16, 0.9, 0.3, 1) backwards;
            animation-delay: calc(var(--i) * 45ms);
        }
        @keyframes ring-in-strong {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(var(--a)) translateX(0px) rotate(calc(-1 * var(--a))) scale(0.2);
                filter: blur(4px);
            }
            50% { opacity: 1; filter: blur(0); }
            to   { opacity: 1; filter: blur(0); }
        }

        /* 名称退场后，悬停反馈要扛起「这是哪个」的全部提示 —— 底色 + 描边 + 放大一起上 */
        .radial__item:hover {
            color: var(--m-main);
            background: var(--m-tint);
            border-color: color-mix(in srgb, var(--m-main) 34%, transparent);
            transform: translate(-50%, -50%) rotate(var(--a)) translateX(calc(var(--r) + 3px)) rotate(calc(-1 * var(--a))) scale(1.16);
        }
        /* 实底加深一档：原 --m-main 上白字仅 4.47:1 */
        .radial__item.active {
            color: var(--m-on);
            background: var(--m-ink);
            border-color: var(--m-ink);
            /* 沿半径向外咬合 5px —— 让「当前项」不只是一块颜色，而是真的从盘面里探出来 */
            transform: translate(-50%, -50%) rotate(var(--a)) translateX(calc(var(--r) + 5px)) rotate(calc(-1 * var(--a))) scale(1.15);
        }
        .radial__item:focus-visible {
            outline: 2px solid var(--m-main);
            outline-offset: 2px;
        }
        .radial__item.active::after {
            content: ''; position: absolute; inset: -1px;
            border-radius: inherit;
            border: 1.2px solid var(--m-main);
            animation: sel-pulse 2.6s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes sel-pulse {
            0% { transform: scale(1); opacity: 0.7; }
            70%, 100% { transform: scale(1.5); opacity: 0; }
        }
        /* 字形占比 0.54：按钮直径决定「能不能放得下」，这个比例决定「看起来多大」。
           纯色化后图标没有底色衬托，0.48 会让 36px 的按钮里只躺一个 17px 的字形，显得空。 */
        .radial__item svg { width: calc(var(--icon, 36px) * 0.54); height: calc(var(--icon, 36px) * 0.54); flex-shrink: 0; }

        /* 有子菜单的标记：底部小圆点 */
        .radial__item[data-has-children="true"]::before {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px; height: 4px;
            border-radius: 999px;
            background: var(--m-main);
            z-index: 3;
            transition: all 0.2s ease;
        }
        .radial__item.active[data-has-children="true"]::before {
            background: var(--m-on);
            box-shadow: none;
        }

        /* 名称条：悬停/聚焦时出现，位置固定在圆盘正下方。
           不用「沿角度外推的气泡」——那是极坐标定位，宽名字在最左/最右必然与图标叠或被侧栏裁，
           而且每项方向不同，看起来就是"歪"的。固定一条，永远居中、永远放得下。 */
        .radial-caption {
            flex-shrink: 0;
            max-width: 100%;
            min-height: 20px;
            padding: 2px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--m-ink);
            background: var(--m-tint);
            border: 1px solid color-mix(in srgb, var(--m-main) 22%, transparent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            opacity: 0;
            transform: translateY(-3px);
            transition: opacity 0.16s ease, transform 0.16s ease;
        }
        .radial-caption.is-on {
            opacity: 1;
            transform: translateY(0);
        }

        /* ========== 收起态：平铺图标列 ========== */
        /* 与圆盘是同一份数据（当前模块的分区），两种形态互斥显示 */
        .rail {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            padding: 4px 0 6px;
        }
        .sidebar.collapsed .rail { display: flex; animation: rail-in 0.28s ease; }
        /* 纯透明度过渡：不动 rect，将来做几何验收时不会被入场动画污染数值 */
        @keyframes rail-in { from { opacity: 0; } to { opacity: 1; } }

        .rail__item {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 34px;
            max-height: 46px;
            display: flex; align-items: center; justify-content: center;
            border: 0; padding: 0; margin: 0;
            background: none;
            color: var(--text-secondary);
            font: inherit;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        /* 激活指示条贴侧栏内沿，不用左侧 padding 位移，避免整列抖动 */
        .rail__item::before {
            content: '';
            position: absolute;
            left: 0; top: 50%;
            width: 3px; height: 0;
            border-radius: 0 3px 3px 0;
            background: var(--m-main);
            transform: translateY(-50%);
            transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rail__item.active { color: var(--m-main); }
        .rail__item.active::before { height: 20px; }

        .rail__btn {
            position: relative;
            width: 34px; height: 34px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid transparent;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .rail__btn svg { width: 17px; height: 17px; }
        .rail__item:hover .rail__btn {
            color: var(--text-primary);
            background: var(--bg-deep);
            border-color: var(--line);
            transform: scale(1.08);
        }
        .rail__item.active .rail__btn {
            color: var(--m-main);
            background: var(--m-tint);
            border-color: color-mix(in srgb, var(--m-main) 26%, transparent);
        }
        .rail__item[data-has-children="true"] .rail__btn::after {
            content: '';
            position: absolute;
            right: 4px; bottom: 4px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--m-main);
        }
        .rail__back .rail__btn { color: var(--text-muted); }
        .rail__back:hover .rail__btn { color: var(--m-main); }

        /* 提示浮到侧栏之外：依赖 .sidebar.collapsed { overflow: visible } */
        .rail__tip {
            position: absolute;
            left: calc(100% + 6px);
            top: 50%;
            transform: translateY(-50%) translateX(-5px);
            padding: 5px 10px;
            border-radius: 9px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-pop);
            font-size: 12px; font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.16s ease, transform 0.16s ease;
            z-index: 200;
        }
        .rail__item:hover .rail__tip {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        /* 矮窗口：靠压缩图标节奏容纳，而不是给 .rail 加滚动
           （加滚动会裁掉浮出侧栏的悬停提示） */
        @media (max-height: 720px) {
            .rail__item { min-height: 28px; max-height: 34px; }
            .rail__item.active::before { height: 16px; }
            .rail__btn { width: 28px; height: 28px; border-radius: 9px; }
            .rail__btn svg { width: 15px; height: 15px; }
            .rail__item[data-has-children="true"] .rail__btn::after { right: 3px; bottom: 3px; }
        }
        @media (max-height: 620px) {
            .rail__item { min-height: 24px; }
            .rail__btn { width: 24px; height: 24px; border-radius: 8px; }
            .rail__btn svg { width: 14px; height: 14px; }
            .rail__item[data-has-children="true"] .rail__btn::after { right: 2px; bottom: 2px; }
        }

        /* ========== 可切换的槽 ========== */
        .sidebar-slot {
            flex: 1;
            min-height: 0;
            display: flex; flex-direction: column;
            border-top: 1px solid var(--line);
            margin-top: 2px;
        }
        .sidebar.collapsed .sidebar-slot { display: none; }

        .slot-tabs {
            display: flex; align-items: center;
            gap: 2px;
            padding: 8px 10px 6px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .slot-tabs::-webkit-scrollbar { display: none; }
        .slot-tab {
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            user-select: none;
        }
        .slot-tab:hover {
            color: var(--text-primary);
            background: var(--bg-deep);
        }
        .slot-tab.active {
            color: var(--m-ink);
            background: var(--m-tint);
        }

        .slot-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 14px 14px;
        }
        .slot-body::-webkit-scrollbar { width: 4px; }
        .slot-body::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
        .slot-body:hover::-webkit-scrollbar-thumb { background: var(--line); }

        .slot-panel { display: none; }
        .slot-panel.active { display: block; animation: slot-in 0.25s ease backwards; }
        @keyframes slot-in {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 最近 */
        .recent-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px;
            margin: 0 -8px;
            border-radius: 8px;
            font-size: 12.5px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .recent-item:hover {
            background: var(--bg-deep);
            color: var(--text-primary);
            padding-left: 12px;
        }
        .recent-icon {
            width: 20px; height: 20px;
            border-radius: 6px;
            background: var(--m-tint);
            color: var(--m-main);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .recent-icon svg { width: 11px; height: 11px; }
        .recent-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .recent-time { font-size: 10.5px; color: var(--text-muted); flex-shrink: 0; }

        /* 快捷（.quick-grid / .quick-btn）整组已删 ——
           本原型把侧栏压成"最近 / KPI / AI"三槽，没有"快捷"槽：
           那几个动作在每个分区自己的卡片头上（新增任务 / 提交 Bug / 添加账户…），
           做两遍就是两套入口做同一件事。
           ⚠️ 样式跟着槽一起删，别留"看着有用、其实没人挂"的死规则。 */

        /* KPI */
        .kpi-list { display: flex; flex-direction: column; gap: 4px; }
        .kpi-item {
            display: flex; align-items: baseline; gap: 6px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line);
        }
        .kpi-item:last-child { border-bottom: none; }
        .kpi-label { font-size: 11.5px; color: var(--text-muted); flex: 1; }
        .kpi-value {
            font-size: 14px; font-weight: 800;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }
        .kpi-value.accent { color: var(--m-ink); }

        /* AI */
        .ai-chat { display: flex; flex-direction: column; gap: 8px; }
        .ai-msg {
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 11.5px;
            line-height: 1.6;
        }
        .ai-msg.bot {
            background: var(--bg-deep);
            color: var(--text-secondary);
            border-top-left-radius: 3px;
        }
        .ai-msg.user {
            background: var(--m-tint);
            color: var(--m-ink);
            border-top-right-radius: 3px;
            align-self: flex-end;
            max-width: 85%;
        }
        .ai-input {
            display: flex; align-items: center; gap: 4px;
            margin-top: 6px;
            padding: 4px 4px 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--bg-slot);
        }
        .ai-input input {
            flex: 1; min-width: 0;
            border: none; outline: none; background: transparent;
            font-size: 11.5px;
            color: var(--text-primary);
            font-family: inherit;
        }
        .ai-input input::placeholder { color: var(--text-muted); }
        .ai-send {
            width: 24px; height: 24px;
            border-radius: 999px;
            border: none;
            background: var(--m-main);
            color: var(--m-on);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .ai-send svg { width: 12px; height: 12px; }

        /* 侧栏底部 */
        .sidebar-foot {
            padding: 8px 14px 14px;
            flex-shrink: 0;
        }
        .collapse-btn {
            width: 100%;
            padding: 8px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .collapse-btn:hover {
            border-color: var(--m-main);
            color: var(--m-ink);
            background: var(--m-tint);
        }
        .collapse-btn svg {
            width: 12px; height: 12px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.collapsed .collapse-btn svg { transform: rotate(180deg); }
        .sidebar.collapsed .collapse-text { display: none; }

        /* 页头右侧的动作组。列表态只放一个「+ 新建项目」，
           位置与详情态 Hero 右侧的「编辑 / ⋯ / 折叠」对齐。 */
        .page-actions { display: flex; gap: 8px; flex-shrink: 0; }
        /* 命令面板 */
        .cmd-mask {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.5);
            z-index: 1000;
            display: none;
            align-items: flex-start; justify-content: center;
            padding: 120px 20px 20px;
            animation: fadeIn 0.2s ease;
        }
        .cmd-mask.open { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .cmd-panel {
            width: 100%;
            max-width: 560px;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow-pop);
            overflow: hidden;
            animation: cmdIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes cmdIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .cmd-input {
            width: 100%;
            padding: 18px 20px;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            border-bottom: 1px solid var(--line);
        }
        .cmd-input::placeholder { color: var(--text-muted); }
        .cmd-list { max-height: 320px; overflow-y: auto; padding: 8px; }
        .cmd-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13.5px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .cmd-item:hover, .cmd-item.active {
            background: var(--m-tint);
            color: var(--m-ink);
        }
        .cmd-item-icon {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: var(--bg-deep);
            color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .cmd-item-icon svg { width: 14px; height: 14px; stroke-width: 2; }
        .cmd-item:hover .cmd-item-icon,
        .cmd-item.active .cmd-item-icon { color: var(--m-main); }
        .cmd-item-text { flex: 1; }
        @media (max-width: 1100px) { :root { --sidebar-w: 220px; } }
        /* 全label 需要 757px；导航可用宽 = 视口 − 319 ⇒ 理论下限 1076px。
           取 1140 作为切换点，留 64px 余量：低于它只保留**当前项**的文字，
           其余收成图标 —— 而不是靠无滚动条的 overflow-x 静默把末位截掉。 */
        @media (max-width: 1140px) {
            .nav-p-item:not(.active) .nav-p-text { display: none; }
            .nav-p-item { padding: 0 11px; }
        }

        @media (max-width: 900px) {
            .app {
                grid-template-columns: 1fr;
                grid-template-areas: "topbar" "main";
                grid-template-rows: 68px 1fr;
                gap: 12px;
                padding: 12px;
            }
            .sidebar-wrap { display: none; }
            .nav-p-item span:not(.nav-p-icon):not(.nav-p-badge) { display: none; }
            .nav-p-item { padding: 0 12px; }
            .topbar { padding: 8px 10px 8px 12px; }
            .topbar-right .icon-btn:not(.ai):not(#themeBtn) { display: none; }
        }
        /* 遮罩：纯色化后它只剩"压暗"一件事，暗色下要压得更重才分得开 */
        .dark .cmd-mask { background: rgba(3,7,18,0.66); }
    </style>
</head>
<body>

<!-- 环境层（原来的极光底衬与三枚色团）整块已删 —— 见 style 里"弥散背景整层已删"那段。
     页面底色现在由令牌层的页面底色一个值给，没有第二层要合成。
     .app 的 position / z-index 保留 —— 它担着"内容层永远在环境层之上"这个约定，
     现在虽然只剩一层，但这句话改起来比留着更容易出错。
     注：这里刻意不写出被删掉的类名与令牌名，HTML 注释里出现尖括号或连续短横线会污染注释边界。 -->
<div class="app" id="app">

    <!-- ========== 顶栏（v5 导航壳：logo + 一级胶囊 + 超级菜单 + 右侧动作）==========
         ⚠️ .mega 必须挂在 .topbar 上：.nav-primary 是 overflow-x:auto，
            面板挂进去会被裁掉，还会顶出一条竖滚动条。 -->
    <div class="topbar-wrap">
        <div class="topbar">
            <div class="logo-mark" onclick="openCmd()">J</div>
            <div class="divider-v"></div>

            <nav class="nav-primary" id="navPrimary">
                <div class="nav-p-item" data-module="dashboard">
          <span class="nav-p-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
              <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
            </svg>
          </span>
                    <span class="nav-p-text">工作台</span>
                </div>
                <div class="nav-p-item" data-module="tasks">
          <span class="nav-p-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </span>
                    <span class="nav-p-text">任务</span>

    function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    let toastTimer = null;
    function toast(msg) {
        const wrap = document.getElementById('toastWrap');
        if (!wrap) return;
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = '<span class="toast-dot"></span>' + esc(msg);
        wrap.appendChild(el);
        requestAnimationFrame(() => el.classList.add('on'));
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            el.classList.remove('on');
            setTimeout(() => el.remove(), 260);
        }, 2200);
    }

    /* 稳定哈希：内容池按它确定性取值（与 `src/data/derive.ts` 的 hash 同一条） */
    function hash(input) {
        let h = 0;
        for (let i = 0; i < input.length; i += 1) h = (h * 31 + input.charCodeAt(i)) >>> 0;
        return h;
    }
    function pick(poolArr, seed, count) {
        const h = hash(seed);
        const out = [];
        for (let i = 0; i < count; i += 1) out.push(poolArr[(h + i * 3) % poolArr.length]);
        return out;
    }

    const PRIO_CLASS = { high: 'prio-P0', mid: 'prio-P1', low: 'prio-P2' };

    const BUG_STATUS_LABEL = { open: '待修复', fixing: '修复中', fixed: '已修复' };

    const TIMES = ['12 分钟前', '2 小时前', '昨天 18:40', '3 天前'];
    const BUG_VERSIONS = ['v2.3.1', 'v2.3.0', 'v2.2.9', 'v2.2.8', 'v2.2.7'];

    /* ============================================================
       3. 派生（当前详情态的那个项目）

    let currentProjectId = PROJECTS[0].id;

    function curProject() {
        return PROJECTS.find((p) => p.id === currentProjectId) || PROJECTS[0];
    }
    function curPool() { return POOL[curProject().scope]; }
    /* 详情态那 7 格的读数入口。导航（SECTIONS 的 count/meta）与面板读的是**同一份**，
       不各算一遍 —— 那正是本文件一开始就在防的"看板说有 4 条、列表只列出 2 条"。 */
    function curTasks() { return tasksOf(curProject()); }
    function curDocs() { return docsOf(curProject()); }
    function curBugs() { return bugsOf(curProject()); }
    function curServers() { return serversOf(curProject()); }
    function curDeploys() { return deploysOf(curProject()); }
    function curMeetings() { return meetingsOf(curProject()); }
    function curAccounts() { return accountsOf(curProject()); }

    /** 距上次更新多少小时 → 文案。能算出来就不写死一句会过期的话。 */
    function updatedText(hours) {
        if (hours < 24) return hours + ' 小时前';
        const d = Math.round(hours / 24);
        return d <= 1 ? '昨天' : d + ' 天前';
    }

    function tasksOf(p) {
        const names = POOL[p.scope].tasks;
        const list = [];
        for (let i = 0; i < p.tasksTotal; i += 1) {
            const status = i < p.tasksDone ? 'done'
                : i < p.tasksDone + 2 ? (p.status === 'risk' ? 'blocked' : 'doing')
                    : 'todo';
            const due = p.status === 'done' ? '已完成'
                : (i % 5 === 0 && p.status === 'risk') ? '已逾期 2 天'
                    : ((i % 4) + 1) + ' 天后';
            list.push({
                id: p.id + '-t' + (i + 1),
                title: names[i % names.length],
                status,
                prio: i % 4 === 0 ? 'high' : i % 3 === 0 ? 'mid' : 'low',
                due,
                late: due.indexOf('逾期') > -1,
                owner: p.owners[i % p.owners.length],
            });
        }
        /* 未完成排前面（sort 稳定，组内保持原顺序） */
        return list.sort((a, b) => (a.status === 'done' ? 1 : 0) - (b.status === 'done' ? 1 : 0));
    }

    function docsOf(p) {
        const seed = hash(p.id);
        return POOL[p.scope].documents.map((d, i) => ({
            id: p.id + '-d' + (i + 1),
            name: d.name,
            kind: d.kind,
            /* 来源按项目哈希轮转 —— 应用里没有"某篇文档存在语雀"这种事实 */
            source: DOC_SOURCES[(seed + i) % DOC_SOURCES.length],
            summary: '索引与外部链接，正文由原工具维护。',
            hours: d.hours,
            updatedAt: updatedText(d.hours),
            author: p.owners[i % p.owners.length],
        }));
    }

    /** 问题清单：条数 2，风险项目 +1（"有风险"与"问题更多"是同一件事的两面）。 */
    function bugsOf(p) {
        const count = p.status === 'risk' ? 3 : 2;
        return pick(POOL[p.scope].bugs, p.id + 'bug', count).map((title, i) => ({
            id: p.id + '-b' + (i + 1),
            title,
            level: BUG_LEVEL[i % BUG_LEVEL.length][0],
            status: i === 0 ? 'open' : i === 1 ? 'fixing' : 'fixed',
            version: BUG_VERSIONS[(hash(p.id) + i) % BUG_VERSIONS.length],
            when: TIMES[(hash(p.id + i) + i) % TIMES.length],
            who: p.owners[i % p.owners.length],
        }));
    }

    /** 负载档：≥90 告警、≥75 注意。告警与每一格的染色共用这一条判据。 */
    function loadLevel(pct) { return pct >= 90 ? 'danger' : pct >= 75 ? 'warn' : 'ok'; }

    function serversOf(p) {
        return POOL[p.scope].servers.map((seed, i) => {
            const on = seed.env === 'prod';
            return {
                id: p.id + '-s' + (i + 1),
                name: (seed.env === 'prod' ? 'prod' : 'test') + '-' + seed.role + '-01',

                os: seed.os,
                cpu: seed.cpu, mem: seed.mem, disk: seed.disk,
                /* 规格与"用了多少"都由池子里那 6 个数**算**出来，不另写一份 */
                spec: seed.cores + 'C' + seed.memGb + 'G',
                memUsed: (seed.memGb * seed.mem / 100).toFixed(1),
                diskUsed: Math.round(seed.diskGb * seed.disk) / 100,

                alert: loadLevel(seed.cpu) === 'danger' || loadLevel(seed.mem) === 'danger' || loadLevel(seed.disk) === 'danger',
                version: latestVersion(p),

    function versionBase(p) { return 'v' + (2 + (hash(p.id) % 2)) + '.3'; }

                id: p.id + '-dp' + (i + 1),
                version: base + '.' + (DEPLOY_TIMES.length - i),
                result: rollback ? 'rollback' : 'success',
                when,
                server: servers[0] ? servers[0].name : 'prod-web-01',
                who: p.owners[i % p.owners.length],
                /* 只有成功的发布才有"耗时" —— 回滚没有这个概念 */
                duration: rollback ? '' : '2m ' + String(8 + ((hash(p.id + i) % 50) + i)).padStart(2, '0') + 's',
                changes: notes[i] || '—',
            };
        });
    }

    function deployDocsOf(p) {
        return POOL[p.scope].deployDocs.map((d, i) => ({
            id: p.id + '-dd' + (i + 1), name: d.name, kind: d.kind, version: d.version,
            updatedAt: updatedText(d.hours), script: d.kind === '脚本',
        }));
    }

    function meetingsOf(p) {
        const base = new Date(p.due + 'T00:00:00');
        return pick(POOL[p.scope].meetings, p.id + 'mt', 2).map((title, i) => {
            const date = new Date(base.getTime() - (10 + i * 6) * 86400000);
            const attendees = i === 1 ? p.owners.concat(['王产品', '赵测试']) : p.owners.slice();
            return {
                id: p.id + '-m' + (i + 1),
                month: date.toLocaleString('en-US', { month: 'short' }).toUpperCase(),
                day: String(date.getDate()),
                time: i === 0 ? '14:00' : '10:00',
                title,
                meta: i === 0 ? '60 分钟 · 会议室 A' : '60 分钟 · 线上',
                attendees: attendees.slice(0, 4),
                more: Math.max(0, attendees.length - 4),
            };
        });
    }

    function accountsOf(p) {
        const platforms = POOL[p.scope].accounts;
        return platforms.map((platform, i) => ({
            id: p.id + '-a' + (i + 1),
            platform,
            env: i % 3 === 2 ? 'dev' : i % 2 === 0 ? 'prod' : 'test',
            user: (platform === '阿里云' ? 'admin' : 'dev') + '@xxx.com',
            expire: i === 0 ? '90 天后换' : i === platforms.length - 1 ? '7 天后换' : '',
            warn: i === platforms.length - 1,
        }));
    }

    /* 象限：重要 = P0；紧急 = 已逾期或 2 天内到期。四个格子读的是同一份任务 */
    function quadOf(t) {
        const important = t.prio === 'high';
        const urgent = t.late || t.due === '1 天后' || t.due === '2 天后';
        if (important && urgent) return 'q1';
        if (important) return 'q2';
        if (urgent) return 'q3';
        return 'q4';
    }

    /* ============================================================
       4. 两态与列表筛选的状态
       ============================================================ */
    /* ⚠️ 初始是**列表态** —— 点开「项目」这一域看到的是全部项目，
       详情是下钻。这与 `/projects` 是模块根、`/projects/:id` 是详情同形。 */
    let viewMode = 'list';
    /* 「最近」槽的事实源：**用户自己走过的路**（进过哪些项目），不写死四条示例。
       本机行为，不进后端 —— 与 `stores/recents-store` 同一条口径。 */
    const VISITED = [];
    let projView = 'cards';
    let projQuery = '';
    let projScope = 'all';
    let projSort = 'default';
    let projKpiFilter = '';
    let taskView = 'list';
    let openDocId = null;

    /** 列表态真正显示的项目 = 领域 + 关键词 + KPI 那一格的条件 */
    function visibleProjects() {
        const kw = projQuery.trim().toLowerCase();
        let list = PROJECTS.filter((p) => {
            if (projScope !== 'all' && p.scope !== projScope) return false;
            if (projKpiFilter === 'active' && p.status !== 'active') return false;
            if (projKpiFilter === 'risk' && p.status !== 'risk') return false;
            if (projKpiFilter === 'done' && p.status !== 'done') return false;
            if (!kw) return true;
            return [p.name, p.desc, p.tags.join(' '), p.milestone].join(' ').toLowerCase().indexOf(kw) > -1;
        });
        if (projSort === 'due') list = list.slice().sort((a, b) => a.daysLeft - b.daysLeft);
        if (projSort === 'progress') list = list.slice().sort((a, b) => b.progress - a.progress);
        if (projSort === 'priority') {
            const rank = { high: 3, mid: 2, low: 1 };
            list = list.slice().sort((a, b) => rank[b.prio] - rank[a.prio]);
        }
        return list;
    }

    function projStats() {
        const total = PROJECTS.length;
        const by = (s) => PROJECTS.filter((p) => p.status === s).length;
        const scopes = { life: 0, work: 0, learn: 0 };
        let sum = 0;
        PROJECTS.forEach((p) => { scopes[p.scope] += 1; sum += p.progress; });
        return { total, active: by('active'), risk: by('risk'), done: by('done'), scopes,
                 avg: total ? Math.round(sum / total) : 0 };
    }

    /* ============================================================
       5. 列表态 · 全部项目
       ============================================================ */
    function renderList() {
        const st = projStats();

        /* 页头只说"义"：读数归下面 KPI 四格（"同一个词不在一屏出现三次"） */
        document.getElementById('listSubtitle').textContent =
            '生活 / 工作 / 学习三个域的项目都在这里，点一张卡进入它的工作区。';

        /* 读数四格：**可点即筛**，且 KPI 与工具栏同处一张卡。读数不可点，
           用户就得去工具栏把同一个条件再挑一遍。 */
        const cards = [
            { k: '', label: '全部', value: st.total, sub: '生活 ' + st.scopes.life + ' · 工作 ' + st.scopes.work + ' · 学习 ' + st.scopes.learn, kc: 'var(--m-main)' },
            { k: 'active', label: '进行中', value: st.active, sub: '正在推进的项目', kc: 'var(--info)' },
            { k: 'risk', label: '风险阻塞', value: st.risk, sub: st.risk ? '需要先看这几个' : '没有阻塞中的项目', kc: 'var(--danger)' },
            /* 第四格的色与「已完成」的状态徽标同源（都是 --ok）；
               原来用了第四象限的 --q4（灰蓝），同一个枚举两种颜色。 */
            { k: 'done', label: '已完成', value: st.done, sub: '平均进度 ' + st.avg + '%', kc: 'var(--ok)' },
        ];
        document.getElementById('projKpi').innerHTML = cards.map((c) => `
            <div class="ov-kpi-card${projKpiFilter === c.k ? ' is-on' : ''}"
                 style="--kc: ${c.kc}" data-kpi="${c.k}" role="button" tabindex="0"
                 aria-pressed="${projKpiFilter === c.k}">
                <div class="ov-kpi-label"><span class="ov-kpi-dot"></span>${c.label}</div>
                <div class="ov-kpi-value">${c.value}</div>
                <div class="ov-kpi-sub">${esc(c.sub)}</div>
            </div>`).join('');

        const list = visibleProjects();
        const total = PROJECTS.length;
        document.getElementById('projSummary').textContent = '显示 ' + list.length + ' / ' + total;
        document.getElementById('projEmpty').hidden = !(list.length === 0);

        document.getElementById('projCards').innerHTML = list.map((p) => `
            <div class="card proj-card" data-open-project="${p.id}" role="button" tabindex="0">
                <div class="proj-card-head">
                    <span class="badge badge-neutral">${SCOPE_LABEL[p.scope]}</span>
                    <span class="badge ${STATUS_BADGE[p.status]}">${STATUS_LABEL[p.status]}</span>
                    <span class="prio ${PRIO_CLASS[p.prio]}" style="margin-left:auto">${PRIO_LABEL[p.prio]}</span>
                </div>
                <div class="proj-card-name">${esc(p.name)}</div>
                <div class="proj-card-desc">${esc(p.desc)}</div>
                <div class="proj-card-tags">${p.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('')}</div>
                <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%"></div></div>
                <div class="proj-card-foot">
                    <span>${p.tasksDone}/${p.tasksTotal} 任务 · 截止 ${esc(p.dueShort)}</span>
                    <span class="${dueClass(p)}" style="margin-left:auto">${leftText(p)}</span>
                </div>
            </div>`).join('');

        /* 表格是"横着比"的形态 —— 所以它必须有表头，且末两列定宽（见 .proj-table 那几条）。
           没有表头的话 6 列全靠猜，那就不叫表格。 */
        document.getElementById('projTable').innerHTML =
            `<div class="task-row is-head" aria-hidden="true">
                <div class="task-row-main">项目</div>
                <div class="task-row-right">
                    <span class="task-due">截止</span>
                    <span class="task-quad-tag">进度</span>
                    <span class="prio">优先级</span>
                    <span class="pill">状态</span>
                </div>
            </div>`
            + list.map((p) => `
            <div class="task-row" data-open-project="${p.id}" role="button" tabindex="0">
                <div class="task-row-main">
                    <div class="task-row-title">${esc(p.name)}</div>
                    <div class="task-row-sub"><span class="tag">${SCOPE_LABEL[p.scope]}</span><span class="tag">${esc(p.milestone)}</span></div>
                </div>
                <div class="task-row-right">
                    <span class="task-due${p.daysLeft < 0 ? ' is-late' : ''}">${esc(p.dueShort)}${p.daysLeft < 0 ? ' 逾期' : ''}</span>
                    <span class="task-quad-tag">${p.progress}%</span>
                    <span class="prio ${PRIO_CLASS[p.prio]}">${PRIO_LABEL[p.prio]}</span>
                    <span class="pill ${p.status === 'done' ? 'pill-done' : p.status === 'active' ? 'pill-doing' : 'pill-todo'}">${STATUS_LABEL[p.status]}</span>
                </div>
            </div>`).join('');

        /* 看板：卡片视图 10 项、表格 6 项、看板至少要有"进度 + 剩几天"。
           一栏里几张卡只有名字的话，比不出任何东西。 */
        document.getElementById('projBoard').innerHTML = ['planning', 'active', 'risk', 'done'].map((s) => {
            const items = list.filter((p) => p.status === s);
            return `<div class="kanban-col">
                <div class="kanban-title"><span>${STATUS_LABEL[s]}</span><span>${items.length}</span></div>
                ${items.map((p) => `<div class="kanban-card${s === 'done' ? ' is-done' : ''}" data-open-project="${p.id}" role="button" tabindex="0">
                    <div class="kanban-card-name">${esc(p.name)}</div>
                    <div class="kanban-card-meta">
                        <span class="progress-mini"><i style="width:${p.progress}%"></i></span>
                        <span>${p.progress}%</span>
                        <span class="sep">·</span>
                        <span class="${dueClass(p)}">${leftText(p)}</span>
                    </div>
                </div>`).join('')}
            </div>`;
        }).join('');
    }

    /** 截止临近（≤14 天且未完成）才高亮 —— 已完成的项目再"剩几天"没有意义 */
    function dueClass(p) {
        return (p.status !== 'done' && p.daysLeft >= 0 && p.daysLeft <= 14) ? 'text-danger' : '';
    }
    function leftText(p) {
        if (p.status === 'done') return '已完成';
        return p.daysLeft >= 0 ? '剩 ' + p.daysLeft + ' 天' : '逾期 ' + (-p.daysLeft) + ' 天';
    }

    /* ============================================================
       6. 详情态 · Hero + 分区栏 + 七个面板
       ============================================================ */
    function heroBadgeClass(st) { return STATUS_BADGE[st]; }

    function renderHero() {
        const p = curProject();
        document.getElementById('heroTag').textContent = PRIO_LABEL[p.prio];
        document.getElementById('heroName').textContent = p.name;
        const b = document.getElementById('heroStatus');
        b.className = 'badge ' + heroBadgeClass(p.status);
        b.textContent = STATUS_LABEL[p.status];
        document.getElementById('hpPct').textContent = p.progress + '%';
        document.getElementById('hpFill').style.width = p.progress + '%';
        document.getElementById('hdValue').textContent = p.dueShort;
        const u = document.getElementById('hdUrgent');
        u.textContent = leftText(p);
        u.classList.toggle('is-over', p.daysLeft < 0);
        document.getElementById('heroDesc').textContent = p.desc;
        document.getElementById('heroMeta').innerHTML = [
            '创建 ' + esc(p.start),
            '负责人 ' + esc(p.owners.join(' · ')),
            '里程碑 ' + esc(p.milestone),
            '仓库 ' + esc(p.repo),
        ].map((t) => '<span>' + t + '</span>').join('<span class="sep">·</span>');
    }

    /** 分区栏的计数与"更新点"都从同一份派生算 —— 不写死在标记里 */
    function tabCounts() {
        const p = curProject();
        const t = tasksOf(p);
        const c = {};
        c.tasks = t.filter((x) => x.status === 'done').length + '/' + t.length;
        c.bugs = String(bugsOf(p).length);
        c.docs = String(docsOf(p).length);
        c.ops = [serversOf(p).length, deployDocsOf(p).length, deploysOf(p).length].filter(Boolean).join('·');
        c.meetings = String(meetingsOf(p).length);
        c.accounts = String(accountsOf(p).length);
        return c;
    }
    /** 「更新点」= 这一格有未处理的项（不在 Bug 上就是待修复、不在任务上就是未完成） */
    function updatingKeys() {
        const p = curProject();
        const set = [];
        if (tasksOf(p).some((t) => t.status !== 'done')) set.push('tasks');
        if (bugsOf(p).some((b) => b.status !== 'fixed')) set.push('bugs');
        return set;
    }

    function renderTabs() {
        const cnt = tabCounts();
        const up = updatingKeys();
        document.getElementById('projTabs').innerHTML = activeSections().map((s) => {
            const isOn = s.key === activeSectionKey();
            return `<button type="button" role="tab" aria-selected="${isOn}"
                class="tab${isOn ? ' active' : ''}${up.indexOf(s.key) > -1 ? ' has-update' : ''}"
                data-proj-tab="${s.key}">
                ${esc(s.label)}${cnt[s.key] ? '<span class="tab-count">' + esc(cnt[s.key]) + '</span>' : ''}
                <span class="tab-dot"></span>
            </button>`;
        }).join('');
    }

    function renderOverview() {
        const p = curProject();
        const tasks = tasksOf(p).filter((t) => t.status !== 'done');
        const bugs = bugsOf(p);
        const docs = docsOf(p);
        const servers = serversOf(p);
        const deploys = deploysOf(p);
        const meetings = meetingsOf(p);
        const accounts = accountsOf(p);
        const has = (k) => activeSections().some((s) => s.key === k);
        const more = (k, label) => has(k) ? `<span class="card-more" data-proj-tab-link="${k}">${label} →</span>` : '';

        const head = (icon, title, count, k, label) => `
            <div class="card-head">
                <div class="card-head-left">
                    <div class="card-icon">${icon}</div>
                    <div class="card-title">${title}</div>
                    <span class="card-count">${esc(count)}</span>
                </div>
                ${more(k, label || '查看全部')}
            </div>`;

        const box = [];
        /* 五格的顺序按"打开这一页最常问的"排：先看我该做什么，再看东西在哪、怎么跑起来的 */
        box.push(`<div class="card">
            ${head('✅', '任务', tasksOf(p).filter((t) => t.status === 'done').length + ' / ' + tasksOf(p).length, 'tasks')}
            <div>${tasks.slice(0, 3).map(taskItemHtml).join('') || '<div class="q-empty">没有未完成任务</div>'}</div>
        </div>`);

        box.push(`<div class="card">
            ${head('🐛', 'Bug', bugs.length + ' 条 · ' + bugs.filter((b) => b.status !== 'fixed').length + ' 待处理', 'bugs')}
            <div class="bug-grid" style="grid-template-columns:1fr">${bugs.slice(0, 2).map(bugCardHtml).join('')}</div>
        </div>`);

        box.push(`<div class="card">
            ${head('📄', '文档', docs.length, 'docs')}
            <div class="doc-books">${docs.slice(0, 3).map(docBookHtml).join('')}</div>
        </div>`);

        if (servers.length) {
            box.push(`<div class="card">
                ${head('🚀', '运维', servers.length + ' 服务器 · ' + deploysOf(p).length + ' 记录', 'ops')}
                <div class="server-list" style="margin-bottom:10px">${servers.slice(0, 1).map(serverRowHtml).join('')}</div>
                <div class="deploy-timeline">${deploys.slice(0, 2).map(deployRowHtml).join('')}</div>
            </div>`);
        }

        box.push(`<div class="card">
            ${head('📅', '会议', meetings.length, 'meetings')}
            <div class="meeting-grid" style="grid-template-columns:1fr">${meetings.slice(0, 1).map(meetingCardHtml).join('')}</div>
        </div>`);

        if (accounts.length) {
            box.push(`<div class="card">
                ${head('🔑', '账户', accounts.length + ' · ' + new Set(accounts.map((a) => a.platform)).size + ' 平台', 'accounts')}
                <div class="account-grid" style="grid-template-columns:1fr">${accounts.slice(0, 1).map(accountCardHtml).join('')}</div>
            </div>`);
        }

        document.getElementById('ovGrid').innerHTML = box.join('');
    }

    /* ---------- 七格里反复出现的那几个零件 ---------- */
    function taskItemHtml(t) {
        const disp = t.status === 'blocked' ? 'doing' : t.status;
        const done = disp === 'done';
        return `<div class="task-item">
            <div class="task-check${done ? ' done' : ''}" data-task-toggle="${t.id}"
                 role="checkbox" aria-checked="${done}" tabindex="0"
                 title="${done ? '已完成' : t.status === 'blocked' ? '阻塞中' : '进行中'}">${done ? '✓' : t.status === 'blocked' ? '!' : t.status === 'doing' ? '•' : ''}</div>
            <div class="task-text${done ? ' done' : ''}">${esc(t.title)}</div>
            ${done ? '' : '<span class="task-due-inline' + (t.late ? ' is-late' : '') + '">' + esc(t.late ? '已逾期' : t.due) + '</span>'}
            <span class="prio ${PRIO_CLASS[t.prio]}">${PRIO_LABEL[t.prio]}</span>
        </div>`;
    }

    function bugCardHtml(b) {
        const lv = BUG_LEVEL.find((x) => x[0] === b.level);
        return `<div class="bug-card" style="--bc:${lv[2]}" data-demo="Bug：${esc(b.title)}">
            <div class="bug-head"><span class="bug-level">${lv[1]}</span><span class="bug-status">${BUG_STATUS_LABEL[b.status]}</span></div>
            <div class="bug-title">${esc(b.title)}</div>
            <div class="bug-meta"><span>${esc(b.version)}</span><span>·</span><span>${esc(b.when)}</span><span class="bug-assignee">${esc(b.who.slice(0, 1))}</span></div>
        </div>`;
    }

    function docBookHtml(d) {
        return `<div class="doc-book k-${d.kind}" data-doc-open="${d.id}" role="button" tabindex="0">
            <span class="db-tag">${DOC_KIND_LABEL[d.kind]}</span>
            <div class="db-title">${esc(d.name)}</div>
            <div class="db-meta">${esc(d.updatedAt)}</div>
        </div>`;
    }

    function serverRowHtml(s) {
        return `<div class="server-row" data-demo="服务器 ${esc(s.name)}">
            <div class="server-rack ${s.env}"></div>
            <div class="server-info">
                <div class="server-name">${esc(s.name)}</div>
                <div class="server-meta">${s.spec} · ${esc(s.os)} · ${s.on ? '运行中' : '已停止'}</div>
            </div>
            <span class="server-status ${s.on ? 'on' : 'off'}">${s.on ? '运行中' : '已停止'}</span>
        </div>`;
    }

    function deployRowHtml(d) {
        const ok = d.result === 'success';
        return `<div class="deploy-row" data-demo="发布 ${esc(d.version)}">
            <div class="deploy-dot" style="--dc:${ok ? 'var(--ok)' : 'var(--warn)'}"></div>
            <div class="deploy-info">
                <div class="deploy-ver">${esc(d.version)}
                    <span class="deploy-badge ${ok ? 'success' : 'rollback'}">${ok ? '成功' : '回滚'}</span></div>
                <div class="deploy-meta"><span>${esc(d.when)}</span><span class="sep">·</span><span>${esc(d.server)}</span><span class="sep">·</span><span>${esc(d.who)}</span>${d.duration ? '<span class="deploy-duration">' + esc(d.duration) + '</span>' : ''}</div>
            </div>
        </div>`;
    }

    function meetingCardHtml(m) {
        return `<div class="meeting-card" data-demo="会议 ${esc(m.title)}">
            <div class="meeting-date">
                <div class="meeting-month">${esc(m.month)}</div>
                <div class="meeting-day">${esc(m.day)}</div>
                <div class="meeting-time">${esc(m.time)}</div>
            </div>
            <div class="meeting-info">
                <div class="meeting-title">${esc(m.title)}</div>
                <div class="meeting-meta">${esc(m.meta)}</div>
                <div class="meeting-attendees">${m.attendees.map((a) => '<span class="avatar">' + esc(a.slice(0, 1)) + '</span>').join('')}${m.more > 0 ? '<span class="more">+' + m.more + '</span>' : ''}</div>
            </div>
        </div>`;
    }

    function accountCardHtml(a) {
        return `<div class="account-card">
            <div class="account-key">🔑</div>
            <div class="account-info">
                <div class="account-platform">${esc(a.platform)}<span class="account-env ${a.env}">${ACCOUNT_ENV_LABEL[a.env]}</span></div>
                <div class="account-user">${esc(a.user)}</div>
                <div class="account-pwd">🔒 密码已加密</div>
            </div>
            <button class="account-copy" title="复制账号" data-demo="复制账号（只复制用户名，密码不在这里）">📋</button>
            ${a.expire ? '<span class="account-expire' + (a.warn ? ' warn' : '') + '">' + esc(a.expire) + '</span>' : ''}
        </div>`;
    }

    /* ---------- 任务 / Bug / 运维 / 会议 / 账户 五个面板 ---------- */
    function renderTasks() {
        const p = curProject();
        const tasks = tasksOf(p);
        const doing = tasks.filter((t) => t.status !== 'done');
        const done = tasks.filter((t) => t.status === 'done');
        const late = tasks.filter((t) => t.late).length;
        document.getElementById('taskSummary').textContent =
            tasks.length + ' 项 · 未完成 ' + doing.length + ' · 逾期 ' + late;

        document.getElementById('taskListBody').innerHTML = `
            <div class="task-group-title is-doing">进行中<span class="tg-count">${doing.length}</span></div>
            ${doing.map(taskItemHtml).join('') || '<div class="q-empty">没有进行中的任务</div>'}
            <div class="task-group-title is-done" style="margin-top:12px">已完成<span class="tg-count">${done.length}</span></div>
            ${done.map(taskItemHtml).join('')}`;

        document.getElementById('kanban').innerHTML = [['todo', '待办', 'pill-todo'], ['doing', '进行中', 'pill-doing'], ['done', '已完成', 'pill-done']]
            .map(([k, label]) => {
                const items = tasks.filter((t) => (t.status === 'blocked' ? 'doing' : t.status) === k);
                return `<div class="kanban-col">
                    <div class="kanban-title"><span>${label}</span><span>${items.length}</span></div>
                    ${items.map((t) => `<div class="kanban-card${k === 'done' ? ' is-done' : ''}">${esc(t.title)}</div>`).join('')}
                </div>`;
            }).join('');

        document.querySelectorAll('.quad').forEach((el) => {
            const key = el.dataset.quad;
            const items = tasks.filter((t) => quadOf(t) === key);
            const meta = { q1: ['重要且紧急', '现在就做'], q2: ['重要不紧急', '排期做'], q3: ['紧急不重要', '尽快甩出去'], q4: ['不重要不紧急', '先放着'] }[key];
            el.innerHTML = `<div class="quad-head">
                    <span class="quad-name">${meta[0]}</span>
                    <span class="quad-hint">${meta[1]}</span>
                    <span class="quad-count">${items.length}</span>
                </div>
                ${items.slice(0, 4).map((t) => `<div class="q-task${t.status === 'done' ? ' is-done' : ''}" data-task-toggle-row="${t.id}">
                        <span class="q-task-title">${esc(t.title)}</span>
                        <span class="q-task-due">${esc(t.late ? '已逾期' : t.due)}</span>
                    </div>`).join('') || '<div class="q-empty">这一格是空的</div>'}`;
        });
    }

    function renderBugs() {
        const bugs = bugsOf(curProject());
        document.getElementById('bugCount').textContent = bugs.filter((b) => b.status !== 'fixed').length + ' 个待处理';
        document.getElementById('bugGrid').innerHTML = bugs.map(bugCardHtml).join('');
    }

    function renderDocsPanel() {
        const docs = docsOf(curProject());
        document.getElementById('docCount').textContent = docs.length + ' 篇';
        document.getElementById('docIndex').innerHTML = docs.map((d) => `
            <div class="doc-item" data-doc-open="${d.id}" role="button" tabindex="0">
                <div class="doc-icon">${DOC_KIND_LABEL[d.kind].slice(0, 1)}</div>
                <div class="doc-info">
                    <div class="doc-name">${esc(d.name)}</div>
                    <div class="doc-meta">${DOC_KIND_LABEL[d.kind]} · ${esc(d.source)} · ${esc(d.updatedAt)} · ${esc(d.author)}</div>
                </div>
                <div class="doc-arrow">›</div>
            </div>`).join('');
    }

    function renderOps() {
        const p = curProject();
        const servers = serversOf(p);
        const dd = deployDocsOf(p);
        const dp = deploysOf(p);
        document.getElementById('serverCount').textContent = servers.length + ' 台 · 告警 ' + servers.filter((s) => s.alert).length;
        document.getElementById('serverList').innerHTML = servers.map(serverRowHtml).join('');
        document.getElementById('deployDocs').innerHTML = dd.map((d) => `
            <div class="doc-book${d.script ? ' script' : ''}" data-demo="部署文档 ${esc(d.name)}" role="button" tabindex="0">
                <span class="db-tag">${esc(d.kind)}</span>
                <div class="db-title">${esc(d.name)}</div>
                <div class="db-meta">${esc(d.version)} · ${esc(d.updatedAt)}</div>
            </div>`).join('');
        document.getElementById('deployCount').textContent = dp.length + ' 次 · ' + dp.filter((x) => x.result === 'rollback').length + ' 次回滚';
        document.getElementById('deployList').innerHTML = dp.map(deployRowHtml).join('');
    }

    function renderMeetings() {
        const ms = meetingsOf(curProject());
        document.getElementById('meetingCount').textContent = ms.length + ' 场';
        document.getElementById('meetingGrid').innerHTML = ms.map(meetingCardHtml).join('');
    }

    function renderAccounts() {
        const as = accountsOf(curProject());
        document.getElementById('accountCount').textContent = as.length + ' 个 · ' + new Set(as.map((a) => a.platform)).size + ' 平台';
        document.getElementById('accountGrid').innerHTML = as.map(accountCardHtml).join('');
    }

    /** 渲染详情态里**没有**从数据裁掉的那几格 */
    function renderDetail() {
        renderHero();
        renderTabs();
        renderOverview();
        renderTasks();
        renderBugs();
        renderDocsPanel();
        renderOps();
        renderMeetings();
        renderAccounts();
        /* 从数据裁掉的分区整块不渲染（paging / accounts 在生活、学习项目下不存在） */
        activeSections().forEach((s) => {
            const el = document.querySelector('#viewDetail .panel[data-panel="' + s.key + '"]');
            if (el) el.hidden = false;
        });
        SECTIONS.forEach((s) => {
            if (activeSections().indexOf(s) > -1) return;
            const el = document.querySelector('#viewDetail .panel[data-panel="' + s.key + '"]');
            if (el) el.hidden = true;
        });
    }

    /* ============================================================
       7. 两态切换与分区切换
       ============================================================ */
    /** 当前详情态的分区 key */
    function activeSectionKey() {
        const list = activeSections();
        return (list[currentItemIdx] || list[0] || {}).key || '';
    }

    function showList() {
        viewMode = 'list';
        document.getElementById('viewList').hidden = false;
        document.getElementById('viewDetail').hidden = true;
        currentProjectId = null;
        renderList();
        renderRing(false);      // 列表态环是空的（域根没有可寻址的下级）
    }

    function showDetail(id) {
        viewMode = 'detail';
        currentProjectId = id;
        document.getElementById('viewList').hidden = true;
        document.getElementById('viewDetail').hidden = false;
        /* 记一笔"最近"。去重按项目，同一个项目反复进只保留最新一条。 */
        const p = curProject();
        const at = VISITED.findIndex((x) => x.id === p.id);
        if (at > -1) VISITED.splice(at, 1);
        VISITED.unshift(p);
        if (VISITED.length > 4) VISITED.pop();
        renderDetail();
        /* 进项目一律落在第一个分区，别让"高亮"和"内容"错开一格 */
        currentItemIdx = 0;
        activateTab(activeSections()[0].key);
    }

    /* ⚠️ 内容 → 导航的唯一同步点。圆盘 / 图标列 / 分区栏 / 命令面板最后都汇到这里。 */
    function activateTab(key) {
        const list = activeSections();
        const idx = list.findIndex((s) => s.key === key);
        if (idx < 0) return;                     // 未知 key 只当没看见（数据裁掉了那一格）
        currentItemIdx = idx;
        /* 分区与面板一起换 */
        document.querySelectorAll('#viewDetail .panel').forEach((p) => {
            p.classList.toggle('active', p.dataset.panel === key);
        });
        /* 离开文档分区时把主从状态复位，回来时才是索引页 */
        if (key !== 'docs' && openDocId) {
            openDocId = null;
            document.querySelectorAll('[data-doc-screen]').forEach((s) => s.classList.toggle('active', s.dataset.docScreen === 'index'));
        }
        renderTabs();
        syncRingTo(key);
    }

    /* ============================================================
       8. 文档主从
       ============================================================ */
    function docDetailHtml(d) {
        const p = curProject();
        const related = tasksOf(p).slice(0, 4);
        return `<section class="card">
            <div class="doc-head">
                <div class="doc-head-icon">${DOC_KIND_LABEL[d.kind].slice(0, 1)}</div>
                <div class="doc-head-main">
                    <div class="doc-head-title">${esc(d.name)}</div>
                    <div class="doc-head-meta">
                        <span class="badge badge-neutral">${DOC_KIND_LABEL[d.kind]}</span>
                        <span>${esc(d.source)}</span>
                        <span>·</span>
                        <span>更新 ${esc(d.updatedAt)}</span>
                        <span>·</span>
                        <span>${esc(d.author)}</span>
                    </div>
                </div>
                <div class="doc-head-actions">
                    <button class="btn btn-ghost" data-demo="在来源工具里打开">打开原文</button>
                </div>
            </div>
            <div class="prose" style="margin-top:18px">
                <h4>这份文档是什么</h4>
                <p>${esc(d.summary)}正文留在原工具里维护，这里只存索引与链接 —— 两份正文迟早会各自漂移。</p>
                <h4>与这个项目的关系</h4>
                <ul>${related.map((t) => '<li>' + esc(t.title) + '（' + esc(t.due) + '）</li>').join('')}</ul>
            </div>
            <div class="callout" style="margin-top:16px">
                <span class="callout-dot"></span>
                <span>索引与链接型文档：这里不复制正文，改动只发生在来源工具里。</span>
            </div>
        </section>
        <section class="card">
            <div class="card-head"><div class="card-head-left"><div class="card-icon">↩</div><div class="card-title">关联任务</div>
            <span class="card-count">${related.length} 项</span></div></div>
            ${related.map(taskItemHtml).join('')}
        </section>`;
    }

    function openDoc(id) {
        const d = docsOf(curProject()).find((x) => x.id === id);
        if (!d) return;
        openDocId = id;
        document.getElementById('docDetail').innerHTML = docDetailHtml(d);
        document.querySelectorAll('[data-doc-screen]').forEach((s) => s.classList.toggle('active', s.dataset.docScreen === 'detail'));
    }
    function backToDocIndex() {
        openDocId = null;
        document.querySelectorAll('[data-doc-screen]').forEach((s) => s.classList.toggle('active', s.dataset.docScreen === 'index'));
    }

    /* ============================================================
       9. 勾选与视图切换
       ============================================================ */
    function setTaskView(key) {
        taskView = key;
        document.querySelectorAll('[data-task-view]').forEach((b) => b.classList.toggle('active', b.dataset.taskView === key));
        document.querySelectorAll('[data-task-panel]').forEach((v) => v.classList.toggle('active', v.dataset.taskPanel === key));
    }

    /** 勾选写在 DOM 上不是写回数据：原型没有写接口，改数据会假装"存下来了"。 */
    function toggleTask(id) {
        const el = document.querySelector('[data-task-toggle="' + id + '"]');
        if (!el) return;
        const nowDone = !el.classList.contains('done');
        el.classList.toggle('done', nowDone);
        el.setAttribute('aria-checked', String(nowDone));
        el.textContent = nowDone ? '✓' : '';
        const row = el.closest('.task-item');
        if (row) {
            const text = row.querySelector('.task-text');
            if (text) text.classList.toggle('done', nowDone);
        }
        toast(nowDone ? '原型演示：标记为完成' : '原型演示：重置为未完成');
    }

    /* ============================================================
       10. 事件：统一委托，重渲染后无需重新绑定
       ============================================================ */
    document.addEventListener('click', (e) => {
        const hit = (sel) => e.target.closest(sel);

        /* 分区栏 / 卡片里的"查看全部 →" */
        const tabLink = hit('[data-proj-tab-link]');
        if (tabLink) { activateTab(tabLink.dataset.projTabLink); return; }
        const tabBtn = hit('[data-proj-tab]');
        if (tabBtn) { activateTab(tabBtn.dataset.projTab); return; }
        const gotoTab = hit('[data-goto-tab]');
        if (gotoTab) { activateTab(gotoTab.dataset.gotoTab); return; }
        const gotoView = hit('[data-goto-task-view]');
        if (gotoView) { activateTab('tasks'); setTaskView(gotoView.dataset.gotoTaskView); return; }

        /* 列表态：KPI 即筛选 / 视图切换 / 打开项目 */
        const kpi = hit('[data-kpi]');
        if (kpi) {
            const k = kpi.dataset.kpi;
            projKpiFilter = projKpiFilter === k ? '' : k;
            renderList();
            return;
        }
        const pv = hit('[data-proj-view]');
        if (pv) {
            projView = pv.dataset.projView;
            document.querySelectorAll('[data-proj-view]').forEach((b) => b.classList.toggle('active', b.dataset.projView === projView));
            document.querySelectorAll('[data-proj-panel]').forEach((v) => v.classList.toggle('active', v.dataset.projPanel === projView));
            return;
        }
        const openP = hit('[data-open-project]');
        if (openP) { showDetail(openP.dataset.openProject); return; }

        /* 任务：视图 / 勾选 */
        const seg = hit('[data-task-view]');
        if (seg) { setTaskView(seg.dataset.taskView); return; }
        const check = hit('[data-task-toggle]');
        if (check) { toggleTask(check.dataset.taskToggle); return; }
        const qrow = hit('[data-task-toggle-row]');
        if (qrow && !hit('[data-task-toggle]')) { toggleTask(qrow.dataset.taskToggleRow); return; }

        /* 文档主从 */
        const openDocEl = hit('[data-doc-open]');
        if (openDocEl) { openDoc(openDocEl.dataset.docOpen); return; }
        if (hit('[data-doc-back]')) { backToDocIndex(); return; }

        /* 原型占位动作：一律诚实回一句"没接"，不假装成功 */
        const demo = hit('[data-demo]');
        if (demo) { toast('原型演示：' + demo.dataset.demo); return; }
    });

    /* 点顶栏「项目」胶囊 = 回域根。
       React 里的回头路就是它 —— 详情页没有独立的返回键（环被项目分区占满了）。
       ⚠️ 必须走**捕获阶段**：navPrimary 是直接绑在胶囊上的，冒泡阶段拦不住它。 */
    document.addEventListener('click', (e) => {
        const pill = e.target.closest('.nav-p-item');
        if (!pill || pill.dataset.module !== CURRENT_MODULE) return;
        if (viewMode !== 'detail') return;
        e.stopPropagation();
        showList();
    }, true);

    /* Hero 那一排控件各自绑定：右侧整块 stopPropagation，
       所以 ⤵ 这几个不能被 document 上的委托接手 —— 否则和"点整条收起"抢。 */
    document.getElementById('heroBar').addEventListener('click', toggleHero);
    /* 右侧整块自成一区：每个控件都有自己的动作，点它们不该顺手把 Hero 收起来。
       也正因为拦在这里，里面的 [data-demo]（编辑）要自己接一手 —— 文档上的委托收不到它。 */
    document.getElementById('heroBarRight').addEventListener('click', (e) => {
        e.stopPropagation();
        const demo = e.target.closest('[data-demo]');
        if (demo) toast('原型演示：' + demo.dataset.demo);
    });
    document.getElementById('foldToggle').addEventListener('click', (e) => { e.stopPropagation(); toggleHero(); });
    document.getElementById('heroProgress').addEventListener('click', (e) => {
        e.stopPropagation();
        toast('原型演示：调整进度（应用里还没有写接口）');
    });
    /* 它是一个 role=button 的 div，键盘可得 → Enter / Space 也要能按 */
    document.getElementById('heroProgress').addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        e.stopPropagation();
        toast('原型演示：调整进度（应用里还没有写接口）');
    });
    document.getElementById('moreBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const dd = document.getElementById('moreDropdown');
        const open = !dd.classList.contains('open');
        dd.classList.toggle('open', open);
        document.getElementById('moreBtn').setAttribute('aria-expanded', String(open));
    });
    document.getElementById('moreDropdown').addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.target.closest('[data-back-list]')) { closeMore(); showList(); return; }
        const demo = e.target.closest('[data-demo]');
        if (demo) { closeMore(); toast('原型演示：' + demo.dataset.demo); }
    });
    /* 点别处收起 ⋯ 菜单 */
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#moreMenu')) closeMore();
    });

    function toggleHero() {
        const card = document.getElementById('heroCard');
        const open = !card.classList.contains('open');
        card.classList.toggle('open', open);
        document.getElementById('foldToggle').setAttribute('aria-expanded', String(open));
        document.getElementById('foldToggle').title = open ? '收起' : '展开';
    }
    function closeMore() {
        const dd = document.getElementById('moreDropdown');
        if (!dd) return;
        dd.classList.remove('open');
        document.getElementById('moreBtn').setAttribute('aria-expanded', 'false');
    }

    /* 列表态的三个筛选控件 */
    document.getElementById('projQuery').addEventListener('input', (e) => { projQuery = e.target.value; renderList(); });
    document.getElementById('projScope').addEventListener('change', (e) => { projScope = e.target.value; renderList(); });
    document.getElementById('projSort').addEventListener('change', (e) => { projSort = e.target.value; renderList(); });
    document.getElementById('newProjectBtn').addEventListener('click', () => toast('原型演示：新建项目（应用里还没有写接口）'));

    /* 勾选框 / 卡片支持键盘（它们是 tabindex=0 的 role=checkbox / role=button） */
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const t = e.target;
        const check = t.closest('[data-task-toggle]');
        if (check) { e.preventDefault(); toggleTask(check.dataset.taskToggle); return; }
        const kpi = t.closest('[data-kpi]');
        if (kpi) { e.preventDefault(); kpi.click(); return; }
        const openP = t.closest('[data-open-project]');
        if (openP) { e.preventDefault(); showDetail(openP.dataset.openProject); return; }
        const openDocEl = t.closest('[data-doc-open]');
        if (openDocEl) { e.preventDefault(); openDoc(openDocEl.dataset.docOpen); return; }
    });

    /* 快捷键：详情态按 1..7 切分区（无修饰键、且焦点不在输入控件里） */
    document.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = (e.target.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (viewMode !== 'detail') return;
        const n = parseInt(e.key, 10);
        const list = activeSections();
        if (n >= 1 && n <= list.length) activateTab(list[n - 1].key);
    });

    /* ============================================================
       内容区的入口
       列表态是**域的入口**，所以先渲它；详情态的数据按需算 ——
       不预先摊开 8 个项目的全部派生量。
       （真正的"首屏"在导航壳那一侧，见文件末尾的「9. 首屏」。）
       ============================================================ */
    function renderContent() {
        renderList();
    }
    /* ============================================================
       10. 导航壳（v5）
       与内容区只有一条契约：**分区的 key 就是 .panel[data-panel] 的值**。
       圆盘 / 图标列 / 超级菜单 / 命令面板 / 面包屑都是这一份数据的呈现，
       所以任何入口最终都汇到 activateTab()，由它一处同步面板与导航。
       ============================================================ */

    /* 本原型只有「项目」模块有内容承载。其余 8 个模块**保留导航与二级清单**
       （超级菜单里是有内容的），但点击时只给提示：
       不改 active、不换色、不重建环 —— 否则顶栏会指着一个内容区不存在的模块。 */
    const CURRENT_MODULE = 'projects';

    /* 7 个分区。key 必须等于 .panel[data-panel] 的值。
       三个字段各去一个地方，别混：
         count → 圆盘悬停名称条（"任务 · 26 未完成"）——圆盘上只有图标，
                 它是"值不值得点"的唯一线索，但侧栏只有 240px，**必须短**；
         meta  → 侧栏副标题 + 收起态图标列的悬停提示（那里浮在侧栏之外，放得下全称）；
         desc  → 命令面板里的说明（列表态的位置由页头说，详情态不再放第二个项目名）。
       visible → **分区可见性由数据裁，不由 scope 白名单裁**：
                 `servers` / `accounts` 只有 work 域非空，派生出 0 条就隐藏那一格。
                 写成一张 scope 白名单就是第二份事实源，池子改了它不知道，
                 而且两边都不报错 —— 症状是"这一格有内容却点不开"。
       四个字段都是函数而不是字符串：勾掉一条任务之后，这些读数要跟着变。 */
    const SECTIONS = [
        { key: 'overview', label: '总览', icon: 'grid',
          count: () => curTasks().length + ' 项',
          meta: () => `${curTasks().length} 项任务 · ${curBugs().length} 个 Bug`,
          desc: '其余各格的前几条汇总，本身不引新数据。' },
        { key: 'tasks', label: '任务', icon: 'list',
          count: () => curTasks().filter((t) => t.status !== 'done').length + ' 未完成',
          meta: () => `${curTasks().filter((t) => t.status !== 'done').length} 项未完成 · ${curTasks().filter((t) => t.late).length} 项逾期`,
          desc: '列表 / 看板 / 四象限三个视图共用同一份任务数据。' },
        { key: 'bugs', label: 'Bug', icon: 'alert',
          count: () => curBugs().length + ' 条',
          meta: () => `${curBugs().length} 条 · ${curBugs().filter((b) => b.status !== 'fixed').length} 条待处理`,
          desc: '问题清单：级别、状态、落在哪一版上。' },
        { key: 'docs', label: '文档', icon: 'file',
          count: () => curDocs().length + ' 篇',
          meta: () => `${curDocs().length} 篇 · 索引与外部链接`,
          desc: '只存索引与链接，正文留在原工具里。' },
        { key: 'ops', label: '运维', icon: 'database',
          count: () => curServers().length + ' 台',
          meta: () => `${curServers().length} 服务器 · ${curDeploys().length} 条发布记录`,
          desc: '服务器负载、部署文档与发布记录。',
          visible: () => curPool().servers.length > 0 },
        { key: 'meetings', label: '会议', icon: 'calendar',
          count: () => curMeetings().length + ' 场',
          meta: () => `${curMeetings().length} 场会议`,
          desc: '这个项目开过的会。' },
        { key: 'accounts', label: '账户', icon: 'shield',
          count: () => curAccounts().length + ' 个',
          meta: () => `${curAccounts().length} 个账号 · ${new Set(curAccounts().map((a) => a.platform)).size} 平台`,
