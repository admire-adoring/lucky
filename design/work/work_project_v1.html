<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作模块 · 项目页 · 个人系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-page: #F7F8FA;
            --bg-card: rgba(255,255,255,0.62);
            --bg-sidebar: rgba(255,255,255,0.72);
            --bg-topbar: rgba(255,255,255,0.72);
            --border-card: rgba(255,255,255,0.7);
            --border-subtle: rgba(15,23,42,0.07);
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --shadow-card: 0 4px 24px rgba(15,23,42,0.05);
            --shadow-card-hover: 0 8px 32px rgba(15,23,42,0.10);
            --blur-card: blur(24px) saturate(180%);
            --blob-opacity: 0.38;
            --blob-blur: 120px;

            --a-work-1: #FDA4AF; --a-work-2: #FECDD3; --a-work-3: #FBCFE8;
            --s-work: #E11D48;

            --m1: var(--a-work-1);
            --m2: var(--a-work-2);
            --m3: var(--a-work-3);
            --m-main: var(--s-work);
        }

        .dark {
            --bg-page: #0A0F1C;
            --bg-card: rgba(30,41,59,0.5);
            --bg-sidebar: rgba(15,23,42,0.78);
            --bg-topbar: rgba(15,23,42,0.78);
            --border-card: rgba(255,255,255,0.08);
            --border-subtle: rgba(255,255,255,0.06);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-card-hover: 0 8px 32px rgba(0,0,0,0.4);
            --blur-card: blur(28px) saturate(160%);
            --blob-opacity: 0.24;
            --blob-blur: 140px;

            --a-work-1: #BE123C; --a-work-2: #9F1239; --a-work-3: #881337;
            --s-work: #FB7185;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-primary);
            background: var(--bg-page);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .aurora-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .blob {
            position: absolute; border-radius: 50%;
            filter: blur(var(--blob-blur));
            opacity: var(--blob-opacity);
            transition: opacity 0.5s ease, filter 0.5s ease, background 0.5s ease;
            animation: drift 22s ease-in-out infinite alternate;
        }
        .blob-1 { width: 520px; height: 520px; top: -8%;  left: -8%;  background: var(--m1); }
        .blob-2 { width: 480px; height: 480px; top: 24%;  right: -10%; background: var(--m2); animation-delay: -7s; }
        .blob-3 { width: 560px; height: 560px; bottom: -16%; left: 30%; background: var(--m3); animation-delay: -14s; }

        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(36px,-28px) scale(1.08); }
        }
        @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

        .app {
            position: relative; z-index: 1;
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 56px 1fr;
            grid-template-areas: "sidebar topbar" "sidebar main";
            height: 100vh;
        }

        .sidebar {
            grid-area: sidebar;
            background: var(--bg-sidebar);
            backdrop-filter: var(--blur-card);
            -webkit-backdrop-filter: var(--blur-card);
            border-right: 1px solid var(--border-subtle);
            padding: 16px 12px;
            display: flex; flex-direction: column; gap: 2px;
            overflow-y: auto;
        }
        .sidebar-title {
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-muted);
            padding: 14px 12px 6px;
        }
        .menu-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 10px;
            font-size: 14px; color: var(--text-secondary);
            cursor: pointer; border-left: 3px solid transparent;
            transition: all 0.18s ease; user-select: none;
        }
        .menu-item:hover { background: var(--border-subtle); color: var(--text-primary); }
        .menu-item.active {
            background: color-mix(in srgb, var(--m-main) 12%, transparent);
            color: var(--m-main);
            border-left-color: var(--m-main);
            font-weight: 600;
        }
        .menu-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--m-main); flex-shrink: 0; }

        .topbar {
            grid-area: topbar;
            background: var(--bg-topbar);
            backdrop-filter: var(--blur-card);
            -webkit-backdrop-filter: var(--blur-card);
            border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; gap: 16px;
        }
        .breadcrumb { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .breadcrumb strong { color: var(--text-primary); font-weight: 600; }
        .topbar-actions { display: flex; align-items: center; gap: 10px; }

        .btn {
            border: none; border-radius: 10px;
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.18s ease;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary {
            background: var(--m-main); color: #fff;
            box-shadow: 0 4px 14px color-mix(in srgb, var(--m-main) 30%, transparent);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px color-mix(in srgb, var(--m-main) 45%, transparent);
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }
        .btn-ghost:hover { border-color: var(--m-main); color: var(--m-main); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .theme-toggle {
            width: 38px; height: 38px; border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s ease;
        }
        .theme-toggle:hover { transform: scale(1.05); border-color: var(--m-main); }

        .main {
            grid-area: main;
            padding: 24px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: var(--blur-card);
            -webkit-backdrop-filter: var(--blur-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            padding: 20px;
            transition: all 0.25s ease;
        }
        .card:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-2px); }
        .card-title {
            font-size: 12px; font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.06em;
        }

        /* ============================================================
           项目书架 —— 本页核心样式
           ============================================================ */

        .bookshelf-wrap {
            background: var(--bg-card);
            backdrop-filter: var(--blur-card);
            -webkit-backdrop-filter: var(--blur-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            padding: 24px;
        }
        .bookshelf-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px;
        }
        .shelf-group { margin-bottom: 26px; }
        .shelf-group:last-child { margin-bottom: 0; }
        .shelf-group-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.1em;
            margin-bottom: 14px;
        }
        .shelf-group-title::after {
            content: ""; flex: 1;
            height: 1px; background: var(--border-subtle);
        }
        .shelf-count {
            font-size: 10px; color: var(--text-muted);
            font-weight: 500; letter-spacing: 0;
            text-transform: none;
        }
        .grid-shelf {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
        }

        /* 精装书封面 */
        .book-flat {
            position: relative;
            aspect-ratio: 5 / 7;
            border-radius: 3px 7px 7px 3px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
            transform-origin: center bottom;
            user-select: none;
            box-shadow:
                    0 1px 0 rgba(0,0,0,0.08),
                    0 2px 0 rgba(0,0,0,0.06),
                    0 3px 0 rgba(0,0,0,0.05),
                    0 4px 10px rgba(15,23,42,0.18);
        }
        .book-flat::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                    repeating-linear-gradient(45deg,
                    rgba(255,255,255,0.035) 0px,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px,
                    transparent 3px);
            pointer-events: none;
            z-index: 3;
            border-radius: inherit;
        }
        .book-flat:hover {
            transform: translateY(-6px) rotate(-1.2deg) scale(1.015);
            box-shadow:
                    0 1px 0 rgba(0,0,0,0.1),
                    0 2px 0 rgba(0,0,0,0.08),
                    0 4px 0 rgba(0,0,0,0.06),
                    0 6px 0 rgba(0,0,0,0.05),
                    0 20px 40px rgba(15,23,42,0.25);
        }
        .dark .book-flat:hover {
            box-shadow:
                    0 1px 0 rgba(0,0,0,0.3),
                    0 2px 0 rgba(0,0,0,0.25),
                    0 4px 0 rgba(0,0,0,0.2),
                    0 6px 0 rgba(0,0,0,0.15),
                    0 20px 40px rgba(0,0,0,0.65);
        }
        .book-flat.archived {
            filter: saturate(0.5) brightness(0.9);
            opacity: 0.85;
        }
        .book-flat.archived:hover {
            filter: saturate(0.75) brightness(1);
            opacity: 1;
        }

        .bf-cover {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            color: #fff;
            overflow: hidden;
        }

        .bf-spine {
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 14px;
            background: linear-gradient(90deg,
            rgba(0,0,0,0.42) 0%,
            rgba(0,0,0,0.22) 40%,
            rgba(0,0,0,0.06) 70%,
            transparent 100%);
            z-index: 2;
        }
        .bf-spine::after {
            content: "";
            position: absolute;
            left: 3px; top: 8%; bottom: 8%;
            width: 1px;
            background: linear-gradient(180deg,
            transparent 0%,
            rgba(255,255,255,0.35) 25%,
            rgba(255,255,255,0.35) 75%,
            transparent 100%);
        }
        .bf-flap {
            position: absolute;
            top: 0; bottom: 0; left: 14px;
            width: 3px;
            background: linear-gradient(90deg,
            rgba(0,0,0,0.18) 0%,
            rgba(255,255,255,0.12) 50%,
            transparent 100%);
            z-index: 2;
            pointer-events: none;
        }
        .bf-flap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
            rgba(255,255,255,0.15) 0%,
            transparent 100%);
            box-shadow: inset 1px 0 0 rgba(255,255,255,0.25);
        }

        .bf-frame {
            position: absolute;
            inset: 14px 12px 14px 22px;
            padding: 12px 12px 10px;
            display: flex; flex-direction: column;
            z-index: 4;
        }
        .bf-frame.frame-core { border: 1px solid rgba(255,255,255,0.28); }
        .bf-frame.frame-core::before {
            content: "";
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(255,255,255,0.14);
            pointer-events: none;
        }
        .bf-frame.frame-fe { border: 1.5px dashed rgba(255,255,255,0.25); }
        .bf-frame.frame-bi { border: 1px solid rgba(255,255,255,0.22); }
        .bf-frame.frame-perf { border: 1px solid rgba(255,255,255,0.15); }

        .bf-tag-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: auto;
        }
        .bf-tag {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.16em;
            color: rgba(255,255,255,0.88);
            padding: 2px 6px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 2px;
            text-transform: uppercase;
        }
        .bf-icon {
            font-size: 18px;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .bf-title-block {
            margin-bottom: auto;
            padding-top: 6px;
        }
        .bf-title {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 0.03em;
            margin-bottom: 8px;
            color: #F5E8D0;
            text-shadow:
                    0 1px 0 rgba(255,255,255,0.4),
                    0 -1px 0 rgba(0,0,0,0.5),
                    0 2px 4px rgba(0,0,0,0.4),
                    0 0 12px rgba(255,215,150,0.2);
        }
        .bf-divider {
            display: flex; align-items: center; gap: 5px;
            margin-bottom: 6px;
        }
        .bf-divider::before,
        .bf-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.35);
        }
        .bf-divider span {
            width: 4px; height: 4px;
            background: rgba(255,255,255,0.55);
            transform: rotate(45deg);
            flex-shrink: 0;
        }
        .bf-subtitle {
            font-size: 8px;
            letter-spacing: 0.18em;
            color: rgba(255,255,255,0.55);
            text-transform: uppercase;
            text-align: center;
        }
        .bf-publisher {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 8px;
            letter-spacing: 0.08em;
            color: rgba(255,255,255,0.55);
            text-transform: uppercase;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }
        .bf-progress-mini {
            display: flex; align-items: center; gap: 5px;
        }
        .bf-progress-mini-bar {
            width: 32px; height: 2px;
            background: rgba(255,255,255,0.2);
            border-radius: 999px;
            overflow: hidden;
        }
        .bf-progress-mini-fill {
            height: 100%;
            background: rgba(255,255,255,0.9);
            border-radius: 999px;
            display: block;
        }
        .bf-progress-mini-text {
            font-weight: 700;
            color: rgba(255,255,255,0.9);
        }

        .bf-bookmark {
            position: absolute;
            top: -3px;
            right: 20px;
            width: 12px;
            height: 26px;
            z-index: 5;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .bf-bookmark.gold {
            background: linear-gradient(180deg, #FFE78A 0%, #F5C842 45%, #C9A02E 100%);
        }
        .bf-bookmark.red {
            background: linear-gradient(180deg, #FF6B6B 0%, #EF4444 45%, #A01F1F 100%);
        }

        /* 飞行克隆体 */
        .fly-clone {
            position: fixed;
            z-index: 400;
            pointer-events: none;
            border-radius: 3px 7px 7px 3px;
            overflow: hidden;
            will-change: transform, opacity;
            transition: none;
            box-shadow: 0 30px 80px rgba(15,23,42,0.4);
        }
        .fly-clone.animating {
            transition:
                    left 0.48s cubic-bezier(0.4, 0, 0.2, 1),
                    top 0.48s cubic-bezier(0.4, 0, 0.2, 1),
                    width 0.48s cubic-bezier(0.4, 0, 0.2, 1),
                    height 0.48s cubic-bezier(0.4, 0, 0.2, 1),
                    opacity 0.4s ease,
                    border-radius 0.4s ease;
        }
        .dark .fly-clone {
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        }

        /* 弹窗 */
        .modal-mask {
            position: fixed; inset: 0;
            background: rgba(15,23,42,0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-mask.open { display: flex; }

        .modal {
            background: var(--bg-card);
            backdrop-filter: var(--blur-card);
            -webkit-backdrop-filter: var(--blur-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(15,23,42,0.25);
            width: 100%; max-width: 640px;
            max-height: 88vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .modal.entering {
            animation: modalIn 0.4s cubic-bezier(0.34,1.4,0.64,1) 0.18s both;
        }
        .modal.leaving {
            animation: modalOut 0.32s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes modalOut {
            from { opacity: 1; transform: none; }
            to { opacity: 0; transform: scale(0.94) translateY(8px); }
        }

        .modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .modal-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; }
        .modal-close {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.18s ease;
        }
        .modal-close:hover { background: var(--border-subtle); color: var(--text-primary); }
        .modal-body { padding: 22px; overflow-y: auto; }

        .modal-title-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-right: 10px;
            vertical-align: 1px;
            box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent);
        }

        .detail-section { margin-bottom: 20px; }
        .detail-section:last-child { margin-bottom: 0; }
        .detail-label {
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .detail-row {
            display: flex; justify-content: space-between;
            font-size: 14px; padding: 6px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row span:first-child { color: var(--text-muted); }
        .detail-row span:last-child { color: var(--text-primary); font-weight: 500; }

        .progress-bar {
            height: 6px;
            background: var(--border-subtle);
            border-radius: 999px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; border-radius: 999px;
            background: var(--m-main); opacity: 0.8;
            transition: width 0.4s ease;
        }
        .progress-label {
            display: flex; justify-content: space-between;
            font-size: 12px; color: var(--text-muted);
            margin-top: 4px;
        }

        .notice {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .form-actions {
            display: flex; gap: 10px; justify-content: flex-end;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center; padding: 24px;
            color: var(--text-muted); font-size: 13px;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 768px) {
            .app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
            .sidebar { display: none; }
        }
        @media (max-width: 768px) {
            .grid-shelf { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

<div class="aurora-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="app">

    <aside class="sidebar">
        <div class="sidebar-title">全局层</div>
        <div class="menu-item"><span class="menu-dot"></span>工作台</div>
        <div class="menu-item"><span class="menu-dot"></span>任务清单</div>
        <div class="menu-item"><span class="menu-dot"></span>日程</div>

        <div class="sidebar-title">领域层</div>
        <div class="menu-item"><span class="menu-dot"></span>生活</div>
        <div class="menu-item active"><span class="menu-dot"></span>工作</div>

<div class="modal-mask" id="modalMask">

            <div class="modal-close" onclick="closeShelf()">✕</div>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
    // ========== 主题切换 ==========
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        themeToggle.textContent = '☀️';
    }
    themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        themeToggle.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // ========== 快速记录 ==========
    document.getElementById('quickAdd').addEventListener('click', () => {
        alert('原型演示：快速记录');
    });

    // ========== 项目书架：飞出 / 飞回 ==========
    const modalMask = document.getElementById('modalMask');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const box = modalMask.querySelector('.modal');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let busy = false;
    let current = null;

    function openModal() {
        modalMask.classList.add('open');
    }
    function closeModal() {
        modalMask.classList.remove('open');
    }

    function spawn(book, from, to, fadeOut) {
        const clone = book.cloneNode(true);
        clone.classList.add('fly-clone');
        clone.style.transformOrigin = 'top left';
        clone.style.left = from.left + 'px';
        clone.style.top = from.top + 'px';
        clone.style.width = from.width + 'px';
        clone.style.height = from.height + 'px';
        clone.style.opacity = fadeOut ? '1' : '0.9';
        clone.style.borderRadius = fadeOut ? '3px 7px 7px 3px' : '20px';
        document.body.appendChild(clone);
        requestAnimationFrame(() => requestAnimationFrame(() => {
            clone.classList.add('animating');
            clone.style.left = to.left + 'px';
            clone.style.top = to.top + 'px';
            clone.style.width = to.width + 'px';
            clone.style.height = to.height + 'px';
            clone.style.opacity = fadeOut ? '0' : '1';
            clone.style.borderRadius = fadeOut ? '20px' : '3px 7px 7px 3px';
        }));
        return clone;
    }

    function fill(book) {
        const progress = Number(book.dataset.progress || 0);
        const deadline = book.dataset.deadline || '—';
        const tone = book.dataset.tone || '#C13A4E';
        modalTitle.innerHTML =
            '<span class="modal-title-dot" style="background:' + tone + ';color:' + tone + ';"></span>' +
            (book.dataset.name || '');
        modalBody.innerHTML =
            '<div class="detail-section">' +
            '<div class="detail-label">项目概况</div>' +
            '<div class="detail-row"><span>截止日期</span><span>' + deadline + '</span></div>' +
            '<div class="detail-row"><span>当前进度</span><span>' + progress + '%</span></div>' +
            '</div>' +
            '<div class="detail-section">' +
            '<div class="detail-label">说明</div>' +
            '<div class="notice">这份原型只演示<b>版式与动画时机</b>。弹窗正文（项目概况 / 项目描述 / 风险 / 关键节点 / 关联文档）由应用按<b>真实项目数据</b>渲染。</div>' +
            '</div>' +
            '<div class="detail-section">' +
            '<div class="progress-bar"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
            '<div class="progress-label"><span>' + progress + '%</span><span>截止 ' + deadline + '</span></div>' +
            '</div>' +
            '<div class="form-actions"><button class="btn btn-ghost" onclick="closeShelf()">关闭</button></div>';
    }

    function showCard(book) {
        busy = true;
        current = book;
        fill(book);
        openModal();
        box.classList.remove('entering', 'leaving');
        if (reduced) {
            box.style.visibility = 'visible';
            busy = false;
            return;
        }
        box.style.visibility = 'hidden';
        const to = box.getBoundingClientRect();
        const clone = spawn(book, book.getBoundingClientRect(), to, true);
        setTimeout(() => { box.style.visibility = 'visible'; box.classList.add('entering'); }, 260);
        setTimeout(() => { clone.remove(); busy = false; }, 520);
    }

    function closeShelf() {
        if (!current) { closeModal(); return; }
        const book = current;
        current = null;
        box.classList.remove('entering');
        if (reduced) { box.classList.remove('leaving'); closeModal(); return; }
        busy = true;
        box.classList.add('leaving');
        const clone = spawn(book, box.getBoundingClientRect(), book.getBoundingClientRect(), false);
        setTimeout(() => {
            clone.remove();
            closeModal();
            box.classList.remove('leaving');
            busy = false;
        }, 480);
    }
    window.closeShelf = closeShelf;

    document.addEventListener('click', (e) => {
        const book = e.target.closest('.book-flat');
        if (!book || busy) return;
        showCard(book);
    });

    document.addEventListener('click', (e) => {
        if (!current || e.target !== modalMask) return;
        e.stopPropagation();
        closeShelf();
    }, true);

    document.addEventListener('keydown', (e) => {
        if (!current || e.key !== 'Escape') return;
        e.stopPropagation();
        closeShelf();
    }, true);
</script>
