<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>部署 · 项目详情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* [hidden] 必须始终生效 —— 否则会被 author 的 display 覆盖 */
        [hidden] { display: none !important; }

        :root {
            /* 纯色范式：面一律给实色，层次只靠「底色明度差 + 1px 描边 + 两段阴影」。
               页 #F4F5F7 < 卡面 #FFFFFF > 区块底 #F7F8FA —— 区块底比卡面暗一档，
               它专门承担「卡里的子区块」，别再让 --bg-hover 一个令牌当三件事。 */
            --bg-page: #F4F5F7;
            --bg-card: #FFFFFF;
            --bg-card-solid: #FFFFFF;
            --bg-subtle: #F7F8FA;
            --bg-sidebar: #FFFFFF;
            --bg-topbar: #FFFFFF;
            /* 白描边只在毛玻璃上成立（玻璃自带明暗底衬）；实底卡片要用实色描边 */
            --border-card: #E6E9EE;
            --border-subtle: rgba(15,23,42,0.07);
            --border-strong: rgba(15,23,42,0.13);
            /* 输入框的边要单独一档：控件靠它成形，必须 ≥3:1（白底 vs #7F899B = 3.53） */
            --border-field: #7F899B;
            --text-primary: #0F172A;
            /* 浅色主题下二级/三级文字必须 ≥4.5:1 */
            --text-secondary: #4A5A72;
            --text-muted: #5B6A82;
            /* 阴影写成两段：近距细影定轮廓、远距柔影给高度。
               单段 0 4px 24px 那种大影是给毛玻璃配的，纯色下发虚。 */
            --shadow-card: 0 1px 2px rgba(15,23,42,0.04), 0 6px 18px rgba(15,23,42,0.06);
            --shadow-card-hover: 0 2px 4px rgba(15,23,42,0.06), 0 14px 32px rgba(15,23,42,0.10);

            --r-sm: 8px; --r-md: 12px; --r-lg: 18px;

            --s-work: #E11D48;
            --m-main: var(--s-work);

            /* 部署模块功能色 —— 与运维绿、工作域粉都拉开距离 */
            --dp: #6366F1;        /* 只用于图形：图标底、选中左条、焦点环 */
            --dp-fg: #4338CA;     /* 需要作为文字时用这一档（≥4.5:1） */
            /* 实底按钮背景单独深一档：#6366F1 上的白字只有 4.47:1，差一点不达标 */
            --dp-btn: #4F46E5;    /* 白字 6.28:1 */
            /* 当前配置所在那一组的描边（比常规描边重一档，但不铺底色 ——
               底色要留给"当前这一条"，两处都铺色会互相打架） */
            --group-edge-active: color-mix(in srgb, var(--dp) 34%, transparent);

            /* 语义状态令牌（浅色）—— 全部 ≥4.5:1 */
            --ok-fg: #036B4E;      --ok-bg: rgba(16,185,129,0.14);
            --warn-fg: #9A4708;    --warn-bg: rgba(245,158,11,0.16);
            --danger-fg: #B91C1C;  --danger-bg: rgba(239,68,68,0.13);
            --idle-fg: #475569;    --idle-bg: rgba(100,116,139,0.16);

            --bar-ok: #10B981;
            --bar-warn: #F59E0B;
            --bar-danger: #EF4444;
            --bar-track: rgba(15,23,42,0.09);

            /* 终端输出区：深浅两套都保持"深底浅字"，它是代码块不是普通文本 */
            --term-bg: #0F172A;
            --term-fg: #CBD5E1;
            --term-dim: #94A3B8;
            --term-ok: #6EE7B7;
            --term-warn: #FCD34D;
            --term-err: #FCA5A5;
            --term-bar: #1B2438;   /* 终端标题栏：比正文区略亮一档 */

            /* 各分区的垂直/水平内边距统一走这两个值，别一处 11 一处 13 */
            --pad-y: 12px;
            --pad-x: 16px;

            --focus-ring: var(--text-primary);
        }

        .dark {
            /* 深色同样三档：页 #0A0F1C < 卡面 #171F32 > 区块底 #131A2A */
            --bg-page: #0A0F1C;
            --bg-card: #171F32;
            --bg-card-solid: #171F32;
            --bg-subtle: #131A2A;
            --bg-sidebar: #171F32;
            --bg-topbar: #171F32;
            --border-card: rgba(255,255,255,0.10);
            --border-subtle: rgba(255,255,255,0.06);
            --border-strong: rgba(255,255,255,0.15);
            --border-field: rgba(255,255,255,0.36);   /* 对卡底 3.31:1 */
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            /* 卡面变实心后 #8695AB 只剩 4.81:1（本来卡面是半透明的，叠着页底更深）——
               提亮一档到 5.1:1 留出余量 */
            --text-muted: #8B9AB0;
            --shadow-card: 0 1px 2px rgba(0,0,0,0.32), 0 8px 22px rgba(0,0,0,0.26);
            --shadow-card-hover: 0 2px 6px rgba(0,0,0,0.40), 0 16px 36px rgba(0,0,0,0.42);

            --s-work: #FB7185;
            --dp: #818CF8;
            --dp-fg: #A5B4FC;
            --group-edge-active: color-mix(in srgb, var(--dp) 42%, transparent);

            --ok-fg: #6EE7B7;      --ok-bg: rgba(16,185,129,0.20);
            --warn-fg: #FCD34D;    --warn-bg: rgba(245,158,11,0.22);
            --danger-fg: #FCA5A5;  --danger-bg: rgba(239,68,68,0.22);
            --idle-fg: #CBD5E1;    --idle-bg: rgba(148,163,184,0.22);

            --bar-ok: #34D399;
            --bar-warn: #FBBF24;
            --bar-danger: #F87171;
            --bar-track: rgba(255,255,255,0.13);

            --term-bg: #060B16;
            --term-fg: #CBD5E1;
            --term-dim: #94A3B8;
            --term-bar: #101828;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-primary);
            background: var(--bg-page);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 6px; }

        /* 从毛玻璃换成纯色后，这一层装饰性光斑整个去掉 ——
           它原本的作用是"让玻璃有东西可折射"，没有玻璃就只剩下一片粉雾。
           DOM 里那段也要一起删，只删 CSS 会留下空的固定层。 */

        /* ============================================================
           工作台外壳：没有侧栏 / 顶栏 / 面包屑，整页就是部署工具本身
           ============================================================ */
        .viewer {
            position: relative; z-index: 1;
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        /* 顶栏三段：① 身份（是谁的哪一页）② 上下文（这次往哪部署）
           ③ 状态与操作（现在怎么样 + 能做什么）。
           组间 20px、组内 16px —— 组距必须大于项距，否则三条元信息会被读成一整行 */
        .viewer-bar {
            flex-shrink: 0;
            display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap;
            padding: 9px 14px;
            background: var(--bg-topbar);
            border-bottom: 1px solid var(--border-subtle);
        }
        .viewer-id { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .viewer-ico {
            width: 28px; height: 28px; border-radius: var(--r-sm); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            /* 薄染混顶栏自己的底色，不混 transparent —— 混 transparent 得到的仍是
               半透明色，最终结果取决于它叠在谁上面 */
            background: color-mix(in srgb, var(--dp) 13%, var(--bg-topbar));
            border: 1px solid color-mix(in srgb, var(--dp) 22%, var(--bg-topbar));
            color: var(--dp-fg);
        }
        .viewer-ico svg { width: 15px; height: 15px; }
        .viewer-name { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; color: var(--text-primary); }
        /* 「部署」是本页的分区名，挂在标题后当标签 —— 不再拼进标题里占掉一半宽度
           （窗口标题与面包屑已经在说这件事了） */
        .viewer-scope {
            flex-shrink: 0; padding: 2px 7px; border-radius: 5px;
            background: color-mix(in srgb, var(--dp) 11%, var(--bg-topbar));
            color: var(--dp-fg);
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap;
        }
        .viewer-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        /* 顶栏里的按钮统一 30px 高，否则主题按钮会比刷新/关闭高一截 */
        .viewer-actions .log-tool { height: 30px; padding: 0 11px; }
        .log-tool svg { width: 13px; height: 13px; flex-shrink: 0; }
        .icon-btn {
            width: 30px; height: 30px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 9px; border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid); color: var(--text-secondary);
            cursor: pointer; font-family: inherit;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .icon-btn svg { width: 15px; height: 15px; }
        .icon-btn:hover { border-color: var(--dp); color: var(--dp-fg); }
        .icon-btn.danger:hover { border-color: var(--danger-fg); color: var(--danger-fg); }
        .viewer-bar .theme-toggle {
            width: 30px; height: 30px; border-radius: 9px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid); color: var(--text-secondary);
        }
        .viewer-bar .theme-toggle svg { width: 15px; height: 15px; }
        .viewer-bar .theme-toggle:hover { border-color: var(--dp); color: var(--dp-fg); }

        .btn {
            border: none; border-radius: 10px;
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }
        .btn-primary { background: var(--m-main); color: #fff; box-shadow: 0 1px 2px rgba(15,23,42,0.10), 0 4px 12px rgba(15,23,42,0.12); }
        .btn-primary:hover { box-shadow: 0 2px 4px rgba(15,23,42,0.12), 0 10px 22px rgba(15,23,42,0.16); transform: translateY(-1px); }
        .btn-ghost { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-subtle); }
        .btn-ghost:hover { border-color: var(--m-main); color: var(--m-main); }
        .btn-danger { background: var(--danger-fg); color: #fff; }
        .btn-danger:hover { filter: brightness(1.08); transform: translateY(-1px); }
        /* 深色主题下这两个按钮都是「亮底 + 白字」，实测只有 2.69:1 / 1.90:1。
           翻成深字即可 —— 亮底深字本来就是暗色主题处理高饱和色的通行做法。 */
        .dark .btn-primary, .dark .btn-danger { color: #0F172A; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .theme-toggle {
            width: 38px; height: 38px; border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.18s ease, border-color 0.18s ease;
        }
        .theme-toggle:hover { transform: scale(1.05); border-color: var(--m-main); }

        /* 工作区：占满剩余高度 */
        .viewer-main {
            flex: 1 1 auto; min-height: 0;
            padding: 12px 14px 14px;
            display: flex; flex-direction: column;
        }
        .last-sync { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }

        /* 顶栏小按钮 */
        .log-tool {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 10px; border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid); color: var(--text-secondary);
            font-family: inherit; font-size: 11.5px; font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .log-tool:hover { border-color: var(--dp); color: var(--dp-fg); }

        /* 上下文行：三条元信息都写成「标签 + 值」，靠间距分组、不画分隔线 ——
           相邻色块本来就靠底色差成边，再加线等于把同一条边画两遍 */
        .meta-bar { display: flex; align-items: center; gap: 6px 16px; flex-wrap: wrap; min-width: 0; }
        .meta-item {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11.5px; color: var(--text-secondary); white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        /* 主机名 / 版本号这类"照抄下来"的值用等宽，避免数字宽度跳动 */
        .meta-item b { font-weight: 700; color: var(--text-primary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        /* 环境决定这次部署的风险等级 —— 三条里只给它加重，并配一枚实心点做形状线索
           （只靠颜色深浅区分，遮住颜色就看不出来了） */
        .meta-env { color: var(--text-primary); font-weight: 800; }
        .meta-env .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dp); flex-shrink: 0; }
        /* 配置数是背景统计、不是状态 ⇒ 压低一档 */
        .meta-weak { color: var(--text-muted); }
        /* 运行态是整条顶栏里唯一需要一眼看到的结论，锚在最右 */
        .state-pill {
            display: inline-flex; align-items: center; gap: 7px;
            height: 30px; padding: 0 12px; border-radius: 999px;
            background: var(--ok-bg); color: var(--ok-fg);
            font-size: 11.5px; font-weight: 800; letter-spacing: 0.01em; white-space: nowrap;
        }
        .state-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
        .state-pill .ver { font-weight: 700; color: var(--text-secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

        /* ============================================================
           部署工作区：左栏「部署配置」+ 右栏「配置 → 上传 → 执行 → 输出」
           ============================================================ */
        .dp-scope {
            flex: 1 1 auto; min-height: 0;
            display: grid;
            grid-template-columns: 272px minmax(0, 1fr);
            /* 行高必须钉死成 1fr：默认 auto 会按内容取高，而右栏里的步骤区是
               flex-shrink:0，于是整栏会被内容顶出视口（底部终端被裁掉）。 */
            grid-template-rows: minmax(0, 1fr);
            gap: 14px; align-items: stretch;
        }

        /* ---------- 左栏 · 部署配置列表 ---------- */
        .dp-side {
            display: flex; flex-direction: column; min-height: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        /* 实底卡已有 1px 描边，不再需要那道"上沿内发光"（它是给玻璃补边用的） */
        .dp-side-head {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 11px 10px 11px 14px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .dp-side-add {
            width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid); color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-family: inherit; font-size: 13px; line-height: 1;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .dp-side-add:hover { border-color: var(--dp); color: var(--dp-fg); background: color-mix(in srgb, var(--dp) 8%, transparent); }

        /* ============================================================
           分组
           —— 五条配置平铺在一个列表里，「哪几条是一回事」全靠用户自己认路径。
              按「这次部署动的是什么」再分一层：应用服务 / 前端资源 / 数据库 / 其它。
              这条分组的理由，与日志页那句「一台机器上八份日志平铺」是同一条 ——
              **平铺列表里"分类"这件事只能靠用户自己在大脑里做**。

           与日志页同一套表示（结构、间距、折叠机制都照搬）：
             组框用白实底 + 一条 inset 描边，不用灰底衬 —— 灰底会和项底挤在同一段窄灰阶里，整栏看着脏；
             描边用 inset box-shadow 而不是 border，border 会占宽度、把项挤窄；
             组头不放延伸线（描边 + 色条 + 计数 + 箭头已经 4 种元素，第 5 种不会增加分组感）；
             缩进做在**项的 padding-left** 上，不做在容器 padding 上 ——
             否则 hover / 选中的底色会从缩进之后才开始，左边缺一段背景、看着像断了一截。

           分组是**纯展示层**：选中、执行、编辑全部按 `data-id` 找元素，组容器不参与任何逻辑，
           所以新建的配置改完路径就自动归位（分组由 `groupFor(path)` 现算，不落字段）。
           ============================================================ */
        .dp-group {
            display: grid; grid-template-rows: auto 1fr; min-width: 0;
            padding: 3px; border-radius: 14px;
            background: var(--bg-card-solid);
            box-shadow: inset 0 0 0 1px var(--border-strong);
            transition: grid-template-rows 0.22s ease, box-shadow 0.18s ease;
        }
        /* 当前配置在哪一组 —— 组数一多，这比让用户自己记住在第几组靠谱。
           只动描边与色条，不动底色。 */
        .dp-group:has(.dp-cfg.active) { box-shadow: inset 0 0 0 1px var(--group-edge-active); }
        .dp-group:has(.dp-cfg.active) .dp-group-name { color: var(--text-primary); }
        .dp-group:has(.dp-cfg.active) .dp-group-mark { background: var(--dp); }

        .dp-group-head {
            display: flex; align-items: center; gap: 7px;
            width: 100%; min-width: 0;
            /* 左 3px：色条离开圆角；右 12px：折叠箭头与项右沿落在同一条竖线上 */
            padding: 7px 12px 6px 3px;
            border: none; border-radius: 10px; background: transparent;
            font-family: inherit; text-align: left; cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.15s ease, background 0.15s ease;
        }
        .dp-group-head:hover { color: var(--text-primary); background: var(--border-subtle); }
        /* 组标识色条：与选中项左侧那条强调竖条同源（模块功能色）——「这组」的最快识别符，比读组名快。
           非当前组压到 45%，避免三组都在喊。 */
        .dp-group-mark {
            flex-shrink: 0; width: 3px; height: 12px; border-radius: 2px;
            background: color-mix(in srgb, var(--dp) 45%, transparent);
            transition: background 0.18s ease;
        }
        .dp-group-name {
            font-size: 11px; font-weight: 800; letter-spacing: 0.02em;
            color: inherit; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .dp-group-n {
            flex-shrink: 0; margin-left: auto;
            font-size: 10px; font-weight: 700; color: var(--text-muted);
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .dp-group-chev {
            flex-shrink: 0; width: 11px; line-height: 1;
            color: var(--text-muted); transition: transform 0.18s ease;
        }
        .dp-group-head[aria-expanded="false"] .dp-group-chev { transform: rotate(-90deg); }

        /* 折叠：0fr 收高度（真实过渡，不是写死的 max-height），
           并延迟切 visibility —— 0fr 只是「看不见」，Tab 键照样能钻进去。
           本体仍是 grid 两行/两列，所以窄屏换成「收宽度」即可复用同一套逻辑。 */
        .dp-group-items {
            position: relative;
            display: flex; flex-direction: column; gap: 1px;
            min-width: 0; min-height: 0; overflow: hidden;
            padding: 0 1px;
            --indent: 12px;
        }
        .dp-group-items .dp-cfg { padding-left: calc(11px + var(--indent)); }
        .dp-group:has(.dp-group-head[aria-expanded="false"]) { grid-template-rows: auto 0fr; }
        .dp-group:has(.dp-group-head[aria-expanded="false"]) .dp-group-items {
            visibility: hidden;
            transition: visibility 0s linear 0.22s;
        }

        /* 组间距只由 .dp-cfg-list 的 gap 提供 —— 组上再给 margin 会叠成两倍，列表节奏立刻散掉 */
        .dp-cfg-list { display: flex; flex-direction: column; gap: 8px; padding: 8px 5px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .dp-cfg {
            position: relative; width: 100%;
            display: flex; flex-direction: column; gap: 3px;
            padding: 9px 11px; border-radius: 9px;
            border: none; background: transparent; font-family: inherit;
            text-align: left; cursor: pointer;
            overflow: hidden;   /* 让选中色条被裁进圆角里，不外露直角 */
            transition: background 0.15s ease;
        }
        .dp-cfg:hover { background: var(--border-subtle); }
        .dp-cfg.active { background: color-mix(in srgb, var(--dp) 10%, transparent); }
        .dp-cfg.active::before {
            content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
            width: 3px; border-radius: 0 3px 3px 0; background: var(--dp);
        }
        .dp-cfg-name {
            font-size: 12.5px; font-weight: 700; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dp-cfg-cmd {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .dp-cfg.active .dp-cfg-cmd { color: var(--text-secondary); }

        /* ============================================================
           列表项的行内「编辑 / 删除」
           —— 左栏是这个列表的宿主，那就该在这里能改能删；原来只有右栏头部那一对，
              要改"列表里的另一条"得先切过去再点。与日志页同一套形态，三个约束也一样：
                ① `.dp-cfg` 本身是 <button>，按钮里不能再套按钮（非法 HTML）
                   ⇒ 每项外面包一层 `.dp-item`，动作按钮是它的**兄弟**，绝对定位叠在行尾；
                ② 项宽只有 252px，名称 + 路径已经占满 ⇒ 动作不能常驻。
                   改成悬停 / 键盘聚焦时出现，同时**路径那一行让位** —— 两者占同一格，
                   交叉淡入淡出，零重排零截断；
                ③ 隐藏必须用 `visibility`（延迟切），不能只给 `opacity: 0` ——
                   opacity 为 0 的按钮照样能被 Tab 聚焦，会得到一个"看不见但有焦点"的按钮。
           ============================================================ */
        .dp-item { position: relative; min-width: 0; }
        .dp-cfg-actions {
            position: absolute; right: 10px; bottom: 6px;
            display: flex; gap: 2px;
            opacity: 0; visibility: hidden;
            transition: opacity 0.14s ease, visibility 0s linear 0.14s;
        }
        /* :focus-within 一并用上 —— 否则键盘用户永远走不到这两个按钮 */
        .dp-item:hover .dp-cfg-actions,
        .dp-item:focus-within .dp-cfg-actions {
            opacity: 1; visibility: visible;
            transition: opacity 0.14s ease, visibility 0s;
        }
        /* 动作占的就是路径那一行 —— 让它让位，而不是把名称挤窄 */
        .dp-item:hover .dp-cfg-cmd,
        .dp-item:focus-within .dp-cfg-cmd {
            opacity: 0; visibility: hidden;
            transition: opacity 0.12s ease, visibility 0s linear 0.12s;
        }
        .dp-cfg-act {
            width: 22px; height: 22px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            border: none; border-radius: 6px; background: transparent;
            color: var(--text-muted); font-family: inherit; font-size: 12px; line-height: 1;
            cursor: pointer;
            transition: background 0.14s ease, color 0.14s ease;
        }
        .dp-cfg-act:hover { background: var(--border-subtle); color: var(--text-primary); }
        /* 删除是破坏性动作：只在 hover 它自己时转警示色，平时不喊 */
        .dp-cfg-act.danger:hover { background: var(--danger-bg); color: var(--danger-fg); }
        .dp-cfg-act:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }

        /* 降级成一行文字动作：虚线框和列表项抢注意力，而它只是个次要入口 */
        .dp-side-foot {
            flex-shrink: 0; margin: 0 6px; padding: 11px 12px;
            border: none; border-top: 1px solid var(--border-subtle);
            border-radius: 0; background: transparent;
            color: var(--text-muted);
            font-family: inherit; font-size: 11.5px; font-weight: 600;
            cursor: pointer; text-align: center;
            transition: color 0.15s ease;
        }
        .dp-side-foot:hover { color: var(--dp-fg); }

        /* 空态（配置被删空时） */
        .dp-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; padding: 34px 18px; text-align: center;
        }
        .dp-empty .ico { font-size: 22px; opacity: 0.6; }
        .dp-empty .t { font-size: 13px; font-weight: 700; }
        .dp-empty .d { font-size: 11.5px; color: var(--text-muted); }

        /* ---------- 右栏 ---------- */
        .dp-main {
            display: flex; flex-direction: column; min-height: 0; min-width: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        /* 配置摘要 */
        .dp-head { flex-shrink: 0; padding: var(--pad-y) var(--pad-x); border-bottom: 1px solid var(--border-subtle); }
        .dp-head-top { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
        .dp-title {
            position: relative; padding-left: 11px;
            font-size: 15px; font-weight: 800; letter-spacing: -0.01em; min-width: 0;
        }
        .dp-title::before {
            content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 15px; border-radius: 2px; background: var(--dp);
        }
        /* 摘要改成「标签列 + 值列」两行对齐：
           原来两列并排、中间拉一条竖线，值那一列只分到一半宽 —— 路径长一点就折行，
           一折行两个字段的基线也错开了。上下两行之后值列宽了一倍，标签左对齐到同一列，
           行高也不再随内容跳（值一律单行省略，悬停给全文）。 */
        .dp-spec { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .dp-spec-item {
            display: grid; grid-template-columns: 52px minmax(0, 1fr);
            gap: 10px; align-items: baseline; min-width: 0;
        }
        .dp-spec-k { font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
        .dp-spec-v {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; color: var(--text-primary); min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* 命令列塞得下「第一条 + 共 N 条」徽标，超长命令省略号收尾、悬停看全 */
        .dp-spec-line { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
        .dp-spec-more {
            flex-shrink: 0; padding: 1px 5px; border-radius: 4px;
            background: var(--border-subtle); color: var(--text-secondary);
            font-size: 9.5px; font-weight: 700; white-space: nowrap;
        }
        /* 自动化就绪度：全自动 / 需输入 / 可改写，三种语义各一个底色 */
        .dp-spec-more.auto { background: var(--ok-bg); color: var(--ok-fg); }
        .dp-spec-more.need { background: var(--warn-bg); color: var(--warn-fg); }
        .dp-spec-more.fix  { background: color-mix(in srgb, var(--dp) 13%, transparent); color: var(--dp-fg); }

        /* 上传区：把「文件从哪来」这件事拆成两条并列的路 —— ① 拖拽/选择，② 绑定本机已有的路径。
           两块用同一个 grid 行（不是 flex）：左右同宽、**不写死高度**，谁高谁说了算，
           矮的那块由 stretch 拉平，避免以后改一边的字数又要回头对高度。 */
        .dp-upload { flex-shrink: 0; padding: var(--pad-y) var(--pad-x); border-bottom: 1px solid var(--border-subtle); }
        .dp-label {
            display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted); margin-bottom: 9px;
        }
        .dp-label .aside { font-size: 10.5px; font-weight: 600; letter-spacing: 0; text-transform: none; }

        /* 两种来源是**二选一**（一次部署只会用一种）：上面一个两段控件选"怎么给文件"，
           下面只渲染选中那一种的面板 —— 并列两张卡看起来像"两条都要走"。
           分段用「轨道 + 白底药丸」表达选中：纯色范式下不靠光晕，靠底色差 + 描边。 */
        .src-pick { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--bg-subtle); }
        .src-opt {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 8px;
            border: 1px solid transparent; background: transparent;
            color: var(--text-secondary); cursor: pointer;
            font-family: inherit; font-size: 11.5px; font-weight: 700;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .src-opt:hover { color: var(--text-primary); }
        .src-opt.on {
            background: var(--bg-card-solid); color: var(--dp-fg);
            border-color: var(--border-subtle);
            box-shadow: 0 1px 2px rgba(15,23,42,0.06);
        }
        .src-opt:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
        /* 选中态不能只靠白底药丸 —— 它与轨道的差只有 1.08:1，等于没差。
           加一枚「实心 / 空心」的单选标记：状态从此有**形状**这条线索，
           而且两枚标记各自都过 3:1（空心 `--text-muted` 压轨道 5.2:1，实心 `--dp` 压白药丸 4.47:1）。
           两侧常驻、常宽，切换时不会发生字位跳动。 */
        .src-opt .dot {
            width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
            border: 1.5px solid var(--text-muted); background: transparent;
        }
        .src-opt.on .dot { border-color: var(--dp); background: var(--dp); }
        /* 已经备好文件的来源在标签上带条数 —— 切走的那一边不能变成"隐藏状态"，
           否则会出现"要传 3 个"与清单里 0 行对不上的局面 */
        /* 文案单独一层：按钮的矩形里还有圆点与计数徽标，量按钮本身会把它们的像素当底色采走
           （实测把 7.4:1 的深靛蓝文字量成了 1.77）*/
        .src-opt-t { display: block; }
        .src-opt .n {
            min-width: 16px; padding: 0 5px; border-radius: 999px; text-align: center;
            background: color-mix(in srgb, var(--dp) 16%, transparent); color: var(--dp-fg);
            font-size: 9.5px; font-weight: 800; font-variant-numeric: tabular-nums;
        }

        /* 区块底（比卡面暗一档）成块，不描边 —— 面与面之间有底色差就不需要线 */
        .src-panel { margin-top: 9px; display: flex; flex-direction: column; padding: 10px 12px 12px; border-radius: 12px; background: var(--bg-subtle); }

        /* 拖拽区：卡片里再放一块白底虚线框，「往这儿丢」就有了明确落点（区块底上再叠区块底等于没画） */
        .dropzone {
            flex: 1 1 auto; min-height: 66px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            padding: 12px 14px; border-radius: 10px;
            border: 1.5px dashed color-mix(in srgb, var(--dp) 42%, var(--border-strong));
            background: var(--bg-card-solid);
            cursor: pointer; text-align: center; font-family: inherit;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }
        .dropzone:hover {
            border-color: var(--dp);
            background: color-mix(in srgb, var(--dp) 5%, var(--bg-card-solid));
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--dp) 12%, transparent);
        }
        .dropzone.over {
            border-color: var(--dp);
            background: color-mix(in srgb, var(--dp) 10%, var(--bg-card-solid));
            box-shadow: 0 0 0 3px var(--dp);
        }
        /* 图标走内联 SVG（统一 16 网格、1.6 描边、currentColor），不用字符 —— 非 ASCII 会落到 emoji 字体族 */
        .dz-ico { color: var(--dp-fg); display: flex; }
        .dz-ico svg { width: 20px; height: 20px; display: block; }
        .dz-t { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
        .dz-d { font-size: 10.5px; color: var(--text-muted); }
        input[type="file"] { display: none; }

        /* 方式二：绑定本机路径。输入框 + 「绑定」在同一行，且用 stretch 对齐高度 */
        .bind-row { display: flex; gap: 6px; align-items: stretch; }
        .bind-input {
            flex: 1 1 auto; min-width: 0;
            padding: 8px 10px; border-radius: 9px;
            border: 1px solid var(--border-field);
            background: var(--bg-card-solid); color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .bind-input:focus {
            outline: none; border-color: var(--dp);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--dp) 16%, transparent);
        }
        /* placeholder 不写颜色会吃浏览器默认灰（深色下直接看不见） */
        .bind-input::placeholder { color: var(--text-muted); }
        .bind-input.bad { border-color: var(--warn-fg); }
        .bind-go {
            flex-shrink: 0; padding: 0 14px; border-radius: 9px;
            border: 1px solid var(--dp); background: transparent; color: var(--dp-fg);
            font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
            transition: background 0.15s ease;
        }
        .bind-go:hover { background: color-mix(in srgb, var(--dp) 12%, transparent); }
        .bind-go:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
        /* 「浏览…」与「绑定」是同一件事的两条通道（挑一份 / 填一条），所以不给它主按钮的强调色 ——
           一个面板里两个同等重的主按钮，等于没有主按钮 */
        .bind-browse {
            flex-shrink: 0; padding: 0 12px; border-radius: 9px;
            border: 1px solid var(--border-subtle); background: var(--bg-card-solid);
            color: var(--text-secondary);
            font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .bind-browse:hover { border-color: var(--dp); color: var(--dp-fg); }
        .bind-browse:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
        /* 检测结果行：只在「有话要说」时出文案，平时留一条同高的空行 ——
           否则打字时整块会上下跳 */
        .bind-state {
            display: flex; align-items: center; gap: 5px; min-height: 16px;
            margin-top: 8px; font-size: 10.5px; line-height: 1.4; color: var(--text-muted);
        }
        .bind-state.ok { color: var(--ok-fg); font-weight: 700; }
        .bind-state.bad { color: var(--warn-fg); font-weight: 700; }
        .bind-state .sep { color: var(--text-muted); flex-shrink: 0; }
        .bind-state .k {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-weight: 600; color: var(--text-secondary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .bind-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .bind-chip {
            max-width: 100%; padding: 3px 8px; border-radius: 6px;
            border: 1px solid var(--border-subtle); background: var(--bg-card-solid);
            color: var(--text-secondary); cursor: pointer;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            transition: border-color 0.15s ease, color 0.15s ease;
        }
        .bind-chip:hover { border-color: var(--dp); color: var(--dp-fg); }

        /* 文件清单：两种来源合到一张表里（「要上传的文件」就该只有一个答案）。
           来源标签跟着名称走，不单独占列 —— 窄屏隐藏大小时它还能留下。 */
        .file-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 132px; overflow-y: auto; }
        .file-item {
            display: grid; grid-template-columns: auto minmax(0, 1fr) auto 22px;
            gap: 10px; align-items: center;
            padding: 8px 11px; border-radius: 9px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-solid);
            animation: fileIn 0.22s ease both;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        @keyframes fileIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
        .file-item:hover {
            border-color: color-mix(in srgb, var(--dp) 34%, transparent);
            background: color-mix(in srgb, var(--dp) 5%, var(--bg-card-solid));
        }
        /* 本机找不到的绑定文件：状态叠层（琥珀底），它会在「校验本地文件」那一步真的失败 */
        .file-item.missing {
            border-color: color-mix(in srgb, var(--warn-fg) 40%, transparent);
            background: var(--warn-bg);
        }
        .file-item.missing:hover { border-color: var(--warn-fg); background: var(--warn-bg); }
        /* 琥珀底衬会把徽标那层半透明靛蓝也染黄（深色下只剩 4.54:1）⇒
           这一行里的徽标改成实底，别让环境色参与自己的底色 */
        .file-item.missing .file-ico {
            background: color-mix(in srgb, var(--dp) 20%, var(--bg-card-solid));
        }
        /* 宽度跟着扩展名长短走：JAR / YAML / GZ 不该都被塞进同一个方块 */
        .file-ico {
            height: 24px; min-width: 32px; padding: 0 7px; border-radius: 6px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.02em;
            background: color-mix(in srgb, var(--dp) 14%, transparent);
            color: var(--dp-fg);
        }
        .file-name {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .file-size {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums;
        }
        .file-size.bad { color: var(--warn-fg); font-weight: 700; }
        .file-del {
            width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
            border: none; background: transparent; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-family: inherit; font-size: 11px; line-height: 1;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .file-del:hover { background: var(--danger-bg); color: var(--danger-fg); }

        /* 执行动作行：左边按钮常驻，右边只在有事要说时才有字（空字符串 ⇒ 整行收起）。
           所以这一行的高度由按钮决定，不随提示文案长短上下跳。
           两个按钮写同一个高度是安全的 —— 都是「一行字的按钮」，高度不取决于谁的内边距。 */
        .dp-run {
            flex-shrink: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: var(--pad-y) var(--pad-x);
            border-bottom: 1px solid var(--border-subtle);
        }
        .btn-run {
            display: inline-flex; align-items: center; gap: 9px;
            height: 40px; padding: 0 20px 0 17px; border-radius: 11px; border: none;
            background: var(--dp-btn); color: #fff;
            font-family: inherit; font-size: 13.5px; font-weight: 700; letter-spacing: 0.01em;
            cursor: pointer;
            /* 两段式中性影：近距细影压住边缘 + 远距柔影托起。原来那两处带色光晕（color-mix 的
               `0 Npx Npx`）属于纯色范式明确不要的装饰，换掉之后按钮反而更像"按得下去" */
            box-shadow: 0 1px 2px rgba(15,23,42,0.10), 0 4px 12px rgba(15,23,42,0.12);
            transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }
        .btn-run:hover:not(:disabled) {
            background: color-mix(in srgb, var(--dp-btn) 88%, #0B1220);
            box-shadow: 0 2px 4px rgba(15,23,42,0.12), 0 8px 20px rgba(15,23,42,0.16);
        }
        .btn-run:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 1px 2px rgba(15,23,42,0.14);
        }
        .btn-run:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
        .btn-run .ic { flex-shrink: 0; display: flex; }
        .btn-run .ic svg { width: 15px; height: 15px; display: block; }
        /* 执行中：不加透明度（那会把白字压到 2.5:1），也不再用扫光（白色渐变属于装饰）——
           改成更深的实底 + 文案里的「部署中…」，白字反而更清楚；运动只留图标这一处旋转 */
        .btn-run:disabled {
            cursor: not-allowed; box-shadow: none;
            background: color-mix(in srgb, var(--dp-btn) 78%, #0B1220);
        }
        .btn-run:disabled .ic svg { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 中止与主按钮并排：破坏性动作靠描边和颜色表达，不抢主按钮的位置 */
        .btn-abort {
            display: inline-flex; align-items: center; gap: 7px;
            height: 40px; padding: 0 15px; border-radius: 11px;
            border: 1px solid color-mix(in srgb, var(--danger-fg) 38%, transparent);
            background: transparent; color: var(--danger-fg);
            font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .btn-abort:hover { background: var(--danger-bg); border-color: var(--danger-fg); }
        .btn-abort:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
        .btn-abort .ic { flex-shrink: 0; display: flex; }
        .btn-abort .ic svg { width: 13px; height: 13px; display: block; }
        .run-hint { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11.5px; color: var(--text-muted); }
        .run-hint.warn { color: var(--warn-fg); font-weight: 600; }
        .run-hint .spin {
            width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%;
            border: 1.5px solid color-mix(in srgb, var(--dp) 30%, transparent);
            border-top-color: var(--dp);
            animation: spin 0.8s linear infinite;
        }

        /* ============================================================
           执行区：左侧任务列 + 右侧执行输出
           ============================================================ */
        .dp-output {
            flex: 1 1 auto; min-height: 0;
            display: grid;
            grid-template-columns: 268px minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr);
            overflow: hidden;
        }

        /* ---------- 左：任务列 ---------- */
        .dp-tasks {
            position: relative;
            display: flex; flex-direction: column; min-height: 0; min-width: 0;
            border-right: 1px solid var(--border-subtle);
            background: var(--bg-subtle);
        }
        .dp-tasks-head {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 10px 14px 8px;
        }
        .dp-tasks-title {
            display: flex; align-items: center; gap: 7px;
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .dp-tasks-title::before {
            content: ""; width: 3px; height: 12px; border-radius: 2px;
            background: var(--dp); flex-shrink: 0;
        }
        .dp-tasks-stats { display: inline-flex; align-items: center; gap: 4px; }
        .task-count {
            display: inline-flex; align-items: center;
            padding: 2px 8px; border-radius: 999px;
            background: var(--border-subtle);
            font-size: 10px; font-weight: 700; letter-spacing: 0.02em;
            color: var(--text-secondary); font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }
        /* 实底：这枚 chip 落在任务列的淡紫渐变上，叠绿底会掉到 4.42:1 */
        .task-count.done { background: var(--bg-card-solid); color: var(--ok-fg); }
        .task-fold-btn {
            width: 20px; height: 20px; border-radius: 5px;
            border: none; background: transparent; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; cursor: pointer; font-family: inherit;
            transition: background 0.15s ease, color 0.15s ease, transform 0.2s ease;
        }
        .task-fold-btn:hover { background: color-mix(in srgb, var(--dp) 10%, transparent); color: var(--dp-fg); }
        .task-fold-btn.active { color: var(--dp-fg); transform: rotate(180deg); }

        .dp-tasks-progress {
            flex-shrink: 0; height: 2px; margin: 0 14px 6px;
            background: var(--border-subtle); border-radius: 2px; overflow: hidden;
        }
        .dp-tasks-progress > span {
            display: block; height: 100%; width: 0; border-radius: 2px;
            background: var(--dp);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .steps {
            flex: 1 1 auto; min-height: 0; overflow-y: auto;
            display: flex; flex-direction: column; gap: 2px;
            padding: 4px 10px 12px;
            position: relative;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: color-mix(in srgb, var(--dp-fg) 45%, var(--border-strong)) transparent;
        }
        .steps::-webkit-scrollbar { width: 6px; }
        .steps::-webkit-scrollbar-thumb {
            background: color-mix(in srgb, var(--dp-fg) 45%, var(--border-strong));
            border-radius: 3px;
        }
        .steps::-webkit-scrollbar-thumb:hover {
            background: color-mix(in srgb, var(--dp-fg) 65%, var(--border-strong));
        }

        /* ---------- 步骤 ---------- */
        .step {
            position: relative;
            display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 18px;
            gap: 8px; align-items: center;
            padding: 7px 9px; border-radius: 9px;
            cursor: pointer; outline: none;
            max-height: 96px;
            transition: max-height 0.25s ease, padding 0.25s ease, opacity 0.2s ease,
                        background 0.18s ease, box-shadow 0.18s ease;
        }
        /* 竖向连接线：把 6 个圆点串成一条流程 */
        .step::before {
            content: ""; position: absolute;
            left: 18px; top: 50%; bottom: -2px; width: 2px;
            background: var(--border-subtle);
            transform: translateX(-1px);
            transition: background 0.25s ease;
            z-index: 0;
        }
        .step:last-child::before { display: none; }
        .step-ok::before { background: color-mix(in srgb, var(--ok-fg) 35%, var(--border-subtle)); }
        .step-run::before { background: color-mix(in srgb, var(--dp) 40%, var(--border-subtle)); }
        .step-skip::before {
            background-color: transparent;
            background-image: linear-gradient(180deg, var(--border-subtle) 50%, transparent 50%);
            background-size: 2px 6px;
        }
        .dp-tasks.folded .step-ok:not(.focused)::before { display: none; }

        .step:hover { background: color-mix(in srgb, var(--dp) 6%, transparent); }
        .step:focus-visible { box-shadow: 0 0 0 2px var(--dp); }
        .step.focused { background: color-mix(in srgb, var(--dp) 11%, transparent); }

        .step-dot {
            position: relative; z-index: 1;
            width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-card-solid);
            border: 2px solid var(--border-strong);
            color: var(--text-muted);
            font-size: 9.5px; font-weight: 800;
            transition: background 0.25s ease, border-color 0.25s ease,
                        color 0.25s ease, transform 0.25s ease;
        }
        /* 数字单独一层：圆点带 2px 边框，合在一起量会把边框采成文字底衬 */
        .step-dot-n { line-height: 1; }
        .step-run .step-dot {
            /* 用实底那一档：--dp 上的白字只有 4.47:1，差一点不达标 */
            background: var(--dp-btn); border-color: var(--dp-btn); color: #fff;
            animation: pulse 1.4s ease-in-out infinite;
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--dp) 18%, transparent);
        }
        .step-ok .step-dot {
            background: var(--ok-fg); border-color: var(--ok-fg); color: #fff;
            animation: dotSettle 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        .step-err .step-dot { background: var(--danger-fg); border-color: var(--danger-fg); color: #fff; }
        .step-skip .step-dot {
            background: transparent;
            border: 2px dashed var(--border-strong);
            color: var(--text-muted); font-size: 11px;
        }
        /* 深色下 ok / err 的圆点是亮底 → 翻成深字 */
        .dark .step-ok .step-dot,
        .dark .step-err .step-dot { color: #0F172A; }
        /* 深色下运行中回到亮紫底 + 深字：实底那档在深色里太闷，白字也不行 */
        .dark .step-run .step-dot {
            background: var(--dp); border-color: var(--dp); color: #0F172A;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--dp) 18%, transparent); }
            50%      { box-shadow: 0 0 0 6px color-mix(in srgb, var(--dp) 6%, transparent); }
        }
        @keyframes dotSettle { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }

        /* 重试过的步骤：右上角挂一个黄点 */
        .step-retry .step-dot::after {
            content: ""; position: absolute; top: -2px; right: -2px;
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--warn-fg);
            border: 1.5px solid var(--bg-card-solid);
        }

        .step-name {
            font-size: 12.5px; color: var(--text-muted); min-width: 0;
            line-height: 1.35; position: relative;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            transition: color 0.25s ease;
        }
        .step-run .step-name { color: var(--text-primary); font-weight: 700; }
        .step-ok  .step-name { color: var(--text-primary); }
        .step-err .step-name { color: var(--danger-fg); font-weight: 700; }
        .step-skip .step-name {
            color: var(--text-muted); opacity: .55;
            text-decoration: line-through;
            text-decoration-color: var(--border-strong);
        }
        /* 名称被截断时，悬停给出全文 */
        .step-name.truncated::after {
            content: attr(data-full);
            position: absolute; left: 0; top: calc(100% + 6px);
            z-index: 30;
            padding: 6px 10px; border-radius: 8px;
            background: var(--bg-card-solid);
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-card-hover);
            font-size: 11.5px; font-weight: 500; color: var(--text-primary);
            white-space: normal; width: max-content; max-width: 260px;
            opacity: 0; pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .step:hover .step-name.truncated::after { opacity: 1; transform: none; }

        /* 说明行：只在进行中 / 被点开 / 失败时展开 */
        .step-line {
            grid-column: 2 / -1;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            max-height: 0; opacity: 0;
            transition: max-height 0.2s ease, opacity 0.2s ease, margin 0.2s ease;
        }
        .step-run .step-line,
        .step.focused .step-line,
        .step-err .step-line {
            max-height: 20px; opacity: 1; margin-top: 2px;
        }

        .step-time {
            font-size: 10px; color: var(--text-muted);
            font-variant-numeric: tabular-nums; white-space: nowrap;
            padding: 1px 6px; border-radius: 4px;
            min-width: 44px; text-align: right;
            transition: background 0.25s ease, color 0.25s ease;
        }
        .step-ok .step-time {
            /* 实底：绿色徽标压在 .step-ok 那层 4% 绿底上会掉到 4.23:1 */
            background: var(--bg-card-solid); color: var(--ok-fg); font-weight: 700;
        }
        .step-run .step-time {
            background: color-mix(in srgb, var(--dp) 15%, transparent);
            color: var(--dp-fg); font-weight: 700;
        }
        .step-err .step-time { background: var(--danger-bg); color: var(--danger-fg); font-weight: 700; }
        .step-skip .step-time { background: transparent; color: var(--text-muted); opacity: .55; }
        .step-time.slow { background: var(--warn-bg); color: var(--warn-fg); }

        .step-retry-btn {
            width: 18px; height: 18px; border-radius: 5px;
            border: 1px solid var(--danger-fg);
            background: var(--danger-bg); color: var(--danger-fg);
            display: none; align-items: center; justify-content: center;
            font-size: 10px; cursor: pointer; font-family: inherit; padding: 0;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .step-retry-btn:hover { background: color-mix(in srgb, var(--danger-fg) 20%, transparent); }
        .step-err .step-retry-btn { display: flex; }

        .step-run {
            background: color-mix(in srgb, var(--dp) 9%, transparent);
            box-shadow: inset 3px 0 0 var(--dp);
        }
        .step-ok { background: color-mix(in srgb, var(--ok-fg) 4%, transparent); }

        /* 等待输入：这一步不会自己往下走。用琥珀色与「进行中」的靛蓝区分开 ——
           它是「需要你介入」，既不是跑得好也不是出错 */
        .step-wait {
            background: color-mix(in srgb, var(--bar-warn) 10%, transparent);
            box-shadow: inset 3px 0 0 var(--bar-warn);
        }
        .step-wait::before { background: color-mix(in srgb, var(--warn-fg) 40%, var(--border-subtle)); }
        .step-wait .step-dot {
            background: var(--warn-fg); border-color: var(--warn-fg); color: #fff;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: -1px;
            animation: pulseWarn 1.3s ease-in-out infinite;
        }
        /* 深色下琥珀是亮底 → 翻成深字（亮底白字只有 1.9:1） */
        .dark .step-wait .step-dot { color: #0F172A; }
        .step-wait .step-name { color: var(--text-primary); font-weight: 700; }
        .step-wait .step-time { background: var(--warn-bg); color: var(--warn-fg); font-weight: 700; }
        .step-wait .step-line { max-height: 20px; opacity: 1; margin-top: 2px; }
        /* 等待态那层琥珀底衬会把三级文字压到 4.25:1 —— 说明行这时承载「为什么停下来」，
           提到二级文字色（浅 6.6:1 / 深 7.6:1 左右） */
        .step-wait .step-line { color: var(--text-secondary); }
        @keyframes pulseWarn {
            0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn-fg) 22%, transparent); }
            50%      { box-shadow: 0 0 0 7px color-mix(in srgb, var(--warn-fg) 7%, transparent); }
        }

        /* 步骤内进度条（只有上传步有） */
        .step-bar {
            grid-column: 2 / -1; display: block;
            height: 6px; border-radius: 999px;
            background: var(--bar-track);
            overflow: hidden; margin-top: 2px;
        }
        .step-bar > span {
            display: block; height: 100%; border-radius: 999px; width: 0;
            background: var(--dp);
            transition: width 0.12s linear, background 0.3s ease;
        }
        /* 原来的 45° 白色流动条纹是装饰渐变，去掉；"在传"由宽度增长 + 步骤圆点脉冲表达 */
        .step-ok .step-bar > span { background: var(--bar-ok); background-image: none; animation: none; }

        /* 折叠已完成的步骤 */
        .dp-tasks.folded .step-ok:not(.focused) {
            max-height: 0; padding-top: 0; padding-bottom: 0;
            margin: 0; opacity: 0; overflow: hidden;
        }

        .jump-btn {
            position: absolute; right: 14px; bottom: 12px; z-index: 5;
            padding: 4px 10px; border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--dp) 40%, transparent);
            background: var(--bg-card-solid); color: var(--dp-fg);
            font-family: inherit; font-size: 10.5px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 12px rgba(15,23,42,0.12);
            animation: jumpIn 0.2s ease;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .jump-btn:hover { background: color-mix(in srgb, var(--dp) 10%, var(--bg-card-solid)); transform: translateY(-1px); }
        @keyframes jumpIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        /* ---------- 右：执行面板 ---------- */
        .dp-exec { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
        .dp-exec-head {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; flex-wrap: wrap;
            padding: 8px var(--pad-x);
            border-bottom: 1px solid var(--border-subtle);
        }
        .dp-exec-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .dp-exec-title {
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .exec-meta {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 11px; color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }
        .exec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--idle-fg); flex-shrink: 0; }
        .exec-meta.run .exec-dot { background: var(--dp); animation: pulse 1.1s ease-in-out infinite; }
        .exec-meta.ok  .exec-dot { background: var(--ok-fg); }
        .exec-meta.err .exec-dot { background: var(--danger-fg); }
        .exec-meta.run { color: var(--dp-fg); font-weight: 700; }
        .exec-meta.ok  { color: var(--ok-fg); font-weight: 700; }
        .exec-meta.err { color: var(--danger-fg); font-weight: 700; }
        /* 等待输入：慢闪的琥珀点 —— 和「执行中」的靛蓝脉冲区分开 */
        .exec-meta.wait .exec-dot { background: var(--warn-fg); animation: pulseWarn 1.3s ease-in-out infinite; }
        .exec-meta.wait { color: var(--warn-fg); font-weight: 700; }
        .exec-meta.jump { animation: metaJump 0.4s ease; }
        @keyframes metaJump {
            0%   { transform: translateX(-4px); opacity: 0.4; }
            100% { transform: none; opacity: 1; }
        }
        .dp-exec-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .exec-host {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; color: var(--text-muted); white-space: nowrap;
        }
        /* 连接身份：和「目标服务器」同级的执行上下文，放在它旁边 */
        .exec-user-wrap {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 0 4px 0 7px; height: 22px; border-radius: 6px;
            border: 1px solid var(--border-subtle); background: var(--bg-card-solid);
        }
        .exec-user-k { font-size: 10.5px; color: var(--text-muted); white-space: nowrap; }
        .exec-user {
            border: none; background: transparent; cursor: pointer;
            color: var(--text-secondary);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; font-weight: 700; padding: 0 0 0 1px;
        }
        .exec-user:focus { outline: none; }
        .exec-user-wrap:focus-within { border-color: var(--dp); }
        .exec-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 9px; border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: transparent; color: var(--text-secondary);
            font-family: inherit; font-size: 10.5px; font-weight: 600;
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .exec-btn:hover { border-color: var(--dp); color: var(--dp-fg); }
        .exec-btn.on {
            border-color: var(--dp); color: var(--dp-fg);
            background: color-mix(in srgb, var(--dp) 8%, transparent);
        }
        .exec-btn.alert {
            border-color: var(--warn-fg); color: var(--warn-fg);
            background: color-mix(in srgb, var(--warn-fg) 10%, transparent);
        }

        .console {
            flex: 1 1 auto; min-height: 0;
            overflow-y: auto;
            padding: var(--pad-y) var(--pad-x);
            background: var(--term-bg);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; line-height: 1.85;
        }
        .console-line { display: flex; gap: 10px; }
        .console-t { color: var(--term-dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .console-x { color: var(--term-fg); word-break: break-all; min-width: 0; }
        .console-line.ok   .console-x { color: var(--term-ok); }
        .console-line.warn .console-x { color: var(--term-warn); }
        .console-line.err  .console-x { color: var(--term-err); }
        .console-line.step-header .console-x {
            color: var(--term-dim); font-weight: 700; letter-spacing: 0.04em;
        }
        .console-line.step-header { margin-top: 6px; }
        /* 子命令的操作名：弱化一行，让长命令序列在终端里也能一眼分段 */
        .console-line.sub .console-x { color: var(--term-dim); }
        .console-line.flash { animation: lineFlash 1.2s ease; border-radius: 4px; }
        @keyframes lineFlash {
            0%   { background: color-mix(in srgb, var(--dp) 30%, transparent); }
            100% { background: transparent; }
        }
        .console-empty { color: var(--term-dim); }

        /* 终端里的内联输入：命令自己停下要密码时，就在它那一行里接着输。
           终端深浅两套都是深底浅字，所以这里用固定的浅色而不是主题令牌 */
        .console-line.ask { margin-top: 1px; }
        .console-x.ask-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .ask-label { color: var(--term-fg); }
        .ask-input {
            flex: 0 1 190px; min-width: 104px;
            padding: 1px 8px; border-radius: 5px;
            /* 0.24 的描边在终端底上只有 2.54:1 —— 一个要人往里填东西的控件，
               边界必须是 3:1 起（WCAG 1.4.11），太淡等于没画 */
            border: 1px solid rgba(255,255,255,0.44);
            background: rgba(255,255,255,0.06);
            color: var(--term-fg);
            font-family: inherit; font-size: 11.5px; line-height: 1.6;
            letter-spacing: 0.2em;
        }
        .ask-input:focus {
            outline: none;
            border-color: #A5B4FC;
            box-shadow: 0 0 0 2px rgba(165,180,252,0.35);
        }
        .ask-input::placeholder { color: var(--term-dim); letter-spacing: 0; }
        .ask-input:disabled { opacity: 0.5; }
        .ask-go {
            padding: 1px 10px; border-radius: 5px; cursor: pointer;
            border: 1px solid rgba(165,180,252,0.55);
            background: rgba(165,180,252,0.16);
            color: #E0E7FF; font-family: inherit; font-size: 11px; font-weight: 700;
            transition: background 0.15s ease;
        }
        .ask-go:hover { background: rgba(165,180,252,0.30); }
        .ask-note { font-size: 10.5px; color: var(--term-dim); }
        .ask-err { font-size: 10.5px; color: var(--term-err); }
        .ask-dots { color: var(--term-ok); letter-spacing: 0.2em; }
        .console-line.ask.done .ask-label { color: var(--term-dim); }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 1024px) {
            .dp-scope { grid-template-columns: 232px minmax(0, 1fr); }
        }
        @media (max-width: 860px) {
            :root { --pad-y: 10px; --pad-x: 12px; }
            /* 顶栏折成两行：第一行 标识 + 操作，第二行 概览 */
            .viewer-bar { padding: 8px 10px; gap: 8px 10px; }
            .viewer-name { font-size: 13px; }
            /* 折行后顶栏太挤，时间信息让位给操作按钮 */
            .last-sync { display: none; }
            .viewer-id { order: 1; }
            .viewer-actions { order: 2; }
            /* 上下文整行落到第三行，这时它内部才该按"横向并列"分组 */
            .meta-bar { order: 3; width: 100%; gap: 6px 18px; }
            .viewer-main { padding: 10px; }
            /* 左栏折叠成横向滚动条，右栏独占整宽 */
            .dp-scope { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
            /* 左栏折成横向条后自带滚动条会很抢眼，隐藏掉、靠内容自证可滑 */
            .dp-side {
                flex-direction: row; align-items: center; gap: 8px; padding: 8px;
                overflow-x: auto;
                scrollbar-width: none; -ms-overflow-style: none;
            }
            .dp-side::-webkit-scrollbar { display: none; }
            .dp-side-head { border: none; padding: 0 4px 0 6px; flex-shrink: 0; }
            .dp-side-head span:first-child { display: none; }
            .dp-cfg-list { flex-direction: row; align-items: center; padding: 0; gap: 8px; overflow: visible; }
            /* 横排时组头退化成组标签（色条 + 组名），分区框照旧 —— 并排三块比一串灰字清楚；
               折叠改成「收宽度」：组仍然是 grid，只把列从 1fr 换成 0fr，同一套逻辑复用 */
            .dp-group {
                grid-template-columns: auto 1fr; grid-template-rows: auto;
                align-items: center; gap: 8px;
                padding: 4px 6px;
                transition: grid-template-columns 0.22s ease;
            }
            .dp-group:has(.dp-group-head[aria-expanded="false"]) {
                grid-template-columns: auto 0fr; grid-template-rows: auto;
            }
            .dp-group-head { width: auto; padding: 0 2px; flex-shrink: 0; }
            .dp-group-head:hover { background: transparent; }
            .dp-group-n { display: none; }
            .dp-group-items { flex-direction: row; gap: 6px; padding: 0; }
            /* 横排时每项已经是独立卡片，缩进只会白吃宽度 ⇒ 归零即可，选择器不用改 */
            .dp-group-items { --indent: 0px; }
            /* 展开态必须放开 min-width：基础样式里的 min-width:0 是给「收宽度」折叠用的，
               一旦横排，它就允许 1fr 列被压到 0。不能写 auto —— 容器是 overflow:hidden，
               规范里「自动最小尺寸」遇到非 visible 的 overflow 直接归零，要用显式关键字 min-content。 */
            .dp-group:has(.dp-group-head[aria-expanded="true"]) .dp-group-items { min-width: min-content; }
            /* 横排时 hover 不可靠（触屏根本没有）⇒ 动作在这一档**常驻**，
               并把项右侧让出位置（52px）。这一档本来就是横向滚动，宽度不是稀缺品。 */
            .dp-item { flex-shrink: 0; min-width: 220px; }
            .dp-cfg-actions { right: 6px; opacity: 1; visibility: visible; transition: none; }
            .dp-item:hover .dp-cfg-cmd,
            .dp-item:focus-within .dp-cfg-cmd { opacity: 1; visibility: visible; }
            .dp-cfg {
                flex-shrink: 0; width: 100%; min-width: 0;
                padding: 9px 52px 9px 11px;
                border: 1px solid var(--border-subtle); border-radius: 10px;
            }
            .dp-side-foot { margin: 0; flex-shrink: 0; padding: 9px 12px; }
            /* 执行区折成上下：任务列变成横向步骤条 */
            .dp-output {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
                /* 窄屏上方内容多，给输出区保底高度，否则终端会被压到只剩三行 */
                min-height: 330px;
            }
            /* 右栏内容超出时整体滚动（圆角仍会裁切内容） */
            .dp-main { overflow-y: auto; }
            .dp-tasks { border-right: none; border-bottom: 1px solid var(--border-subtle); }
            .dp-tasks-progress { margin: 0 12px 4px; }
            .steps {
                flex-direction: row; overflow-x: auto; overflow-y: hidden;
                padding: 8px 10px; gap: 6px;
                scrollbar-width: none; scroll-snap-type: x proximity;
            }
            .steps::-webkit-scrollbar { display: none; }
            .step {
                flex-shrink: 0; min-width: 180px; max-height: none;
                border: 1px solid var(--border-subtle); border-radius: 10px;
                background: var(--bg-card-solid); box-shadow: none;
                scroll-snap-align: start;
            }
            .step::before { display: none; }
            .step-run {
                box-shadow: inset 0 -3px 0 var(--dp);
                background: color-mix(in srgb, var(--dp) 8%, var(--bg-card-solid));
            }
            /* 横向条里强调条要跟着转 90°：左侧竖条在卡片上看不见 */
            .step-wait {
                box-shadow: inset 0 -3px 0 var(--bar-warn);
                background: color-mix(in srgb, var(--bar-warn) 10%, var(--bg-card-solid));
            }
            .step-line { display: none; }
            .step-bar { display: none; }
            .dp-tasks.folded .step-ok:not(.focused) { max-height: 96px; padding: 8px 10px; opacity: 1; }
            .jump-btn { display: none; }
            .console { font-size: 11px; }
            .console-t { font-size: 10px; }
            /* 移动端改到顶部居中，避免和底部操作按钮打架 */
            .toast {
                bottom: auto; top: 12px; right: auto; left: 50%;
                transform: translateX(-50%) translateY(-24px);
            }
            .toast.show { transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 560px) {
            /* 这三条基规则没设同名属性，同特异度也不会互相打架 */
            .modal-actions { flex-direction: column-reverse; }
            .modal-actions .btn { justify-content: center; }
            /* 窄屏：主按钮独占一行（提示文案跟着换行到下一行），中止按钮让在它右边 */
            .dp-run .btn-run { width: 100%; justify-content: center; }
            .dp-run .run-hint { width: 100%; }
            /* 以下要覆盖弹窗表单的基规则 —— 那些基规则在本文件里写在**后面**，
               同特异度下后者胜出，媒体查询里的声明会被静默吃掉，所以必须提一档特异度 */
            .modal-form .modal-head { padding: 15px 16px 13px; }
            .modal.modal-form .modal-body { padding: 15px 16px; }
            .modal-form .modal-actions { padding: 15px 16px; }
            .modal-form .form-group { padding: 12px 12px 13px; }
            .modal-form .cmd-head-cmd i { display: none; }
            .modal-form .cmd-head,
            .modal-form .cmd-row { grid-template-columns: 92px minmax(0, 1fr) 28px 26px; }
            .file-item { grid-template-columns: auto minmax(0, 1fr) 22px; }
            .file-ico { height: 20px; min-width: 26px; padding: 0 5px; font-size: 8.5px; }
            .file-size { display: none; }
        }

        /* ============================================================
           弹窗 / Toast
           ============================================================ */
        .modal-mask {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(15,23,42,0.40);
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-mask.open { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--bg-card-solid);
            border-radius: var(--r-lg);
            width: 100%; max-width: 480px; max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 60px rgba(15,23,42,0.28);
            animation: modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: none; } }
        .modal-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 18px 22px 17px; border-bottom: 1px solid var(--border-subtle);
        }
        .modal-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
        .modal-close {
            width: 32px; height: 32px; border-radius: var(--r-sm); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary); background: transparent;
            border: none; font-size: 14px; font-family: inherit;
            transition: background 0.18s ease, color 0.18s ease;
        }
        .modal-close:hover { background: var(--border-subtle); color: var(--text-primary); }
        .modal-body { padding: 22px 24px; overflow-y: auto; }
        .modal-body > p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.75; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 22px; border-top: 1px solid var(--border-subtle); }

        .modal-field { margin-top: 16px; }
        .modal-field:first-child { margin-top: 0; }
        .modal-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        .modal-input {
            width: 100%; padding: 9px 13px; border-radius: 10px;
            border: 1px solid var(--border-field);
            background: var(--bg-card-solid); color: var(--text-primary);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .modal-input:focus { outline: none; border-color: var(--dp); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dp) 18%, transparent); }
        .modal-input.is-invalid { border-color: var(--bar-danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bar-danger) 20%, transparent); }
        /* 名称字段填的是中文描述，用等宽会显得别扭 */
        .modal-input.plain { font-family: inherit; font-size: 13px; }
        /* placeholder 不写颜色就吃浏览器默认灰，深色下只有 3.17:1 */
        .modal-input::placeholder { color: var(--text-muted); }
        .modal-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .modal-chip {
            padding: 5px 11px; border-radius: 7px;
            border: 1px solid var(--border-strong); background: var(--bg-card-solid);
            color: var(--text-secondary); cursor: pointer;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px; font-weight: 600;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .modal-chip:hover {
            border-color: var(--dp); color: var(--dp-fg);
            background: color-mix(in srgb, var(--dp) 6%, var(--bg-card-solid));
        }

        /* 卡片里的第二行（行内小字段）：左边一枚小标签，右边是控件。
           「分组」这四个字不能被卡片名代替，所以它自己带标签 —— 与摘要那块同一个 52px 标签列。 */
        .form-sub { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
        .form-sub-k { flex-shrink: 0; width: 52px; font-size: 11px; font-weight: 700; color: var(--text-muted); }
        .group-pick { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
        /* 单选 chip：选中那枚靠**一条过 3:1 的靛蓝描边** + 文字提色，不只靠底色差
           （底色差只有 1.06:1，等于看不出选中的是哪个）。中文标签，字体不跟着等宽走。 */
        .group-chip {
            padding: 4px 11px; border-radius: 999px;
            border: 1px solid var(--border-strong); background: var(--bg-card-solid);
            color: var(--text-secondary); cursor: pointer;
            font-family: inherit; font-size: 11px; font-weight: 600;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .group-chip:hover { border-color: var(--dp); color: var(--dp-fg); }
        .group-chip.on {
            border-color: var(--dp);
            background: color-mix(in srgb, var(--dp) 10%, var(--bg-card-solid));
            color: var(--dp-fg); font-weight: 700;
        }
        .group-chip:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
        /* 「新建分组」：默认是一枚加号胶囊，点开才在**同一位置**换成输入框 ——
           缺省态是"选"、新建按需才切到输入态，两态共用一个位置，不做成"多长出来一个字段"。
           虚线描边是"这里可以再加一个"的通用写法，与已选中的实线 chip 一眼分得开。 */
        .group-add {
            flex-shrink: 0; width: 30px; height: 25px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 999px; border: 1px dashed var(--border-field);
            background: transparent; color: var(--text-secondary); cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .group-add svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
        .group-add:hover { border-color: var(--dp); color: var(--dp-fg); background: color-mix(in srgb, var(--dp) 8%, var(--bg-card-solid)); }
        .group-add:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
        .group-add-input {
            flex-shrink: 0; width: 104px; height: 25px; padding: 0 10px;
            border-radius: 999px; border: 1px solid var(--dp);
            background: var(--bg-card-solid); color: var(--text-primary);
            font-family: inherit; font-size: 11px; font-weight: 700;
        }
        .group-add-input:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--dp) 16%, transparent); }
        .group-add-input::placeholder { color: var(--text-muted); }
        .modal-warn {
            display: flex; gap: 10px; align-items: flex-start;
            margin-top: 16px; padding: 12px 14px; border-radius: var(--r-md);
            background: var(--danger-bg); color: var(--danger-fg);
            font-size: 12.5px; line-height: 1.65;
        }
        .modal-warn.info { background: var(--idle-bg); color: var(--idle-fg); }
        .modal-warn strong { font-weight: 800; margin-right: 2px; }

        /* ============================================================
           部署配置表单（新增 / 编辑弹窗）
           ============================================================ */
        /* 表单比普通确认框长得多：宽度给到 660，「操作名称 + 命令」两列才不至于互相挤，
           路径与常用值 chip 也才排得下一行（chip 折行会凭空多占一行高度）；
           高度上限 94vh：三张卡片叠起来后，矮窗口下也尽量让整张表单留在首屏 */
        .modal.modal-form { max-width: 660px; max-height: 94vh; }
        /* 目录 / 文件选择器：路径与"大小 · 时间"要能读全，480 会把它频繁截断成省略号 */
        .modal.modal-picker { max-width: 560px; }
        .modal-form .modal-body { padding: 20px 22px; }
        .modal-form .modal-input { padding: 9px 13px; }

        /* 分组：一张卡片只回答一个问题（这是什么 / 传到哪 / 跑什么）。
           成块靠 --bg-subtle 的底色差，不再加描边 —— 卡面与区块底本来就不同色，
           再画一圈边等于把同一条边画两遍（纯色范式的判据：同色才用线）。
           卡片内边距比弹窗内边距紧一档：卡片自身已经是"块"，里外都松会显得整张表单只剩留白。 */
        .form-group {
            margin-top: 14px;
            padding: 15px 16px 16px;
            border-radius: 14px;
            background: var(--bg-subtle);
        }
        .form-group:first-of-type { margin-top: 0; }
        .form-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; }
        .form-group-no {
            width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: color-mix(in srgb, var(--dp) 14%, transparent);
            color: var(--dp-fg);
            font-size: 10.5px; font-weight: 800;
        }
        .form-group-title {
            font-size: 11.5px; font-weight: 800; letter-spacing: 0.04em;
            color: var(--text-secondary); white-space: nowrap;
        }
        /* 卡片头充当字段标签时（一个卡片只有一个字段），点卡片名要能聚焦到输入框 */
        .form-group-title[for] { cursor: pointer; }

        .modal-form .modal-field { margin-top: 14px; }
        /* 紧跟卡片头的第一个字段不要再叠一层上边距 —— 间距已经由卡片头的 margin-bottom 给过。
           （原先写的是 `.modal-field:first-child`，而卡片头永远排在字段前面，
             这条从来没匹配过，白多出 14px。） */
        .modal-form .form-group-head + .modal-field { margin-top: 0; }
        /* 独立标签行的样式：现在三张卡片的字段都把标签并进了卡片头，
           这条路只剩兜底（新增字段时若忘了传 inHead，至少样式是对的） */
        .modal-form .field-label { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
        .modal-form .field-label label { display: inline; margin-bottom: 0; }
        /* 必填用徽标而非跟在文字后的红星：红星在深色底上几乎看不见 */
        .field-req {
            padding: 2px 7px; border-radius: 4px;
            background: var(--danger-bg); color: var(--danger-fg);
            font-size: 10px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap;
        }
        /* 字段说明改挂到标签行的「?」气泡里（见 .tip-layer），不再常驻占位；
           下方只留校验错误，报错时高度只多出错误那一行 */
        .field-help {
            width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0; cursor: help;
            border: 1px solid var(--border-strong);
            background: transparent; color: var(--text-secondary);
            font-family: inherit; font-size: 10px; font-weight: 800; line-height: 1;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .field-help:hover, .field-help:focus-visible {
            border-color: var(--dp); color: var(--dp-fg);
            background: color-mix(in srgb, var(--dp) 10%, transparent);
        }
        /* 计数：多行命令填了几条，填的时候就要能看见。
           做成实底胶囊 —— 它落在卡片底上，同色 chip 会糊进底里。
           靠右：卡片头左边是「卡片名 + 必填 + ?」，右侧留给这类动态状态 */
        .field-count {
            margin-left: auto;
            flex-shrink: 0; white-space: nowrap;
            padding: 2px 9px; border-radius: 999px;
            background: var(--bg-card-solid); color: var(--text-secondary);
            font-size: 10px; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .field-err {
            display: flex; align-items: center; gap: 5px;
            margin-top: 7px;
            font-size: 10.5px; font-weight: 700; line-height: 1.5; color: var(--danger-fg);
        }
        .field-err::before { content: "⚠"; font-size: 11px; flex-shrink: 0; }
        .modal-form .modal-field.has-error .modal-input {
            border-color: var(--bar-danger);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--bar-danger) 20%, transparent);
        }

        /* 常用值：给一组孤零零的路径加个前缀，才知道这是可选而非示例 */
        .chips-row { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
        .chips-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-muted); white-space: nowrap; }

        /* 列名常驻：这两列各填什么，不该靠悬停气泡才知道。
           它放在滚动区**里面**并 sticky 住 —— 与下面的行同一个内宽，列宽才会逐像素对齐；
           放到滚动区外面的话，滚动条一占位两处就差几个 px。 */
        .cmd-head {
            position: sticky; top: 0; z-index: 2;
            display: grid; grid-template-columns: 108px minmax(0, 1fr) 30px 28px;
            gap: 8px; align-items: baseline;
            padding-bottom: 7px;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        .cmd-head-cmd { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
