        .cmd-head-cmd i { font-style: normal; font-weight: 600; letter-spacing: 0; }

        /* 启动命令列表：左边写这一步做什么，右边写要执行的命令。
           列表限高后内部滚动，条数再多也不会把弹窗撑高。
           行距用 margin 而不是 gap —— gap 会连表头一起算，sticky 时留出的缝会漏出行内容 */
        .cmd-rows {
            display: flex; flex-direction: column;
            /* 上限用视口比例表达「最多占多高」，不写死一个数：
               行高 40 + 提示行 43 ⇒ 三行就 179、四行带提示就 260 —— 写死 208 时最后一行底部的
               「建议写法」会被裁掉一半（`clip` 掉的文字 textContent 还在，断言查不出来，只有命中测试能抓）。
               `42vh` 在矮窗口自动收、高窗口给足；真的长到超过它才滚。 */
            max-height: min(300px, 42vh); overflow-y: auto;
        }
        /* 第 3 列是「需人工输入」开关：有些命令天生要停下来等人填，标记后执行到它会暂停 */
        .cmd-row { display: grid; grid-template-columns: 108px minmax(0, 1fr) 30px 28px; gap: 8px; align-items: center; margin-top: 8px; }
        /* 操作名是中文标签，用等宽会显得别扭 */
        .cmd-op { font-family: inherit; font-size: 12.5px; }
        .cmd-run { font-size: 12.5px; }
        .cmd-del {
            width: 28px; padding: 0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid transparent; background: transparent;
            color: var(--text-muted); cursor: pointer; font-family: inherit; font-size: 11.5px;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .cmd-del:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger-fg); border-color: var(--danger-fg); }
        .cmd-del:disabled { opacity: 0.4; cursor: not-allowed; }
        /* 用 >_ 而不是 ⌨：U+2328 在本机没有文本字形，兜底落到彩色 emoji 字体，
           既不跟着 color 走（开关的选中态只能靠底色区分），深色下又是一坨深蓝 */
        .cmd-ask {
            width: 30px; padding: 0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border-strong); background: transparent;
            color: var(--text-muted); cursor: pointer;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px; font-weight: 700; letter-spacing: -0.5px;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        /* 两个图标按钮跟输入框等高：写死高度会在不同字号或缩放下错位 */
        .cmd-ask, .cmd-del { height: auto; align-self: stretch; }
        .cmd-ask:hover { border-color: var(--dp); color: var(--dp-fg); }
        .cmd-ask.on {
            border-color: var(--dp); color: var(--dp-fg);
            background: color-mix(in srgb, var(--dp) 14%, transparent);
        }
        /* 交互提示行：只有识别到「会等输入」或已标记时才出现，普通命令行不会被撑高。
           行里可能带动作按钮与一段等宽授权行，所以要允许换行、并按中线对齐 */
        .cmd-note {
            grid-column: 1 / -1;
            display: flex; align-items: center; flex-wrap: wrap; gap: 5px 7px;
            margin: 4px 2px 0;
            font-size: 11px; line-height: 1.6; color: var(--warn-fg);
        }
        .cmd-note.on { color: var(--dp-fg); }
        .cmd-note.done { color: var(--ok-fg); }
        .cmd-note .ic { flex-shrink: 0; font-weight: 800; }
        .cmd-note .note-t { min-width: 0; }
        /* 行内动作：低频、轻量，只用细描边，别在弹窗里抢注意力 */
        .cmd-note .act {
            flex-shrink: 0; padding: 0 8px; border-radius: 5px; cursor: pointer;
            border: 1px solid currentColor; background: transparent;
            color: inherit; font-family: inherit; font-size: 10.5px; font-weight: 700;
            line-height: 1.8;
            transition: background 0.15s ease;
        }
        .cmd-note .act:hover { background: color-mix(in srgb, currentColor 16%, transparent); }
        /* 免密授权行：等宽、可选中。底用卡面色 —— 它落在分组底上，同色会糊成一片 */
        .cmd-note code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px; padding: 1px 6px; border-radius: 5px;
            background: var(--bg-card-solid); border: 1px solid var(--border-strong);
            color: var(--text-primary);
            max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .cmd-edit > .cmd-add { margin-top: 10px; }
        .cmd-add {
            padding: 7px 13px; border-radius: 9px;
            border: 1px dashed var(--border-strong); background: transparent;
            color: var(--text-secondary); cursor: pointer; font-family: inherit;
            font-size: 11.5px; font-weight: 600;
            transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .cmd-add:hover { border-color: var(--dp); color: var(--dp-fg); background: color-mix(in srgb, var(--dp) 6%, transparent); }

        /* ============================================================
           服务器目录选择器（弹窗正文的第二种视图）
           —— 「服务器路径」不必手输：那台机器上有什么目录只有它自己知道。
              入口是字段标题右侧一个文字按钮（不占输入框宽度），点开把弹窗正文换成目录选择器。
              视图切换复用同一个弹窗的头 / 正文 / 底，**不另起浮层** ——
              正文里飘出来的下拉会被 `.modal-body{overflow-y:auto}` 裁掉（本项目踩过一次）。
           ============================================================ */
        .field-act {
            flex-shrink: 0; padding: 0; border: none; background: transparent;
            color: var(--dp-fg); font-family: inherit;
            font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .field-act:hover { text-decoration: underline; text-underline-offset: 2px; }
        .field-act:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 4px; }

        .pick-crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 1px; }
        .pick-crumb {
            padding: 3px 6px; border-radius: 6px; border: none; background: transparent;
            color: var(--text-secondary); font-family: inherit;
            font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .pick-crumb:hover { background: var(--border-subtle); color: var(--text-primary); }
        .pick-crumb.current { color: var(--text-primary); cursor: default; }
        .pick-crumb.current:hover { background: transparent; }
        .pick-sep { color: var(--text-muted); font-size: 11px; }

        /* 当前目录 + 「用这个目录」：选的是目录不是文件，所以"选中"必须有一个明确的落点 */
        .pick-bar {
            display: flex; align-items: center; gap: 10px;
            margin-top: 10px; padding: 7px 9px 7px 11px; border-radius: 10px;
            background: var(--bg-subtle);
        }
        .pick-bar code {
            flex: 1 1 auto; min-width: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11.5px; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .pick-use {
            flex-shrink: 0; padding: 5px 12px; border-radius: 8px; cursor: pointer;
            border: 1px solid var(--dp);
            background: color-mix(in srgb, var(--dp) 10%, var(--bg-card-solid));
            color: var(--dp-fg); font-family: inherit; font-size: 11.5px; font-weight: 700;
            transition: background 0.15s ease;
        }
        .pick-use:hover { background: color-mix(in srgb, var(--dp) 18%, var(--bg-card-solid)); }

        #pickFilter { margin-top: 10px; }
        .pick-list {
            margin-top: 10px; max-height: 264px; overflow-y: auto;
            border: 1px solid var(--border-subtle); border-radius: 10px;
        }
        .pick-list:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
        .pick-row {
            display: grid; grid-template-columns: 11px minmax(0, 1fr) auto;
            gap: 9px; align-items: center; width: 100%;
            padding: 8px 11px; border: none; border-bottom: 1px solid var(--border-subtle);
            background: transparent; font-family: inherit; text-align: left; cursor: pointer;
            transition: background 0.14s ease;
        }
        .pick-row:last-child { border-bottom: none; }
        .pick-row:hover { background: var(--border-subtle); }
        .pick-ico { color: var(--text-muted); display: flex; align-items: center; }
        .pick-chev {
            width: 11px; height: 11px; fill: none; stroke: currentColor;
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
        }
        /* 只列目录，所以名字用普通字体（目录名是中文/业务词，等宽会显得别扭） */
        .pick-name {
            font-family: inherit; font-weight: 700;
            font-size: 12.5px; color: var(--text-primary);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .pick-meta { font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
        /* 文件行与目录行的区别要落在形状上：目录是 chevron（继续往下走），文件是文件图标（到这儿为止）。
           只靠颜色区分的话，遮住颜色就分不出哪一行点了会关窗 */
        .pick-file { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .pick-row.is-file .pick-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
        .pick-row.is-file .pick-ico { color: var(--text-secondary); }
        .pick-row.is-file:hover .pick-ico { color: var(--dp-fg); }
        .pick-empty { padding: 28px 16px; text-align: center; font-size: 12px; color: var(--text-muted); }

        /* 「?」气泡必须挂在 .modal-body 之外 —— body 是 overflow-y:auto，
           挂在字段里的绝对定位气泡一贴到底部就会被裁掉一半 */
        .tip-layer {
            position: fixed; z-index: 400; pointer-events: none;
            max-width: 272px;
            padding: 8px 11px; border-radius: 9px;
            background: var(--bg-card-solid);
            border: 1px solid var(--border-strong);
            box-shadow: 0 8px 26px rgba(15,23,42,0.18);
            font-size: 11.5px; line-height: 1.65; color: var(--text-secondary);
        }
        .dark .tip-layer { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* 矮窗口（≤800 高）再收一档节奏，尽量让整张表单留在首屏。
           只在视口不足 800 高时生效，高窗口保持舒展的间距。
           注意是「收一档」不是「收紧」—— 收完仍要留得住分组的块感和字段间距。 */
        @media (max-height: 800px) {
            .modal-form .modal-body { padding: 14px 18px; }
            .form-group { margin-top: 10px; padding: 12px 13px 13px; }
            .form-group-head { margin-bottom: 10px; }
            .modal-form .modal-field { margin-top: 11px; }
            .chips-row { margin-top: 7px; }
            /* 命令行列表的上限跟着 42vh 自适应，这里不再单独压 —— 压到 150 会把提示行裁掉 */
        }

        .toast {
            /* 右下角：不压住左栏配置列表与顶栏 */
            position: fixed; bottom: 24px; right: 24px;
            transform: translateY(80px);
            background: var(--bg-card-solid); color: var(--text-primary);
            padding: 12px 20px; border-radius: var(--r-md);
            box-shadow: 0 12px 32px rgba(15,23,42,0.2);
            font-size: 13px; font-weight: 600; z-index: 300;
            opacity: 0; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; gap: 8px;
            border: 1px solid var(--border-subtle);
            max-width: calc(100vw - 32px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast[data-type="ok"] { border-color: color-mix(in srgb, var(--bar-ok) 40%, transparent); }
        .toast[data-type="warn"] { border-color: color-mix(in srgb, var(--bar-warn) 45%, transparent); }
        .toast[data-type="danger"] { border-color: color-mix(in srgb, var(--bar-danger) 45%, transparent); }
        .toast[data-type="ok"] .toast-ico { color: var(--ok-fg); }
        .toast[data-type="warn"] .toast-ico { color: var(--warn-fg); }
        .toast[data-type="danger"] .toast-ico { color: var(--danger-fg); }
        .toast-ico { font-weight: 800; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

<div class="viewer">

    <header class="viewer-bar">
        <!-- ① 身份：项目名 + 本页分区名（分区名做成标签，不再拼进标题占宽度） -->
        <div class="viewer-id">
            <span class="viewer-ico" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 1.9 13.9 4.7v6.6L8 14.1 2.1 11.3V4.7z"/>
                    <path d="M2.1 4.7 8 7.5l5.9-2.8M8 7.5v6.6"/>
                </svg>
            </span>
            <span class="viewer-name" title="支付系统重构 · 部署">支付系统重构</span>
            <span class="viewer-scope">部署</span>
        </div>

        <!-- ② 上下文：这次往哪部署（环境 / 目标主机 / 配置数），内容由 updateHeadMeta 渲染 -->
        <div class="meta-bar" id="headMeta"></div>

        <!-- ③ 状态与操作：现在怎么样 → 能做什么 -->
        <div class="viewer-actions">
            <span class="state-pill" id="headState" hidden></span>
            <span class="last-sync" id="lastSync">更新于 11:20</span>
            <button class="log-tool" onclick="refreshAll()" title="刷新部署配置">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M13.6 8a5.6 5.6 0 1 1-1.7-4"/>
                    <path d="M13.9 1.9v3.5h-3.5"/>
                </svg>
                刷新
            </button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换到深色主题" aria-pressed="false"></button>
            <button class="icon-btn danger" id="closeBtn" onclick="goOps()" title="关闭这个部署窗口" aria-label="关闭这个部署窗口">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
        </div>
    </header>

    <main class="viewer-main">
<div class="dp-scope">

    <!-- ========== 左栏：部署配置 ========== -->
    <aside class="dp-side">
        <div class="dp-side-head">
            <span>部署配置</span>
            <button class="dp-side-add" title="新增部署配置" aria-label="新增部署配置" onclick="askNewConfig()">＋</button>
        </div>
        <div class="dp-cfg-list" id="cfgList" role="tablist" aria-label="部署配置列表"></div>
        <button class="dp-side-foot" onclick="askNewConfig()">＋ 新增部署配置</button>
    </aside>

    <!-- ========== 右栏：当前配置 → 上传 → 执行 → 输出 ========== -->
    <section class="dp-main">

        <!-- 配置摘要。编辑 / 删除只留左栏列表里的行内入口 —— 同一个动作在右侧再来一对，
             等于让「当前这条」有两个入口，还占掉了标题行右侧的位置 -->
        <div class="dp-head">
            <div class="dp-head-top">
                <div class="dp-title" id="cfgTitle">—</div>
            </div>
            <div class="dp-spec">
                <div class="dp-spec-item">
                    <span class="dp-spec-k">上传到</span>
                    <span class="dp-spec-v" id="specPath">—</span>
                </div>
                <div class="dp-spec-item">
                    <span class="dp-spec-k">启动命令</span>
                    <span class="dp-spec-line">
                        <span class="dp-spec-v" id="specCmd">—</span>
                        <span class="dp-spec-more" id="specCmdMore" hidden></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- 上传文件：两种来源**二选一**（一次部署只会用一种） -->
        <div class="dp-upload">
            <div class="dp-label">
                <span>要上传的文件</span>
                <span class="aside" id="fileTotal"></span>
            </div>

            <div class="src-pick" role="radiogroup" aria-label="文件来源">
                <button class="src-opt on" id="srcOptPick" type="button" role="radio" aria-checked="true"
                        onclick="switchFileSrc('pick')"><span class="dot" aria-hidden="true"></span><span class="src-opt-t">从本机选择</span><span class="n" id="srcNPick" hidden></span></button>
                <button class="src-opt" id="srcOptLocal" type="button" role="radio" aria-checked="false"
                        onclick="switchFileSrc('local')"><span class="dot" aria-hidden="true"></span><span class="src-opt-t">绑定本地文件</span><span class="n" id="srcNLocal" hidden></span></button>
            </div>

            <!-- ① 从本机选择 -->
            <div class="src-panel" id="srcPanelPick">
                <!-- 拖拽区：真实可拖入，也支持点击选择 -->
                <div class="dropzone" id="dropzone" role="button" tabindex="0"
                     aria-label="选择或拖入要部署的文件" onclick="pickFiles()">
                    <span class="dz-ico" aria-hidden="true">
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
                             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 10.4V2.6"/>
                            <path d="M4.7 5.7 8 2.5l3.3 3.2"/>
                            <path d="M2.6 9.8v2.4a1.2 1.2 0 0 0 1.2 1.2h8.4a1.2 1.2 0 0 0 1.2-1.2V9.8"/>
                        </svg>
                    </span>
                    <span class="dz-t">拖文件到这里，或点击选择</span>
                    <span class="dz-d">jar / zip / tar.gz / sql / 静态资源</span>
                </div>
                <input type="file" id="fileInput" multiple onchange="onFilesPicked(this.files)">
            </div>

            <!-- ② 绑定本地文件：填本机路径，自动查有没有，有就直接用 -->
            <div class="src-panel" id="srcPanelLocal" hidden>
                <div class="bind-row">
                    <input class="bind-input" id="bindPath" type="text" spellcheck="false"
                           autocomplete="off" aria-label="本机文件的绝对路径"
                           placeholder="/Users/you/build/pay-api.jar">
                    <button class="bind-browse" id="bindBrowse" onclick="browseLocalFile()"
                            title="在本机目录里挑一个文件">浏览…</button>
                    <button class="bind-go" id="bindGo" onclick="bindLocal()">绑定</button>
                </div>
                <div class="bind-state" id="bindState" role="status"></div>
                <div class="bind-presets" id="bindPresets"></div>
            </div>

            <div class="file-list" id="fileList" hidden></div>
        </div>

        <!-- 执行。状态行只在有事要说时出现（好状态不必配一句注解） -->
        <div class="dp-run">
            <button class="btn-run" id="runBtn" onclick="startDeploy()">
                <span class="ic" aria-hidden="true"></span><span id="runText">开始部署</span>
            </button>
            <button class="btn-abort" id="abortBtn" onclick="abortDeploy()" hidden>
                <span class="ic" aria-hidden="true">
                    <svg viewBox="0 0 16 16"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.6" fill="currentColor"/></svg>
                </span>中止
            </button>
            <span class="run-hint" id="runHint" hidden></span>
        </div>

        <!-- 执行输出 -->
        <div class="dp-output">

            <!-- 左：任务列 -->
            <aside class="dp-tasks" id="taskCol">
                <div class="dp-tasks-head">

                    <span class="dp-tasks-stats">

                        <span class="task-count done" id="taskTotal" hidden>0.0s</span>

            <!-- 右：执行面板 -->

                <div class="dp-exec-head">
                    <div class="dp-exec-left">
                        <span class="dp-exec-title">执行输出</span>
                        <span class="exec-meta" id="execMeta">
                            <span class="exec-dot"></span>
                            <span class="exec-text">等待开始</span>
                        </span>

                    <div class="dp-exec-right">
                        <span class="exec-host" id="execHost">—</span>
                        <label class="exec-user-wrap"
                               title="这次连接用的是哪个身份。root 身份下 su / sudo 都不会要密码，同一条配置就不会停下来问人">
                            <span class="exec-user-k">身份</span>
                            <select class="exec-user" id="execUser" aria-label="连接身份">
                                <option value="deploy">deploy</option>
                                <option value="root">root</option>
                                <option value="appuser">appuser</option>
                            </select>
                        </label>
                        <button class="exec-btn on" id="followBtn" onclick="toggleFollow()"
                                title="新日志自动滚到底部">↓ 跟随</button>
                        <button class="exec-btn" id="copyBtn" onclick="copyConsole()"
                                title="复制全部日志">⧉ 复制</button>
                    </div>
                </div>
                <div class="console" id="console">
                    <div class="console-line">
                        <span class="console-t">--:--:--</span>
                        <span class="console-x console-empty">等待开始部署…</span>
                    </div>
                </div>
            </section>

        </div>

    </section>

</div>
    </main>
</div>

<!-- 弹窗：新增 / 编辑部署配置 -->
<div class="modal-mask" id="modalMask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
            <div class="modal-title" id="modalTitle">标题</div>
            <button class="modal-close" onclick="closeModal()" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-actions">
            <button class="btn btn-ghost" id="modalCancel" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="modalConfirm">确定</button>
        </div>
    </div>
</div>

<div class="tip-layer" id="tipLayer" role="tooltip" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
    /* ============================================================
       主题（与运维页共用同一个 key，跨页保持一致）
       ============================================================ */
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    /* 图标一律内联 SVG：同一个 16 网格、同一条 1.6 描边、stroke 吃 currentColor。
       字符图标（🌙 / ⟳ / ✕ / 📦）来自四个字体族，粗细与基线各不相同；非 ASCII 的
       还会落到 emoji 族，color 根本不参与渲染 ⇒ hover / 激活改色对图标无效 */
    const ICON_MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"'
        + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M13.4 9.7A5.7 5.7 0 0 1 6.3 2.6a5.7 5.7 0 1 0 7.1 7.1z"/></svg>';
    const ICON_SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"'
        + ' stroke-linecap="round" aria-hidden="true">'
        + '<circle cx="8" cy="8" r="3.1"/>'
        + '<path d="M8 1.5v1.9M8 12.6v1.9M1.5 8h1.9M12.6 8h1.9M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/></svg>';

    function applyTheme(dark) {
        root.classList.toggle('dark', dark);
        themeToggle.innerHTML = dark ? ICON_SUN : ICON_MOON;
        themeToggle.setAttribute('aria-pressed', String(dark));
        themeToggle.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
        localStorage.setItem('theme', dark ? 'dark' : 'light');
    }
    // 主题优先级：URL 参数 > localStorage。
    // ?theme= 是「渲染级验收」驱动深色态的入口 —— 页面不读它，深色场景会静默渲染成浅色，
    // 量出一模一样的数值，看着还像「全绿」。
    const urlTheme = new URLSearchParams(location.search).get('theme');
    applyTheme(urlTheme ? urlTheme === 'dark' : (localStorage.getItem('theme') || 'light') === 'dark');
    themeToggle.addEventListener('click', () => applyTheme(!root.classList.contains('dark')));

    /* ============================================================
       Toast
       ============================================================ */
    const TOAST_ICON = { ok: '✓', info: 'ℹ', warn: '⚠', danger: '✕' };
    let toastTimer;

    function toast(msg, type = 'ok') {
        const t = document.getElementById('toast');
        t.dataset.type = type;
        t.innerHTML = '';
        const ico = document.createElement('span');
        ico.className = 'toast-ico';
        ico.setAttribute('aria-hidden', 'true');
        ico.textContent = TOAST_ICON[type] || TOAST_ICON.ok;
        const txt = document.createElement('span');
        txt.textContent = msg;
        t.append(ico, txt);
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ============================================================
       独立窗口模式（从运维页用 window.open 打开时 URL 带 #win）
       ============================================================ */
    const IS_WINDOW = location.hash === '#win';
    /* 「关闭/返回」要回的是**运维页**，不是本页（与日志页同一份口径）——
       window.close() 只对脚本打开的窗口生效，直接访问 #win 时要靠这条兜底 */
    const OPS_URL = '工作-项目-项目详情-运维-index.html';
    /* 目标服务器由「从哪台机器进来」决定（运维页打开时带 ?host=），不再逐条配置 ——
       同一条部署流程在多台机器上是复用的，让每条配置各存一份机器名只会互相打架 */
    const TARGET_HOST = new URLSearchParams(location.search).get('host') || 'prod-web-01';
    /* 这次连接用的是谁的身份。
       它和「目标服务器」是同一类东西：由「从哪台机器、以什么身份进来」决定，不进配置。
       为什么它重要：**root 身份下 su / sudo 都不会要密码**，所以同一条配置会不会停下来问人，
       取决于连接身份 —— 不是取决于命令本身。 */
    let sessionUser = new URLSearchParams(location.search).get('user') || 'deploy';

    // 身份下拉框：URL 可能带来预设之外的身份（?user=ci-runner），要能显示出来，
    // 否则 select.value 设成不存在的值时会被浏览器回退成空字符串
    function ensureUserOption(u) {
        const sel = document.getElementById('execUser');
        if (!sel) return null;
        if (!sel.querySelector('option[value="' + String(u).replace(/"/g, '') + '"]')) {
            const o = document.createElement('option');
            o.value = u; o.textContent = u;
            sel.appendChild(o);
        }
        sel.value = u;
        return sel;
    }

    function setSessionUser(u, opts) {
        if (!u) return;
        sessionUser = u;
        ensureUserOption(u);
        renderConfig();
        resetRun();
        if (!(opts && opts.quiet)) toast('连接身份已切到 ' + u);
    }

    function goOps() {
        if (IS_WINDOW) {
            window.close();
            // close() 只对脚本打开的窗口生效；直接访问 #win 时兜底回跳转运维页
            setTimeout(() => { location.href = OPS_URL; }, 150);
            return;
        }
        location.href = OPS_URL;
    }

    /* ============================================================
       弹窗
       ============================================================ */
    const mask = document.getElementById('modalMask');
    const mTitle = document.getElementById('modalTitle');
    const mBody = document.getElementById('modalBody');
    const mConfirm = document.getElementById('modalConfirm');
    const mCancel = document.getElementById('modalCancel');
    const mBox = mask.querySelector('.modal');
    let lastFocused = null;
    /* 目录选择器的状态：picker 非空 = 正文当前是选择器；
       formView 是被摘下来暂存的表单视图 DOM。声明放在这里是因为
       openConfirm 要复位它们，同一个块里一眼能看到全部弹窗状态。 */
    let picker = null;
    let formView = null;
    let formViewTitle = '';

    function openConfirm({ title, desc, warn, warnKind = 'danger', confirmText = '确定', danger = false, variant, render, onConfirm }) {
        lastFocused = document.activeElement;
        mTitle.textContent = title;
        mBody.innerHTML = '';
        /* 底部按钮每次开弹窗都要复位 —— 目录选择器会把它们改成「返回 / 无确认」，
           不复位的话下一次打开会带着上一次的「返回」和隐藏的确定按钮（本项目踩过一次） */
        picker = null;
        formView = null;
        mCancel.textContent = '取消';
        mCancel.onclick = () => closeModal();
        mConfirm.hidden = false;
        // 表单弹窗更宽：长路径与命令需要横向空间，挤在 480 里会被截断
        mBox.classList.toggle('modal-form', variant === 'form');
        // 选择器的宽度类也要一起复位，否则下一次开表单会带着 560 的宽度
        mBox.classList.remove('modal-picker');

        if (desc) {
            const p = document.createElement('p');
            p.textContent = desc;
            mBody.appendChild(p);
        }
        if (warn) {
            const box = document.createElement('div');
            box.className = 'modal-warn' + (warnKind === 'info' ? ' info' : '');
            box.setAttribute('role', 'note');
            const strong = document.createElement('strong');
            strong.textContent = warnKind === 'info' ? '说明：' : '影响：';
            const span = document.createElement('span');
            span.textContent = warn;
            box.append(strong, span);
            mBody.appendChild(box);
        }

        // render 负责挂自定义表单，返回 { focus, validate, onInvalid }
        const api = render ? render(mBody) : null;

        mConfirm.textContent = confirmText;
        mConfirm.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
        mConfirm.onclick = () => {
            if (api && api.validate && api.validate() !== true) {
                if (api.onInvalid) api.onInvalid();
                return;
            }
            closeModal();
            if (onConfirm) onConfirm();
        };

        mask.classList.add('open');
        // focus 允许传函数：编辑态要先 focus 再全选，光给一个元素做不到
        const focusTarget = api && api.focus ? api.focus : mConfirm;
        if (typeof focusTarget === 'function') focusTarget();
        else focusTarget.focus();
    }

    function closeModal() {
        if (!mask.classList.contains('open')) return;
        mask.classList.remove('open');
        // 停在选择器里被关掉时，把这两个状态一起收干净（openConfirm 也会复位，这里是兜底）
        picker = null;
        formView = null;
        if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    /* ============================================================
       数据：部署配置
       path = 传到服务器上的哪个位置，cmd = 传完之后执行什么
       failAt 仅用于把「失败链」演示出来（健康检查不通过 → 自动回滚）
       ============================================================ */
    let CONFIGS = [
        { id: 'c1', name: '应用包 · 全量启动', group: 'app',
          path: '/opt/app/releases',
          cmd: [
              { op: '同步文件', run: 'rsync -a --delete /opt/app/releases/ /opt/app/current/' },
              { op: '重启服务', run: 'su - deploy -c "systemctl restart pay-api"' },
              { op: '健康检查', run: 'curl -sf http://127.0.0.1:8080/healthz' }
          ] },
        { id: 'c2', name: '前端静态资源', group: 'web',
          path: '/var/www/pay-web/dist',
          cmd: [
              { op: '校验配置', run: 'nginx -t' },
              { op: '重载 Nginx', run: 'nginx -s reload' }
          ] },
        { id: 'c3', name: '数据库迁移脚本', group: 'db',
          path: '/opt/db/migrations',
          cmd: [
              { op: '备份当前库', run: 'pg_dump -Fc -f /opt/db/pre-migration.dump paydb' },
              { op: '执行迁移', run: 'psql -f /opt/db/migrations/latest.sql paydb' }
          ],
          failAt: 'health' },
        // 演示「需要人工输入」：su - 会停下来等密码，第 2 步不会自己往下走
        { id: 'c4', name: '切用户重启 · 需输入', group: 'app',
          path: '/opt/app/releases',
          cmd: [
              { op: '同步文件', run: 'rsync -a --delete /opt/app/releases/ /opt/app/current/' },
              { op: '切到 deploy', run: 'su - deploy', ask: true },
              { op: '重启服务', run: 'systemctl restart pay-api' }
          ] },
        // 演示「全自动」：同一件事改成免密写法，执行时一次都不问人
        { id: 'c5', name: '切用户重启 · 免密自动', group: 'app',
          path: '/opt/app/releases',
          cmd: [
              { op: '同步文件', run: 'rsync -a --delete /opt/app/releases/ /opt/app/current/' },
              { op: '免密重启', run: 'sudo -u deploy -n systemctl restart pay-api' },
              { op: '健康检查', run: 'curl -sf http://127.0.0.1:8080/healthz' }
          ] }
    ];

    let currentId = 'c1';
    /* 两种来源是**二选一**，所以两份各存一份（切换不清空）：
         · { src:'pick',  name, size }                       —— 方式①拖拽/选择
         · { src:'local', path, name, size, time, found }    —— 方式②绑定本机路径
       `found === false` 只可能出现在 local 上，它会挡住"开始部署"。
       `files()` 是**当前来源**那一份 —— 清单、总计、第一步名字、开始部署都只看它。
       切走的那一边仍有文件时，那一边的分段标签上会带条数（`renderFiles` 里刷），
       否则就成了"隐藏状态"：上一屏说 3 个文件、清单里 0 行，谁也说不清。 */
    let fileSrc = 'pick';
    const staged = { pick: [], local: [] };
    const files = () => staged[fileSrc];
    const SRC_LABEL = { pick: '本机选择', local: '绑定本机' };
    let steps = [];
    let running = false;
    let timers = [];
    let barTimers = [];
    let stepTicks = {};              // 各步「进行中耗时」的定时器
    let retryCount = {};             // 各步重试次数
    let followTail = true;           // 终端是否自动跟随到底部
    let savedMeta = { text: '等待开始', kind: '' };
    let credCache = {};              // 本次执行里已输入过的凭据（只缓存 sudo —— su 每次都会重新问）
    let pendingAsk = null;           // 正等着输入的那一行：中止 / 复位时要能收掉它

    const cfg = () => CONFIGS.find(c => c.id === currentId) || null;
    const pad2 = n => String(n).padStart(2, '0');
    const hhmmss = (d = new Date()) => pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());

    function fmtSize(b) {
        if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
        if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
        if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
        return b + ' B';
    }
    /* 未找到的绑定文件按 0 计 —— 它不会被真的上传，算进总量是假账 */
    const totalSize = () => files().reduce((s, f) => s + (f.found === false ? 0 : f.size), 0);
    function extOf(name) {
        const m = String(name).match(/\.([A-Za-z0-9]+)$/);
        return m ? m[1].toUpperCase().slice(0, 4) : 'FILE';
    }

    /* ============================================================
       本机文件（原型用的假表）—— 「绑定本地文件」查的就是它
       —— 真实产品里这一步来自本地 agent：请求一个绝对路径 → 返回 存在 / 大小 / 修改时间。
          没列进这张表的一律算「本机没有」，所以"未找到"是一条能当场走到的路，
          而不是只在文案里存在的状态。
       ============================================================ */
    const LOCAL_FS = {
        '/Users/yangliu/build/pay-api.jar':         { size: 134873088, time: '今天 09:41' },
        '/Users/yangliu/build/pay-web-dist.tar.gz': { size: 18874368,  time: '今天 10:02' },
        '/Users/yangliu/build/legacy/app-old.jar':  { size: 96468992,  time: '9月18日' }
    };
    /* 常用项刻意放了第三条（本机没有）：绑定之后立刻能看到"未找到"长什么样 */
    const LOCAL_PRESETS = [
        '/Users/yangliu/build/pay-api.jar',
        '/Users/yangliu/build/pay-web-dist.tar.gz',
        '/Users/yangliu/build/pay-api-2.3.1.jar'
    ];
    const localProbe = path => LOCAL_FS[path] || null;
    const baseName = p => String(p).replace(/\/+$/, '').split('/').pop() || '';

    /* 本机文件的目录树 —— **从 LOCAL_FS 现算**，不另存一份清单：
       两份清单一定会走岔（换了文件却忘了改树，浏览里就永远看不见它）。
       结构与服务器那棵树完全同构，所以选择器只差一个"根"与一种"选中语义"。 */
    const LOCAL_TREE = (function buildLocalTree() {
        const root = fsDir({});
        Object.keys(LOCAL_FS).forEach(p => {
            const segs = String(p).split('/').filter(Boolean);
            let node = root;
            segs.forEach((seg, i) => {
                if (i === segs.length - 1) {
                    node.children[seg] = fsFile(fmtSize(LOCAL_FS[p].size), LOCAL_FS[p].time);
                } else {
                    if (!node.children[seg]) node.children[seg] = fsDir({});
                    node = node.children[seg];
                }
            });
        });
        return root;
    })();
    /* 路径为空时落在哪：第一条本机文件所在的目录 ——
       与服务器树取 /opt/app 同一个理由，别让人每次从根点三层到达常用位置 */
    const LOCAL_HOME = (function localHome() {
        const first = Object.keys(LOCAL_FS)[0] || '';
        return first.split('/').filter(Boolean).slice(0, -1);
    })();
    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }

    /* ============================================================
       字段「?」说明气泡
       气泡挂在页面根下（#tipLayer）：弹窗主体是 overflow-y:auto，
       挂在字段里的绝对定位气泡贴到底部会被裁掉一半。
       ============================================================ */
    const tipLayer = document.getElementById('tipLayer');

    function showTip(anchor, text) {
        tipLayer.textContent = text;
        tipLayer.hidden = false;
        const r = anchor.getBoundingClientRect();
        const w = tipLayer.offsetWidth, h = tipLayer.offsetHeight;
        const box = document.querySelector('#modalMask .modal');
        const boxR = box ? box.getBoundingClientRect() : null;
        let left, top;
        if (boxR && boxR.right + 12 + w <= window.innerWidth - 12) {
            // 首选弹窗右侧外侧：气泡从字段右边弹出会压住正在填的输入框
            left = boxR.right + 12;
            top = Math.max(12, Math.min(r.top - 6, window.innerHeight - h - 12));
        } else {
            // 窄视口退回锚点下方，下方放不下再翻到上方
            left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
            top = r.bottom + 8;
            if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);
        }
        tipLayer.style.left = left + 'px';
        tipLayer.style.top = top + 'px';
    }
    function hideTip() { tipLayer.hidden = true; }

    function helpBtn(text) {
        const b = el('button', 'field-help', '?');
        b.type = 'button';
        b.setAttribute('aria-label', '字段说明：' + text);
        b.addEventListener('mouseenter', () => showTip(b, text));
        b.addEventListener('mouseleave', hideTip);
        b.addEventListener('focus', () => showTip(b, text));
        b.addEventListener('blur', hideTip);
        // 触屏没有 hover：点一下也能看
        b.addEventListener('click', e => { e.preventDefault(); showTip(b, text); });
        return b;
    }
    document.addEventListener('click', e => { if (!e.target.closest('.field-help')) hideTip(); });
    document.getElementById('modalBody').addEventListener('scroll', hideTip);

    /* ============================================================
       左栏：配置列表 —— 按「这次部署动的是什么」分组
       —— 分组现在是**配置自己的标签**（`c.group`）：新增/编辑时在表单里选，
          选了什么就归到哪一组（用户口径「新增的时候加标签，添加到对应的分组中」）。
          没有标签时**退回按路径推断** —— 老数据、或者别处写进来的配置也能有个去处，
          不至于掉进"无分组"的洞里。
       ============================================================ */
    /* 「其它」既是兜底组、也是用户能选的一项，但它**不再靠"排在最后"来当兜底** ——
       一旦在它后面插进新建的分组，`[length-1]` 就会漂移到那个新组上，
       路径推断不中的配置会莫名其妙落进用户刚建的分组。兜底认 id，不认位置。 */
    const GROUP_OTHER = { id: 'other', name: '其它', match: () => false };
    const DEPLOY_GROUPS = [
        { id: 'app', name: '应用服务', match: p => /^\/opt\/app(\/|$)/.test(p) },
        { id: 'web', name: '前端资源', match: p => /^\/var\/www(\/|$)/.test(p) },
        { id: 'db',  name: '数据库',   match: p => /^\/opt\/db(\/|$)/.test(p) },
        GROUP_OTHER
    ];
    const foldedGroups = {};     // 各组的折叠状态：重渲染时从这里恢复

    function groupFromPath(path) {
        const p = String(path || '');
        return (DEPLOY_GROUPS.find(g => g.id !== GROUP_OTHER.id && g.match(p)) || GROUP_OTHER).id;
    }
    /* 新建分组：插在「其它」之前，且不参与路径推断（它是用户显式选的）。
       id 用递增编号而不是名字 —— 名字是给眼睛看的，左栏归组与已存数据认的是 id。
       撞名直接复用已有那一组：并排出现两个同名分组，会让人以为"新建没生效" */
    let groupSeq = 0;
    function addDeployGroup(name) {
        const n = String(name || '').trim();
        if (!n) return null;
        const same = DEPLOY_GROUPS.find(g => g.name === n);
        if (same) return same;
        groupSeq++;
        const g = { id: 'g' + groupSeq, name: n, match: () => false };
        DEPLOY_GROUPS.splice(DEPLOY_GROUPS.length - 1, 0, g);
        return g;
    }
    const groupName = id => (DEPLOY_GROUPS.find(g => g.id === id) || {}).name || '';
    /* 标签优先、路径兜底。两处不要各写一遍这个 `||`（表单里预选时也要用） */
    function groupFor(c) { return (c && c.group) || groupFromPath(c && c.path); }

    /* 列表项 + 行内「编辑 / 删除」。形态与三条约束见 CSS 那段注释 */
    function cfgItem(c) {
        const wrap = el('div', 'dp-item');

        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dp-cfg' + (c.id === currentId ? ' active' : '');
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', String(c.id === currentId));
        b.dataset.id = c.id;
        // 分组后每项窄了一截，名称和路径都可能被截断 —— 用 title 兜底给全文
        b.title = c.name + '\n' + c.path;
        b.onclick = () => selectConfig(c.id);
        b.append(el('span', 'dp-cfg-name', c.name),
                 el('span', 'dp-cfg-cmd', c.path));

        const acts = el('div', 'dp-cfg-actions');
        const edit = el('button', 'dp-cfg-act', '✎');
        edit.type = 'button';
        edit.title = '编辑「' + c.name + '」';
        edit.setAttribute('aria-label', edit.title);
        // stopPropagation：动作是项的兄弟，不阻止的话这次点击还会传到项的 click
        edit.onclick = e => { e.stopPropagation(); askEditConfig(c.id); };
        const del = el('button', 'dp-cfg-act danger', '✕');
        del.type = 'button';
        del.title = '删除「' + c.name + '」';
        del.setAttribute('aria-label', del.title);
        del.onclick = e => { e.stopPropagation(); askDeleteConfig(c.id); };
        acts.append(edit, del);

        wrap.append(b, acts);
        return wrap;
    }

    function renderCfgList() {
        const list = document.getElementById('cfgList');
        list.innerHTML = '';

        if (!CONFIGS.length) {
            const box = el('div', 'dp-empty');
            box.append(el('div', 'ico', '📦'), el('div', 't', '还没有部署配置'),
                       el('div', 'd', '点下方「新增部署配置」填上传路径和启动命令'));
            list.appendChild(box);
            return;
        }

        DEPLOY_GROUPS.forEach(g => {
            const items = CONFIGS.filter(c => groupFor(c) === g.id);
            if (!items.length) return;      // 空组不渲染 —— 一条都没有的分类标签只是噪音

            // role=presentation：让 tab 透传上浮，tablist 的直接子元素就不会是组容器
            const box = el('div', 'dp-group');
            box.dataset.group = g.id;
            box.setAttribute('role', 'presentation');

            const head = el('button', 'dp-group-head');
            head.type = 'button';
            head.setAttribute('aria-expanded', String(!foldedGroups[g.id]));
            head.setAttribute('aria-controls', 'dpg-' + g.id);
            const mark = el('span', 'dp-group-mark');
            mark.setAttribute('aria-hidden', 'true');
            const chev = el('span', 'dp-group-chev', '⌄');
            chev.setAttribute('aria-hidden', 'true');
            head.append(mark, el('span', 'dp-group-name', g.name),
                        el('span', 'dp-group-n', items.length + ' 条'), chev);
            head.onclick = () => {
                foldedGroups[g.id] = !foldedGroups[g.id];
                renderCfgList();
            };

            const body = el('div', 'dp-group-items');
            body.id = 'dpg-' + g.id;
            body.setAttribute('role', 'presentation');
            items.forEach(c => body.appendChild(cfgItem(c)));

            box.append(head, body);
            list.appendChild(box);
        });
    }

    function selectConfig(id) {
        if (running) { toast('部署执行中，暂不能切换配置', 'warn'); return; }
        if (id === currentId) return;
        currentId = id;
        renderCfgList();
        renderConfig();
        resetRun();
    }

    function renderConfig() {
        const c = cfg();
        document.getElementById('cfgTitle').textContent = c ? c.name : '—';
        // 值一律单行省略（行高不随内容跳），所以两个字段都要给 title 兜底
        const pathEl = document.getElementById('specPath');
        pathEl.textContent = c ? c.path : '—';
        pathEl.title = c ? c.path : '';
        const cmdEl = document.getElementById('specCmd');
        const cmdMore = document.getElementById('specCmdMore');
        const cmdArr = c ? cmdList(c.cmd) : [];
        cmdEl.textContent = cmdArr.length ? cmdArr[0].run : '—';
        cmdEl.title = cmdArr.map(x => (x.op ? '[' + x.op + '] ' : '') + x.run + (needsHuman(x) ? '（需人工输入）' : '')).join('\n');
        // 摘要先回答「这条配置要不要人盯着」：全自动 → 绿标；有要输入的 → 琥珀；能改但还没改 → 靛蓝提示
        const sum = autoSummary(c);
        const bits = [];
        if (cmdArr.length > 1) bits.push('共 ' + cmdArr.length + ' 条');
        let badge = '', cls = '', title = '';
        if (sum.full) {
            cls = ' auto';
            badge = '全自动';
            title = '配置里没有会等输入的命令，执行时不需要人工介入'
                + '（自研脚本的交互识别不出来，要它自己用 >_ 标记）';
        } else if (sum.askN) {
            cls = ' need';
            badge = '需输入 ' + sum.askN + ' 处';
            title = '有 ' + sum.askN + ' 处命令会停下来等输入';
        } else if (sum.rew) {
            cls = ' fix';
            badge = '可免密 ' + sum.rew + ' 处';
            title = '有 ' + sum.rew + ' 处命令还在用会要密码的写法，改成非交互写法（sudo -n / BatchMode）才不用人盯着';
        } else if (sum.ext) {
            cls = ' fix';
            badge = '凭据文件 ' + sum.ext + ' 处';
            title = '这几条要靠服务器上的凭据文件（~/.pgpass 等）才免交互';
        }
        cmdMore.hidden = !bits.length && !badge;
        cmdMore.className = 'dp-spec-more' + cls;
        cmdMore.title = title + '（当前连接身份 ' + sessionUser + '）';
        cmdMore.textContent = badge && !bits.length ? badge : bits.concat(badge || []).join(' · ');
        const hostEl = document.getElementById('execHost');
        if (hostEl) hostEl.textContent = '本机 → ' + TARGET_HOST;
        const userSel = document.getElementById('execUser');
        if (userSel && userSel.value !== sessionUser) userSel.value = sessionUser;
        updateHeadMeta();
    }

    /* 顶栏上下文：三条都是「这次往哪部署」的背景，与运行状态分开放 ——
       混成一排时四种性质等重，真正需要一眼看到的「运行中」会被平均掉 */
    function updateHeadMeta() {
        const box = document.getElementById('headMeta');
        box.innerHTML = '';

        const item = (cls) => {
            const n = el('span', 'meta-item' + (cls ? ' ' + cls : ''));
            box.appendChild(n);
            return n;
        };

        // ① 环境：决定这次部署的风险等级，三条里只给它加重
        const env = item('meta-env');
        env.appendChild(el('span', 'dot'));
        env.appendChild(el('span', null, '生产环境'));

        // ② 目标主机：位置信息不是状态，不借用状态绿（那会把绿字压到绿底上）
        const host = item();
        host.appendChild(el('span', null, '目标主机'));
        host.appendChild(el('b', null, TARGET_HOST));

        // ③ 配置数：背景统计，压低一档
        item('meta-weak').appendChild(el('span', null, CONFIGS.length + ' 个配置'));

        // 运行态：版本号是标识、状态词是结论，锚在最右
        const pill = document.getElementById('headState');
        if (pill) {
            pill.innerHTML = '';
            pill.appendChild(el('span', 'dot'));
            pill.appendChild(el('span', 'ver', 'v2.3.1'));
            pill.appendChild(el('span', null, '运行中'));
            pill.hidden = false;
        }
    }

    /* ============================================================
       上传：① 选文件 / 拖入　② 绑定本机路径
       ============================================================ */
    function pickFiles() {
        if (running) { toast('部署执行中，请先中止或等待完成', 'warn'); return; }
        document.getElementById('fileInput').click();
    }

    function onFilesPicked(fileList) {
        if (!fileList || !fileList.length) return;
        fileSrc = 'pick';                   // 能手选文件，就说明这次要用"从本机选择"
        const arr = staged.pick;
        let n = 0;
        Array.prototype.forEach.call(fileList, f => {
            const i = arr.findIndex(x => x.name === f.name);
            const it = { src: 'pick', name: f.name, size: f.size };
            if (i > -1) arr[i] = it;        // 同名覆盖，避免列出两个同名文件
            else arr.push(it);
            n++;
        });
        // 清空 input，否则再次选同一个文件不会触发 change
        document.getElementById('fileInput').value = '';
        renderFiles();
        refreshFirstStep();
        toast('已添加 ' + n + ' 个文件');
    }

    /* ---------- 方式②：绑定本机文件 ---------- */
    function bindLocal() {
        if (running) { toast('部署执行中，暂不能改文件列表', 'warn'); return; }
        const inp = document.getElementById('bindPath');
        const path = inp.value.trim();
        if (!path) { setBindState('bad', '先填一个本机文件的绝对路径'); inp.focus(); return; }
        if (path[0] !== '/') { setBindState('bad', '要绝对路径（从 / 开始）'); inp.focus(); return; }
        const name = baseName(path);
        if (!name) { setBindState('bad', '这个路径指向的是一个目录'); inp.focus(); return; }

        const hit = localProbe(path);
        const it = {
            src: 'local', path: path, name: name,
            size: hit ? hit.size : 0, time: hit ? hit.time : '', found: !!hit
        };
        // 能填路径绑定，就说明这次要用"绑定本地文件" —— 顺手把来源切过去（面板本来就该是它）
        fileSrc = 'local';
        const arr = staged.local;
        const i = arr.findIndex(x => x.name === name);
        if (i > -1) arr[i] = it; else arr.push(it);

        inp.value = '';   // 加进去就该清空 —— 它是个"新增"入口，不是待提交的表单字段
        setBindState(hit ? 'ok' : 'bad', hit
            ? '本机已找到 ' + name + ' · 已加入清单'
            : '本机没有这个文件 · 已标记「未找到」',
            hit ? fmtSize(hit.size) : path);
        renderFiles();
        refreshFirstStep();
        toast(hit ? '已绑定 ' + name + '（本机已找到，直接用这份）'
                  : '已绑定 ' + name + '，但本机没找到 —— 部署会被它挡住',
              hit ? '' : 'warn');
    }

    /* 结果行：只在"有话要说"时写字，平时留一条同高的空行（打字时整块不跳） */
    function setBindState(kind, text, detail) {
        const box = document.getElementById('bindState');
        if (!box) return;
        box.className = 'bind-state' + (kind ? ' ' + kind : '');
        box.innerHTML = '';
        if (!text) return;
        box.appendChild(el('span', null, text));
        if (detail) {
            // 结论与细节之间给一个分隔点：两者都是文字，不加记号会读成一句话
            box.appendChild(el('span', 'sep', '·'));
            const k = el('span', 'k', detail);
            k.title = detail;
            box.appendChild(k);
        }
    }

    /* 边打边查：只要命中就立刻绿字 —— 「自动查找本机有没有这个文件」本来就该是实时的。
       查不到先不说（打字打一半被红字打断很烦），留给失焦 / 绑定 / 按回车那一刻。 */
    let bindTimer = null;
    function bindTyping() {
        const inp = document.getElementById('bindPath');
        const path = inp.value.trim();
        inp.classList.remove('bad');
        clearTimeout(bindTimer);
        if (!path) { setBindState('', ''); return; }
        bindTimer = setTimeout(() => {
            const hit = localProbe(path);
            // 没命中就把上一轮的结论清掉 —— 留着一条已经过期的绿字比不显示更糟
            if (hit) setBindState('ok', '本机已找到', fmtSize(hit.size) + ' · ' + hit.time);
            else setBindState('', '');
        }, 220);
    }

    /* 「绑定本地文件」的浏览入口：同一个选择器，换成从本机树里挑**文件**。
       挑完直接绑定 —— 文件的选中语义就是"用它"，再让人点一次「绑定」等于把一步拆成两步 */
    function browseLocalFile() {
        if (running) { toast('部署执行中，暂不能改文件列表', 'warn'); return; }
        const inp = document.getElementById('bindPath');
        openFsPicker({
            src: 'local', mode: 'file', standalone: true,
            currentPath: inp.value.trim(),
            onPick: picked => {
                inp.value = picked;
                bindLocal();     // 走一遍正常绑定：状态行、清单、toast 都由它出
            }
        });
    }

    /* 失焦时给结论（这时"找不到"才是有效信息，而不是打字过程中的噪音） */
    function bindBlur() {
        const inp = document.getElementById('bindPath');
        const path = inp.value.trim();
        clearTimeout(bindTimer);
        if (!path) { setBindState('', ''); inp.classList.remove('bad'); return; }
        const hit = localProbe(path);
        setBindState(hit ? 'ok' : 'bad',
            hit ? '本机已找到' : '本机没有这个文件',
            hit ? fmtSize(hit.size) + ' · ' + hit.time : path);
        inp.classList.toggle('bad', !hit);
    }

    /* 常用项只印文件名：三条完整路径必然折成两行，而它们的前缀是重复的 ——
       一个 chip 折行要多占 22px，代价是终端少三行。完整路径进 title，点下去绑的也是它。 */
    function bindPresets() {
        const box = document.getElementById('bindPresets');
        if (!box) return;
        LOCAL_PRESETS.forEach(p => {
            const b = el('button', 'bind-chip', baseName(p));
            b.type = 'button';
            b.title = p + (localProbe(p) ? '（本机已找到）' : '（本机没有这个文件）');
            b.onclick = () => {
                document.getElementById('bindPath').value = p;
                bindLocal();
            };
            box.appendChild(b);
        });
    }

    function bindBindInput() {
        const inp = document.getElementById('bindPath');
        if (!inp) return;
        inp.addEventListener('input', bindTyping);
        inp.addEventListener('blur', bindBlur);
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); bindLocal(); }
        });
        bindPresets();
    }

    function removeFile(name) {
        if (running) { toast('部署执行中，暂不能改文件列表', 'warn'); return; }
        // 就地删：不要 `staged[fileSrc] = ...` 换一个新数组（那会让别处持有的引用变成孤儿）
        const arr = files();
        const i = arr.findIndex(f => f.name === name);
        if (i > -1) arr.splice(i, 1);
        renderFiles();
        refreshFirstStep();
    }

    /* 换来源：只换"当前用哪一种"，两边的清单各自留着（清空是破坏性的，而
       "切过去看一眼再切回来"是常见动作）。面板显隐、计数、清单、总计统一由
       renderFiles() 重画 —— 状态只有一个来源，别在切函数里再写一套。 */
    function switchFileSrc(src) {
        if (running) { toast('部署执行中，暂不能换文件来源', 'warn'); return; }
        if (!staged[src] || src === fileSrc) return;
        fileSrc = src;
        renderFiles();
        refreshFirstStep();
    }

    /* 每次重画都重查一遍本机 —— "自动查找"不能只在绑定的那一刻发生一次
       （用户可能刚把文件删了 / 刚生成出来） */
    function recheckLocal() {
        // 只查绑定那一份：`files` 现在是"当前来源"的函数，而带路径的条目只会出现在 staged.local
        staged.local.forEach(f => {
            const hit = localProbe(f.path);
            f.found = !!hit;
            f.size = hit ? hit.size : 0;
            f.time = hit ? hit.time : '';
        });
    }

    function renderFiles() {
        const list = document.getElementById('fileList');
        const total = document.getElementById('fileTotal');
        list.innerHTML = '';
        recheckLocal();     // 每次重画都重查一遍本机（只对绑定那份有意义）

        /* 二选一的三个表现（面板显隐 / 分段选中态 / 两边条数）全在这一处刷 ——
           切来源的入口只有 switchFileSrc，状态别有两个来源 */
        const isPick = fileSrc === 'pick';
        document.getElementById('srcPanelPick').hidden = !isPick;
        document.getElementById('srcPanelLocal').hidden = isPick;
        [['pick', 'srcOptPick', 'srcNPick'], ['local', 'srcOptLocal', 'srcNLocal']].forEach(pair => {
            const opt = document.getElementById(pair[1]), n = document.getElementById(pair[2]);
            const on = fileSrc === pair[0];
            opt.classList.toggle('on', on);
            opt.setAttribute('aria-checked', String(on));
            // 切走的那一边还有几条：写在标签上，别让它变成看不见的状态
            const c = staged[pair[0]].length;
            n.hidden = !c;
            n.textContent = String(c);
        });

        const arr = files();
        if (!arr.length) {
            list.hidden = true;
            total.textContent = '';
            return;
        }
        list.hidden = false;

        const miss = arr.filter(f => f.found === false);
        total.textContent = arr.length + ' 个文件 · 共 ' + fmtSize(totalSize())
            + (miss.length ? ' · ' + miss.length + ' 个未找到' : '');

        arr.forEach(f => {
            const row = el('div', 'file-item' + (f.found === false ? ' missing' : ''));
            // 来源不用再逐行打标：清单里只会有当前来源那一份（分段控件就在上面）
            row.append(el('span', 'file-ico', extOf(f.name)), el('span', 'file-name', f.name));
            row.appendChild(el('span', 'file-size' + (f.found === false ? ' bad' : ''),
                f.found === false ? '未找到' : fmtSize(f.size)));

            const del = el('button', 'file-del', '✕');
            del.type = 'button';
            del.title = f.src === 'local' ? '解绑 ' + f.path : '移除 ' + f.name;
            del.setAttribute('aria-label', del.title);
            del.onclick = () => removeFile(f.name);
            row.appendChild(del);
            // 绑定文件把完整路径挂在行上（清单里只看得到文件名）
            if (f.src === 'local') row.title = f.path + (f.time ? ' · ' + f.time : '');
            list.appendChild(row);
        });
    }

    function bindDropzone() {
        const dz = document.getElementById('dropzone');
        ['dragenter', 'dragover'].forEach(ev =>
            dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(ev =>
            dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
        dz.addEventListener('drop', e => {
            const fl = e.dataTransfer && e.dataTransfer.files;
            if (fl && fl.length) onFilesPicked(fl);
        });
        dz.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickFiles(); }
        });
    }

    /* ============================================================
       部署执行：串行跑步骤，带进度与终端输出
       ============================================================ */
    const FAIL_MSG = {
        check: '本地文件不可读或校验值不匹配',
        upload: '目标目录写入失败（磁盘空间不足）',
        backup: '回滚点创建失败',
        start: '启动命令返回非 0 退出码',
        health: '健康检查连续 3 次未通过（/healthz 返回 502）'
    };

    function buildSteps(c) {
        return [
            { key: 'check',  name: '校验本地文件',   line: '检查可读性与校验值',   ms: 700 },
            { key: 'upload', name: '上传到 ' + c.path, line: '',                  ms: 1900, bar: true },
            { key: 'backup', name: '备份当前版本',   line: '生成回滚点',           ms: 900 },
            { key: 'start',  name: '执行启动命令',   line: cmdBrief(c.cmd),        ms: 1300 },
            { key: 'health', name: '健康检查',       line: 'GET /healthz',         ms: 950 },
            { key: 'done',   name: '部署完成',       line: '',                     ms: 0 }
        ];
    }

    function renderSteps() {
        const box = document.getElementById('stepList');
        box.innerHTML = '';
        steps.forEach((st, i) => {
            const row = el('div', 'step step-idle');
            row.dataset.i = i;
            row.dataset.key = st.key;
            row.tabIndex = 0;
            row.setAttribute('role', 'option');
            row.setAttribute('aria-selected', 'false');
            row.setAttribute('aria-label', '步骤 ' + (i + 1) + '：' + st.name);

            // 数字单独一层：圆点带 2px 边框，合在一起量会把边框采成文字底衬
            const dot = el('span', 'step-dot');
            dot.appendChild(el('span', 'step-dot-n', String(i + 1)));

            const name = el('span', 'step-name', st.name);
            const time = el('span', 'step-time', '待执行');
            const retry = el('button', 'step-retry-btn', '↻');
            retry.type = 'button';
            retry.title = '从这个步骤重试';
            retry.setAttribute('aria-label', '重试 ' + st.name);
            retry.onclick = e => { e.stopPropagation(); retryStep(i); };

            row.append(dot, name, time, retry);
            if (st.line) row.appendChild(el('div', 'step-line', st.line));
            if (st.bar) {
                const bar = el('span', 'step-bar');
                bar.appendChild(el('span'));
                row.appendChild(bar);
            }

            // 名称被截断时，悬停给出全文
            requestAnimationFrame(() => {
                if (name.scrollWidth > name.clientWidth + 1) {
                    name.classList.add('truncated');
                    name.dataset.full = st.name;
                }
            });

            row.addEventListener('click', () => focusStep(i));
            row.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focusStep(i); }
            });
            box.appendChild(row);
        });
        setTaskCount(steps.length + ' 步');
        updateTaskProgress();
    }

    // 第一步的名称跟着「用哪种来源、备了几个文件」走
    function refreshFirstStep() {
        const row = stepNode(0);
        if (!row || running) return;
        const name = row.querySelector('.step-name');
        if (!name) return;
        const text = checkStepName();
        name.textContent = text;
        if (name.classList.contains('truncated')) name.dataset.full = text;
    }

    function stepNode(i) { return document.querySelector('.step[data-i="' + i + '"]'); }

    function markStep(i, cls, badge, time) {
        const row = stepNode(i);
        if (!row) return;
        const keepRetry = row.classList.contains('step-retry');
        row.className = 'step ' + cls + (keepRetry && cls !== 'step-idle' ? ' step-retry' : '');
        if (keepRetry && cls !== 'step-idle') row.dataset.retry = retryCount[i] || 1;

        const dotNum = row.querySelector('.step-dot-n');
        if (dotNum) dotNum.textContent = badge;

        const t = row.querySelector('.step-time');
        if (t) {
            t.textContent = time;
            // 比基线慢 50% 以上就把耗时标成琥珀色
            const base = steps[i] && steps[i].ms;
            const ms = parseFloat(time) * 1000;
            if (base && !isNaN(ms) && ms > base * 1.5) {
                t.classList.add('slow');
                t.title = '比基线慢 ' + ((ms / base - 1) * 100).toFixed(0) + '%';
            } else {
                t.classList.remove('slow');
                t.removeAttribute('title');
            }
        }
        updateTaskProgress();
        updateJumpBtn();
    }

    /* ============================================================
       任务列：计数 / 进度 / 焦点联动 / 键盘
       ============================================================ */
    function setTaskCount(text, done) {
        const c = document.getElementById('taskCount');
        if (!c) return;
        c.textContent = text;
        c.className = 'task-count' + (done ? ' done' : '');
    }

    function updateTaskProgress() {
        const fill = document.getElementById('taskProgressFill');
        if (!fill) return;
        const finished = document.querySelectorAll('.step-ok, .step-err, .step-skip').length;
        fill.style.width = (steps.length ? finished / steps.length * 100 : 0) + '%';
    }

    // 点某一步 → 在终端里定位到它那几行
    function focusStep(i) {
        document.querySelectorAll('.step').forEach(row => {
            row.classList.remove('focused');
            row.setAttribute('aria-selected', 'false');
        });
        const row = stepNode(i);
        if (row) {
            row.classList.add('focused');
            row.setAttribute('aria-selected', 'true');
        }
        const key = steps[i] && steps[i].key;
        const line = key && document.querySelector('.console-line[data-step="' + key + '"]');
        if (line) {
            line.scrollIntoView({ block: 'center', behavior: 'smooth' });
            line.classList.add('flash');
            setTimeout(() => line.classList.remove('flash'), 1200);
        }
        // 执行面板头部闪一下，说明「在找哪一步」
        if (steps[i]) {
            const meta = document.getElementById('execMeta');
            if (meta) {
                meta.classList.add('jump');
                meta.querySelector('.exec-text').textContent = '→ ' + steps[i].name;
                setTimeout(() => { meta.classList.remove('jump'); restoreExecMeta(); }, 1600);
            }
        }
    }

    function setExecMeta(text, kind) {
        savedMeta = { text: text, kind: kind || '' };
        const m = document.getElementById('execMeta');
        if (!m) return;
        m.className = 'exec-meta' + (kind ? ' ' + kind : '');
        m.querySelector('.exec-text').textContent = text;
    }
    function restoreExecMeta() {
        const m = document.getElementById('execMeta');
        if (!m) return;
        m.className = 'exec-meta' + (savedMeta.kind ? ' ' + savedMeta.kind : '');
        m.querySelector('.exec-text').textContent = savedMeta.text;
    }

    // 上下键在步骤间移动
    document.getElementById('stepList').addEventListener('keydown', e => {
        const cur = document.activeElement.closest('.step');
        if (!cur) return;
        const rows = Array.from(document.querySelectorAll('.step'));
        const idx = rows.indexOf(cur);
        if (e.key === 'ArrowDown' && idx < rows.length - 1) { e.preventDefault(); rows[idx + 1].focus(); }
        else if (e.key === 'ArrowUp' && idx > 0) { e.preventDefault(); rows[idx - 1].focus(); }
        else if (e.key === 'Home') { e.preventDefault(); rows[0].focus(); }
        else if (e.key === 'End') { e.preventDefault(); rows[rows.length - 1].focus(); }
    });

    /* ============================================================
       折叠 / 跳到当前步
       ============================================================ */
    function toggleFold() {
        const col = document.getElementById('taskCol');
        const btn = document.getElementById('foldBtn');
        if (!col || !btn) return;
        const folded = col.classList.toggle('folded');
        btn.classList.toggle('active', folded);
        btn.setAttribute('aria-pressed', String(folded));
        btn.title = folded ? '展开已完成的步骤' : '折叠已完成的步骤';
        const done = document.querySelectorAll('.step-ok').length;
        setTaskCount(folded && done ? done + ' 步已完成' : steps.length + ' 步');
        updateJumpBtn();
    }

    function updateJumpBtn() {
        const btn = document.getElementById('jumpBtn');
        const box = document.getElementById('stepList');
        if (!btn || !box) return;
        const run = document.querySelector('.step-run, .step-wait, .step-err');
        if (!run) { btn.hidden = true; return; }
        const boxRect = box.getBoundingClientRect();
        const runRect = run.getBoundingClientRect();
        btn.hidden = runRect.top >= boxRect.top && runRect.bottom <= boxRect.bottom;
    }
    document.getElementById('stepList').addEventListener('scroll', updateJumpBtn);

    function jumpToCurrent() {
        const run = document.querySelector('.step-run, .step-wait, .step-err');
        if (run) run.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    /* ============================================================
       跟随 / 复制
       ============================================================ */
    function updateFollowBtn() {
        const btn = document.getElementById('followBtn');
        if (!btn) return;
        btn.className = 'exec-btn' + (followTail ? ' on' : ' alert');
        btn.textContent = followTail ? '↓ 跟随' : '↓ 回到底部';
    }

    function toggleFollow() {
        followTail = !followTail;
        const box = document.getElementById('console');
        if (followTail && box) box.scrollTop = box.scrollHeight;
        updateFollowBtn();
    }

    document.getElementById('console').addEventListener('scroll', () => {
        const box = document.getElementById('console');
        const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 8;
        if (followTail && !atBottom) { followTail = false; updateFollowBtn(); }
        else if (!followTail && atBottom) { followTail = true; updateFollowBtn(); }
    });

    function copyConsole() {
        const lines = Array.from(document.querySelectorAll('#console .console-line'));
        if (!lines.length) return;
        const text = lines.map(l => {
            const t = l.querySelector('.console-t');
            const x = l.querySelector('.console-x');
            return ((t ? t.textContent : '') + '  ' + (x ? x.textContent : '')).trim();
        }).join('\n');
        const done = () => {
            const b = document.getElementById('copyBtn');
            const old = b.textContent;
            b.textContent = '✓ 已复制';
            setTimeout(() => { b.textContent = old; }, 1400);
        };
        const fallback = () => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            ta.remove();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => { done(); toast('已复制全部日志'); })
                .catch(fallback);
        } else { fallback(); }
    }

    /* 通用复制：按钮上反馈一下，再兜一个 toast。
       file:// 下 navigator.clipboard 常常不可用，所以保留 execCommand 兜底 */
    function copyText(text, btn, okMsg) {
        const done = () => {
            if (btn) {
                const old = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(() => { btn.textContent = old; }, 1400);
            }
            if (okMsg) toast(okMsg);
        };
        const fallback = () => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            ta.remove();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(fallback);
        } else { fallback(); }
    }

    /* ============================================================
       跳过剩余 / 单步重试
       ============================================================ */
    function markRemainingSkipped(fromIdx) {
        document.querySelectorAll('.step').forEach(row => {
            const i = Number(row.dataset.i);
            if (i > fromIdx && row.classList.contains('step-idle')) {
                // 去掉 step-idle 再加 step-skip：留着两个状态类，
                // 后面任何按 classList.contains 判断状态的地方都会读到自相矛盾的行
                row.classList.remove('step-idle');
                row.classList.add('step-skip');
                const dn = row.querySelector('.step-dot-n');
                if (dn) dn.textContent = '—';
                const t = row.querySelector('.step-time');
                if (t) { t.textContent = '跳过'; t.classList.remove('slow'); }
            }
        });
        updateTaskProgress();
        updateJumpBtn();
    }

    function retryStep(i) {
        if (running) return;
        if (!cfg()) return;
        retryCount[i] = (retryCount[i] || 0) + 1;

        running = true;
        setRunBtn('部署中…', true);
        document.getElementById('abortBtn').hidden = false;
        setHint('从「' + steps[i].name + '」重试中…', false, true);
        setExecMeta('重试中…', 'run');

        // 该步及其之后全部复位
        steps.forEach((st, k) => {
            if (k < i) return;
            const row = stepNode(k);
            if (!row) return;
            row.className = 'step step-idle';
            delete row.dataset.retry;
            const dn = row.querySelector('.step-dot-n');
            if (dn) dn.textContent = String(k + 1);
            const t = row.querySelector('.step-time');
            if (t) { t.textContent = '待执行'; t.classList.remove('slow'); t.removeAttribute('title'); }
            const bar = row.querySelector('.step-bar > span');
            if (bar) bar.style.width = '0%';
        });
        const row = stepNode(i);
        if (row) { row.classList.add('step-retry'); row.dataset.retry = retryCount[i]; }

        logAt('↻ 从「' + steps[i].name + '」重试（第 ' + retryCount[i] + ' 次）', 'warn');
        runStep(i);
    }

    // stepKey 让「点某一步」能在终端里定位到它那几行
    function logAt(text, kind, stepKey) {
        const box = document.getElementById('console');
        const empty = box.querySelector('.console-empty');
        if (empty) empty.closest('.console-line').remove();
        const line = el('div', 'console-line' + (kind ? ' ' + kind : ''));
        line.dataset.step = stepKey == null ? '' : stepKey;
        line.append(el('span', 'console-t', hhmmss()), el('span', 'console-x', text));
        box.appendChild(line);
        if (followTail) box.scrollTop = box.scrollHeight;
    }

    function logStepHeader(st) {
        const box = document.getElementById('console');
        const empty = box.querySelector('.console-empty');
        if (empty) empty.closest('.console-line').remove();
        const line = el('div', 'console-line step-header');
        line.dataset.step = st.key;
        line.append(el('span', 'console-t', ''), el('span', 'console-x', '── ' + st.name + ' ──'));
        box.appendChild(line);
        if (followTail) box.scrollTop = box.scrollHeight;
    }

    function clearConsole() {
        const box = document.getElementById('console');
        box.innerHTML = '';
        const line = el('div', 'console-line');
        line.append(el('span', 'console-t', '--:--:--'),
                    el('span', 'console-x console-empty', '等待开始部署…'));
        box.appendChild(line);
        followTail = true;
        updateFollowBtn();
    }

    function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
    function clearTimers() {
        timers.forEach(clearTimeout); timers = [];
        barTimers.forEach(clearInterval); barTimers = [];
        Object.values(stepTicks).forEach(clearInterval); stepTicks = {};
    }

    let deployStart = 0;

    /* 第一步的名字由「这一批文件长什么样」决定：有本机绑定就一并说清，
       因为绑定文件走的是"直接读本机那份"，与上传来的文件不是同一条路 */
    function checkStepName() {
        const arr = files();
        if (!arr.length) return '校验本地文件';
        return fileSrc === 'local'
            ? '校验绑定路径（' + arr.length + ' 份）'
            : '校验本地文件（' + arr.length + ' 个）';
    }

    function startDeploy() {
        if (running) return;
        const c = cfg();
        if (!c) { toast('请先在左栏选择一个部署配置', 'warn'); return; }
        if (!files().length) {
            toast('请先在「' + SRC_LABEL[fileSrc] + '」这一边备好文件', 'warn');
            const dz = document.getElementById('dropzone');
            if (fileSrc === 'pick') {
                dz.classList.add('over');
                setTimeout(() => dz.classList.remove('over'), 700);
            } else {
                const inp = document.getElementById('bindPath');
                inp.focus();
            }
            return;
        }
        /* 绑定文件在本机找不到就别让它跑到第三步才失败 —— 这里挡住，
           并指出是哪一条（清单里那一行已经是琥珀底，滚过去就能看到） */
        const miss = files().filter(f => f.found === false);
        if (miss.length) {
            toast('有 ' + miss.length + ' 个绑定文件在本机找不到：' + miss.map(f => f.name).join('、'), 'warn');
            setHint('本机找不到这段路径：' + miss[0].path + ' —— 改对路径或先解绑，再开始部署', true);
            const row = document.querySelector('.file-item.missing');
            if (row) row.scrollIntoView({ block: 'nearest' });
            return;
        }

        running = true;
        deployStart = Date.now();
        setRunBtn('部署中…', true);
        document.getElementById('abortBtn').hidden = false;
        setHint('正在执行…', false, true);

        retryCount = {};
        credCache = {};
        pendingAsk = null;
        document.getElementById('taskTotal').hidden = true;
        document.getElementById('taskCol').classList.remove('folded');
        document.getElementById('foldBtn').classList.remove('active');
        document.getElementById('execHost').textContent = '本机 → ' + TARGET_HOST;
        setExecMeta('执行中…', 'run');

        steps = buildSteps(c);
        steps[0].name = checkStepName();
        renderSteps();
        clearConsole();

        logAt('开始部署「' + c.name + '」→ ' + TARGET_HOST + '（连接身份 ' + sessionUser + '）', '');
        logAt('目标路径 ' + c.path + ' · 来源「' + SRC_LABEL[fileSrc] + '」'
            + files().length + ' 个文件 / ' + fmtSize(totalSize()), '');
        // 绑定文件不走上传：进部署时直接读本机那一份，所以单独说一句
        files().filter(f => f.src === 'local').forEach(f =>
            logAt('绑定本机 ' + f.path + ' → 已找到 ' + fmtSize(f.size) + '（' + f.time + '），直接使用', 'sub'));
        // 提权那一刻本来最容易停下来问人 —— 这里先说明这条配置不会问。
        // root 身份下不存在"授权不足"，那句话就不该出现
        if (sessionUser !== 'root' &&
            cmdList(c.cmd).some(x => /^sudo\b/.test(x.run) && /(^|\s)-n(\s|$)/.test(x.run))) {
            logAt('提权命令用非交互写法（sudo -n）：服务器上没配授权会立刻失败，不会停下来等密码', 'sub');
        }
        runStep(0);
    }

    function runStep(i) {
        if (!running) return;

        if (i >= steps.length) { finish(true); return; }
        const st = steps[i];

        // 终态步：只做标记
        if (st.ms === 0) {
            markStep(i, 'step-ok', '✓', '—');
            logAt('部署完成，服务已启动', 'ok', st.key);
            finish(true);
            return;
        }

        markStep(i, 'step-run', '●', '0.0s');
        logStepHeader(st);
        const t0 = Date.now();
        // 状态行说"现在跑到哪一步了" —— 这是执行期唯一值得看的一句话
        setHint('第 ' + (i + 1) + ' / ' + steps.length + ' 步 · ' + st.name, false, true);

        // 命令条数决定这一步的时长：一条条地走，而不是所有命令挤在同一瞬间
        const cmdArr = st.key === 'start' ? cmdList(cfg() && cfg().cmd) : [];
        const dur = cmdArr.length ? 320 + cmdArr.length * 300 : st.ms;

        // 进行中实时走秒
        startTick(i, st, t0);

        if (st.bar) {
            const bar = stepNode(i).querySelector('.step-bar > span');
            barStart(bar, st.ms);
            logAt('↑ 上传 ' + fmtSize(totalSize()) + ' → ' + cfg().path, '', st.key);
        } else if (st.key === 'start' && cmdArr.length) {
            // 命令序列自己走：中途可能停在「等你输入」上
            runCmdSequence(i, st, cmdArr, t0);
            return;
        } else {
            logAt(st.name + ' …', '', st.key);
        }

        later(() => completeStep(i, t0, cmdArr), dur);
    }

    /* 进行中实时走秒。t0 用「整步开始时刻」——
       中途等待输入的时长也算在耗时里，不藏起来 */
    /* 窄屏下步骤是一根横向条，要等输入的那一步很可能停在可视区之外 ——
       等待态必须让人看得见，所以只横向把它滚进来（不动整页滚动位置）。
       桌面是纵向列表 + 右下角「↓ 当前步」，不走这里。 */
    function revealStepCard(i) {
        const box = document.getElementById('stepList');
        const row = stepNode(i);
        if (!box || !row) return;
        if (box.scrollWidth <= box.clientWidth + 1) return;
        const b = box.getBoundingClientRect(), r = row.getBoundingClientRect();
        if (r.left >= b.left && r.right <= b.right) return;
        box.scrollLeft += (r.left - b.left) - (b.width - r.width) / 2;
    }

    function startTick(i, st, t0) {
        clearInterval(stepTicks[st.key]);
        stepTicks[st.key] = setInterval(() => {
            const el2 = stepNode(i) && stepNode(i).querySelector('.step-time');
            if (el2) el2.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
        }, 100);
    }

    /* 一条命令 = 打印命令 → （可能）等输入 → 下一条。
       不用 forEach + 定时器批量铺出去，否则遇到交互命令会「后面的先跑完」 */
    function runCmdSequence(i, st, items, t0) {
        let k = 0;
        function next() {
            if (!running) return;
            if (k >= items.length) {
                clearInterval(stepTicks[st.key]);
                delete stepTicks[st.key];
                completeStep(i, t0, items);
                return;
            }
            const it = items[k];
            // 逐条打印：先给操作名（弱化），再给命令 —— 长命令序列才分得清哪步是哪步
            if (it.op) logAt('· ' + it.op, 'sub', st.key);
            logAt('$ ' + it.run, '', st.key);
            const step = () => { k++; next(); };
            if (needsHuman(it)) askFor(it, i, t0, step);
            else later(step, 300);
        }
        next();
    }

    function completeStep(i, t0, cmdArr) {
        if (!running) return;                    // 中止之后不再往下推进
        const st = steps[i];
        if (!st) return;
        cmdArr = cmdArr || [];
        clearInterval(stepTicks[st.key]);
        delete stepTicks[st.key];
        const sec = ((Date.now() - t0) / 1000).toFixed(1) + 's';

        // 演示失败链：健康检查不通过 → 中止后续步骤并回滚
        if (cfg() && cfg().failAt === st.key) {
            if (st.bar) barStop(false);
            markStep(i, 'step-err', '✕', sec);
            logAt('✕ ' + st.name + ' 失败：' + FAIL_MSG[st.key], 'err', st.key);
            logAt('触发自动回滚 → 恢复上一个版本', 'warn');
            markRemainingSkipped(i);
            later(() => { finish(false); }, 900);
            return;
        }

        if (st.bar) barStop(true);

        if (st.key === 'upload') logAt('✓ 已上传到 ' + cfg().path, 'ok', st.key);
        else if (st.key === 'start') logAt('✓ ' + (cmdArr.length > 1 ? cmdArr.length + ' 条命令依次执行完成' : '命令执行完成') + '（退出码 0）', 'ok', st.key);
        else if (st.key === 'health') logAt('✓ 健康检查通过（/healthz 200 · 12ms）', 'ok', st.key);
        else if (st.key === 'backup') logAt('✓ 回滚点已生成', 'ok', st.key);
        else logAt('✓ ' + (st.line || st.name), 'ok', st.key);

        markStep(i, 'step-ok', '✓', sec);
        runStep(i + 1);
    }

    /* ============================================================
       等待输入：命令自己停了下来
       终端那一行里直接给输入框 —— 不弹窗、不跳页，输出流不断。
       步骤行切到 step-wait，进度与计时都停在这里，直到你按下回车。
       ============================================================ */
    function askFor(it, i, t0, onDone) {
        const st = steps[i];
        const det = detectAsk(it.run);
        const kind = det ? det.kind : 'input';
        const prompt = (det && det.prompt) || 'Input:';

        // sudo 的凭据默认缓存 15 分钟，同一次执行里不必反复问；
        // su 不缓存（每次都会重新要密码）—— 别把两者写成一样
