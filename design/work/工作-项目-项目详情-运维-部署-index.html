        if (kind === 'sudo' && credCache[kind]) {
            logAt(prompt + ' •••••••• 已复用本次执行输入的 sudo 凭据', 'sub', st.key);
            later(onDone, 220);
            return;
        }

        clearInterval(stepTicks[st.key]);
        delete stepTicks[st.key];
        // 立刻写成「等待 0.0s」而不是先落在「等待输入」上 —— 秒数每 100ms 才刷一次，
        // 中间那 100ms 会露出一帧和下方定时器不一致的文案
        markStep(i, 'step-wait', '>_', '等待 0.0s');
        revealStepCard(i);
        setExecMeta('等你输入…', 'wait');
        setHint('命令停下来了，需要你手动输入 —— 输完按回车或点「继续」', true);

        const line = el('div', 'console-line ask');
        line.dataset.step = st.key;
        const x = el('span', 'console-x ask-row');
        const label = el('span', 'ask-label', prompt);
        const inp = el('input', 'ask-input');
        inp.type = 'password';
        inp.autocomplete = 'new-password';
        inp.spellcheck = false;
        inp.placeholder = '演示：任意 4 位以上算正确';
        inp.setAttribute('aria-label', it.op ? it.op + '，' + prompt : prompt);
        const go = el('button', 'ask-go', '继续');
        go.type = 'button';
        const msg = el('span', 'ask-err');
        x.append(label, inp, go, msg);
        line.append(el('span', 'console-t', hhmmss()), x);
        const cbox = document.getElementById('console');
        cbox.appendChild(line);
        cbox.scrollTop = cbox.scrollHeight;

        let tries = 0;
        const waitT0 = Date.now();
        // 等待时把步骤徽标换成「等待 X.Xs」，让「卡住了」和「正在等你」一眼分得清
        const wt = setInterval(() => {
            const el2 = stepNode(i) && stepNode(i).querySelector('.step-time');
            if (el2) el2.textContent = '等待 ' + ((Date.now() - waitT0) / 1000).toFixed(1) + 's';
        }, 100);
        // 无限等下去等于把这台机器挂在这儿 —— 真实系统里超时即失败
        const to = setTimeout(() => {
            fail('等待输入超时（' + (ASK_TIMEOUT_MS / 1000) + 's 未输入）', '终止本次部署 → 服务保持原状');
        }, ASK_TIMEOUT_MS);
        timers.push(to);

        pendingAsk = { i: i, close: close };

        function detach(text) {
            clearInterval(wt); clearTimeout(to);
            inp.disabled = true; go.hidden = true; msg.textContent = '';
            x.appendChild(el('span', 'ask-note', text));
            line.classList.add('done');
        }
        function close(how) {
            pendingAsk = null;
            detach(how === 'abort' ? '已中止' : '未提供');
        }
        function fail(txt, extra) {
            pendingAsk = null;
            detach('✕ 失败');
            markStep(i, 'step-err', '✕', ((Date.now() - t0) / 1000).toFixed(1) + 's');
            logAt('✕ ' + txt, 'err', st.key);
            if (extra) logAt(extra, 'warn', st.key);
            markRemainingSkipped(i);
            later(() => finish(false), 800);
        }

        function submit() {
            const v = inp.value;
            if (!v) { msg.textContent = '密码不能为空'; inp.focus(); return; }
            // su 会给 3 次机会；演示里不足 4 位就当密码错
            if (v.length < 4) {
                tries++;
                logAt('su: Authentication failure', 'err', st.key);
                if (tries >= 3) { fail('连续 3 次认证失败'); return; }
                msg.textContent = '密码错误，还剩 ' + (3 - tries) + ' 次机会';
                inp.value = '';
                inp.focus();
                return;
            }
            if (kind === 'sudo') credCache[kind] = true;
            pendingAsk = null;
            clearInterval(wt); clearTimeout(to);
            inp.remove(); go.remove(); msg.remove();
            x.append(el('span', 'ask-dots', '••••••••'), el('span', 'ask-note', '✓ 认证通过'));
            line.classList.add('done');
            logAt(prompt + ' •••••••• 认证通过 → 继续执行', 'ok', st.key);
            setExecMeta('执行中…', 'run');
            setHint('正在执行…', false, true);
            startTick(i, st, t0);          // 接着按整步耗时走秒
            later(onDone, 240);
        }

        go.onclick = submit;
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); submit(); }
        });
        inp.focus();
    }

    function barStart(bar, ms) {
        if (!bar) return;
        const t0 = Date.now();
        const tick = setInterval(() => {
            const pct = Math.min(97, (Date.now() - t0) / ms * 100);
            bar.style.width = pct.toFixed(1) + '%';
        }, 80);
        barTimers.push(tick);
    }
    // fillUp=true 走成功路径（补满）；失败时停在当前进度，别假装传完了
    function barStop(fillUp) {
        barTimers.forEach(clearInterval);
        barTimers = [];
        if (fillUp) document.querySelectorAll('.step-bar > span').forEach(s => { s.style.width = '100%'; });
    }

    function finish(ok) {
        clearTimers();
        running = false;
        setRunBtn(ok ? '再次部署' : '重试部署', false);
        document.getElementById('abortBtn').hidden = true;

        // 总耗时挂到任务列头部
        const total = ((Date.now() - deployStart) / 1000).toFixed(1) + 's';
        const totalEl = document.getElementById('taskTotal');
        if (totalEl) { totalEl.textContent = total; totalEl.hidden = false; }
        setTaskCount(steps.length + ' 步');

        if (ok) {
            setHint('部署完成 · ' + hhmmss(), false);
            setExecMeta('部署完成 · ' + hhmmss(), 'ok');
            toast('部署完成');
        } else {
            setHint('部署失败，已自动回滚到上一个版本', true);
            setExecMeta('部署失败，已自动回滚', 'err');
            toast('部署失败，已自动回滚', 'danger');
        }
        followTail = true;
        updateFollowBtn();
        const box = document.getElementById('console');
        if (box) box.scrollTop = box.scrollHeight;
        updateTaskProgress();
        updateJumpBtn();
    }

    function abortDeploy() {
        if (!running) return;
        // 正等着输入时中止：那个输入框要先收掉，否则会留在终端里点得动
        const cur = document.querySelector('.step.step-run, .step.step-wait');
        if (pendingAsk) pendingAsk.close('abort');
        clearTimers();
        running = false;

        if (cur) {
            const idx = Number(cur.dataset.i);
            // 进度条保持当前宽度 —— 中止时上传并没有传完，补满等于假报成功
            markStep(idx, 'step-idle', '■', '已中止');
            // 从 idx 之后开始跳过：传 idx-1 会把刚标好的「已中止」再盖成「跳过」
            markRemainingSkipped(idx);
        }
        logAt('用户中止了本次部署', 'warn');

        const runBtn = document.getElementById('runBtn');
        setRunBtn('重新部署', false);
        document.getElementById('abortBtn').hidden = true;
        setHint('已中止 · 服务保持中止前的状态', true);
        setExecMeta('已中止', 'err');
        setTaskCount('已中止');
        toast('已中止部署', 'warn');
    }

    /* 状态行：**只说"现在正在发生什么"，不说"接下来会怎样"**。
       默认态没有话要说（能自证的不用配注解 —— 条数、自动化就绪度都在上面那块摘要里），
       所以传空串就是把整行收起来；这一行的高度因此由按钮决定，不随文案长短跳。 */
    function setHint(text, warn, busy) {
        const h = document.getElementById('runHint');
        if (!h) return;
        h.innerHTML = '';
        h.hidden = !text;
        h.className = 'run-hint' + (warn ? ' warn' : '');
        if (!text) return;
        // 忙的时候带一个转圈：按钮之外也有"在动"的落点
        if (busy) h.appendChild(el('span', 'spin'));
        h.appendChild(el('span', null, text));
    }

    /* 主按钮的文字与图标必须同步翻转，所以只在这一个函数里改 ——
       散在各处写 textContent 时最容易漏掉图标，留下"不忙也在转圈"的按钮 */
    const ICO = {
        run: '<svg viewBox="0 0 16 16" aria-hidden="true">'
            + '<circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.38"/>'
            + '<path d="M6.3 5.1 10.7 8l-4.4 2.9z" fill="currentColor"/></svg>',
        // 270° 的弧，配合 CSS 的 spin 转起来就是标准的加载态
        busy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"'
            + ' stroke-linecap="round" aria-hidden="true"><path d="M8 2.8a5.2 5.2 0 1 0 5.2 5.2"/></svg>'
    };
    function setRunBtn(label, busy) {
        const b = document.getElementById('runBtn');
        if (!b) return;
        const t = document.getElementById('runText');
        if (t) t.textContent = label;
        const ic = b.querySelector('.ic');
        if (ic) ic.innerHTML = busy ? ICO.busy : ICO.run;
        b.disabled = !!busy;
    }

    function resetRun() {
        clearTimers();
        running = false;
        retryCount = {};
        credCache = {};
        pendingAsk = null;
        setRunBtn('开始部署', false);
        document.getElementById('abortBtn').hidden = true;
        // 默认态不配注解：条数与自动化就绪度都在上面那块摘要里，这一行留给"正在发生的事"
        setHint('');
        setExecMeta('等待开始', '');
        const totalEl = document.getElementById('taskTotal');
        if (totalEl) totalEl.hidden = true;
        document.getElementById('taskCol').classList.remove('folded');
        document.getElementById('foldBtn').classList.remove('active');
        clearConsole();
        if (cfg()) {
            steps = buildSteps(cfg());
            renderSteps();
            refreshFirstStep();
        } else {
            document.getElementById('stepList').innerHTML = '';
        }
    }

    /* ============================================================
       新增 / 编辑 / 删除配置
       ============================================================ */
    const PATH_PRESETS = ['/opt/app/releases', '/var/www/pay-web/dist', '/opt/db/migrations'];

    /* ============================================================
       服务器目录（原型用的假树）
       —— 点「浏览服务器目录」时展开的就是它。真实产品里这一段来自服务端：
          打开选择器 → 请求当前目录 → 点目录 → 再请求下一级。
          层级刻意与三条常用路径（/opt/app/releases、/var/www/pay-web/dist、
          /opt/db/migrations）对齐，所以"选出来的目录"和"手输的目录"落在同一套位置上。
          /opt/app/releases 给到 10 个历史版本目录 —— 真实机器的发布目录就长这样，
          筛选框也才有存在的理由。
          树里**保留文件节点**（那是机器上的事实，将来别处可能要用），但这个选择器**只列目录**：
          "几项"与筛选都按子目录数算，别让看不见的文件把账撑大。
       ============================================================ */
    function fsDir(children) { return { type: 'd', children: children }; }
    function fsFile(size, time) { return { type: 'f', size: size, time: time }; }

    /* 根也包成 fsDir：fsNodeAt 从根开始走，少一层 type 就会在第一次比较时被判成"不是目录" */
    const HOST_FS = fsDir({
        bin: fsDir({}),
        etc: fsDir({
            nginx: fsDir({ 'nginx.conf': fsFile('2.4 KB', '9月10日'), 'mime.types': fsFile('3.1 KB', '9月10日') }),
            systemd: fsDir({ system: fsDir({ 'pay-api.service': fsFile('680 B', '9月18日') }) }),
            'hosts': fsFile('220 B', '9月12日')
        }),
        home: fsDir({
            deploy: fsDir({ '.bash_history': fsFile('18 KB', '今天 09:41'), 'release.sh': fsFile('1.2 KB', '9月20日') })
        }),
        opt: fsDir({
            app: fsDir({
                releases: fsDir({
                    '20260925-1812': fsDir({}), '20260924-0930': fsDir({}), '20260923-1714': fsDir({}),
                    '20260922-1026': fsDir({}), '20260921-1902': fsDir({}), '20260920-1138': fsDir({}),
                    '20260919-1645': fsDir({}), '20260918-0921': fsDir({}), '20260917-1533': fsDir({}),
                    '20260916-1047': fsDir({})
                }),
                current: fsDir({
                    config: fsDir({ 'application.yml': fsFile('4.6 KB', '今天 09:20') }),
                    static: fsDir({}),
                    'VERSION': fsFile('12 B', '今天 09:20')
                }),
                shared: fsDir({
                    config: fsDir({}),
                    logs: fsDir({ 'pay-api.log': fsFile('62 MB', '今天 10:14') }),
                    uploads: fsDir({})
                }),
                backup: fsDir({ 'pre-20260925.dump': fsFile('420 MB', '今天 09:18') })
            }),
            db: fsDir({
                migrations: fsDir({
                    'V1__init.sql': fsFile('8.2 KB', '9月02日'),
                    'V2__add_order_index.sql': fsFile('1.4 KB', '9月14日'),
                    'latest.sql': fsFile('12 KB', '今天 08:40')
                }),
                backups: fsDir({})
            })
        }),
        srv: fsDir({}),
        tmp: fsDir({}),
        usr: fsDir({ local: fsDir({}), share: fsDir({}) }),
        var: fsDir({
            www: fsDir({
                'pay-web': fsDir({
                    dist: fsDir({
                        'index.html': fsFile('4.1 KB', '今天 09:22'),
                        assets: fsDir({}),
                        'favicon.ico': fsFile('15 KB', '9月12日')
                    }),
                    static: fsDir({}),
                    conf: fsDir({ 'nginx.include': fsFile('820 B', '9月14日') })
                }),
                html: fsDir({ 'index.html': fsFile('4.1 KB', '9月12日') })
            }),
            log: fsDir({
                nginx: fsDir({ 'access.log': fsFile('186 MB', '2 分钟前'), 'error.log': fsFile('4.2 MB', '今天 10:12') }),
                'syslog': fsFile('12 MB', '今天 10:15')
            }),
            lib: fsDir({ docker: fsDir({ containers: fsDir({}) }) })
        })
    });

    /* 路径为空时落在哪：/opt/app 是发布包最常待的地方 ——
       让人每次都从根目录点三层才到，是把"目录结构"的教育成本转嫁给日常操作 */
    const FS_HOME = ['opt', 'app'];

    /* 两棵树共用同一套查找：传根进去，别让函数自己认死 HOST_FS ——
       本机树一进来，写死根的版本就得再抄一份（第二份实现一定走岔） */
    function fsNodeAtIn(root, parts) {
        let node = root;
        for (let i = 0; i < parts.length && node; i++) {
            if (node.type !== 'd') return null;
            node = node.children[parts[i]];
        }
        return node || null;
    }

    /* 已填的路径可能指向目录、指向文件、或早就没了（配置是历史留下的）。
       三种都要落到一个能用的位置上：目录本身 → 它所在的那一级 → 最长的存在前缀 → 默认 */
    function fsDirForIn(root, parts, home) {
        const cut = parts.slice();
        while (cut.length) {
            const node = fsNodeAtIn(root, cut);
            if (node) return node.type === 'd' ? cut : cut.slice(0, -1);
            cut.pop();
        }
        return home.slice();
    }

    /* ---------- 服务器目录选择器（弹窗正文的第二种视图） ---------- */
    // picker / formView / formViewTitle 三个状态变量声明在弹窗区块那边（openConfirm 要复位它们）
    const PICK_CHEV = '<svg class="pick-chev" viewBox="0 0 16 16" aria-hidden="true">'
        + '<path d="M6.5 4.4 10.1 8l-3.6 3.6"/></svg>';
    /* 文件图标（折角页）—— 描边与填充交给 .pick-file，与 chevron 同一套 16 网格 */
    const PICK_FILE = '<svg class="pick-file" viewBox="0 0 16 16" aria-hidden="true">'
        + '<path d="M9.3 1.9H4.6a1.3 1.3 0 0 0-1.3 1.3v9.6a1.3 1.3 0 0 0 1.3 1.3h6.8a1.3 1.3 0 0 0 1.3-1.3V5.3z"/>'
        + '<path d="M9.3 1.9v3.4h3.4"/></svg>';

    function pickerViewOpen() { return !!picker; }

    /* 两处入口共用这一个选择器，差异只有三件事：
       ① 数据源（服务器 HOST_FS / 本机 LOCAL_TREE）
       ② 选中语义（选目录 / 选文件）
       ③ 是不是从表单里打开（正文要摘下来暂存 / 整个弹窗就是它） */
    function openFsPicker(opts) {
        const isLocal = opts.src === 'local';
        const root = isLocal ? LOCAL_TREE : HOST_FS;
        const home = isLocal ? LOCAL_HOME : FS_HOME;
        picker = {
            root: root, home: home, src: isLocal ? 'local' : 'host',
            mode: opts.mode === 'file' ? 'file' : 'dir',
            parts: fsDirForIn(root, String(opts.currentPath || '').split('/').filter(Boolean), home),
            filter: '', onPick: opts.onPick, standalone: !!opts.standalone
        };
        mBox.classList.toggle('modal-form', !opts.standalone);
        mBox.classList.toggle('modal-picker', !!opts.standalone);
        mTitle.textContent = pickTitle();
        /* 选择器里没有"确认"这一步 —— 点「用这个目录」或直接点文件名就是选中，底部只留「取消/返回」 */
        mConfirm.hidden = true;

        if (opts.standalone) {
            /* 不在表单流程里（从「绑定本地文件」进来的）：没有正文要暂存，弹窗整体就是它 */
            lastFocused = document.activeElement;
            formView = null;
            formViewTitle = '';
            mBody.innerHTML = '';
            mCancel.textContent = '取消';
            mCancel.onclick = () => closeModal();
            mask.classList.add('open');
        } else {
            /* 表单视图整块**摘下来存着**，不是重新生成一遍 ——
               从选择器返回时，刚敲进去还没保存的名称与命令必须原样还在。
               取的是 .form-body 这个容器（不是 firstElementChild：正文里多一个说明段就取错了）。 */
            formView = mBody.querySelector('.form-body') || mBody.firstElementChild;
            formViewTitle = mTitle.textContent;
            mCancel.textContent = '返回';
            mCancel.onclick = () => closeDirPicker();
        }
        renderPicker();
    }

    /* 服务器目录：进「新增 / 编辑配置」弹窗的正文视图（原有调用点不动） */
    function openDirPicker(currentPath, onPick) {
        openFsPicker({ src: 'host', mode: 'dir', currentPath: currentPath, onPick: onPick });
    }

    function pickTitle() {
        if (!picker) return '';
        if (picker.src === 'local') return picker.mode === 'file' ? '选择本机文件' : '选择本机目录';
        return picker.mode === 'file' ? '选择服务器文件 · ' + TARGET_HOST : '选择服务器目录 · ' + TARGET_HOST;
    }
    const pickRootLabel = () => (picker && picker.src === 'local' ? '本机' : TARGET_HOST);

    function closeDirPicker() {
        // 独立模式没有正文要还原，「返回」就等于关窗
        if (picker && picker.standalone) { closeModal(); return; }
        picker = null;
        mBody.innerHTML = '';
        if (formView) mBody.appendChild(formView);
        mTitle.textContent = formViewTitle;
        mCancel.textContent = '取消';
        mCancel.onclick = () => closeModal();
        mConfirm.hidden = false;
    }

    function renderPicker() {
        const p = picker;
        if (!p) return;
        const withFiles = p.mode === 'file';     // 选文件时这一层才列文件
        mBody.innerHTML = '';

        /* 面包屑：机器名 › opt › app › releases，逐级可点 */
        const crumbs = el('div', 'pick-crumbs');
        const crumb = (label, parts, isLast) => {
            if (crumbs.children.length) {
                const sep = el('span', 'pick-sep', '›');
                sep.setAttribute('aria-hidden', 'true');
                crumbs.appendChild(sep);
            }
            const b = el('button', 'pick-crumb' + (isLast ? ' current' : ''), label);
            b.type = 'button';
            if (!isLast) b.onclick = () => { picker.parts = parts; picker.filter = ''; renderPicker(); };
            crumbs.appendChild(b);
        };
        crumb(pickRootLabel(), [], p.parts.length === 0);
        p.parts.forEach((seg, i) => crumb(seg, p.parts.slice(0, i + 1), i === p.parts.length - 1));
        mBody.appendChild(crumbs);

        /* 当前目录。选目录时这里要给一个明确的落点（点行只能往里走）；
           选文件时没有落点可给 —— 目录不是这次要的答案，这条就只负责"现在在哪" */
        const bar = el('div', 'pick-bar');
        bar.appendChild(el('code', null, '/' + p.parts.join('/')));
        if (!withFiles) {
            const use = el('button', 'pick-use', '用这个目录');
            use.type = 'button';
            use.onclick = () => {
                const path = '/' + picker.parts.join('/');
                const pick = picker.onPick;
                closeDirPicker();
                pick(path);
            };
            bar.appendChild(use);
        }
        mBody.appendChild(bar);

        /* 条目多时才给筛选框：三级目录里放个搜索框是给不存在的需求配控件。
           数量按**这一层看得见的条目**算（选文件时文件也算），否则会出现"显示 8 项却弹出筛选框" */
        const node = fsNodeAtIn(p.root, p.parts) || fsDir({});
        if (childCount(node, withFiles) >= 10) {
            const filter = el('input', 'modal-input');
            filter.id = 'pickFilter';
            filter.type = 'search';
            filter.placeholder = '筛选当前目录';
            filter.value = p.filter;
            filter.setAttribute('autocomplete', 'off');
            filter.oninput = () => { if (picker) { picker.filter = filter.value; renderPickList(); } };
            mBody.appendChild(filter);
        }

        const list = el('div', 'pick-list');
        list.id = 'pickList';
        list.tabIndex = -1;
        mBody.appendChild(list);
        renderPickList();
    }

    /* 这一层看得见几条：选目录时只算子目录，选文件时文件也算。
       两个方向都会出账不对 —— 多算看不见的文件会"显示 3 项却只有 2 行"，少算文件则会
       "明明有 12 个文件却不给筛选框"。树里的文件节点一直都在（那是机器上的事实），
       列不列由视图决定。 */
    function childCount(node, withFiles) {
        return Object.keys(node.children)
            .filter(k => withFiles || node.children[k].type === 'd').length;
    }

    function renderPickList() {
        const p = picker;
        const list = document.getElementById('pickList');
        if (!p || !list) return;
        const withFiles = p.mode === 'file';
        const node = fsNodeAtIn(p.root, p.parts) || fsDir({});
        const kw = p.filter.toLowerCase();
        const entries = Object.keys(node.children)
            .map(name => ({ name: name, node: node.children[name] }))
            .filter(e => withFiles || e.node.type === 'd')   // 选目录的视图里，文件只会分散注意力
            .filter(e => !kw || e.name.toLowerCase().indexOf(kw) > -1)
            /* 目录在前、文件在后：目录是"继续往下走"，文件是"到这儿为止" */
            .sort((a, b) => a.node.type === b.node.type
                ? a.name.localeCompare(b.name)
                : (a.node.type === 'd' ? -1 : 1));

        list.innerHTML = '';
        if (!entries.length) {
            list.appendChild(el('div', 'pick-empty', pickEmptyText(kw)));
            return;
        }
        entries.forEach(e => {
            const isFile = e.node.type === 'f';
            const row = el('button', 'pick-row' + (isFile ? ' is-file' : ''));
            row.type = 'button';
            const ico = el('span', 'pick-ico');
            ico.innerHTML = isFile ? PICK_FILE : PICK_CHEV;
            ico.setAttribute('aria-hidden', 'true');
            const nm = el('span', 'pick-name', e.name);
            if (isFile) {
                /* 点文件名就是选中 —— 文件这层没有下一级，再要一次确认是白加一步 */
                const meta = el('span', 'pick-meta', e.node.size + ' · ' + e.node.time);
                row.title = '/' + p.parts.concat(e.name).join('/');
                row.onclick = () => pickFilePath(p.parts.concat(e.name));
                row.append(ico, nm, meta);
            } else {
                const meta = el('span', 'pick-meta', childCount(e.node, withFiles) + ' 项');
                row.onclick = () => { picker.parts = picker.parts.concat(e.name); picker.filter = ''; renderPicker(); };
                row.append(ico, nm, meta);
            }
            list.appendChild(row);
        });
    }

    function pickEmptyText(kw) {
        const fileMode = picker.mode === 'file';
        if (kw) return '这个目录里没有匹配「' + kw + '」的' + (fileMode ? '文件' : '子目录');
        return fileMode ? '这个目录是空的' : '这个目录里没有子目录';
    }

    /* 选中一个文件：拼成本机绝对路径交出去，选择器到这儿就结束 */
    function pickFilePath(parts) {
        const path = '/' + parts.join('/');
        const pick = picker.onPick;
        closeDirPicker();
        if (pick) pick(path);
    }
    // 启动命令 = 「操作名称 + 命令」的列表，按顺序执行；ask = 执行到这里要停下来等输入
    const CMD_PRESETS = [
        [{ op: '重启服务', run: 'systemctl restart pay-api' }],
        [{ op: '校验配置', run: 'nginx -t' }, { op: '重载 Nginx', run: 'nginx -s reload' }],
        [{ op: '切换用户重启', run: 'su - deploy -c "systemctl restart pay-api"' }],
        [{ op: '切到 deploy', run: 'su - deploy', ask: true },
         { op: '重启服务', run: 'systemctl restart pay-api' }],
        // 免密写法：执行时全程不需要人介入
        [{ op: '重启服务', run: 'sudo -u deploy -n systemctl restart pay-api' }]
    ];

    /* 读到结构化的命令列表。表单里以 JSON 存在隐藏 input 上；也容忍纯文本（旧的「每行一条」） */
    function parseCmds(v) {
        if (typeof v === 'string') {
            const t = v.trim();
            if (!t) return [];
            if (t.charAt(0) === '[') {
                try { return JSON.parse(t); } catch (e) { return []; }
            }
            return t.split('\n').map(s => ({ op: '', run: s }));
        }
        return Array.isArray(v) ? v : [];
    }
    /* 只保留真正有命令的条目，并归一化字段。
       ask 必须原样带下去 —— 它决定执行时那一条要不要停下来等输入 */
    function cmdList(v) {
        return parseCmds(v)
            .filter(x => x && String(x.run || '').trim())
            .map(x => ({
                op: String(x.op || '').trim(),
                run: String(x.run).trim(),
                ask: !!(x && x.ask)
            }));
    }
    /* 步骤说明行很窄，只放第一条的操作名（没有就退回命令本身） */
    function cmdBrief(v) {
        const a = cmdList(v);
        if (!a.length) return '—';
        const first = a[0].op || a[0].run;
        const n = a.filter(needsHuman).length;
        // 全非交互、且确实有提权命令 → 简报里点出「免密自动」，与"需输入"对称
        const auto = !n && a.some(x => {
            const i = autoInfo(x.run);
            return i && i.level === 'ready' && /^(sudo|su)\b/.test(x.run);
        });
        return (a.length === 1 ? first : first + ' 等 ' + a.length + ' 条')
            + (n ? ' · 含 ' + n + ' 处需输入' : (auto ? ' · 免密自动' : ''));
    }

    /* ============================================================
       交互命令识别
       有些命令跑起来会停在那儿等人敲键盘（su 要密码），自动执行会一直挂着。
       这里只做「识别 + 提示」，不替用户改写命令 —— 能不能免密只有他知道。
       ============================================================ */
    const ASK_TIMEOUT_MS = 180000;   // 等 3 分钟没人输入就判失败，而不是无限挂着

    function detectAsk(run) {
        const s = String(run || '').trim();
        if (!s) return null;
        if (/^su\b/.test(s)) {
            const hasC = /(^|\s)-c(\s|$)/.test(s);
            return { kind: 'su', prompt: 'Password:', sure: !hasC,
                     why: hasC ? 'su 在非 root 下仍可能要求密码' : 'su 会停在这里等密码' };
        }
        if (/^sudo\b/.test(s) && !/(^|\s)-n(\s|$)/.test(s)) {
            return { kind: 'sudo', prompt: '[sudo] password for deploy:', sure: false,
                     why: '没加 -n，未配置免密时会要求密码' };
        }
        if (/^(ssh|scp|sftp)\b/.test(s)) {
            return { kind: 'ssh', prompt: 'deploy@10.0.3.12\'s password:', sure: false,
                     why: '未配置公钥登录时会要求密码' };
        }
        if (/^(mysql|mariadb)\b/i.test(s)) {
            return { kind: 'mysql', prompt: 'Enter password:', sure: false,
                     why: '命令里没带凭据时会要求密码' };
        }
        if (/^psql\b/.test(s)) {
            return { kind: 'psql', prompt: 'Password for user pay:', sure: false,
                     why: '未配置 ~/.pgpass 时会要求密码' };
        }
        if (/(^|[|;&]\s*)(read|passwd)\b/.test(s)) {
            return { kind: 'read', prompt: '', sure: true, why: '这条命令本身就在读输入' };
        }
        return null;
    }

    /* ============================================================
       自动化就绪度：**只识别 + 给建议，不代改**
       —— 同一条命令基本都有非交互写法，这里算出「建议写法」（`to`）摆在提示行里让用户照抄。
          "一键改写"（批量的、行内单条的）都已在 2026-09-25 按用户要求移除：
          命令是用户亲手写的，工具代它改比"告诉它建议怎么写"更容易出错。
       ============================================================ */
    // 从 sudo 的参数里剥出真正要执行的命令
    function stripSudoFlags(s) {
        return String(s || '')
            .replace(/(^|\s)-u\s+\S+/g, ' ')
            .replace(/(^|\s)-n(\s|$)/g, ' ')
            .replace(/(^|\s)-(i|H|E|S|A)(\s|$)/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }
    // 免密授权行：跑部署的用户 → 以 targetUser 身份 → 免密执行这一条命令
    function sudoersLine(run) {
        const asUser = (String(run).match(/(?:^|\s)-u\s+([\w.@-]+)/) || [])[1];
        const cmd = stripSudoFlags(String(run).replace(/^sudo\s+/, ''));
        if (!cmd) return '';
        return '<跑部署的用户> ALL=(' + (asUser || 'root') + ') NOPASSWD: ' + cmd;
    }

    function autoInfo(run) {
        const s = String(run || '').trim();
        if (!s) return null;
        // root 身份下 su / sudo 都不问密码（sudo 对 root 免认证，su 从 root 切任何用户也免认证）。
        // 这条规则只作用于提权命令 —— ssh / psql 不因为"我在本机是 root"就免掉对端认证。
        const asRoot = sessionUser === 'root';
        let m = s.match(/^su\s+(?:-\s+)?([\w.@-]+)\s+-c\s+(["'])([\s\S]+)\2\s*$/);
        if (m) {
            if (asRoot) return { level: 'ready', rootFree: true, why: '当前连接身份是 root，切到 ' + m[1] + ' 不需要密码' };
            return { level: 'rewritable',
                     to: 'sudo -u ' + m[1] + ' -n ' + m[3],
                     // 别写成"一定会停"：su -c 在 root 下不问密码，图标那档是 ℹ，文案得跟着
                     why: 'su -c 在非 root 下仍会要密码；换 sudo -u … -n 就免密（没授权立刻失败，不挂着）' };
        }
        m = s.match(/^su\s+(?:-\s+)?([\w.@-]+)\s*$/);
        if (m) {
            if (asRoot) return { level: 'ready', rootFree: true, why: '当前连接身份是 root，切到 ' + m[1] + ' 不需要密码' };
            return { level: 'needsCommand',
                     why: 'su 一定会停下来要密码；补上要执行的命令就能免密' };
        }
        if (/^sudo\b/.test(s)) {
            const hasN = /(^|\s)-n(\s|$)/.test(s);
            if (!stripSudoFlags(s.replace(/^sudo\s+/, ''))) {
                return { level: 'needsCommand', why: '补上要执行的命令就能免密' };
            }
            if (asRoot) return { level: 'ready', rootFree: true, why: '当前连接身份是 root，sudo 不会要密码' };
            if (hasN) return { level: 'ready', why: '已是非交互写法（-n）', sudoLine: sudoersLine(s) };
            return { level: 'rewritable', to: s.replace(/^sudo\s+/, 'sudo -n '),
                     why: '加 -n：没配免密授权就立刻失败，不会挂在那儿等密码',
                     sudoLine: sudoersLine(s) };
        }
        if (/^ssh\b/.test(s) && !/-o\s*BatchMode/.test(s)) {
            return { level: 'rewritable', to: s.replace(/^ssh\b/, 'ssh -o BatchMode=yes'),
                     why: '配好公钥登录 + BatchMode：要密码时立刻失败，不挂着' };
        }
        if (/^(scp|sftp)\b/.test(s) && !/-o\s*BatchMode/.test(s)) {
            return { level: 'rewritable', to: s.replace(/^(scp|sftp)\b/, '$1 -o BatchMode=yes'),
                     why: '配好公钥登录 + BatchMode：要密码时立刻失败，不挂着' };
        }
        if (/^(mysql|mariadb)\b/i.test(s)) {
            return { level: 'external', why: '免交互要配 ~/.my.cnf（或 --defaults-extra-file=…），页面改不了' };
        }
        if (/^psql\b/.test(s)) {
            return { level: 'external', why: '免交互要配 ~/.pgpass，页面改不了' };
        }
        const det = detectAsk(s);
        if (det) return { level: 'manual', why: det.why };
        return { level: 'ready', why: '' };
    }
    /* 这条命令这次到底要不要人。
       ask 是「用户说这条要人」，但连接身份已经让提权不问密码时，这条声明就是多余的（甚至过期）——
       执行侧按事实走，否则会出现「提示说不会提示 / 徽标说需输入 / 真跑起来停住」三方打架。 */
    function needsHuman(x) {
        if (!x || !x.ask) return false;
        const i = autoInfo(x.run);
        return !(i && i.rootFree);
    }

    // 一条配置整体的自动化程度。
    // 「全自动」= 没有任何人工标记，**且**没有"可能还要密码"的命令 ——
    // su -c / sudo（无 -n）都不算，别把"大概能跑"说成"全自动"。
    function autoSummary(c) {
        const arr = c ? cmdList(c.cmd) : [];
        let askN = 0, rew = 0, ext = 0, ready = 0;
        arr.forEach(x => {
            const i = autoInfo(x.run);
            if (needsHuman(x)) { askN++; return; }
            if (!i) return;
            if (i.level === 'ready') ready++;
            else if (i.level === 'rewritable' || i.level === 'needsCommand') rew++;
            else if (i.level === 'external') ext++;
            else askN++;   // manual：识别不出改写法的交互命令，按"要人"算
        });
        return {
            total: arr.length, askN, rew, ext, ready,
            full: arr.length > 0 && askN === 0 && rew === 0 && ext === 0
        };
    }

    function askNewConfig() {
        if (running) { toast('部署执行中，暂不能改配置', 'warn'); return; }
        openConfigForm(null);
    }
    /* 编辑 / 删除各有两处入口：右栏头部那两个按钮（对"当前配置"）与左栏列表行内动作（对"那一条"）。
       `id` 传字符串时锁定那一条，否则落到当前配置。
       注意要判**类型**而不是真假：内联 onclick 会把事件对象当第一个参数传进来。 */
    function configById(id) {
        return typeof id === 'string' ? CONFIGS.find(x => x.id === id) : null;
    }
    function askEditConfig(id) {
        if (running) { toast('部署执行中，暂不能改配置', 'warn'); return; }
        const c = configById(id) || cfg();
        if (!c) { toast('请先选择一个部署配置', 'warn'); return; }
        openConfigForm(c);
    }

    function openConfigForm(base) {
        if (!base && CONFIGS.length >= 6) {
            toast('原型里最多演示 6 个配置', 'warn');
            return;
        }

        let fields = null;   // render 里回填，onConfirm 才有字段可读
        /* 分组标签的两个状态：render 里赋值、onConfirm 里读。
           必须声明在 render **之外** —— render 与 onConfirm 是同一个对象字面量里的**兄弟**，
           render 里 `let` 出来的变量在 onConfirm 里根本不存在（写的时候不报错，点"创建"才炸）。 */
        let groupAuto = true;    // 还在跟着路径自动预选吗
        let groupVal = GROUP_OTHER.id;  // 当前标签

        openConfirm({
            title: base ? '编辑部署配置' : '新增部署配置',
            variant: 'form',
            confirmText: base ? '保存' : '创建配置',
            render: (body) => {
                const inputs = {};

                /* 一个字段 = 标签行（必填徽标 + ? 说明 + 右侧计数）+ 控件 + 常用值 + 错误 */
                function field(o) {
                    const wrap = el('div', 'modal-field');

                    /* 传了 inHead（卡片容器）就把标签类元素并进卡片头：卡片名已经说了这是什么，
                       下面再写一行 label 就是同一个名字写两遍。 */
                    const card = o.inHead || null;
                    const head = card ? card.head : el('div', 'field-label');
                    if (card) {
                        // 卡片名兼作 label：点它也该能聚焦到输入框
                        const t = head.querySelector('.form-group-title');
                        if (t) t.setAttribute('for', o.id);
                    } else {
                        const lab = el('label', null, o.label);
                        lab.setAttribute('for', o.id);
                        head.appendChild(lab);
                    }
                    if (o.required) head.appendChild(el('span', 'field-req', '必填'));
                    if (o.help) head.appendChild(helpBtn(o.help));
                    /* 字段级动作（目前只有「浏览服务器目录」）—— 挂标题行里，不占输入框宽度。
                       回调拿到的是本字段的 input：闭包在点击时才求值，那时 inp 早已赋值。 */
                    if (o.action) {
                        const b = el('button', 'field-act', o.action.label);
                        b.type = 'button';
                        b.onclick = () => o.action.onClick(inp);
                        head.appendChild(b);
                    }

                    let countEl = null;
                    if (o.count) {
                        countEl = el('span', 'field-count');   // 自带 margin-left: auto，落在卡片头右端
                        head.appendChild(countEl);
                    }

                    let inp;
                    if (o.list) {
                        // 值载体：列表结构的 JSON 也放进 input.value，
                        // 校验 / 计数 / 摘要就还能沿用同一条读取口径
                        inp = el('input');
                        inp.type = 'hidden';
                    } else {
                        inp = el('input', 'modal-input' + (o.plain ? ' plain' : ''));
                        inp.type = 'text';
                        inp.autocomplete = 'off';
                        inp.maxLength = o.max || 120;
                    }
                    inp.id = o.id;
                    if (o.placeholder) inp.placeholder = o.placeholder;
                    inp.value = o.value || '';
                    inp.setAttribute('aria-describedby', o.id + '-err');

                    const err = el('div', 'field-err');
                    err.id = o.id + '-err';
                    err.hidden = true;

                    const countText = () => (countEl ? o.count(inp.value) : '');

                    inp.addEventListener('input', () => {
                        wrap.classList.remove('has-error');
                        inp.classList.remove('is-invalid');
                        inp.removeAttribute('aria-invalid');
                        err.hidden = true;
                        if (countEl) countEl.textContent = countText();
                    });
                    // 字段全是单行（列表编辑器里每行也是单行），Enter 直接提交
                    inp.addEventListener('keydown', e => {
                        if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); mConfirm.click(); }
                    });

                    // 标签并进卡片头时，字段自己只剩控件 + 错误行
                    if (!card) wrap.appendChild(head);
                    wrap.append(inp, err);

                    let setList = null;   // 列表编辑器的灌值入口（chips 要用）
                    if (o.list) {
                        const ed = cmdEditor(o.list, () => {
                            inp.value = JSON.stringify(ed.get());
                            inp.dispatchEvent(new Event('input'));
                        });
                        setList = ed.set;
                        wrap.insertBefore(ed.node, err);
                        inp.value = JSON.stringify(ed.get());
                        // 这里不做任何"代用户改写命令"的动作（批量的 2026-09-25 删、行内单条同日也删）——
                        // 工具只识别 + 给建议，改不改、怎么改由用户自己决定
                    }
                    if (countEl) countEl.textContent = countText();

                    if (o.presets) {
                        const row = el('div', 'chips-row');
                        row.appendChild(el('span', 'chips-label', o.presetsLabel || '常用'));
                        o.presets.forEach(p => {
                            // 路径是单行字符串；命令是 [{op, run}] 列表
                            const list = Array.isArray(p) ? p : [p];
                            const val = typeof list[0] === 'object' && list[0] !== null
                                ? JSON.stringify(list)
                                : list.join('\n');
                            const c = el('button', 'modal-chip',
                                typeof list[0] === 'object' && list[0] !== null
                                    ? list.map(x => x.op || x.run).join(' ; ')
                                    : list.join(' ; '));
                            c.type = 'button';
                            c.title = val;
                            c.onclick = () => {
                                if (setList) {
                                    setList(parseCmds(val));   // 内部已重建并同步值
                                } else {
                                    inp.value = val;
                                    inp.dispatchEvent(new Event('input'));
                                }
                                const focusTo = setList ? wrap.querySelector('.cmd-op') : inp;
                                if (focusTo) focusTo.focus();
                            };
                            row.appendChild(c);
                        });
                        wrap.appendChild(row);
                    }

                    inputs[o.key] = { wrap: wrap, inp: inp, err: err };
                    return wrap;
                }

                /* 启动命令列表编辑器：左「操作名称」+ 右「命令」+ >_「需人工输入」+ 删除。
                   值以 JSON 写回隐藏 input。 */
                function cmdEditor(init, onChange) {
                    const rows = el('div', 'cmd-rows');
                    // 列名常驻在滚动区里（sticky）：命令多到要滚时两列各填什么仍一眼可见，
                    // 且与行同一个内宽，列宽逐像素对齐
                    const head = el('div', 'cmd-head');
                    head.appendChild(el('span', 'cmd-head-op', '操作名称'));
                    const hCmd = el('span', 'cmd-head-cmd');
                    hCmd.append(el('span', null, '命令'), el('i', null, '· 从上到下依次执行'));
                    head.appendChild(hCmd);
                    rows.appendChild(head);

                    /* 用 cmdList 读初值：它同时吃数组和 JSON 文本。
                       原先写的是 `Array.isArray(init) ? init : []`，而 onConfirm 存进去的是 JSON 文本
                       ⇒ 新建一条配置再点「编辑」，命令列表是空的，保存后原来填的命令就被清掉了。 */
                    const data = cmdList(init).map(x => ({ op: x.op, run: x.run, ask: x.ask }));
                    if (!data.length) data.push({ op: '', run: '', ask: false });

                    function paint() {
                        // 只清行，留住建在里面的表头
                        Array.prototype.forEach.call(rows.querySelectorAll('.cmd-row'), n => n.remove());
                        data.forEach((it, i) => {
                            const row = el('div', 'cmd-row');
                            const op = el('input', 'modal-input cmd-op');
                            op.type = 'text';
                            op.value = it.op || '';
                            // 列名行已经说了这两列是什么，placeholder 就让位给「长什么样」的例子
                            op.placeholder = '重启服务';
                            op.autocomplete = 'off';
                            op.maxLength = 16;

                            const run = el('input', 'modal-input cmd-run');
                            run.type = 'text';
                            run.value = it.run || '';
                            run.title = run.value;
                            run.placeholder = 'systemctl restart pay-api';
                            run.autocomplete = 'off';
                            run.spellcheck = false;
                            run.maxLength = 200;

                            // >_ 开关常驻（不依赖识别）—— 识别不出来的自研脚本也得能标
                            const ask = el('button', 'cmd-ask', '>_');
                            ask.type = 'button';
                            ask.classList.toggle('on', !!it.ask);
                            ask.setAttribute('aria-pressed', String(!!it.ask));
                            ask.title = it.ask
                                ? (needsHuman(it) ? '已标记：执行到这里会暂停等你输入'
                                                  : '已标记，但当前连接身份下这条不会问密码')
                                : '标记为「需人工输入」';
                            ask.setAttribute('aria-label', '第 ' + (i + 1) + ' 条，' + ask.title);
                            ask.onclick = () => { it.ask = !it.ask; paint(); onChange(); };

                            const del = el('button', 'cmd-del', '✕');
                            del.type = 'button';
                            del.disabled = data.length < 2;
                            del.title = del.disabled ? '至少保留一条' : '删除这一条';
                            del.setAttribute('aria-label', '删除第 ' + (i + 1) + ' 条');
                            del.onclick = () => { data.splice(i, 1); paint(); onChange(); };

                            op.addEventListener('input', () => { it.op = op.value; onChange(); });
                            // 命令常常比输入框宽，悬停至少能看全。
                            // 每敲一个字都要重算提示行 —— 否则新敲的命令要等下次重建列表才出现提示，
                            // 而重建整行会把焦点弄丢，所以只换提示行这一个节点（且延后一点，别每个键都动 DOM）
                            run.addEventListener('input', () => {
                                it.run = run.value; run.title = run.value; onChange();
                                clearTimeout(run._noteT);
                                run._noteT = setTimeout(() => applyNote(row, it, i), 180);
                            });
                            // 都是单行字段：Enter 直接提交整张表单
                            [op, run].forEach(x => x.addEventListener('keydown', e => {
                                if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); mConfirm.click(); }
                            }));

                            row.append(op, run, ask, del);
                            applyNote(row, it, i);

                            rows.appendChild(row);
                        });
                    }

                    /* 提示行：只在「本来就说得上话」的时候出现 ——
                       普通命令行（nginx -t 这种）不该被多说一句。
                       有非交互写法时顺手给个动作：点一下改完，从此不用人输密码。 */
                    function noteFor(it, i) {
                        const det = detectAsk(it.run);
                        const info = autoInfo(it.run);
                        // 已就绪也要分两种：普通命令没什么可说的；「因为身份/写法所以不会问密码」必须说出来 ——
                        // 用户需要知道"为什么这里不用输"
                        const notable = it.ask || det ||
                            (info && (info.level !== 'ready' || info.sudoLine || info.why));
                        if (!notable) return null;

                        const note = el('div', 'cmd-note'
                            + (it.ask ? ' on' : (info && info.level === 'ready' ? ' done' : '')));
                        const head = el('span', 'ic');
                        const txt = el('span', 'note-t');
                        note.append(head, txt);

                        if (it.ask) {
                            head.textContent = '>_';
                            // 标了人工、但当前身份让这条其实不会问密码 —— 说清楚，别让人白等
                            if (info && info.level === 'ready' && info.why) {
                                txt.textContent = '已标记「需人工输入」，但' + info.why + ' —— 这次不会提示';
                            } else {
                                txt.textContent = '执行到这里会暂停，等你在终端里输入'
                                    + (det && det.prompt ? '（会提示 ' + det.prompt + '）' : '');
                            }
                        } else if (info && (info.level === 'rewritable' || info.level === 'needsCommand')) {
                            // ⚠ = 一定会停下来要密码，ℹ = 可能（取决于免密配置）——
                            // 这个区别由 detectAsk 判定
                            head.textContent = det && det.sure ? '⚠' : 'ℹ';
                            txt.textContent = info.why;
                            // 只给建议、不代改：把针对**这条命令**的具体写法摆出来，用户能直接照抄。
                            // 这是"一键改写"移除之后，这条提示的全部价值所在。
                            if (info.to) {
                                const code = el('code', null, info.to);
                                code.title = info.to;
                                note.appendChild(code);
                            }
                        } else if (info && info.level === 'external') {
                            head.textContent = 'ℹ';
                            txt.textContent = info.why;
                        } else if (info && info.level === 'ready') {
                            head.textContent = '✓';
                            txt.textContent = info.why || '已是非交互写法';
                            if (info.sudoLine) {
                                txt.textContent = '已是非交互写法 · 服务器上要有这一行授权：';
                                const code = el('code', null, info.sudoLine);
                                code.title = info.sudoLine;
                                note.append(code, copyLineBtn(info.sudoLine));
                            }
                        } else if (det) {
                            // 识别到会等输入，但这条没有能一键套用的非交互写法
                            head.textContent = det.sure ? '⚠' : 'ℹ';
                            txt.textContent = det.why;
                        }

                        return note;
                    }
                    // 就地换掉提示行（不动其他节点，焦点不会跑）
                    function applyNote(row, it, i) {
                        const old = row.querySelector('.cmd-note');
                        const next = noteFor(it, i);
                        if (old) old.remove();
                        if (next) row.appendChild(next);
                    }

                    /* 「一键改成免密写法」已按用户要求移除 —— 命令是用户亲手写的，
                       工具代它改（甚至只是把它改写一遍再让他确认）都比"告诉他建议怎么写"更容易出错，
                       而提示行里给出的建议写法已经足够。**只提示，不代改。** */
                    function copyLineBtn(text) {
                        const b = el('button', 'act', '复制');
                        b.type = 'button';
                        b.setAttribute('aria-label', '复制这一行授权');
                        b.onclick = e => { e.preventDefault(); copyText(text, b, '已复制授权行'); };
                        return b;
                    }

                    const add = el('button', 'cmd-add', '＋ 添加一条');
                    add.type = 'button';
                    add.onclick = () => {
                        data.push({ op: '', run: '', ask: false });
                        paint();
                        onChange();
                        // 新行直接落在操作名上，少一次点击
                        rows.lastElementChild.querySelector('.cmd-op').focus();
                    };

                    const box = el('div', 'cmd-edit');
                    box.append(rows, add);
                    paint();

                    /* 灌值：常用值 chip 点一下就整段替换，UI 必须重建 ——
                       只改隐藏 input 的值，列表上还是旧内容 */
                    function set(v) {
                        // parseCmds 同时吃数组与 JSON 文本，且不像 cmdList 那样过滤空行
                        // （常用值 chip 灌进来的是数组，但别对入参类型做假设）
                        const next = parseCmds(v)
                            .map(x => ({ op: (x && x.op) || '', run: (x && x.run) || '', ask: !!(x && x.ask) }));
                        data.length = 0;
                        next.forEach(x => data.push(x));
                        if (!data.length) data.push({ op: '', run: '', ask: false });
                        paint();
                        onChange();   // 重建后同步一次值，否则计数 / 摘要还按旧值算
                    }

                    return { node: box, get: () => data, set: set };
                }

                /* 一张卡片 = 一个问题。卡片头兼作字段的标签行 ——
                   一个卡片只放一个字段时再单开一行 label 就是同一个名字写两遍。
                   所以卡片头要能被字段往里塞「必填 / ? / 计数」。
                   卡片名后面不跟解释性文字：字段名本身已经说清要填什么，
                   真正的说明挂在标签行的「?」里，按需再展开。 */
                function group(no, title) {
                    const g = el('div', 'form-group');
                    const h = el('div', 'form-group-head');
                    h.append(el('span', 'form-group-no', no), el('label', 'form-group-title', title));
                    g.appendChild(h);
                    g.head = h;      // 字段把标签类元素挂进这里
                    return g;
                }

                /* ---------------- ① 名称与分组 ----------------
                   分组是**配置自己的标签**：选了什么，它就在左栏归到哪一组。
                   新建时**跟着路径自动预选**（填了 /var/www/… 就落在「前端资源」，省一次点击），
                   但只要点过任一枚 chip，就以点的那枚为准 —— 自动只是默认值，决定权在人手上。 */
                const g1 = group('1', '名称与分组');
                g1.appendChild(field({
                    key: 'name', id: 'cfgName', inHead: g1, required: true, plain: true,
                    placeholder: '例如：应用包 · 全量启动', max: 20,
                    value: base ? base.name : '',
                    help: '显示在左侧配置列表里，建议写清用途。'
                }));

                const groupRow = el('div', 'form-sub');
                groupRow.appendChild(el('span', 'form-sub-k', '分组'));
                const chipRow = el('div', 'group-pick');
                chipRow.setAttribute('role', 'radiogroup');
                chipRow.setAttribute('aria-label', '分组标签');
                groupAuto = !base;                                     // 编辑时以配置自身的标签为准
                groupVal = base ? groupFor(base) : GROUP_OTHER.id;
                const chips = [];                                      // 动态：新建分组会往里加一枚
                function mkGroupChip(g) {
                    const b = el('button', 'group-chip', g.name);
                    b.type = 'button';
                    b.setAttribute('role', 'radio');
                    b.dataset.g = g.id;
                    b.onclick = () => { groupAuto = false; groupVal = g.id; paintGroupChips(); };
                    chips.push(b);
                    return b;
                }
                DEPLOY_GROUPS.forEach(g => chipRow.appendChild(mkGroupChip(g)));
                function paintGroupChips() {
                    chips.forEach(b => {
                        const on = b.dataset.g === groupVal;
                        b.classList.toggle('on', on);
                        b.setAttribute('aria-checked', String(on));
                    });
                }
                paintGroupChips();

                /* 行尾的「＋」：点开在**同一位置**换成输入框（缺省态是"选"，新建按需才切到输入态）。
                   回车或失焦确认，Esc / 空值取消 —— 点开又后悔是常事，不该建出一个空名的分组。 */
                let adding = false;
                const addBtn = el('button', 'group-add');
                addBtn.type = 'button';
                addBtn.title = '新建分组';
                addBtn.setAttribute('aria-label', '新建分组');
                addBtn.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.6v8.8M3.6 8h8.8"/></svg>';
                const addInput = el('input', 'group-add-input');
                addInput.type = 'text';
                addInput.maxLength = 8;
                addInput.placeholder = '新分组名';
                addInput.setAttribute('aria-label', '新分组名称');
                addInput.hidden = true;

                function openAddGroup() {
                    adding = true;
                    addBtn.hidden = true;
                    addInput.hidden = false;
                    addInput.value = '';
                    addInput.focus();
                }
                function closeAddGroup() {
                    adding = false;     // 先落这个标志：藏起输入框本身还会再触发一次 blur
                    addInput.value = '';
                    addInput.hidden = true;
                    addBtn.hidden = false;
                }
                function commitAddGroup() {
                    if (!adding) return;            // 收输入态时走的也是这个函数，别二次提交
                    const name = addInput.value;
                    closeAddGroup();                // 建没建成先收起输入态，不停在半开的样子
                    const g = addDeployGroup(name);
                    if (!g) return;                 // 空名 = 取消
                    // 撞名时不再补一枚 chip，直接把它选中 —— 两个同名分组会让人以为"没生效"
                    if (!chips.some(b => b.dataset.g === g.id)) chipRow.insertBefore(mkGroupChip(g), addBtn);
                    groupAuto = false;              // 手选过就不再被路径改写
                    groupVal = g.id;
                    paintGroupChips();
                }
                addBtn.onclick = openAddGroup;
                addInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); commitAddGroup(); }
                    // Esc 只该收起这一格 —— 不挡住冒泡的话，文档级那个监听顺手把整张表单关了
                    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeAddGroup(); }
                });
                addInput.addEventListener('blur', commitAddGroup);

                chipRow.append(addBtn, addInput);
                groupRow.appendChild(chipRow);
                g1.appendChild(groupRow);

                /* ---------------- ② 服务器路径 ---------------- */
                const g2 = group('2', '服务器路径');
                g2.appendChild(field({
                    key: 'path', id: 'cfgPath', inHead: g2, required: true,
                    placeholder: '/opt/app/releases', presets: PATH_PRESETS, presetsLabel: '常用路径', max: 80,
                    value: base ? base.path : '',
                    action: {
                        label: '浏览服务器目录',
                        onClick: inp => openDirPicker(inp.value, picked => {
                            inp.value = picked;
                            // 走一遍 input 事件：清掉上一次校验留下的红框，联动的地方也跟着更新
                            inp.dispatchEvent(new Event('input'));
                            inp.focus();
                        })
                    },
                    help: '上传的文件会放到这个目录；目录不存在会自动创建，同名文件将被覆盖。'
                }));
                // 路径 → 分组的预选：只在"还没手动选过"时发生
                inputs.path.inp.addEventListener('input', () => {
                    if (!groupAuto) return;
                    const next = groupFromPath(inputs.path.inp.value.trim());
                    if (next !== groupVal) { groupVal = next; paintGroupChips(); }
                });

                /* ---------------- ③ 启动命令 ---------------- */
                const g3 = group('3', '启动命令');
                g3.appendChild(field({
                    key: 'cmd', id: 'cfgCmd', inHead: g3, required: true,
                    list: base ? base.cmd : [],
                    presets: CMD_PRESETS, presetsLabel: '常用模板',
                    help: '传完之后按顺序执行。su / sudo / ssh 这类会停下来要密码的命令，'
                        + '提示里会给出建议的非交互写法（sudo -n：没授权会立刻失败，不会挂着）；'
                        + '确实要人输入的（自研交互脚本）点行尾的 >_ 标记。',
                    count: v => { const n = cmdList(v).length; return n ? n + ' 条' : ''; }
                }));

                /* 三张卡片包一个容器：目录选择器切走正文时，要能把"整张表单"作为一个节点暂存、
                   切回来原样放回（不是取 firstElementChild —— 正文里将来若多一个说明段就取错了） */
                const formBody = el('div', 'form-body');
                formBody.append(g1, g2, g3);
                body.appendChild(formBody);
                fields = inputs;

                return {
                    focus: () => {
                        inputs.name.inp.focus();
                        if (base) inputs.name.inp.select();   // 编辑态预填内容直接全选，省一次三击
                    },
                    validate: () => {
                        const bad = [];
                        const val = k => inputs[k].inp.value.trim();
                        const mark = (k, msg) => {
                            const f = inputs[k];
                            f.wrap.classList.add('has-error');
                            f.inp.classList.add('is-invalid');
                            f.inp.setAttribute('aria-invalid', 'true');
                            f.err.textContent = msg;
                            f.err.hidden = false;
                            bad.push(k);
                        };

                        ['name', 'path', 'cmd'].forEach(k => {
                            const f = inputs[k];
                            f.wrap.classList.remove('has-error');
                            f.inp.classList.remove('is-invalid');
                            f.inp.removeAttribute('aria-invalid');
                            f.err.hidden = true;
                        });

                        // 每个字段独立判断：一次把问题全指出来，而不是修好一个又冒一个
                        if (!val('name')) mark('name', '请填写配置名称');
                        if (!val('path')) mark('path', '请填写上传路径');
                        else if (val('path').charAt(0) !== '/') mark('path', '路径要以 / 开头，例如 /opt/app/releases');
                        const cmds = cmdList(val('cmd'));
                        if (!cmds.length) mark('cmd', '请至少填写一条启动命令');
                        else if (cmds.some(x => !x.op)) mark('cmd', '每条命令都要有操作名称');

                        if (bad.length) {
                            inputs[bad[0]].inp.focus();
                            inputs[bad[0]].inp.scrollIntoView({ block: 'center', behavior: 'smooth' });
                            toast(bad.length + ' 项还没填好', 'warn');
                            return false;
                        }
                        return true;
                    }
                };
            },
            onConfirm: () => {
                const payload = {
                    name: fields.name.inp.value.trim(),
                    // 分组标签：左栏就是按它归组的（没有标签的老数据才退回按路径推断）
                    group: groupVal,
                    path: fields.path.inp.value.trim(),
                    // 存结构化数组，与初始数据同型：存 JSON 文本会让下游到处多一层
                    // 「可能是字符串」的分支，而这个分支一定会有人漏写（见 cmdEditor 那处旧 bug）
                    cmd: cmdList(fields.cmd.inp.value)
                };
                if (base) {
                    Object.assign(base, payload);
                    toast('已保存「' + payload.name + '」· ' + groupName(groupVal));
                } else {
                    const id = 'c' + Date.now();
                    CONFIGS.push(Object.assign({ id: id }, payload));
                    currentId = id;
                    // 说清它落到了哪一组 —— 这正是「加标签」要回答的事
                    toast('已创建「' + payload.name + '」· ' + groupName(groupVal));
                }
                renderCfgList();
                renderConfig();
                resetRun();
                document.getElementById('stepList').scrollTop = 0;
            }
        });
    }
    function askDeleteConfig(id) {
        if (running) { toast('部署执行中，暂不能删除配置', 'warn'); return; }
        const c = configById(id) || cfg();
        if (!c) { toast('请先选择一个部署配置', 'warn'); return; }

        openConfirm({
            title: '删除部署配置',
            desc: '将删除「' + c.name + '」（上传到 ' + c.path + '）。',
            warn: '只移除这条配置，不会影响服务器上已经部署的内容。',
            warnKind: 'info',
            confirmText: '删除',
            danger: true,
            onConfirm: () => {
                CONFIGS = CONFIGS.filter(x => x.id !== c.id);
                // 只有当被删的正是当前这条时才需要另选一条 ——
                // 从左栏删掉"别的"配置时，用户当前在看的那条不该跟着变
                if (c.id === currentId) currentId = CONFIGS.length ? CONFIGS[0].id : null;
                renderCfgList();
                renderConfig();
                resetRun();
                toast('已删除「' + c.name + '」');
            }
        });
    }

    function refreshAll() {
        if (running) { toast('部署执行中，完成后再刷新', 'warn'); return; }
        document.getElementById('lastSync').textContent = '更新于 ' + hhmmss().slice(0, 5);
        renderCfgList();
        renderConfig();
        resetRun();
        toast('已刷新部署配置');
    }

    /* ============================================================
       键盘
       ============================================================ */
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            // 在目录选择器里按 Escape = 退回表单，而不是把整张表单一起关掉
            if (mask.classList.contains('open')) {
                if (pickerViewOpen()) closeDirPicker();
                else closeModal();
            }
            return;
        }
        // ⌘/Ctrl + Enter 直接开始部署
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !running && !mask.classList.contains('open')) {
            e.preventDefault();
            startDeploy();
        }
    });

    /* ============================================================
       初始化
       ============================================================ */
    renderCfgList();
    renderConfig();
    renderFiles();
    bindDropzone();
    bindBindInput();
    resetRun();
    updateFollowBtn();
    updateTaskProgress();
    updateJumpBtn();

    // 连接身份：切一下就重算「这条配置还要不要人盯」。跑着的时候不让改 ——
    // 换身份会把执行上下文换掉，正在跑的流程不能中途换人。
    (function bindExecUser() {
        const sel = ensureUserOption(sessionUser);
        if (!sel) return;
        sel.addEventListener('change', () => {
            if (running) {
                toast('部署执行中，暂不能切换连接身份', 'warn');
                sel.value = sessionUser;
                return;
            }
            setSessionUser(sel.value);
        });
    })();

    if (IS_WINDOW) {
        document.title = '部署 · 支付系统重构（独立窗口）';
        setTimeout(() => toast('已在新窗口打开部署面板'), 500);
    }
</script>
</body>
</html>
