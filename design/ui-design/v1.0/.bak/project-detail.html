<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>项目详情 · Lucky-Y</title>
<style>
/* ============================================================
   Lucky-Y UI Prototype v1.0 — 项目详情
   ============================================================ */
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;

  --brand-700:#3730a3; --brand-600:#4338ca; --brand-500:#4f46e5;
  --brand-400:#6366f1; --brand-100:#e0e7ff; --brand-50:#eef2ff;

  --life:#0f9d76;   --life-bg:#e7f6f1;
  --work:#2f6fed;   --work-bg:#e9f0fe;
  --learn:#7c3aed;  --learn-bg:#f1ebfe;

  --ink-900:#101218; --ink-800:#1b1e26; --ink-700:#343a46; --ink-600:#4a515e;
  --ink-500:#6b7280; --ink-400:#8b93a1; --ink-300:#aeb5c0; --ink-200:#d5d9e0;
  --ink-100:#e8ebef; --ink-50:#f3f5f8;

  --surface:#ffffff; --bg:#f6f7f9; --border:#e5e8ed; --border-strong:#d3d8e0;

  --danger:#dc2626;  --danger-bg:#fdecec;
  --success:#0f9d76; --success-bg:#e7f6f1;
  --warning:#c2740a; --warning-bg:#fdf3e2;

  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-full:999px;

  --sh-xs:0 1px 2px rgba(16,18,24,.05);
  --sh-sm:0 1px 3px rgba(16,18,24,.06),0 1px 2px rgba(16,18,24,.04);
  --sh-md:0 4px 12px rgba(16,18,24,.07),0 2px 4px rgba(16,18,24,.04);
  --sh-lg:0 12px 28px rgba(16,18,24,.10),0 4px 8px rgba(16,18,24,.04);
  --sh-xl:0 24px 48px rgba(16,18,24,.14);

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s8:32px; --s10:40px; --s12:48px; --s16:64px;

  --d-fast:150ms; --d-base:220ms; --d-slow:400ms;
  --ease-out:cubic-bezier(0,0,.2,1);

  --sidebar-w:248px; --topbar-h:60px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-sans);font-size:15px;line-height:1.7;color:var(--ink-900);
  background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px;border-radius:var(--r-xs)}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-300);background-clip:content-box;border:3px solid transparent}
.icon{width:18px;height:18px;flex:none}

/* ---------- 骨架 ---------- */
.app{display:flex;height:100vh;overflow:hidden}

.sidebar{
  width:var(--sidebar-w);flex:none;display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--border);z-index:30;
}
.sidebar__brand{
  height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:10px;
  padding:0 var(--s5);border-bottom:1px solid var(--border);
}
.sidebar__brand svg{width:28px;height:28px;border-radius:8px;flex:none}
.sidebar__brand b{font-size:15.5px;font-weight:700}
.sidebar__brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.13em;
  color:var(--ink-400);text-transform:uppercase;line-height:1;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:var(--s4) var(--s3) var(--s2)}
.nav__label{padding:var(--s3) var(--s3) 6px;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400)}
.nav__item{display:flex;align-items:center;gap:11px;padding:9px var(--s3);margin-bottom:2px;
  border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-600);
  transition:background var(--d-fast) var(--ease-out),color var(--d-fast) var(--ease-out);position:relative}
.nav__item .icon{width:17.5px;height:17.5px;color:var(--ink-400);transition:color var(--d-fast)}
.nav__item:hover{background:var(--ink-50);color:var(--ink-900)}
.nav__item:hover .icon{color:var(--ink-600)}
.nav__item.is-active{background:var(--ink-900);color:#fff;font-weight:600}
.nav__item.is-active .icon{color:#fff}
.nav__item.is-active::before{content:"";position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--brand-500)}
.sidebar__foot{flex:none;padding:var(--s3);border-top:1px solid var(--border)}
.sync{display:flex;align-items:center;gap:8px;padding:9px 11px;margin-bottom:var(--s3);
  border-radius:var(--r-sm);background:var(--ink-50);font-size:11.5px;color:var(--ink-500);font-weight:500}
.sync i{width:6px;height:6px;border-radius:50%;background:#22c55e;flex:none;
  box-shadow:0 0 0 3px rgba(34,197,94,.16);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-md);
  cursor:pointer;transition:background var(--d-fast)}
.user-card:hover{background:var(--ink-50)}
.user-card__meta{min-width:0;flex:1}
.user-card__meta b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.user-card__meta span{display:block;font-size:11.5px;color:var(--ink-400);line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card>svg{width:15px;height:15px;color:var(--ink-300);flex:none}

.avatar{width:32px;height:32px;flex:none;border-radius:9px;display:inline-flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#6366f1,#7c3aed);letter-spacing:.02em}
.avatar--sm{width:26px;height:26px;border-radius:7px;font-size:10.5px}
.avatar--xs{width:22px;height:22px;border-radius:6px;font-size:9.5px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

.topbar{
  height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s6);background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);z-index:20;
}
.hamburger{display:none;width:34px;height:34px;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--ink-600)}
.search{position:relative;flex:1;max-width:400px;display:flex;align-items:center}
.search .icon{position:absolute;left:11px;width:16px;height:16px;color:var(--ink-400);pointer-events:none}
.search input{width:100%;height:36px;padding:0 62px 0 35px;font-family:inherit;font-size:13.5px;
  color:var(--ink-900);background:var(--ink-50);border:1px solid transparent;border-radius:var(--r-md);
  outline:none;transition:all var(--d-fast) var(--ease-out)}
.search input::placeholder{color:var(--ink-400)}
.search input:focus{background:var(--surface);border-color:var(--brand-500);box-shadow:0 0 0 3.5px rgba(79,70,229,.12)}
.search kbd{position:absolute;right:9px;padding:2px 6px;border-radius:5px;background:var(--surface);
  border:1px solid var(--border);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-400);line-height:1.5}
.topbar__spacer{flex:1}
.icon-btn{width:34px;height:34px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--ink-500);
  transition:all var(--d-fast) var(--ease-out)}
.icon-btn:hover{background:var(--ink-50);color:var(--ink-900)}
.icon-btn .icon{width:17.5px;height:17.5px}
.topbar__divider{width:1px;height:22px;background:var(--border);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;
  border-radius:var(--r-md);font-size:13.5px;font-weight:600;border:1px solid transparent;
  transition:all var(--d-fast) var(--ease-out);white-space:nowrap}
.btn .icon{width:16px;height:16px}
.btn--primary{background:var(--ink-900);color:#fff}
.btn--primary:hover{background:#000;box-shadow:var(--sh-md);transform:translateY(-1px)}
.btn--ghost{background:var(--surface);border-color:var(--border-strong);color:var(--ink-700)}
.btn--ghost:hover{background:var(--ink-50);border-color:var(--ink-300);color:var(--ink-900)}
.btn--sm{height:32px;padding:0 11px;font-size:13px}
.btn:active{transform:scale(.98)}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--s5) var(--s6) var(--s16)}

/* ---------- 返回 ---------- */
.back{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--ink-500);
  margin-bottom:var(--s4);transition:color var(--d-fast)
}
.back:hover{color:var(--brand-600)}
.back .icon{width:14px;height:14px}
.back .icon--l{transform:rotate(180deg)}

/* ---------- Hero ---------- */
.hero{
  display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:var(--s6);
  padding:var(--s6);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
  margin-bottom:var(--s5);
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
}
.hero[data-scope="life"]::before{background:var(--life)}
.hero[data-scope="work"]::before{background:var(--work)}
.hero[data-scope="learn"]::before{background:var(--learn)}

.hero__top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.hero h1{font-size:26px;line-height:1.3;margin-bottom:8px}
.hero__desc{font-size:14px;color:var(--ink-500);line-height:1.8;max-width:660px;margin:0 0 var(--s5)}
.hero__actions{display:flex;gap:var(--s2);flex-wrap:wrap}

.metagrid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:var(--s3);margin-top:var(--s5);padding-top:var(--s5);
  border-top:1px dashed var(--border);
}
.metaitem{display:flex;flex-direction:column;gap:3px}
.metaitem__k{font-size:11.5px;font-weight:600;color:var(--ink-400);display:flex;align-items:center;gap:5px}
.metaitem__k .icon{width:12.5px;height:12.5px}
.metaitem__v{font-size:13.5px;font-weight:600;color:var(--ink-800)}
.metaitem__v.warn{color:var(--danger)}

/* 进度环 */
.ringcard{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--s5);border-radius:var(--r-lg);background:var(--bg);border:1px solid var(--border);
  text-align:center;
}
.ring{width:132px;height:132px;position:relative}
.ring__num{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ring__num b{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring__num span{font-size:11.5px;font-weight:600;color:var(--ink-400);margin-top:4px}
.ringcard__meta{display:flex;gap:var(--s5);margin-top:var(--s4);width:100%;justify-content:center}
.ringcard__meta div{text-align:center}
.ringcard__meta b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.ringcard__meta span{font-size:11.5px;color:var(--ink-400);font-weight:500}

/* ---------- 标签页 ---------- */
.tabs{
  display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:var(--s5);
  overflow-x:auto;
}
.tabs button{
  position:relative;
  padding:11px 15px;border:0;background:transparent;
  font-size:13.5px;font-weight:600;color:var(--ink-500);white-space:nowrap;
  transition:color var(--d-fast) var(--ease-out);
}
.tabs button:hover{color:var(--ink-900)}
.tabs button.is-active{color:var(--ink-900)}
.tabs button.is-active::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
  background:var(--ink-900);border-radius:2px 2px 0 0;
}
.tabs .n{
  display:inline-block;margin-left:6px;padding:0 6px;border-radius:var(--r-full);
  background:var(--ink-100);font-size:11px;font-weight:700;color:var(--ink-500);line-height:18px;
}

.panel{display:none}
.panel.is-active{display:block;animation:fadeUp .3s var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s5);align-items:start}
.cols--wide{grid-template-columns:minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:var(--s5)}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;
}
.card__head{
  display:flex;align-items:center;gap:var(--s2);
  padding:var(--s4) var(--s5);border-bottom:1px solid var(--border);
}
.card__head h3{font-size:14px;font-weight:700}
.card__head .icon{width:16px;height:16px;color:var(--ink-400)}
.card__head .sp{flex:1}
.card__head .hint{font-size:12px;color:var(--ink-400);font-weight:500}
.card__body{padding:var(--s5)}
.card__body--flush{padding:0}

/* ---------- 任务列表 ---------- */
.task{
  display:flex;align-items:center;gap:var(--s4);
  padding:12px var(--s5);
  border-bottom:1px solid var(--border);
  transition:background var(--d-fast) var(--ease-out);
}
.task:last-child{border-bottom:0}
.task:hover{background:var(--ink-50)}
.task__check{
  width:19px;height:19px;flex:none;border-radius:6px;
  border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;
  color:#fff;transition:all var(--d-fast) var(--ease-out);
}
.task__check .icon{width:11px;height:11px;opacity:0}
.task.is-done .task__check{background:var(--success);border-color:var(--success)}
.task.is-done .task__check .icon{opacity:1}
.task__name{flex:1;min-width:0;font-size:13.5px;font-weight:500;line-height:1.55}
.task.is-done .task__name{color:var(--ink-400);text-decoration:line-through;text-decoration-color:var(--ink-300)}
.task__due{font-size:12px;color:var(--ink-400);font-variant-numeric:tabular-nums;white-space:nowrap}
.task__due.warn{color:var(--danger);font-weight:600}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  height:22px;padding:0 9px;border-radius:var(--r-full);
  font-size:11.5px;font-weight:600;white-space:nowrap;
}
.pill i{width:5.5px;height:5.5px;border-radius:50%;flex:none}
.pill--todo{background:var(--ink-100);color:var(--ink-600)}
.pill--todo i{background:var(--ink-400)}
.pill--doing{background:var(--success-bg);color:#0b7a5c}
.pill--doing i{background:var(--success)}
.pill--blocked{background:var(--danger-bg);color:#b91c1c}
.pill--blocked i{background:var(--danger)}
.pill--done{background:var(--brand-50);color:var(--brand-600)}
.pill--done i{background:var(--brand-500)}

.badge{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
  border-radius:var(--r-full);font-size:11.5px;font-weight:700;white-space:nowrap;
}
.badge i{width:5.5px;height:5.5px;border-radius:50%;flex:none;background:currentColor}
.badge--life{background:var(--life-bg);color:var(--life)}
.badge--work{background:var(--work-bg);color:var(--work)}
.badge--learn{background:var(--learn-bg);color:var(--learn)}

.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-xs);
  background:var(--ink-50);border:1px solid var(--border);font-size:11.5px;font-weight:500;color:var(--ink-500)}

/* ---------- 里程碑时间线 ---------- */
.mile{position:relative;padding-left:34px;padding-bottom:var(--s6)}
.mile:last-child{padding-bottom:0}
.mile::before{
  content:"";position:absolute;left:8px;top:20px;bottom:-4px;width:1.5px;background:var(--border);
}
.mile:last-child::before{display:none}
.mile__dot{
  position:absolute;left:0;top:4px;width:17px;height:17px;border-radius:50%;
  border:2px solid var(--border-strong);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
}
.mile__dot .icon{width:9px;height:9px;color:#fff;opacity:0}
.mile.is-done .mile__dot{background:var(--success);border-color:var(--success)}
.mile.is-done .mile__dot .icon{opacity:1}
.mile.is-now .mile__dot{border-color:var(--brand-500);background:var(--surface);box-shadow:0 0 0 4px rgba(79,70,229,.14)}
.mile.is-now .mile__dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand-500)}
.mile__name{font-size:13.5px;font-weight:650;line-height:1.5}
.mile.is-done .mile__name{color:var(--ink-500)}
.mile__meta{display:flex;align-items:center;gap:10px;margin-top:3px;font-size:12px;color:var(--ink-400)}
.mile__meta .icon{width:12.5px;height:12.5px}

/* ---------- 文档 ---------- */
.doc{
  display:flex;align-items:center;gap:var(--s4);padding:14px var(--s5);
  border-bottom:1px solid var(--border);transition:background var(--d-fast)
}
.doc:last-child{border-bottom:0}
.doc:hover{background:var(--ink-50)}
.doc__ic{
  width:34px;height:34px;flex:none;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  background:var(--ink-50);color:var(--ink-500);
}
.doc__ic .icon{width:16px;height:16px}
.doc__main{flex:1;min-width:0}
.doc__main b{display:block;font-size:13.5px;font-weight:600;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc__main span{display:block;font-size:12px;color:var(--ink-400);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 动态 ---------- */
.feed{position:relative;padding-left:34px}
.feed__item{position:relative;padding-bottom:var(--s5)}
.feed__item:last-child{padding-bottom:0}
.feed__item::before{content:"";position:absolute;left:-22px;top:24px;bottom:-4px;width:1.5px;background:var(--border)}
.feed__item:last-child::before{display:none}
.feed__av{position:absolute;left:-34px;top:0}
.feed__text{font-size:13.5px;line-height:1.7;color:var(--ink-700)}
.feed__text b{font-weight:650;color:var(--ink-900)}
.feed__text em{font-style:normal;font-weight:600;color:var(--brand-600)}
.feed__time{font-size:11.5px;color:var(--ink-400);margin-top:2px}

/* ---------- 信息列表 ---------- */
.dl{display:flex;flex-direction:column;gap:var(--s4)}
.dl__row{display:flex;align-items:flex-start;gap:var(--s4)}
.dl__k{width:76px;flex:none;font-size:12.5px;color:var(--ink-400);font-weight:600;padding-top:1px}
.dl__v{flex:1;font-size:13px;font-weight:500;color:var(--ink-800);display:flex;align-items:center;
  gap:6px;flex-wrap:wrap;min-width:0}
.dl__v .icon{width:14px;height:14px;color:var(--ink-400)}
.link{color:var(--brand-600);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* 风险提示 */
.alert{
  display:flex;gap:11px;padding:var(--s4);border-radius:var(--r-md);
  background:var(--warning-bg);border:1px solid #f2ddb8;
}
.alert--danger{background:var(--danger-bg);border-color:#f7cdcd}
.alert .icon{width:16px;height:16px;color:var(--warning);flex:none;margin-top:2px}
.alert--danger .icon{color:var(--danger)}
.alert b{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.alert p{margin:0;font-size:12.5px;line-height:1.65;color:var(--ink-600)}

/* ---------- 进度条 ---------- */
.progress{display:flex;align-items:center;gap:10px;margin-top:var(--s4)}
.progress__bar{flex:1;height:8px;border-radius:99px;background:var(--ink-100);overflow:hidden}
.progress__bar span{display:block;height:100%;border-radius:99px;transition:width var(--d-slow) var(--ease-out)}
.fill-life{background:linear-gradient(90deg,#34d3a6,#0f9d76)}
.fill-work{background:linear-gradient(90deg,#6f9dff,#2f6fed)}
.fill-learn{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.progress__legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-400);font-weight:600}

#toastHost{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px;border-radius:12px;background:#101218;color:#fff;font-size:13.5px;
  font-weight:500;box-shadow:0 12px 28px rgba(16,18,24,.22);opacity:0;transform:translateY(-8px);
  transition:all .24s cubic-bezier(0,0,.2,1)}
.toast.is-on{opacity:1;transform:translateY(0)}
.scrim{display:none;position:fixed;inset:0;background:rgba(16,18,24,.42);backdrop-filter:blur(2px);z-index:29}
.scrim.is-on{display:block}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
  .hero{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
}
@media (max-width:1024px){
  :root{--sidebar-w:236px}
  .scroll{padding:var(--s4) var(--s4) var(--s12)}
  .topbar{padding:0 var(--s4)}
}
@media (max-width:860px){
  .hamburger{display:inline-flex}
  .sidebar{position:fixed;inset:0 auto 0 0;height:100%;transform:translateX(-100%);
    transition:transform var(--d-base) var(--ease-out);box-shadow:var(--sh-xl)}
  .sidebar.is-open{transform:translateX(0)}
  .search kbd{display:none}
  .search input{padding-right:12px}
  .hero{padding:var(--s4)}
  .hero h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ============================================================
   工具
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = (id, cls) => '<svg class="icon '+(cls||'')+'"><use href="#'+id+'"/></svg>';

function hash(str){ var h=0; for(var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }

function avatar(n, cls){
  var hues=[265,215,158,25,340];
  var h=hues[hash(n)%hues.length];
  return '<span class="avatar '+(cls||'')+'" style="background:linear-gradient(135deg,hsl('+h+',72%,64%),hsl('+((h+330)%360)+',68%,52%))">'+esc(n)+'</span>';
}

/* 从内容池稳定取值 */
function pick(arr, seed, count){
  var out=[], h=hash(seed);
  for(var i=0;i<count;i++){ out.push(arr[(h+i*3)%arr.length]); }
  return out;
}

/* ============================================================
   生成派生数据
   ============================================================ */
function buildTasks(p){
  var names = pick(POOL[p.scope].tasks, p.id+'task', p.total);
  var list = [];
  for(var i=0;i<p.total;i++){
    // 前 done 个已完成；再往后少量进行中/阻塞，其余待办
    var st = i < p.done ? 'done' : (i < p.done+2 ? (p.status==='risk'? 'blocked':'doing') : 'todo');
    var due = p.status==='done' ? '已完成'
            : (i%5===0 && p.status==='risk' ? '已逾期 2 天' : (i%4)+1+' 天后');
    list.push({
      name: names[i] + (i>=names.length? ' ('+(i+1)+')' : ''),
      status: st,
      priority: i%4===0 ? '高' : (i%3===0 ? '中' : '低'),
      owner: p.owners[i % p.owners.length],
      due: due,
      late: due.indexOf('逾期')>-1
    });
  }
  // 未完成的任务排前面
  list.sort(function(a,b){ return (a.status==='done'?1:0)-(b.status==='done'?1:0); });
  return list;
}

function buildMiles(p){
  var names = POOL[p.scope].miles;
  var doneCount = Math.min(names.length, Math.max(0, Math.round(p.progress/100*names.length)));
  return names.map(function(n,i){
    var state = i < doneCount ? 'done' : (i === doneCount ? 'now' : 'todo');
    return { name:n, state:state,
      date: state==='done' ? '已完成' : (state==='now' ? '进行中' : '待启动'),
      detail: state==='done' ? '已于计划内完成' : (state==='now' ? '当前所处阶段' : '等待前序阶段') };
  });
}

function buildDocs(p){
  var srcs = ['腾讯文档','语雀','Git 仓库','本地 Markdown'];
  return pick(POOL[p.scope].docs, p.id+'doc', 4).map(function(n,i){
    return { name:n, src:srcs[(hash(p.id)+i)%srcs.length],
      summary:'索引与外部链接，正文由原工具维护', time:(i*2+1)+' 天前更新' };
  });
}

function buildFeed(p){
  var acts = POOL[p.scope].feed;
  var times = ['12 分钟前','2 小时前','昨天 18:40','3 天前'];
  return acts.map(function(a,i){
    return { who: p.owners[i % p.owners.length], act:a, time:times[i%times.length] };
  });
}

  // 展开数据并把 id 注入，后续内容池的种子依赖 p.id
  return Object.assign({}, PROJECTS[id], { id:id });
}

  /* --- 里程碑 --- */

  fill.className = sc.fill;
  requestAnimationFrame(function(){ fill.style.width = p.progress + '%'; });

  document.getElementById('mileList').innerHTML = mileHtml;
  document.getElementById('mileFull').innerHTML = mileHtml;

      '<span class="doc__ic">'+icon('i-file')+'</span>'+
      '<span class="doc__main"><b>'+esc(d.name)+'</b><span>'+esc(d.summary)+'</span></span>'+
      '<span class="tag">'+esc(d.src)+'</span>'+
      '<span class="task__due">'+esc(d.time)+'</span>'+

  }).join('');

  /* --- 时间线 --- */

  /* --- 侧栏信息 --- */
  document.getElementById('infoList').innerHTML =
    dl('负责人', p.owners.map(function(o){ return avatar(o,'avatar--xs'); }).join('') +
      '<span style="font-size:12.5px;color:var(--ink-500)">'+p.owners.length+' 人</span>') +
    dl('开始日期', esc(p.start)) +
    dl('截止日期', '<span'+(p.days<=14 && p.status!=='done'?' style="color:var(--danger)"':'')+'>'+esc(p.dueText)+'</span>') +
    dl('预算', esc(p.budget)) +

      : '<a class="link" href="#" onclick="toast(\'原型演示：外部跳转未实现\');return false">'+icon('i-git')+esc(p.repo)+'</a>') +
    dl('关联文档', '<a class="link" href="#" onclick="toast(\'原型演示：外部跳转未实现\');return false">'+icon('i-link')+esc(p.docs)+'</a>') +
    dl('同步方式', icon('i-git') + 'Git 异步推送');

  /* --- 风险 --- */

    document.getElementById('riskCard').style.display = '';
    document.getElementById('riskTitle').textContent = p.risk.title;
    document.getElementById('riskDesc').textContent = p.risk.desc;
  }

/* ---------- 渲染片段 ---------- */
function mi(ic,k,v,warn){
  return '<div class="metaitem">'+
    '<span class="metaitem__k">'+icon(ic)+esc(k)+'</span>'+
    '<span class="metaitem__v'+(warn?' warn':'')+'">'+esc(v)+'</span></div>';
}
function dl(k,v){
  return '<div class="dl__row"><span class="dl__k">'+esc(k)+'</span><span class="dl__v">'+v+'</span></div>';
}
function taskPill(s){
  return { todo:'pill--todo', doing:'pill--doing', blocked:'pill--blocked', done:'pill--done' }[s];
}
function taskLabel(s){
  return { todo:'待办', doing:'进行中', blocked:'阻塞', done:'已完成' }[s];
}
function mileRow(m){
  return '<div class="mile is-'+m.state+'">'+
    '<span class="mile__dot">'+icon('i-check')+'</span>'+
    '<div class="mile__name">'+esc(m.name)+'</div>'+
    '<div class="mile__meta">'+icon('i-calendar')+esc(m.date)+' · '+esc(m.detail)+'</div>'+
  '</div>';
}

/* ---------- 标签页切换 ---------- */
function switchTab(name){
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.classList.toggle('is-active', b.dataset.tab === name);
  });
  document.querySelectorAll('.panel').forEach(function(pnl){
    pnl.classList.toggle('is-active', pnl.id === 'panel-' + name);
  });
  document.querySelector('.scroll').scrollTo({ top:0, behavior:'smooth' });
}
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]');
  if(b) switchTab(b.dataset.tab);
});

/* ---------- 提示 ---------- */
function toast(msg){
  var host = document.getElementById('toastHost');
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  host.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('is-on'); });
  setTimeout(function(){ el.classList.remove('is-on'); setTimeout(function(){ el.remove(); }, 260); }, 2100);
}
