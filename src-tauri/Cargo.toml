[package]
name = "lucky"
version = "0.1.0"
description = "Lucky-Y 桌面外壳（Tauri）。领域逻辑在 backend/lucky_y_server，本 crate 只做窗口、权限与命令注册。"
authors = ["Lucky-Y"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 约定：staticlib/cdylib 供移动端复用，rlib 供下面的 bin 引用
name = "lucky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：tauri.conf.json 里开了 `app.macOSPrivateApi`（透明窗口要用它）
# 就必须在这里同时启用这个 feature，否则 tauri-build 会在编译期直接报
# "The `tauri` dependency features ... does not match the allowlist defined under tauri.conf.json"。
# 不写成 target.'cfg(target_os="macos")'.dependencies 是因为配置项是无条件的，
# 构建期校验按"当前目标"比对，分平台写会让非 macOS 目标的 config 与 feature 对不上。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
