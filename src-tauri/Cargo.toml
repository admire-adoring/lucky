[package]
name = "lucky"
version = "0.1.0"
description = "Lucky-Y 桌面外壳（Tauri）。领域逻辑在 backend/lucky_y_server，本 crate 只做窗口、权限与命令注册。"
authors = ["Lucky-Y"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 约定：staticlib/cdylib 供移动端复用，rlib 供下面的 bin 引用
name = "lucky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
