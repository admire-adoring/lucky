[package]
name = "lucky"
version = "0.1.0"
description = "Lucky-Y 桌面应用，Tauri v2 官方布局。命令层（窗口/权限/命令注册）在 lib.rs，领域层在 src/server/（不 import tauri）。"
authors = ["Lucky-Y"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 约定：staticlib/cdylib 供移动端复用，rlib 供下面的 bin 引用
name = "lucky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：tauri.conf.json 里开了 `app.macOSPrivateApi`（透明窗口要用它）
# 就必须在这里同时启用这个 feature，否则 tauri-build 会在编译期直接报
# "The `tauri` dependency features ... does not match the allowlist defined under tauri.conf.json"。
# 不写成 target.'cfg(target_os="macos")'.dependencies 是因为配置项是无条件的，
# 构建期校验按"当前目标"比对，分平台写会让非 macOS 目标的 config 与 feature 对不上。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 配置文件与日志
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 领域层存储。bundled 把 SQLite 一起编进来，机器上不必预装 sqlite3。
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
